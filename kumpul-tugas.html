<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumpulan Tugas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { extend: { colors: { primary: '#2563eb', gelap: '#0f172a', kartu: '#1e293b' } } }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen transition-colors dark:bg-gelap dark:text-gray-100">
    <div class="container mx-auto px-4 py-6 max-w-3xl">
        
        <header class="bg-primary text-white rounded-lg shadow p-5 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold">📚 PENGUMPULAN TUGAS</h1>
                <p class="opacity-90">Satu Semester - 15 Pertemuan</p>
            </div>
            <button onclick="gantiMode()" class="bg-white text-primary px-3 py-2 rounded shadow hover:bg-gray-100 flex items-center font-medium text-sm">
                <i class="fa fa-moon-o dark:hidden mr-1"></i>
                <i class="fa fa-sun-o hidden dark:inline mr-1"></i>
                <span id="teks-mode"></span>
            </button>
        </header>

        <div class="bg-white dark:bg-kartu rounded-lg shadow p-5 mb-6">
            <h2 class="text-lg font-semibold mb-3">Pilih Pertemuan</h2>
            <select id="pertemuan" class="w-full border p-2 rounded bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
                <option value="">-- Pilih Pertemuan --</option>
                <script>for (let i = 1; i <= 15; i++) document.write(`<option value="${i}">Pertemuan ${i}</option>`);</script>
            </select>
        </div>

        <div id="form" class="bg-white dark:bg-kartu rounded-lg shadow p-5 hidden">
            <h2 class="text-xl font-semibold text-primary mb-5">Form Pengumpulan Tugas <span id="ke"></span></h2>

            <div class="mb-4">
                <label class="block mb-2 font-medium">Pilih Kelas</label>
                <select id="pilihKelas" class="w-full border p-2 rounded bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-primary">
                    <option value="">-- Memuat daftar kelas ... --</option>
                </select>
            </div>

            <div id="blokNis" class="hidden mb-4">
                <label class="block mb-2 font-medium">Pilih NIS</label>
                <select id="pilihNis" class="w-full border p-2 rounded bg-gray-50 dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-primary">
                    <option value="">-- Pilih NIS --</option>
                </select>
            </div>

            <div id="blokNama" class="hidden mb-4">
                <label class="block mb-2 font-medium">Nama Lengkap</label>
                <input type="text" id="namaSiswa" readonly class="w-full border p-2 rounded bg-gray-200 dark:bg-gray-600 font-medium" placeholder="Muncul otomatis">
            </div>

            <div id="blokTugas" class="hidden">
                <div class="mb-4">
                    <label class="block mb-2 font-medium">Tautan / Link Tugas</label>
                    <input type="url" id="linkTugas" class="w-full border p-2 rounded bg-gray-50 dark:bg-gray-700 dark:border-gray-600" placeholder="https://drive.google.com/...">
                </div>

                <div class="mb-5">
                    <label class="block mb-2 font-medium">Unggah Gambar Tugas</label>
                    <input type="file" id="gambarTugas" accept="image/*" class="w-full border p-2 rounded bg-gray-50 dark:bg-gray-700 dark:border-gray-600">
                    <div id="pratinjau" class="mt-3 hidden p-2 rounded border border-dashed bg-gray-50 dark:bg-gray-800">
                        <img id="hasilGambar" class="max-h-48 mx-auto rounded shadow">
                    </div>
                </div>

                <button onclick="kirimTugas()" id="tombolKirim" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded font-medium text-lg">
                    📤 KIRIM TUGAS
                </button>
            </div>

            <div id="status" class="mt-5 text-center font-medium hidden p-2 rounded"></div>
        </div>
    </div>

    <script>
        // GANTI DENGAN URL APLIKASI WEB ANDA
        const URL_SKRIP = "https://script.google.com/macros/s/AKfycbz4laIjiYuK77fXx_zbq7JjkQ0gRHUJR3XoeOfVeyLCP3lyUbegUKrsoLC0abpWaHHD/exec";
        let daftarSiswa = [], daftarKelasUnik = [], dataGambar = "";

        function gantiMode() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("mode", isDark ? "gelap" : "terang");
            document.getElementById("teks-mode").textContent = isDark ? "" : "";
        }

        window.onload = () => {
            if (localStorage.getItem("mode") === "gelap") {
                document.documentElement.classList.add("dark");
                document.getElementById("teks-mode").textContent = "";
            }
            ambilDataSiswa();
        };

        function ambilDataSiswa() {
            fetch(URL_SKRIP)
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") {
                    daftarSiswa = data.siswa;
                    const kelasSet = new Set(daftarSiswa.map(s => s.kelas));
                    daftarKelasUnik = Array.from(kelasSet).sort();
                    const pilihKelas = document.getElementById("pilihKelas");
                    pilihKelas.innerHTML = `<option value="">-- Pilih Kelas --</option>`;
                    daftarKelasUnik.forEach(k => pilihKelas.innerHTML += `<option value="${k}">${k}</option>`);
                } else {
                    document.getElementById("pilihKelas").innerHTML = `<option value="">Gagal memuat data</option>`;
                }
            })
            .catch(() => document.getElementById("pilihKelas").innerHTML = `<option value="">Tidak terhubung ke server</option>`);
        }

        document.getElementById("pertemuan").addEventListener("change", function() {
            if (this.value) {
                document.getElementById("ke").textContent = this.value;
                document.getElementById("form").classList.remove("hidden");
                resetForm();
            } else {
                document.getElementById("form").classList.add("hidden");
            }
        });

        document.getElementById("pilihKelas").addEventListener("change", function() {
            const kelasDipilih = this.value;
            resetBagianNisKebawah();
            if (!kelasDipilih) return;
            const siswaDiKelas = daftarSiswa.filter(s => s.kelas === kelasDipilih);
            const pilihNis = document.getElementById("pilihNis");
            pilihNis.innerHTML = `<option value="">-- Pilih NIS --</option>`;
            siswaDiKelas.forEach((s, i) => pilihNis.innerHTML += `<option value="${i}">${s.nis}</option>`);
            document.getElementById("blokNis").classList.remove("hidden");
        });

        document.getElementById("pilihNis").addEventListener("change", function() {
            const idx = this.value;
            resetBagianNamaKebawah();
            if (idx === "") return;
            const kelas = document.getElementById("pilihKelas").value;
            const siswa = daftarSiswa.filter(s => s.kelas === kelas)[idx];
            document.getElementById("namaSiswa").value = siswa.nama;
            document.getElementById("blokNama").classList.remove("hidden");
            document.getElementById("blokTugas").classList.remove("hidden");
        });

        document.getElementById("gambarTugas").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) { dataGambar = ""; document.getElementById("pratinjau").classList.add("hidden"); return; }
            if (file.size > 1 * 1024 * 1024) { alert("Ukuran gambar maksimal 1MB!"); this.value = ""; return; }
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    const kanvas = document.createElement("canvas");
                    const lebarMaks = 600;
                    const rasio = Math.min(lebarMaks / img.width, 1);
                    kanvas.width = Math.round(img.width * rasio);
                    kanvas.height = Math.round(img.height * rasio);
                    const ctx = kanvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, kanvas.width, kanvas.height);
                    dataGambar = kanvas.toDataURL("image/jpeg", 0.55);
                    document.getElementById("hasilGambar").src = dataGambar;
                    document.getElementById("pratinjau").classList.remove("hidden");
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function kirimTugas() {
            const pertemuan = document.getElementById("pertemuan").value;
            const kelas = document.getElementById("pilihKelas").value;
            const idxNis = document.getElementById("pilihNis").value;
            const link = document.getElementById("linkTugas").value.trim();
            const status = document.getElementById("status");
            const tombol = document.getElementById("tombolKirim");

            if (!pertemuan || !kelas || idxNis === "") {
                tampilStatus("❌ Lengkapi Pertemuan, Kelas dan NIS terlebih dahulu!", "merah");
                return;
            }
            if (!link && !dataGambar) {
                tampilStatus("❌ Isi minimal Link ATAU unggah Gambar!", "merah");
                return;
            }

            tombol.disabled = true;
            tombol.textContent = "⏳ Mengirim...";
            tampilStatus("⏳ Sedang mengirim data...", "biru");

            const siswa = daftarSiswa.filter(s => s.kelas === kelas)[idxNis];

            fetch(URL_SKRIP, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pertemuan: pertemuan,
                    nis: siswa.nis,
                    nama: siswa.nama,
                    kelas: kelas,
                    linkTugas: link,
                    gambar: dataGambar
                })
            })
            .then(res => res.json())
            .then(h => {
                if (h.status === "ok") {
                    tampilStatus(`✅ Tugas Pertemuan ${pertemuan} atas nama ${siswa.nama} berhasil dikirim!`, "hijau");
                    setTimeout(() => {
                        document.getElementById("pertemuan").value = "";
                        document.getElementById("form").classList.add("hidden");
                        resetForm();
                    }, 3000);
                } else {
                    tampilStatus("❌ " + h.pesan, "merah");
                }
            })
            .catch(err => {
                tampilStatus("❌ Gagal terkirim: Buka lewat URL aplikasi web", "merah");
                console.error(err);
            })
            .finally(() => {
                tombol.disabled = false;
                tombol.textContent = "📤 KIRIM TUGAS";
            });
        }

        function tampilStatus(teks, warna) {
            const status = document.getElementById("status");
            status.textContent = teks;
            status.className = `mt-5 text-center font-medium p-2 rounded ${
                warna === "merah" ? "text-red-500 bg-red-50 dark:bg-red-900/20" :
                warna === "hijau" ? "text-green-600 bg-green-50 dark:bg-green-900/20" :
                "text-blue-500 bg-blue-50 dark:bg-blue-900/20"
            }`;
            status.classList.remove("hidden");
        }

        function resetForm() {
            document.getElementById("pilihKelas").value = "";
            resetBagianNisKebawah();
            document.getElementById("status").classList.add("hidden");
        }

        function resetBagianNisKebawah() {
            document.getElementById("blokNis").classList.add("hidden");
            document.getElementById("pilihNis").innerHTML = `<option value="">-- Pilih NIS --</option>`;
            resetBagianNamaKebawah();
        }

        function resetBagianNamaKebawah() {
            document.getElementById("blokNama").classList.add("hidden");
            document.getElementById("namaSiswa").value = "";
            document.getElementById("blokTugas").classList.add("hidden");
            document.getElementById("linkTugas").value = "";
            document.getElementById("gambarTugas").value = "";
            document.getElementById("pratinjau").classList.add("hidden");
            dataGambar = "";
        }
    </script>
</body>
</html>
