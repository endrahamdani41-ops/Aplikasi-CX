<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Pendidikan</title>
    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-container: #ffffff;
            --text-main: #212529;
            --text-heading: #000000;
            --border-color: #dee2e6;
            --table-header: #e9ecef;
            --btn-primary: #0d6efd;
            --btn-success: #198754;
            --btn-danger: #dc3545;
            --btn-secondary: #6c757d;
            --btn-text: #ffffff;
            --holiday-red: #dc3545;
            --info-simpan: #28a745;
            --icon-mode-color: #f1c40f;
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-heading: #ffffff;
            --border-color: #444444;
            --table-header: #2d2d2d;
            --holiday-red: #ff6b6b;
            --icon-mode-color: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-container);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            position: relative;
        }

        .status-simpan {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--info-simpan);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .status-simpan.aktif {
            opacity: 1;
        }

        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-icon-action {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            user-select: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            transition: transform 0.2s, background-color 0.2s;
            color: var(--text-main);
        }
        .btn-icon-action:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.1);
        }
        body:not(.dark-mode) .btn-icon-action:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-right: 90px;
        }

        .top-bar input[type="number"] {
            width: 6ch;
            min-width: 6ch;
            max-width: 6ch;
            padding: 4px 2px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-container);
            color: var(--text-main);
            font-size: 16px;
            -moz-appearance: textfield;
        }
        .top-bar input[type="number"]::-webkit-outer-spin-button,
        .top-bar input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button {
            padding: 7px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: var(--btn-text);
        }

        .btn-primary-action { background: var(--btn-primary); }
        .btn-add { background: var(--btn-success); }
        .btn-delete { background: var(--btn-danger); font-weight: bold; min-width: 32px; }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            font-size: 19px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .month-section {
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .month-header {
            background: var(--table-header);
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: normal;
        }

        .stats-group input {
            width: 36px;
            max-width: 36px;
            padding: 2px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            background: var(--bg-container);
            color: var(--text-main);
            font-size: 14px;
            -moz-appearance: textfield;
        }

        .content-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 15px;
        }

        .calendar-table {
            flex: 1 1 450px;
            border-collapse: collapse;
            width: 100%;
        }

        .calendar-table th, .calendar-table td {
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
        }

        .calendar-table th {
            background: var(--table-header);
            font-weight: 600;
            cursor: default;
        }

        .calendar-table td.hari-minggu,
        .calendar-table td.highlight-red {
            color: var(--holiday-red);
            font-weight: bold;
        }

        .event-table {
            flex: 1 1 450px;
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        .event-table th {
            background: var(--table-header);
            font-weight: 600;
            padding: 10px 8px;
            border: 1px solid var(--border-color);
        }

        .event-table th:nth-child(1),
        .event-table td:nth-child(1) {
            width: 20%;
            min-width: 70px;
            text-align: center;
        }

        .event-table th:nth-child(2) {
            text-align: center;
        }

        .event-table td:nth-child(2) {
            width: 70%;
            min-width: 220px;
            text-align: left;
        }

        .event-table th:nth-child(3),
        .event-table td:nth-child(3) {
            width: 10%;
            min-width: 50px;
            text-align: center;
        }

        .event-table td {
            border: 1px solid var(--border-color);
            padding: 8px;
            vertical-align: middle;
        }

        input[type="text"] {
            width: 100%;
            margin: 0;
            padding: 4px 2px;
            border: none;
            border-bottom: 1px dashed var(--border-color);
            background: transparent;
            color: var(--text-main);
            font-size: inherit;
            line-height: inherit;
            font-family: inherit;
        }

        .event-table td:nth-child(1) input[type="text"] {
            text-align: center;
        }

        .signature-section {
            margin-top: 40px;
            margin-left: auto;
            width: fit-content;
            text-align: left;
            line-height: 2;
        }

        .baris-tempat-tanggal {
            display: inline-flex;
            align-items: baseline;
            gap: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            white-space: nowrap;
        }

        #tempatTtd, #tanggalTtd {
            padding: 0;
            border: none;
            border-bottom: 1px dashed var(--border-color);
            background: transparent;
            color: var(--text-main);
        }

        .koma {
            display: inline;
            margin-right: 5px;
        }

        .name {
            font-weight: bold;
            text-decoration: underline;
            margin-top: 40px;
        }

        /* 🖨️ CSS PERBAIKAN TOTAL CETAK - SUPER RAPAT & PADAT */
        @media print {
            /* Reset dan hilangkan transisi/efek browser */
            * {
                transition: none !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }
            @page {
                margin: 10mm; /* Sisi margin lembar */
            }
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                line-height: 1.0 !important; 
                font-size: 11px !important; /* Perkecil basis huruf agar lebih rapat */
            }
            .container {
                padding: 0 !important;
                max-width: 100% !important;
                margin: 0 !important;
                background: transparent !important;
            }
            /* Sembunyikan elemen antarmuka web */
            .top-buttons, .top-bar, .status-simpan, .btn-add, .btn-delete, 
            .event-table th:nth-child(3), .event-table td:nth-child(3) {
                display: none !important;
            }
            
            /* Rapatkan Header utama */
            h1 {
                font-size: 16px !important;
                margin: 0 0 2px 0 !important;
                line-height: 1.0 !important;
                padding: 0 !important;
            }
            h2 {
                font-size: 12px !important;
                margin: 0 0 10px 0 !important;
                line-height: 1.0 !important;
                padding: 0 !important;
            }
            h2 br {
                display: block;
                content: "";
                margin-top: 2px;
            }

            /* Rapatkan Kontainer Bulan */
            .month-section {
                border: 1px solid #000000 !important;
                margin-bottom: 8px !important; /* Jarak antar kotak bulan sangat minim */
                page-break-inside: avoid; /* Mencegah bulan terbelah halaman */
                border-radius: 0 !important;
            }
            .month-header {
                background: #e5e5e5 !important;
                color: #000000 !important;
                border-bottom: 1px solid #000000 !important;
                padding: 2px 8px !important; /* Sangat rapat */
                font-size: 12px !important;
                line-height: 1.0 !important;
            }
            .content-wrapper {
                padding: 4px !important; 
                gap: 8px !important;
            }

            /* Rapatkan Semua Sel Tabel */
            .calendar-table th, .calendar-table td, 
            .event-table th, .event-table td {
                border: 1px solid #000000 !important;
                color: #000000 !important;
                padding: 2px 3px !important; /* Paksa padding minimal */
                line-height: 1.0 !important;   /* Paksa jarak baris 1 */
                height: auto !important;
            }
            .calendar-table th, .event-table th {
                background: #e5e5e5 !important;
                font-size: 11px !important;
            }

            /* Rapatkan Input dalam tabel */
            input[type="text"] {
                border-bottom: none !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                line-height: 1.0 !important;
                height: auto !important;
            }
            /* Kolom tanggal kegiatan dipaksa rata tengah saat cetak */
            .event-table td:nth-child(1) input[type="text"] {
                text-align: center !important;
            }

            .calendar-table td.hari-minggu, 
            .calendar-table td.highlight-red {
                color: #c00000 !important;
            }
            
            /* Sesuaikan lebar kolom uraian karena kolom aksi hilang */
            .event-table th:nth-child(2), .event-table td:nth-child(2) {
                width: 80% !important;
            }

            /* Rapatkan Bagian Tanda Tangan */
            .signature-section {
                margin-top: 15px !important;
                line-height: 1.1 !important;
                font-size: 11px !important;
            }
            .name {
                margin-top: 25px !important; /* Jarak untuk tanda tangan fisik rapat */
            }
        }

        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .calendar-table th, .calendar-table td { padding: 6px 4px; font-size: 14px; }
            .month-header { flex-direction: column; align-items: flex-start; }
            .signature-section { margin-left: 0; width: 100%; }
            .top-bar { padding-right: 0; }
            .top-buttons { position: static; margin-bottom: 15px; justify-content: flex-end; }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="status-simpan" id="statusSimpan">Tersimpan otomatis</div>

    <div class="container">
        <div class="top-buttons">
            <button onclick="window.print()" class="btn-icon-action" title="Cetak Kalender">🖨️</button>
            <button onclick="toggleMode()" class="btn-icon-action" id="iconMode" title="Ganti Mode Tema">🌙</button>
        </div>

        <div class="top-bar">
            <div>
                <label>Tahun Ajaran: </label>
                <input type="number" id="tahunMulai" value="2026"> / 
                <input type="number" id="tahunAkhir" value="2027">
                <button onclick="buatSemuaKalender(true)" class="btn-primary-action">Terapkan</button>
            </div>
        </div>

        <h1>KALENDER PENDIDIKAN</h1>
        <h2>
            <input type="text" id="namaSekolah" value="SMP NEGERI 110 JAKARTA" style="width: 400px; text-align: center; font-size: 19px; border: none; background: transparent;" oninput="jadwalkanSimpan()">
            <br>TAHUN PELAJARAN <span id="tahunAjaranTeks">2026 / 2027</span>
        </h2>

        <div id="kalender-container"></div>

        <div class="signature-section">
            <p class="baris-tempat-tanggal">
                <input type="text" id="tempatTtd" value="Jakarta" oninput="sesuaikanLebar(this); jadwalkanSimpan();">
                <span class="koma">, </span>
                <input type="text" id="tanggalTtd" value="13 Juli 2026" oninput="sesuaikanLebar(this); jadwalkanSimpan();">
            </p>
            <p>Kepala <input type="text" id="sekolahTtd" value="SMP NEGERI 110 JAKARTA" style="width: 300px;" oninput="jadwalkanSimpan()"></p><br>
            <p class="name"><input type="text" id="kepalaSekolah" value="Iis Ratna Sariningrum, S.Pd., M.M." style="width: 350px; font-weight: bold; text-decoration: underline;" oninput="jadwalkanSimpan()"></p>
            <p><input type="text" id="nip" value="NIP. 197103211994122001" style="width: 250px;" oninput="jadwalkanSimpan()"></p>
        </div>
    </div>

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzSv3IqDQZqTT5UWliKcEGsE8SWRmbk9WlLFq3zFBpn8LqJPO7M99jaixQlYza7A9e7xw/exec";

        const NAMA_BULAN = [
            "Januari", "Februari", "Maret", "April", "Mei", "Juni",
            "Juli", "Agustus", "September", "Oktober", "November", "Desember"
        ];

        let dataKegiatan = {};
        let timerSimpan = null;
        let dataSudahSiapDimuat = false; 

        document.getElementById('tahunMulai').addEventListener('input', function(){
            if(this.value.length > 4) this.value = this.value.slice(0,4);
        });
        document.getElementById('tahunAkhir').addEventListener('input', function(){
            if(this.value.length > 4) this.value = this.value.slice(0,4);
        });

        function sesuaikanLebar(el) {
            if (!el) return;
            el.style.width = (el.value.length + 1) + "ch";
        }

        function tampilkanStatus(pesan = "Tersimpan otomatis") {
            const el = document.getElementById("statusSimpan");
            el.textContent = pesan;
            el.classList.add("aktif");
            clearTimeout(el.waktuSembunyi);
            el.waktuSembunyi = setTimeout(() => el.classList.remove("aktif"), 2000);
        }

        function simpanOtomatis() {
            if (!URL_GOOGLE_SCRIPT || !dataSudahSiapDimuat) return; 

            const bulanData = Object.entries(dataKegiatan).map(([kunci, item]) => {
                const [idx, thn] = kunci.split("-").map(Number);
                return {
                    namaBulan: NAMA_BULAN[idx] || "",
                    tahun: thn || 0,
                    hbe: item.hbe || "",
                    hlu: item.hlu || "",
                    hlk: item.hlk || "",
                    tanggalMerah: Array.from(item.tanggalMerah || []),
                    daftarKegiatan: item.daftar || []
                };
            });

            const dataKirim = {
                tahunAjaran: `${document.getElementById("tahunMulai").value} / ${document.getElementById("tahunAkhir").value}`,
                namaSekolah: document.getElementById("namaSekolah").value || "",
                tempatTtd: document.getElementById("tempatTtd").value || "",
                tanggalTtd: document.getElementById("tanggalTtd").value || "",
                sekolahTtd: document.getElementById("sekolahTtd").value || "",
                kepalaSekolah: document.getElementById("kepalaSekolah").value || "",
                nip: document.getElementById("nip").value || "",
                bulanData: bulanData
            };

            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(dataKirim)
            })
            .then(res => res.json())
            .then(hasil => {
                if (hasil.status === "berhasil") tampilkanStatus("Tersimpan otomatis");
            })
            .catch(err => console.log("Gagal simpan otomatis:", err));
        }

        function jadwalkanSimpan() {
            if (!dataSudahSiapDimuat) return; 
            clearTimeout(timerSimpan);
            timerSimpan = setTimeout(simpanOtomatis, 1000);
        }

        function toggleTanggalMerah(kunci, tglElemen) {
            const tanggal = parseInt(tglElemen.textContent);
            if(!tanggal) return;

            if (!dataKegiatan[kunci]) dataKegiatan[kunci] = { hbe: "", hlu: "", hlk: "", daftar: [], tanggalMerah: new Set() };
            if (!dataKegiatan[kunci].tanggalMerah) dataKegiatan[kunci].tanggalMerah = new Set();
            
            if (dataKegiatan[kunci].tanggalMerah.has(tanggal)) {
                dataKegiatan[kunci].tanggalMerah.delete(tanggal);
                if (!tglElemen.classList.contains('hari-minggu')) {
                    tglElemen.classList.remove('highlight-red');
                }
            } else {
                dataKegiatan[kunci].tanggalMerah.add(tanggal);
                tglElemen.classList.add('highlight-red');
            }
            jadwalkanSimpan();
        }

        function buatKalender(bulanIndeks, tahun) {
            const tanggalAwal = new Date(tahun, bulanIndeks, 1);
            const hariAwal = tanggalAwal.getDay();
            const jumlahHari = new Date(tahun, bulanIndeks + 1, 0).getDate();
            const kunci = `${bulanIndeks}-${tahun}`;

            let baris = "<tr>";
            let sel = "";
            for (let i = 0; i < hariAwal; i++) sel += "<td></td>";
            
            if (!dataKegiatan[kunci]) {
                dataKegiatan[kunci] = { hbe: "", hlu: "", hlk: "", daftar: [], tanggalMerah: new Set() };
            } else if (Array.isArray(dataKegiatan[kunci].tanggalMerah)) {
                dataKegiatan[kunci].tanggalMerah = new Set(dataKegiatan[kunci].tanggalMerah);
            }

            for (let tgl = 1; tgl <= jumlahHari; tgl++) {
                const hariIni = new Date(tahun, bulanIndeks, tgl).getDay();
                const isMinggu = hariIni === 0 ? 'hari-minggu' : '';
                const isMerah = dataKegiatan[kunci].tanggalMerah.has(tgl) ? 'highlight-red' : '';
                sel += `<td class="${isMinggu} ${isMerah}" onclick="toggleTanggalMerah('${kunci}', this)">${tgl}</td>`;
                if ((hariAwal + tgl) % 7 === 0) { baris += sel + "</tr><tr>"; sel = ""; }
            }
            if(sel !== "") {
                baris += sel + "</tr>";
            }

            let daftar = (dataKegiatan[kunci].daftar || []).map((item, idx) => `
                <tr>
                    <td><input type="text" value="${item.tgl || ''}" oninput="ubahTgl('${kunci}', ${idx}, this.value)"></td>
                    <td><input type="text" value="${item.uraian || ''}" oninput="ubahUraian('${kunci}', ${idx}, this.value)"></td>
                    <td><button onclick="hapusKegiatan('${kunci}', ${idx})" class="btn-delete">×</button></td>
                </tr>
            `).join("");

            return `
                <div class="month-section">
                    <div class="month-header">
                        <span>${NAMA_BULAN[bulanIndeks]} ${tahun}</span>
                        <div class="stats-group">
                            <label>HBE:</label>
                            <input type="text" maxlength="2" value="${dataKegiatan[kunci].hbe || ''}" oninput="ubahStat('${kunci}', 'hbe', this.value)">
                            <label>HLU:</label>
                            <input type="text" maxlength="2" value="${dataKegiatan[kunci].hlu || ''}" oninput="ubahStat('${kunci}', 'hlu', this.value)">
                            <label>HLK:</label>
                            <input type="text" maxlength="2" value="${dataKegiatan[kunci].hlk || ''}" oninput="ubahStat('${kunci}', 'hlk', this.value)">
                            <button onclick="tambahKegiatan('${kunci}')" class="btn-add" style="margin-left: 8px;">+ Tambah</button>
                        </div>
                    </div>
                    <div class="content-wrapper">
                        <table class="calendar-table"><thead><tr><th>Minggu</th><th>Senin</th><th>Selasa</th><th>Rabu</th><th>Kamis</th><th>Jum'at</th><th>Sabtu</th></tr></thead><tbody>${baris}</tbody></table>
                        <table class="event-table"><thead><tr><th>Tanggal</th><th>Uraian Kegiatan</th><th>Aksi</th></tr></thead><tbody>${daftar}</tbody></table>
                    </div>
                </div>
            `;
        }

        function buatSemuaKalender(pemicuSimpan = false) {
            const mulai = +document.getElementById("tahunMulai").value;
            const akhir = +document.getElementById("tahunAkhir").value;
            document.getElementById("tahunAjaranTeks").textContent = `${mulai} / ${akhir}`;
            const wadah = document.getElementById("kalender-container");
            wadah.innerHTML = "";
            
            for (let b = 6; b <= 11; b++) wadah.innerHTML += buatKalender(b, mulai);
            for (let b = 0; b <= 5; b++) wadah.innerHTML += buatKalender(b, akhir);
            
            if (pemicuSimpan && dataSudahSiapDimuat) {
                jadwalkanSimpan();
            }
        }

        function tambahKegiatan(kunci) {
            if (!dataKegiatan[kunci]) dataKegiatan[kunci] = { hbe:"", hlu:"", hlk:"", daftar:[], tanggalMerah: new Set() };
            dataKegiatan[kunci].daftar.push({tgl:"", uraian:""});
            
            dataSudahSiapDimuat = true; 
            buatSemuaKalender(true);
        }

        function ubahStat(kunci, jenis, nilai) {
            if (!dataKegiatan[kunci]) dataKegiatan[kunci] = { hbe:"", hlu:"", hlk:"", daftar:[], tanggalMerah: new Set() };
            dataKegiatan[kunci][jenis] = nilai.trim();
            jadwalkanSimpan();
        }

        function ubahTgl(kunci, idx, nilai) {
            if (!dataKegiatan[kunci].daftar[idx]) return;
            dataKegiatan[kunci].daftar[idx].tgl = nilai.trim();
            jadwalkanSimpan();
        }

        function ubahUraian(kunci, idx, nilai) {
            if (!dataKegiatan[kunci].daftar[idx]) return;
            dataKegiatan[kunci].daftar[idx].uraian = nilai.trim();
            jadwalkanSimpan();
        }

        function hapusKegiatan(kunci, idx) {
            if (!dataKegiatan[kunci] || !dataKegiatan[kunci].daftar) return;
            dataKegiatan[kunci].daftar.splice(idx, 1);
            buatSemuaKalender(true);
        }

        function toggleMode() {
            const isDark = document.body.classList.toggle("dark-mode");
            document.getElementById("iconMode").textContent = isDark ? "🌙" : "☀️";
        }

        function muatDariGoogleSheet() {
            if (!URL_GOOGLE_SCRIPT) {
                buatSemuaKalender(false);
                dataSudahSiapDimuat = true;
                return;
            }
            tampilkanStatus("Memuat data...");
            
            fetch(URL_GOOGLE_SCRIPT)
            .then(res => res.json())
            .then(hasil => {
                if (hasil.status === "berhasil") {
                    document.getElementById("tahunMulai").value = hasil.tahunMulai || 2026;
                    document.getElementById("tahunAkhir").value = hasil.tahunAkhir || 2027;
                    document.getElementById("namaSekolah").value = hasil.namaSekolah || "SMP NEGERI 110 JAKARTA";
                    document.getElementById("tempatTtd").value = hasil.tempatTtd || "Jakarta";
                    document.getElementById("tanggalTtd").value = hasil.tanggalTtd || "13 Juli 2026";
                    document.getElementById("sekolahTtd").value = hasil.sekolahTtd || "SMP NEGERI 110 JAKARTA";
                    document.getElementById("kepalaSekolah").value = hasil.kepalaSekolah || "Iis Ratna Sariningrum, S.Pd., M.M.";
                    document.getElementById("nip").value = hasil.nip || "NIP. 197103211994122001";
                    
                    dataKegiatan = {};
                    if (hasil.kegiatan) {
                        for (const k in hasil.kegiatan) {
                            const d = hasil.kegiatan[k];
                            dataKegiatan[k] = {
                                hbe: d.hbe || "",
                                hlu: d.hlu || "",
                                hlk: d.hlk || "",
                                daftar: d.daftar || [],
                                tanggalMerah: new Set(d.toggleTanggalMerah || d.tanggalMerah || [])
                            };
                        }
                    }
                    
                    dataSudahSiapDimuat = true; 
                    
                    buatSemuaKalender(false);
                    sesuaikanLebar(document.getElementById('tempatTtd'));
                    sesuaikanLebar(document.getElementById('tanggalTtd'));
                    tampilkanStatus("Data berhasil dimuat");
                    
                } else if (hasil.status === "kosong") {
                    dataSudahSiapDimuat = true; 
                    buatSemuaKalender(false);
                    sesuaikanLebar(document.getElementById('tempatTtd'));
                    sesuaikanLebar(document.getElementById('tanggalTtd'));
                    tampilkanStatus("Belum ada data di spreadsheet");
                }
            })
            .catch(err => {
                console.log("Kesalahan muat data:", err);
                dataSudahSiapDimuat = true; 
                buatSemuaKalender(false);
            });
        }

        window.onload = function() {
            const isDark = document.body.classList.contains("dark-mode");
            document.getElementById("iconMode").textContent = isDark ? "🌙" : "☀️";
            muatDariGoogleSheet();
        };
    </script>
</body>
</html>
