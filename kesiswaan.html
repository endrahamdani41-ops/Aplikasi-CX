<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesiswaan Ekskul - SMPN 110 Jakarta</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#121212;color:#eee;padding:20px;}
.container{max-width:1200px;margin:auto;background:#1e1e1e;border-radius:8px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.5);}
.header{background:#1565c0;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:17px;font-weight:normal;}
button{padding:7px 14px;border:none;border-radius:4px;cursor:pointer;color:white;margin-left:5px;transition:background 0.3s;}

/* ✅ WARNA TOMBOL CETAK COKLAT */
.btn-cetak {
    background-color: #8B4513;
}
.btn-cetak:hover {
    background-color: #A0522D;
}
.btn-simpan {
    background-color: #2e7d32;
}
.btn-simpan:hover {
    background-color: #388e3c;
}

.konten{padding:15px;}
.input-group{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
input, select{padding:7px 10px;margin:4px 0;background:#333;color:white;border:1px solid #555;border-radius:4px;font-size:13px;}
input:focus, select:focus{outline:none;border-color:#1976d2;}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
th,td{border:1px solid #444;padding:7px 5px;text-align:center;vertical-align:middle;}
th{background:#1976d2;font-weight:normal;}
tr:nth-child(even){background:#2a2a2a;}
tr:hover{background:#383838;}
.notif{position:fixed;top:20px;right:20px;background:#27ae60;color:white;padding:10px 16px;border-radius:4px;display:none;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.error-box{background:#c0392b;color:white;padding:8px;border-radius:4px;margin:8px 0;display:none;}
.info-box{background:#f39c12;color:white;padding:8px;border-radius:4px;margin:8px 0;display:none;}

/* ==== STYLE KHUSUS CETAK - DIATUR PAS 1 LEMBAR ==== */
@media print{
    @page {
        size: A4;
        margin: 10mm;
    }
    body{background:white !important;color:black !important;padding:0 !important;font-size:10px !important;}
    .header, .input-group, button, .notif, .error-box, .info-box{display:none !important;}
    .container{background:white;box-shadow:none;max-width:100%;}
    
    .judul-cetak{text-align:center;margin-bottom:10px;line-height:1.4;}
    .judul-cetak h1{font-size:14px;font-weight:bold;}
    .judul-cetak h3{font-size:12px;font-weight:bold;margin-top:2px;}

    table{width:100%;border:1px solid #000;font-size:12px !important;table-layout:fixed;}
    th,td{border:2px solid #000;padding:3px 3px !important;overflow:hidden;text-overflow:ellipsis;}
    
    /* Atur lebar kolom agar pas semua */
    th:nth-child(1), td:nth-child(1) { width: 4%; }  /* No */
    th:nth-child(2), td:nth-child(2) { width: 7%; }  /* NIS */
    th:nth-child(3), td:nth-child(3) { width: 27%; text-align:left !important; } /* Nama */
    th:nth-child(4), td:nth-child(4) { width: 4%; }  /* JK */
    th:nth-child(5), td:nth-child(5) { width: 6%; }  /* Kelas */
    th:nth-child(6), td:nth-child(6) { width: 12%; } /* Ekskul 1 */
    th:nth-child(7), td:nth-child(7) { width: 5%; }  /* Nilai 1 */
    th:nth-child(8), td:nth-child(8) { width: 12%; } /* Ekskul 2 */
    th:nth-child(9), td:nth-child(9) { width: 5%; }  /* Nilai 2 */

    tr:nth-child(even){background:#f0f0f0;}

    /* ✅ SAAT CETAK: SEMBUNYIKAN KOTAK PILIHAN, TAMPILKAN TEKS SAJA */
    td select { display: none !important; }
    td .teks { display: inline !important; font-weight:normal; }

    /* ✅ Warna merah tetap muncul saat dicetak */
    .nama-merah { color: red !important; font-weight: bold; }

    .tanda-tangan{margin-top:15px;text-align:right;}
    .tanda-tangan .isi-ttd{display:inline-block;text-align:center;font-size:10px;}
    .tanda-tangan p{margin:3px 0;}
}

/* ✅ DI LAYAR: Tampilan teks disembunyikan */
.teks { display: none; }

/* ✅ KELAS WARNA MERAH UNTUK NAMA JIKA TIDAK IKUT EKSKUL */
.nama-merah {
    color: #ff4444 !important;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="notif" id="notif">Berhasil disimpan</div>
<div class="container">
<div class="header">
    <div><h1><b>SMPN 110 Jakarta</b> - Data Ekstrakurikuler Murid</h1></div>
    <div>
        <button class="btn-cetak" onclick="cetak()">🖨️ Cetak</button>
        <button class="btn-simpan" onclick="simpan()">💾 Simpan</button>
    </div>
</div>

<div class="konten">
<div class="error-box" id="errorBox"></div>
<div class="info-box" id="infoBox"></div>

<!-- Bagian ini MUNCUL SAAT DICETAK -->
<div class="judul-cetak" id="judulCetak" style="display:none;">
    <h1>SMPN 110 JAKARTA</h1>
    <h3>EKSTRAKURIKULER KELAS <span id="namaKelasCetak"></span></h3>
</div>
<br>
<div class="input-group">
    <input type="text" id="search" placeholder="🔍 Cari nama murid..." onkeyup="render()">
    <select id="filterKelas" onchange="render()">
        <option value="SEMUA">Semua Kelas</option>
    </select>
    <select id="filterEkskul" onchange="render()">
        <option value="SEMUA">Semua Ekskul</option>
        <option>Futsal</option>
        <option>Paskib</option>
        <option>Pramuka</option>
        <option>PMR</option>
        <option>Tari</option>
        <option>Silat</option>
        <option>Taekwondo</option>
        <option>Tahsin</option>
        <option>Drumband</option>
        <option value="">Tidak Ikut</option>
    </select>
</div>

<table>
<thead>
<tr>
<th>No</th>
<th>NIS</th>
<th>Nama Lengkap</th>
<th>JK</th>
<th>Kelas</th>
<th>Ekskul 1</th>
<th>Nilai 1</th>
<th>Ekskul 2</th>
<th>Nilai 2</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<!-- Bagian ini MUNCUL SAAT DICETAK -->
<div class="tanda-tangan" id="tandaTangan" style="display:none;">
    <div class="isi-ttd"><br>
        <p>Jakarta, <span id="tanggalHariIni"></span></p>
        <p>Wakil Kesiswaan,</p>
        <br><br><br>
        <p><b>Sri Murwani, M.Pd.</b></p>
        <p>NIP. ...........................................</p>
    </div>
</div>

</div>
</div>

<script>
// ✅ URL SUDAH DIISI DENGAN YANG BARU
const URL = "https://script.google.com/macros/s/AKfycbxhaxVjXOWFZVU9Y3pWYSbKN1SAcn8VrUfxJ9DWTKrHIzFOPyOEKl3uqdO74pDNAMH36A/exec"; 

let data = [];
const errorBox = document.getElementById("errorBox");
const infoBox = document.getElementById("infoBox");

// BACA DATA DARI GOOGLE
async function load(){
    let tb = document.getElementById("tbody");
    tb.innerHTML = '<tr><td colspan="9">⏳ Sedang memuat data...</td></tr>';
    errorBox.style.display = "none";
    infoBox.style.display = "none";

    try{
        let res = await fetch(URL, {cache: "no-store"});
        if (!res.ok) throw new Error("Tidak bisa akses server");
        data = await res.json();
        
        if (!data || data.length < 2) throw new Error("Data kosong");

        // ✅ Pastikan setiap baris punya panjang kolom yang sama
        data = data.map(baris => { while(baris.length < 9) baris.push(""); return baris; });

        isiFilter();
        render();
        showInfo("✅ Data dimuat dari Google Sheet");

    }catch(e){
        console.error("Gagal baca:", e);
        let simpananLokal = localStorage.getItem("dataEkskulSiswa");
        if (simpananLokal) {
            data = JSON.parse(simpananLokal);
            isiFilter();
            render();
            showError("⚠️ Tampil data cadangan (lokal)");
        } else {
            tb.innerHTML = '<tr><td colspan="9">❌ Tidak ada data</td></tr>';
        }
    }
}

function isiFilter(){
    let s = document.getElementById("filterKelas");
    s.innerHTML = '<option value="SEMUA">Semua Kelas</option>';
    let set = new Set();
    data.slice(1).forEach(d => { if(d[4]) set.add(d[4]) });
    [...set].sort((a,b)=>a.localeCompare(b, undefined, {numeric:true})).forEach(k=>{
        let o=document.createElement("option");o.value=k;o.textContent=k;s.appendChild(o);
    });
}

function bersihkanTeks(teks) {
    return (teks || "").toString().trim().toLowerCase();
}

function render(){
    let tb=document.getElementById("tbody");tb.innerHTML="";
    let fK=document.getElementById("filterKelas").value;
    let fE=bersihkanTeks(document.getElementById("filterEkskul").value);
    let cari=bersihkanTeks(document.getElementById("search").value);
    
    let ada=false;
    let nomorUrut = 1; // ✅ NOMOR URUT DIULANG DARI 1 SETIAP FILTER BERUBAH

    for(let i=1;i<data.length;i++){
        let d=data[i];
        
        // Filter: Kelas
        if(fK!="SEMUA" && d[4]!=fK) continue;
        
        // Filter: Ekskul (Cocokkan meski beda huruf)
        let cocokEkskul = true;
        if(fE!="semua") {
            let e1 = bersihkanTeks(d[5]);
            let e2 = bersihkanTeks(d[7]);
            cocokEkskul = (e1 === fE || e2 === fE);
        }
        if(!cocokEkskul) continue;

        // Filter: Pencarian Nama
        if(cari && !bersihkanTeks(d[2]).includes(cari)) continue;

        ada=true;

        // ✅ LOGIKA WARNA MERAH: JIKA KEDUA EKSKUL KOSONG / TIDAK IKUT
        let ekskul1 = d[5] || "";
        let ekskul2 = d[7] || "";
        let kelasWarna = "";
        if( (ekskul1 === "" || ekskul1 === "Tidak Ikut") && (ekskul2 === "" || ekskul2 === "Tidak Ikut") ) {
            kelasWarna = "nama-merah";
        }

        let tr=document.createElement("tr");
        tr.innerHTML=`
        <td>${nomorUrut++}</td> <!-- ✅ NOMOR URUT BERJALAN 1,2,3... -->
        <td>${d[1]||"-"}</td>
        <td class="${kelasWarna}" style="text-align:left">${d[2]||"-"}</td>
        <td>${d[3]||"-"}</td>
        <td>${d[4]||"-"}</td>
        
        <!-- EKSKUL 1 -->
        <td>
            <span class="teks">${d[5]||"Tidak Ikut"}</span>
            <select id="ex1_${i}">
                <option value="" ${!d[5]?"selected":""}>Tidak Ikut</option>
                <option ${d[5]=="Futsal"?"selected":""}>Futsal</option>
                <option ${d[5]=="Paskib"?"selected":""}>Paskib</option>
                <option ${d[5]=="Pramuka"?"selected":""}>Pramuka</option>
                <option ${d[5]=="PMR"?"selected":""}>PMR</option>
                <option ${d[5]=="Tari"?"selected":""}>Tari</option>
                <option ${d[5]=="Silat"?"selected":""}>Silat</option>
                <option ${d[5]=="Taekwondo"?"selected":""}>Taekwondo</option>
                <option ${d[5]=="Tahsin"?"selected":""}>Tahsin</option>
                <option ${d[5]=="Drumband"?"selected":""}>Drumband</option>
            </select>
        </td>
        
        <!-- NILAI 1 -->
        <td>
            <span class="teks">${d[6]||"-"}</span>
            <select id="nil1_${i}">
                <option value="" ${!d[6]?"selected":""}>-</option>
                <option value="A" ${d[6]=="A"?"selected":""}>A</option>
                <option value="B" ${d[6]=="B"?"selected":""}>B</option>
                <option value="C" ${d[6]=="C"?"selected":""}>C</option>
            </select>
        </td>

        <!-- EKSKUL 2 -->
        <td>
            <span class="teks">${d[7]||"Tidak Ikut"}</span>
            <select id="ex2_${i}">
                <option value="" ${!d[7]?"selected":""}>Tidak Ikut</option>
                <option ${d[7]=="Futsal"?"selected":""}>Futsal</option>
                <option ${d[7]=="Paskib"?"selected":""}>Paskib</option>
                <option ${d[7]=="Pramuka"?"selected":""}>Pramuka</option>
                <option ${d[7]=="PMR"?"selected":""}>PMR</option>
                <option ${d[7]=="Tari"?"selected":""}>Tari</option>
                <option ${d[7]=="Silat"?"selected":""}>Silat</option>
                <option ${d[7]=="Taekwondo"?"selected":""}>Taekwondo</option>
                <option ${d[7]=="Tahsin"?"selected":""}>Tahsin</option>
                <option ${d[7]=="Drumband"?"selected":""}>Drumband</option>
            </select>
        </td>
        
        <!-- NILAI 2 -->
        <td>
            <span class="teks">${d[8]||"-"}</span>
            <select id="nil2_${i}">
                <option value="" ${!d[8]?"selected":""}>-</option>
                <option value="A" ${d[8]=="A"?"selected":""}>A</option>
                <option value="B" ${d[8]=="B"?"selected":""}>B</option>
                <option value="C" ${d[8]=="C"?"selected":""}>C</option>
            </select>
        </td>
        `;
        tb.appendChild(tr);
    }
    if(!ada) tb.innerHTML="<tr><td colspan=9>Data tidak ada</td></tr>";
}

// ✅ FUNGSI SIMPAN KE GOOGLE SHEET
async function simpan(){
    if(!confirm("Yakin simpan ke Google Sheet?")) return;

    let baru = [data[0]];
    for(let i=1;i<data.length;i++){
        let ex1 = document.getElementById(`ex1_${i}`).value;
        let nil1 = document.getElementById(`nil1_${i}`).value;
        let ex2 = document.getElementById(`ex2_${i}`).value;
        let nil2 = document.getElementById(`nil2_${i}`).value;

        baru.push([
            data[i][0], data[i][1], data[i][2], data[i][3], data[i][4],
            ex1, nil1, ex2, nil2 // Simpan ke kolom berurutan
        ]);
    }

    // Simpan ke cadangan lokal
    localStorage.setItem("dataEkskulSiswa", JSON.stringify(baru));

    try{
        showInfo("⏳ Mengirim data ke Google...");

        let formData = new FormData();
        formData.append("data", JSON.stringify(baru));

        let res = await fetch(URL, {
            method: "POST",
            body: formData,
            redirect: "follow"
        });

        let teks = await res.text();

        if (teks === "SUKSES") {
            showNotif("✅ BERHASIL! Data masuk ke Google Sheet!");
            data = baru;
        } else {
            throw new Error("Respon: " + teks);
        }

    }catch(e){
        showError("❌ GAGAL: " + e.message);
    }
}

// ✅ FUNGSI CETAK
function cetak(){
    let kelasTerpilih = document.getElementById("filterKelas").value;
    document.getElementById("namaKelasCetak").textContent = (kelasTerpilih !== "SEMUA") ? kelasTerpilih : "Semua Kelas";

    const hari = new Date();
    const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const tglCetak = hari.getDate() + " " + namaBulan[hari.getMonth()] + " " + hari.getFullYear();
    document.getElementById("tanggalHariIni").textContent = tglCetak;

    document.getElementById("judulCetak").style.display = "block";
    document.getElementById("tandaTangan").style.display = "block";

    window.print();

    setTimeout(() => {
        document.getElementById("judulCetak").style.display = "none";
        document.getElementById("tandaTangan").style.display = "none";
    }, 1000);
}

function showNotif(t){document.getElementById("notif").innerText=t;document.getElementById("notif").style.display="block";setTimeout(()=>document.getElementById("notif").style.display="none",3000);}
function showError(t){errorBox.innerText=t;errorBox.style.display="block";setTimeout(()=>errorBox.style.display="none",6000);}
function showInfo(t){infoBox.innerText=t;infoBox.style.display="block";setTimeout(()=>infoBox.style.display="none",4000);}

document.addEventListener("DOMContentLoaded", load);
</script>

</body>
</html>
