<!DOCTYPE html>
<html lang="id">

    <style>
        /* Variabel Warna */
        :root {
            --bg-body: #f4f7f6;
            --bg-container: #ffffff;
            --text-main: #333333;
            --text-muted: #718096;
            --text-heading: #1a365d;
            --text-sub: #4a5568;
            --border-color: #e2e8f0;
            --input-border: #cbd5e0;
            --btn-bg: #3182ce;
            --btn-hover: #2b6cb0;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0aec0;
            --text-heading: #63b3ed;
            --text-sub: #cbd5e0;
            --border-color: #2d3748;
            --input-border: #4a5568;
            --btn-bg: #4299e1;
            --btn-hover: #3182ce;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--bg-container);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: rgba(0, 0, 0, 0.05); }
        [data-theme="dark"] .theme-toggle:hover { background: rgba(255, 255, 255, 0.1); }

        .header img { max-width: 100px; margin-bottom: 15px; }
        .header h1 { font-size: 24px; color: var(--text-heading); margin-bottom: 5px; }
        .header h2 { font-size: 18px; color: var(--text-sub); margin-bottom: 20px; font-weight: 400; }
        hr { border: 0; height: 1px; background: var(--border-color); margin: 20px 0; }

        /* Timer Section */
        #countdown-section { padding: 20px 0; }
        .timer-display { display: flex; justify-content: center; gap: 15px; margin: 25px 0; }
        .timer-box { background: var(--border-color); padding: 10px 15px; border-radius: 6px; min-width: 70px; }
        .timer-box span { display: block; font-size: 28px; font-weight: 700; color: var(--btn-bg); }
        .timer-box label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }

        /* Main Section */
        #main-content { display: none; }
        .form-group { margin-bottom: 20px; text-align: center; }
        
        input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid var(--input-border);
            border-radius: 6px; font-size: 16px; background: var(--bg-container); 
            color: var(--text-main); text-align: center;
        }
        
        .search-btn {
            background-color: var(--btn-bg); color: white; border: none; padding: 12px 20px;
            font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%;
        }
        .search-btn:hover { background-color: var(--btn-hover); }

        /* Result Box */
        .result-box { margin-top: 25px; padding: 20px; border-radius: 6px; display: none; }
        .lulus { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        [data-theme="dark"] .lulus { background-color: #1c4532; color: #9ae6b4; border: 1px solid #22543d; }
        .not-found { background-color: #feebc8; color: #744210; border: 1px solid #fbd38d; }
        [data-theme="dark"] .not-found { background-color: #5d3b0e; color: #fbd38d; border: 1px solid #744210; }

        .footer { margin-top: 30px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>

    // 3. LOGIKA TIMER HITUNG MUNDUR
    const hitungMundur = setInterval(function() {
        const sekarang = new Date().getTime();
        const selisih = waktuBuka - sekarang;

        const hari = Math.floor(selisih / (1000 * 60 * 60 * 24));
        const jam = Math.floor((selisih % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const menit = Math.floor((selisih % (1000 * 60 * 60)) / (1000 * 60));
        const detik = Math.floor((selisih % (1000 * 60)) / 1000);

        document.getElementById("hari").innerText = hari < 10 ? "0" + hari : hari;
        document.getElementById("jam").innerText = jam < 10 ? "0" + jam : jam;
        document.getElementById("menit").innerText = menit < 10 ? "0" + menit : menit;
        document.getElementById("detik").innerText = detik < 10 ? "0" + detik : detik;

        if (selisih < 0) {
            clearInterval(hitungMundur);
            document.getElementById("countdown-section").style.display = "none";
            document.getElementById("main-content").style.display = "block";
            document.getElementById("page-subtitle").innerText = "Aplikasi Cek Kelulusan Mandiri";
        }
    }, 1000);

    // 4. LOGIKA TOMBOL PENCARIAN STATUS
    function cekKelulusan() {
        const input = document.getElementById("nisnInput").value.trim();
        const resultBox = document.getElementById("result");

        if (input === "") {
            alert("Silakan masukkan Nomor NIS terlebih dahulu!");
            return;
        }

        if (dataSiswa[input]) {
            const siswa = dataSiswa[input];
            resultBox.className = "result-box lulus";
            resultBox.innerHTML = `<h3>Selamat!</h3><p><b>${siswa.nama}</b> dinyatakan <b>LULUS</b> dari SMPN 110 Jakarta.</p>`;
        } else {
            resultBox.className = "result-box not-found";
            resultBox.innerHTML = `<h3>Data Tidak Ditemukan</h3><p>Nomor NIS <b>${input}</b> tidak terdaftar di sistem kelulusan.</p>`;
        }
        resultBox.style.display = "block";
    }

    // 5. TOGGLE TEKSTUR TEMA (DARK/LIGHT)
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        if (currentTheme === "dark") {
            document.documentElement.setAttribute("data-theme", "light");
            localStorage.setItem("theme", "light");
        } else {
            document.documentElement.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
        }
    }

    const savedTheme = localStorage.getItem("theme");
    const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
    } else {
        document.documentElement.setAttribute("data-theme", "light");
    }
</script>
