<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Rapor Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .login-card { 
            background-color: #0a0a0a; 
            border: 1px solid #141414; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6">

    <div class="flex-1 flex items-center justify-center">
        <div class="login-card w-full max-w-md p-8 md:p-10 rounded-[2rem] shadow-2xl">
            
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-purple-600/10 rounded-2xl flex items-center justify-center border border-purple-500/20 mx-auto mb-4 shadow-lg shadow-purple-500/5">
                    <i class="fas fa-shield-halved text-purple-500 text-xl"></i>
                </div>
                <h1 class="text-lg font-black italic tracking-tighter uppercase">E-RAPOR <span class="text-purple-500">DIGITAL</span></h1>
                <p class="text-gray-600 text-[9px] font-bold tracking-widest uppercase mt-0.5">SMPN 110 JAKARTA</p>
            </div>

            <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-gray-500 text-[10px] font-black tracking-widest uppercase mb-2">Username / NIP</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-600">
                            <i class="fas fa-user text-xs"></i>
                        </span>
                        <input type="text" id="username" required autocomplete="off" placeholder="Masukkan username Anda"
                            class="w-full bg-zinc-950/50 border border-zinc-900 focus:border-purple-600 pl-11 pr-4 py-3.5 rounded-xl outline-none text-sm font-semibold text-white placeholder-gray-700 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-500 text-[10px] font-black tracking-widest uppercase mb-2">Kata Sandi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-600">
                            <i class="fas fa-lock text-xs"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full bg-zinc-950/50 border border-zinc-900 focus:border-purple-600 pl-11 pr-4 py-3.5 rounded-xl outline-none text-sm font-semibold text-white placeholder-gray-700 transition">
                    </div>
                </div>

                <button type="submit" id="btnSubmit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-black uppercase tracking-wider py-4 rounded-xl transition shadow-xl shadow-purple-900/20 italic flex items-center justify-center gap-2 mt-2">
                    <i class="fas fa-right-to-bracket text-xs"></i> Masuk Masuk Ke Dashboard
                </button>
            </form>

        </div>
    </div>

    <footer class="text-center text-gray-700 text-[10px] font-bold uppercase tracking-widest">
        &copy; 2026 SMPN 110 JAKARTA. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // ⚠️ SAMAKAN URL WEB APP INI DENGAN YANG ADA DI DASHBOARD GURU ANDA
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbyASGr_jDzLMbaLmNRYLGEvk-Zhafe_6Z5cW8O2aq9Mc_x5rmNKN7q8FFaVoRzaH2Q5/exec";

        // Cek jika guru sudah dalam keadaan login, langsung alihkan ke dashboard
        window.onload = function() {
            if (localStorage.getItem("nama_guru")) {
                window.location.href = "dashboard_guru.html";
            }
        }

        async function prosesLogin(event) {
            event.preventDefault();

            const btnSubmit = document.getElementById("btnSubmit");
            const usernameInput = document.getElementById("username").value;
            const passwordInput = document.getElementById("password").value;

            // Efek Loading Animasi pada Tombol
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fas fa-sync-alt animate-spin text-xs"></i> Memverifikasi Akun...`;

            try {
                const response = await fetch(URL_WEB_APP, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        aksi: "login",
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const hasil = await response.json();

                if (hasil.success) {
                    // Menyimpan data identitas guru ke LocalStorage Browser
                    localStorage.setItem("nama_guru", hasil.guru.nama);
                    localStorage.setItem("mapel_guru", hasil.guru.mapel);
                    localStorage.setItem("wali_kelas", hasil.guru.wali_kelas);
                    localStorage.setItem("nip_guru", hasil.guru.nip);

                    // Alihkan ke halaman dashboard utama guru
                    window.location.href = "dashboard_guru.html";
                } else {
                    alert("❌ Login Gagal: " + hasil.message);
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fas fa-right-to-bracket text-xs"></i> Masuk Ke Dashboard`;
                }

            } catch (error) {
                alert("⚠️ Masalah Koneksi: Gagal terhubung dengan server e-rapor.");
                console.error(error);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="fas fa-right-to-bracket text-xs"></i> Masuk Ke Dashboard`;
            }
        }
    </script>
</body>
</html>
