<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denah Tempat Duduk - Multi Kelas</title>
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-page: #f3f4f6;
            --bg-container: #ffffff;
            --bg-header: #4f46e5;
            --text-header: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-footer: #f9fafb;
            --border-color: #e5e7eb;
            --seat-empty: #e5e7eb;
            --seat-filled-bg: #ffffff;
            --seat-filled-border: #10b981;
            --seat-name-bg: rgba(0, 0, 0, 0.65);
            --seat-name-color: #ffffff;
            --modal-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
            --gap-pair: 8px;
            --gap-group: 16px;
            --seat-w: 80px;
            --seat-h: 95px;
            --btn-size: 44px;
            --btn-radius: 12px;
        }

        body.dark-mode {
            --bg-page: #0f172a;
            --bg-container: #1e293b;
            --bg-header: #312e81;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-footer: #334155;
            --border-color: #475569;
            --seat-empty: #334155;
            --seat-filled-bg: #1e293b;
            --seat-filled-border: #10b981;
            --seat-name-bg: rgba(0, 0, 0, 0.75);
            --modal-bg: #1e293b;
            --input-bg: #0f172a;
            --input-border: #475569;
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            transition: background 0.3s ease;
        }

        .app-container {
            background: var(--bg-container);
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 1200px;
            overflow: hidden;
        }

        .header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 16px 12px 24px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.15rem;
            margin-bottom: 4px;
            font-weight: 700;
            padding-top: 28px;
        }

        .header h2 {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.9;
        }

        .connection-status {
            position: absolute;
            top: 8px;
            left: 8px;
            font-size: 0.75rem;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-weight: 600;
        }

        .connection-status.connected { background: rgba(16, 185, 129, 0.9); }
        .connection-status.disconnected { background: rgba(239, 68, 68, 0.9); }

        .header-controls {
            position: absolute;
            top: 6px;
            right: 8px;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border: none;
            border-radius: var(--btn-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn:active { transform: scale(0.95); }
        .btn-add-class { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-refresh { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); }
        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            background: rgba(255,255,255,0.18);
            border: none;
            border-radius: var(--btn-radius);
            cursor: pointer;
            font-size: 18px;
        }

        .class-selector-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-footer);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .class-select {
            padding: 10px 14px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 160px;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .denah-scroll-area {
            width: 100%;
            overflow-x: auto;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .denah-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: max-content;
        }

        .row-wrapper {
            display: flex;
            gap: var(--gap-group);
        }

        .pair-wrapper {
            display: flex;
            gap: var(--gap-pair);
        }

        .seat {
            width: var(--seat-w);
            height: var(--seat-h);
            background: var(--seat-empty);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            flex-shrink: 0;
            overflow: hidden;
        }

        .seat.hidden { visibility: hidden; pointer-events: none; }
        .seat:active:not(.hidden) { transform: scale(0.96); }
        .seat.filled {
            border-color: var(--seat-filled-border);
            background: var(--seat-filled-bg);
        }

        .seat-num {
            position: absolute;
            top: 4px;
            left: 4px;
            background: var(--primary);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 10;
        }

        .seat-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .seat-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--seat-name-bg);
            color: var(--seat-name-color);
            font-size: 0.65rem;
            text-align: center;
            padding: 3px 2px;
            font-weight: 600;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-icon {
            font-size: 1.5rem;
            color: var(--text-muted);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--modal-bg);
            padding: 22px;
            border-radius: 14px;
            width: 100%;
            max-width: 360px;
            color: var(--text-main);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 1.05rem;
            text-align: center;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .preview-img {
            width: 90px;
            height: 110px;
            border-radius: 8px;
            object-fit: cover;
            margin-top: 10px;
            display: none;
            border: 2px solid var(--primary);
        }
        .preview-img.show { display: block; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            min-width: 80px;
            padding: 11px 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: var(--input-border); color: var(--text-main); }
        .btn:active { transform: scale(0.97); }

        .footer {
            text-align: center;
            padding: 12px;
            background: var(--bg-footer);
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ========== RESPONSIVE — LAYAR HP ========== */
        @media (max-width: 480px) {
            :root {
                --seat-w: 62px;
                --seat-h: 78px;
                --gap-pair: 5px;
                --gap-group: 10px;
                --btn-size: 40px;
            }

            body { padding: 5px; }

            .app-container { border-radius: 12px; }

            .header { padding: 12px 8px 16px; }
            .header h1 { font-size: 1rem; padding-top: 24px; }
            .header h2 { font-size: 0.8rem; }

            .connection-status { font-size: 0.68rem; padding: 4px 8px; }
            .icon-btn { font-size: 16px; }

            .class-selector-bar { padding: 10px; }
            .class-select { min-width: 140px; font-size: 0.9rem; padding: 8px 10px; }

            .denah-scroll-area { padding: 12px 4px; }

            .seat-num { width: 18px; height: 18px; font-size: 0.65rem; }
            .seat-name { font-size: 0.58rem; padding: 2px 1px; }

            .modal-box { padding: 18px; }
            .btn { font-size: 0.85rem; padding: 10px 6px; }
        }

        /* ========== LAYAR SANGAT KECIL ========== */
        @media (max-width: 360px) {
            :root {
                --seat-w: 54px;
                --seat-h: 70px;
                --gap-pair: 4px;
                --gap-group: 6px;
            }
            .seat-name { font-size: 0.52rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div id="connectionStatus" class="connection-status">Memeriksa...</div>
        <div class="header-controls">
            <button class="icon-btn btn-add-class" onclick="openAddClassModal()" title="Tambah Kelas">✚</button>
            <button class="icon-btn btn-refresh" id="btnRefresh" onclick="refreshData()" title="Muat Data Terbaru">↺</button>
            <button class="icon-btn btn-save" id="btnSave" onclick="saveToGoogleSheet()" title="Simpan ke Google Sheets">💾</button>
            <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema">🌙</button>
        </div><br>
        <h1>DENAH TEMPAT DUDUK KELAS</h1>
        <h1>SMPN 110 JAKARTA</h1>
    </div>

    <div class="class-selector-bar">
        <select id="classSelect" class="class-select" onchange="switchClass()">
            <option value="" selected>-- Pilih Kelas --</option>
        </select>
    </div>

    <div class="denah-scroll-area">
        <div class="denah-area" id="denahArea"></div>
    </div>

    <div class="footer">SMPN 110 JAKARTA @ 2026</div>
</div>

<!-- Modal Input Data Siswa -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3 id="modalTitle">Input Data Siswa</h3>
        <div class="form-group">
            <label>Nama Lengkap Siswa</label>
            <input type="text" id="inpName" placeholder="Masukkan nama lengkap..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>Foto Siswa (Opsional)</label>
            <input type="file" id="inpPhoto" accept="image/*" onchange="handlePreview(this)">
            <img id="imgPreview" class="preview-img">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveData()">Simpan</button>
            <button class="btn btn-danger" onclick="deleteData()">Hapus</button>
            <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<!-- Modal Tambah Kelas -->
<div class="modal-overlay" id="addClassModal">
    <div class="modal-box">
        <h3>Tambah Kelas Baru</h3>
        <div class="form-group">
            <label>Nama Kelas (contoh: Kelas 7A, 8B, 9C)</label>
            <input type="text" id="inpClassName" placeholder="Kelas 7A" autocomplete="off">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="addClass()">Buat Kelas</button>
            <button class="btn btn-secondary" onclick="closeAddClassModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    // ==================================================
    // ⚡ GANTI URL DI BAWAH INI DENGAN URL MILIK ANDA
    // ==================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjRu2AAub8fKD5PK3s4rkcwEIOEEvyDlMGBSzWO0r-Kf-ekKuI1W-33ygh68KvPfeRfQ/exec';

    const TOTAL_ROWS = 5;
    const TOTAL_COLS = 8;
    const MAX_ACTIVE_SEATS = 36;
    const MAX_PHOTO_SEND_LENGTH = 80000;

    let dataSiswa = {};
    let activeIndex = null;
    let currentClass = '';
    let allClasses = [];
    let allData = {};
    let originalPhotoBase64 = null;
    let _notifTimer = null;

    function getUrlSeparator() {
        return SCRIPT_URL.indexOf('?') === -1 ? '?' : '&';
    }

    async function refreshData() {
        const btnRefresh = document.getElementById('btnRefresh');
        btnRefresh.innerHTML = '<span class="loading"></span>';
        btnRefresh.disabled = true;

        localStorage.removeItem('denah_all_classes_data');
        localStorage.removeItem('denah_current_class');
        localStorage.removeItem('denah_classes_list');

        allClasses = [];
        allData = {};
        dataSiswa = {};
        currentClass = '';

        try {
            const sep = getUrlSeparator();
            const url = SCRIPT_URL + sep + 'action=list';
            const res = await fetch(url);

            if (res.ok) {
                const result = await res.json();
                if (result.result === 'success' && result.sheets) {
                    allClasses = result.sheets;
                    allClasses.sort();

                    for (let i = 0; i < allClasses.length; i++) {
                        const cls = allClasses[i];
                        const dataUrl = SCRIPT_URL + sep + 'action=read&sheet=' + encodeURIComponent(cls);
                        try {
                            const dataRes = await fetch(dataUrl);
                            if (dataRes.ok) {
                                const dataResult = await dataRes.json();
                                if (dataResult.result === 'success' && dataResult.data) {
                                    allData[cls] = dataResult.data;
                                }
                            }
                        } catch (e) {
                            allData[cls] = {};
                        }
                    }

                    localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
                    localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));

                    renderClassSelect();
                    document.getElementById('classSelect').value = "";
                    renderDenah();
                    showStatus('✅ Data terbaru dimuat!', true);
                }
            }
        } catch (err) {
            console.error('Refresh error:', err);
            showStatus('⚠️ Gagal memuat: ' + err.message, false);
        } finally {
            btnRefresh.innerHTML = '↺';
            btnRefresh.disabled = false;
        }
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('denah_theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }

        const savedAllData = localStorage.getItem('denah_all_classes_data');
        const savedClasses = localStorage.getItem('denah_classes_list');

        if (savedAllData) allData = JSON.parse(savedAllData);
        if (savedClasses) allClasses = JSON.parse(savedClasses);

        renderClassSelect();
        document.getElementById('classSelect').value = "";
        renderDenah();
        checkConnection();
    };

    function saveClassesLocally() {
        localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
        localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));
        localStorage.setItem('denah_current_class', currentClass);
    }

    function renderClassSelect() {
        const select = document.getElementById('classSelect');
        select.innerHTML = '';
        const defaultOption = document.createElement('option');
        defaultOption.value = '';
        defaultOption.textContent = '-- Pilih Kelas --';
        defaultOption.selected = true;
        select.appendChild(defaultOption);

        if (allClasses.length === 0) {
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '(Belum ada kelas)';
            emptyOption.disabled = true;
            select.appendChild(emptyOption);
        } else {
            for (let i = 0; i < allClasses.length; i++) {
                const cls = allClasses[i];
                const option = document.createElement('option');
                option.value = cls;
                option.textContent = cls;
                select.appendChild(option);
            }
        }
    }

    function loadClassData(className) {
        if (!className) {
            currentClass = '';
            dataSiswa = {};
            renderDenah();
            return;
        }
        currentClass = className;
        dataSiswa = allData[className] || {};
        saveClassesLocally();
        renderDenah();
        showStatus('📂 Beralih ke ' + className, true);
    }

    function switchClass() {
        const select = document.getElementById('classSelect');
        const newClass = select.value;
        if (newClass !== currentClass) {
            if (currentClass) {
                allData[currentClass] = { ...dataSiswa };
            }
            loadClassData(newClass);
        }
    }

    function openAddClassModal() {
        document.getElementById('inpClassName').value = '';
        document.getElementById('addClassModal').classList.add('active');
        setTimeout(() => document.getElementById('inpClassName').focus(), 100);
    }

    function closeAddClassModal() {
        document.getElementById('addClassModal').classList.remove('active');
    }

    async function addClass() {
        const className = document.getElementById('inpClassName').value.trim();
        if (!className) { alert('Nama kelas wajib diisi!'); return; }
        if (className.toLowerCase().substring(0, 5) !== 'kelas') {
            alert('Nama kelas harus diawali "Kelas" (contoh: Kelas 7A)');
            return;
        }
        if (allClasses.indexOf(className) !== -1) {
            alert('Kelas "' + className + '" sudah ada!');
            return;
        }
        if (currentClass) {
            allData[currentClass] = { ...dataSiswa };
        }

        try {
            const sep = getUrlSeparator();
            const url = SCRIPT_URL + sep + 'action=create&sheetName=' + encodeURIComponent(className);
            await fetch(url, { method: 'GET' });
        } catch (e) {
            console.log('Sheet dibuat atau sudah ada');
        }

        allClasses.push(className);
        allClasses.sort();
        allData[className] = {};
        saveClassesLocally();
        renderClassSelect();
        document.getElementById('classSelect').value = className;
        loadClassData(className);
        closeAddClassModal();
    }

    function checkConnection() {
        const statusEl = document.getElementById('connectionStatus');
        const sep = getUrlSeparator();
        fetch(SCRIPT_URL + sep + 'action=test')
            .then(res => {
                if (!res.ok) throw new Error('HTTP Error');
                return res.json();
            })
            .then(result => {
                if (result.result === 'success') {
                    statusEl.textContent = '✅ Terhubung';
                    statusEl.className = 'connection-status connected';
                } else {
                    statusEl.textContent = '❌ Error';
                    statusEl.className = 'connection-status disconnected';
                }
            })
            .catch(err => {
                console.error('Koneksi gagal:', err);
                statusEl.textContent = '❌ Offline';
                statusEl.className = 'connection-status disconnected';
            });
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');
        body.classList.toggle('dark-mode');
        btn.textContent = body.classList.contains('dark-mode') ? '☀️' : '🌙';
        localStorage.setItem('denah_theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    }

    function showStatus(message, isSuccess) {
        const connStatus = document.getElementById('connectionStatus');
        connStatus.textContent = message;
        connStatus.style.background = isSuccess
            ? 'rgba(16, 185, 129, 0.9)'
            : 'rgba(245, 158, 11, 0.9)';
        clearTimeout(_notifTimer);
        _notifTimer = setTimeout(() => {
            checkConnection();
        }, 4000);
    }

    function renderDenah() {
        const container = document.getElementById('denahArea');
        container.innerHTML = '';
        if (!currentClass) {
            container.innerHTML = '<p style="color:var(--text-muted);font-size:1rem;text-align:center;padding:30px;">Silakan pilih atau tambah kelas terlebih dahulu</p>';
            return;
        }
        for (let r = 0; r < TOTAL_ROWS; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-wrapper';
            for (let c = 0; c < TOTAL_COLS; c += 2) {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'pair-wrapper';
                const idxLeft = r * TOTAL_COLS + c;
                const idxRight = r * TOTAL_COLS + c + 1;
                pairDiv.appendChild(createSeat(idxLeft));
                pairDiv.appendChild(createSeat(idxRight));
                rowDiv.appendChild(pairDiv);
            }
            container.appendChild(rowDiv);
        }
    }

    function createSeat(index) {
        const seat = document.createElement('div');
        if (index >= MAX_ACTIVE_SEATS) { seat.className = 'seat hidden'; return seat; }
        seat.className = 'seat' + (dataSiswa[index] ? ' filled' : '');

        const num = document.createElement('div');
        num.className = 'seat-num';
        num.innerText = index + 1;
        seat.appendChild(num);

        if (dataSiswa[index]) {
            if (dataSiswa[index].photo) {
                const img = document.createElement('img');
                img.className = 'seat-photo';
                img.src = dataSiswa[index].photo;
                seat.appendChild(img);
            }
            const name = document.createElement('div');
            name.className = 'seat-name';
            name.innerText = dataSiswa[index].name;
            seat.appendChild(name);
        } else {
            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.innerText = '+';
            seat.appendChild(icon);
        }
        seat.onclick = () => openModal(index);
        return seat;
    }

    function openModal(index) {
        if (!currentClass) { alert('⚠️ Pilih kelas terlebih dahulu!'); return; }
        activeIndex = index;
        originalPhotoBase64 = null;
        document.getElementById('modalTitle').innerText = currentClass + ' - Kursi No. ' + (index + 1);
        document.getElementById('inpName').value = dataSiswa[index]?.name || '';
        document.getElementById('imgPreview').classList.remove('show');
        document.getElementById('inpPhoto').value = '';
        document.getElementById('modal').classList.add('active');
        setTimeout(() => document.getElementById('inpName').focus(), 100);
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    function compressImage(file, maxW, maxH, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                    else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function handlePreview(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            if (file.size > 500 * 1024) {
                alert('⚠️ Ukuran maksimal 500KB');
                input.value = ''; return;
            }
            originalPhotoBase64 = await compressImage(file, 800, 800, 0.85);
            const small = await compressImage(file, 120, 144, 0.6);
            const img = document.getElementById('imgPreview');
            img.src = small;
            img.classList.add('show');
        }
    }

    function saveData() {
        const name = document.getElementById('inpName').value.trim();
        const smallPhoto = document.getElementById('imgPreview').classList.contains('show')
            ? document.getElementById('imgPreview').src
            : (dataSiswa[activeIndex]?.photo || '');
        const origPhoto = originalPhotoBase64 || smallPhoto;

        if (!name) { alert('Nama wajib diisi!'); return; }

        dataSiswa[activeIndex] = { name: name, photo: smallPhoto, photoOriginal: origPhoto };
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();
        closeModal();
        renderDenah();
    }

    function deleteData() {
        if (confirm('Yakin hapus data ini?')) {
            delete dataSiswa[activeIndex];
            allData[currentClass] = { ...dataSiswa };
            saveClassesLocally();
            closeModal();
            renderDenah();
        }
    }

    // ==================================================
    // ⭐ SIMPAN PAKAI POST — BISA 36 FOTO SEKALIGUS!
    // ==================================================
    async function saveToGoogleSheet() {
        if (!SCRIPT_URL || SCRIPT_URL.indexOf('GANTI_DENGAN_URL') !== -1) {
            alert('⚠️ Ganti URL SCRIPT_URL di kode HTML terlebih dahulu!');
            return;
        }
        if (!currentClass) {
            alert('⚠️ Pilih kelas terlebih dahulu!');
            return;
        }

        const btnSave = document.getElementById('btnSave');
        btnSave.disabled = true;
        btnSave.innerHTML = '<span class="loading"></span>';

        try {
            allData[currentClass] = { ...dataSiswa };
            saveClassesLocally();

            const kirimData = {};
            for (let k in dataSiswa) {
                let foto = dataSiswa[k].photoOriginal || dataSiswa[k].photo || '';
                if (foto.length > MAX_PHOTO_SEND_LENGTH) {
                    foto = foto.substring(0, MAX_PHOTO_SEND_LENGTH);
                }
                kirimData[k] = dataSiswa[k].name + '|||' + foto;
            }

            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'save',
                    sheet: currentClass,
                    data: kirimData
                })
            });

            if (!res.ok) throw new Error('HTTP ' + res.status);

            const result = await res.json();
            if (result.result === 'success') {
                showStatus('✅ Tersimpan: ' + result.tersimpan + ' kursi!', true);
            } else {
                showStatus('⚠️ ' + (result.message || 'Gagal menyimpan'), false);
            }

        } catch (error) {
            console.error('Error:', error);
            showStatus('❌ Gagal: ' + error.message, false);
        } finally {
            btnSave.disabled = false;
            btnSave.innerHTML = '💾';
        }
    }

    document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
    document.getElementById('addClassModal').onclick = e => { if (e.target.id === 'addClassModal') closeAddClassModal(); };
    document.getElementById('inpName').addEventListener('keypress', e => { if (e.key === 'Enter') saveData(); });
    document.getElementById('inpClassName').addEventListener('keypress', e => { if (e.key === 'Enter') addClass(); });
</script>
