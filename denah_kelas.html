<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arsip - SMPN 110 Jakarta</title>
    
    <!-- Library untuk Export PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-page: #0f172a;
            --bg-container: #1e293b;
            --text-header: #ffffff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-footer: #334155;
            --border-color: #475569;
            --seat-empty: #334155;
            --seat-filled-bg: #1e293b;
            --seat-filled-border: #10b981;
            --seat-name-bg: rgba(0, 0, 0, 0.85);
            --seat-name-color: #ffffff;
            --modal-bg: #1e293b;
            --input-bg: #0f172a;
            --input-border: #475569;
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            
            --gap-pair: 12px;
            --gap-group: 24px;
            --seat-w: 130px;
            --seat-h: 160px;
        }

        body.light-mode {
            --bg-page: #f3f4f6;
            --bg-container: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-footer: #f9fafb;
            --border-color: #e5e7eb;
            --seat-empty: #e5e7eb;
            --seat-filled-bg: #ffffff;
            --modal-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            transition: background 0.3s ease;
        }

        .app-container {
            background: var(--bg-container);
            box-shadow: var(--shadow);
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text-header);
            padding: 50px 12px 16px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title-main {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #f59e0b 100%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .title-sub {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f59e0b;
            text-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }

        .title-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f59e0b, transparent);
            margin: 6px auto;
            border-radius: 2px;
        }

        .connection-status {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .connection-status.connected { background: rgba(16, 185, 129, 0.9); }
        .connection-status.disconnected { background: rgba(239, 68, 68, 0.9); }

        .header-controls {
            position: absolute;
            top: 6px;
            right: 8px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s;
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn:active { transform: scale(0.92); }
        .btn-add-class { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-refresh { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-lock { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-lock.unlocked { background: linear-gradient(135deg, #10b981, #059669); }
        .theme-toggle { background: rgba(255,255,255,0.15); }

        .toolbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px;
            background: var(--bg-footer);
            border-bottom: 1px solid var(--border-color);
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-container);
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .action-btn.active { background: var(--warning); color: #000; border-color: var(--warning); }

        .class-select {
            padding: 6px 12px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            width: auto;
            max-width: fit-content;
            text-align: center;
        }

        .page-nav {
            display: none;
            justify-content: center;
            gap: 10px;
            padding: 12px 10px 0;
        }

        .page-btn {
            flex: 1;
            max-width: 180px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-footer);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .denah-scroll-area {
            width: 100%;
            padding: 15px 8px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        .denah-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .row-wrapper { 
            display: flex; 
            gap: var(--gap-group); 
            justify-content: center;
            width: 100%;
        }
        
        .pair-wrapper { 
            display: flex; 
            gap: var(--gap-pair); 
        }

        .seat {
            width: var(--seat-w);
            height: var(--seat-h);
            background: var(--seat-empty);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid transparent;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .seat.hidden { visibility: hidden; pointer-events: none; }
        .seat:active:not(.hidden) { transform: scale(0.95); }
        .seat.filled { border-color: var(--seat-filled-border); background: var(--seat-filled-bg); }
        .seat.locked { cursor: default; }
        .seat.selected-swap { border-color: var(--warning) !important; transform: scale(1.05); }

        .seat-num {
            position: absolute;
            top: 6px;
            left: 6px;
            background: var(--primary);
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .seat-photo { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            cursor: zoom-in;
        }

        .seat-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--seat-name-bg);
            color: var(--seat-name-color);
            font-size: 0.75rem;
            line-height: 1.2;
            text-align: center;
            padding: 6px 3px;
            font-weight: 700;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-icon {
            font-size: 2rem;
            color: var(--text-muted);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* MODAL OVERLAY */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--modal-bg);
            padding: 20px 16px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            color: var(--text-main);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 { margin-bottom: 16px; font-size: 1.05rem; text-align: center; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 11px 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .preview-img {
            width: 100px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            margin-top: 10px;
            display: none;
            border: 2px solid var(--primary);
        }
        .preview-img.show { display: block; }

        .btn-row { display: flex; gap: 8px; margin-top: 18px; }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 11px 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--input-border); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: white; }
        .btn:active { transform: scale(0.96); }

        /* MODAL ZOOM FOTO */
        .zoom-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            padding: 16px;
        }

        .zoom-overlay.active { display: flex; }

        .zoom-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
            max-height: 90vh;
        }

        .zoom-img {
            width: calc(var(--seat-w) * 3.8);
            height: calc(var(--seat-h) * 3.8);
            max-width: 85vw;
            max-height: 65vh;
            object-fit: cover;
            border-radius: 16px;
            border: 4px solid #ffffff;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }

        .zoom-caption {
            margin-top: 10px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 20px;
        }

        .zoom-close {
            position: absolute;
            top: -18px;
            right: -18px;
            background: #ef4444;
            color: white;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PRINT MEDIA CONTROL */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0 !important;
            }

            .header-controls, .toolbar, .page-nav, .connection-status,
            .title-divider, .modal-overlay, .zoom-overlay, .empty-icon {
                display: none !important;
            }

            html, body {
                width: 100% !important;
                height: 100% !important;
                max-height: 297mm !important;
                overflow: hidden !important;
                background: #ffffff !important;
                color: #000000 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .app-container {
                background: #ffffff !important;
                box-shadow: none !important;
                width: 100% !important;
                height: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
            }

            .header {
                background: none !important;
                color: #000000 !important;
                padding: 14px 0 4px 0 !important;
                border-bottom: 2px solid #000000 !important;
                margin: 0 10mm 4px 10mm !important;
                text-align: center !important;
            }

            .title-main {
                background: none !important;
                -webkit-text-fill-color: initial !important;
                color: #000000 !important;
                font-size: 1.6rem !important;
                font-weight: 800 !important;
                margin: 0 !important;
            }

            .title-sub {
                color: #000000 !important;
                font-size: 1.3rem !important;
                font-weight: 700 !important;
                margin-top: 4px !important;
            }

            .denah-scroll-area {
                overflow: visible !important;
                padding: 0 10mm !important;
                display: flex !important;
                justify-content: center !important;
            }

            .denah-area {
                display: grid !important;
                grid-template-columns: repeat(6, 1fr) !important;
                gap: 2px !important;
                width: 100% !important;
            }

            .row-wrapper, .pair-wrapper {
                display: contents !important;
            }

            .seat {
                width: 100% !important;
                height: 105px !important;
                border: 1px solid #333333 !important;
                border-radius: 4px !important;
                box-shadow: none !important;
                background: #ffffff !important;
                box-sizing: border-box !important;
                position: relative !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .seat.hidden {
                display: none !important;
            }

            .seat-num {
                width: 15px !important;
                height: 15px !important;
                font-size: 0.55rem !important;
                background: #000000 !important;
                color: #ffffff !important;
                top: 2px !important;
                left: 2px !important;
                border-radius: 50% !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .seat-name {
                font-size: 0.55rem !important;
                line-height: 1 !important;
                padding: 2px 1px !important;
                background: rgba(0, 0, 0, 0.85) !important;
                color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .seat-photo {
                object-fit: cover !important;
                width: 100% !important;
                height: 100% !important;
            }
        }

        @media (max-width: 600px) {
            :root { 
                --seat-w: 76px; 
                --seat-h: 96px; 
                --gap-pair: 6px; 
                --gap-group: 12px; 
            }
            .header { padding-top: 45px; }
            .title-main { font-size: 1rem; }
            .title-sub { font-size: 0.8rem; }
            .icon-btn { width: 34px; height: 34px; font-size: 14px; }
            .seat-num { width: 20px; height: 20px; font-size: 0.7rem; top: 3px; left: 3px; }
            .seat-name { font-size: 0.6rem; padding: 3px 2px; }
            .empty-icon { font-size: 1.3rem; }
            .denah-scroll-area { padding: 10px 4px; }
            .class-select { font-size: 0.85rem; padding: 5px 8px; }
            
            .zoom-img {
                width: calc(var(--seat-w) * 3.8);
                height: calc(var(--seat-h) * 3.8);
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div id="connectionStatus" class="connection-status">Memeriksa...</div>
        <div class="header-controls">
            <button class="icon-btn btn-lock" id="btnLock" onclick="toggleMasterLock()" title="Kunci/Buka Akses Edit">🔒</button>
            <button class="icon-btn btn-add-class" onclick="openAddClassModal()" title="Tambah Kelas">✚</button>
            <button class="icon-btn btn-refresh" id="btnRefresh" onclick="refreshData()" title="Muat Data Terbaru">↺</button>
            <button class="icon-btn btn-save" id="btnSave" onclick="saveToGoogleSheet()" title="Simpan ke Sheets">💾</button>
            <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Ganti Tema">☀️</button>
        </div>

        <div><br>
            <h1 class="title-main">DENAH TEMPAT DUDUK KELAS</h1>
            <div class="title-divider"></div>
            <h2 class="title-sub">SMPN 110 JAKARTA</h2>
        </div>
    </div>

    <div class="toolbar">
        <select id="classSelect" class="class-select" onchange="switchClass()">
            <option value="" disabled selected hidden>-- Pilih Kelas --</option>
        </select>
        
        <select id="sortSelect" class="class-select" onchange="sortSeats()">
            <option value="" disabled selected hidden>↕️ Urutkan</option>
            <option value="az">🔤 Nama (A - Z)</option>
            <option value="za">🔤 Nama (Z - A)</option>
        </select>

        <button class="action-btn" id="btnSwapMode" onclick="toggleSwapMode()">🔄 Mode Tukar</button>
        <button class="action-btn" onclick="randomizeSeats()">🔀 Acak Kursi</button>
        <button class="action-btn" onclick="exportToImage()">🖼️ Export PNG</button>
        <button class="action-btn" onclick="printDenah()">🖨️ Cetak Denah</button>
    </div>

    <div id="pageNav" class="page-nav">
        <button id="btnPage1" onclick="switchPage(1)" class="page-btn active">Hal 1 (Kursi 1-20)</button>
        <button id="btnPage2" onclick="switchPage(2)" class="page-btn">Hal 2 (Kursi 21-36)</button>
    </div>

    <div class="denah-scroll-area">
        <div class="denah-area" id="denahArea"></div>
    </div>
</div>

<!-- MODAL INPUT / EDIT -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3 id="modalTitle">Input Data Siswa</h3>
        <div class="form-group">
            <label>Nama Lengkap Siswa</label>
            <input type="text" id="inpName" placeholder="Masukkan nama lengkap..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>Foto Siswa</label>
            <input type="file" id="inpPhoto" accept="image/*" onchange="handlePreview(this)">
            <img id="imgPreview" class="preview-img">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveData()">Simpan</button>
            <button class="btn btn-danger" id="btnDeleteSeat" onclick="deleteSeatData()">Hapus</button>
            <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH KELAS -->
<div class="modal-overlay" id="addClassModal">
    <div class="modal-box">
        <h3>Tambah Kelas Baru</h3>
        <div class="form-group">
            <label>Nama Kelas (contoh: Kelas 7A, 8B, 9C)</label>
            <input type="text" id="inpClassName" placeholder="Kelas 7A" autocomplete="off">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="addClass()">Buat Kelas</button>
            <button class="btn btn-secondary" onclick="closeAddClassModal()">Batal</button>
        </div>
    </div>
</div>

<!-- MODAL ZOOM FOTO -->
<div class="zoom-overlay" id="zoomModal" onclick="closeZoomModal()">
    <div class="zoom-content" onclick="event.stopPropagation()">
        <button class="zoom-close" onclick="closeZoomModal()">✕</button>
        <img id="zoomImg" class="zoom-img" src="" alt="Zoom Foto">
        <div id="zoomCaption" class="zoom-caption"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPkRVLwfT1zzpzje6XoPzONwfuWPPTggQePm9Ms4g0nj-b-zZxkFsuy_grZfsOevnGXw/exec';

    const MAX_ACTIVE_SEATS = 36;
    let dataSiswa = {};
    let activeIndex = null;
    let currentClass = '';
    let allClasses = [];
    let allData = {};
    let originalPhotoBase64 = null;
    let _notifTimer = null;
    let currentPage = 1;

    let isMasterUnlocked = false;
    const MASTER_PIN = "1234";
    let isSwapMode = false;
    let swapFirstIndex = null;

    function getUrlSeparator() {
        return SCRIPT_URL.indexOf('?') === -1 ? '?' : '&';
    }

    function isMobile() {
        return window.innerWidth <= 600;
    }

    function switchPage(page) {
        currentPage = page;
        document.getElementById('btnPage1').classList.toggle('active', page === 1);
        document.getElementById('btnPage2').classList.toggle('active', page === 2);
        renderDenah();
    }

    function toggleMasterLock() {
        if (!isMasterUnlocked) {
            const pin = prompt("Masukkan PIN untuk Membuka Mode Edit:");
            if (pin === MASTER_PIN) {
                isMasterUnlocked = true;
                const btn = document.getElementById('btnLock');
                btn.textContent = '🔓';
                btn.classList.add('unlocked');
                showStatus('🔓 Mode Edit Terbuka', true);
            } else if (pin !== null) {
                alert("❌ PIN Salah!");
            }
        } else {
            isMasterUnlocked = false;
            const btn = document.getElementById('btnLock');
            btn.textContent = '🔒';
            btn.classList.remove('unlocked');
            if(isSwapMode) toggleSwapMode();
            showStatus('🔒 Denah Terkunci', true);
        }
        renderDenah();
    }

    function toggleSwapMode() {
        if (!isMasterUnlocked) {
            alert('⚠️ Buka Master Lock 🔒 terlebih dahulu untuk menukar tempat!');
            return;
        }
        isSwapMode = !isSwapMode;
        swapFirstIndex = null;
        const btn = document.getElementById('btnSwapMode');
        btn.classList.toggle('active', isSwapMode);
        showStatus(isSwapMode ? '🔄 Mode Tukar Aktif: Pilih 2 Kursi' : 'Mode Tukar Mati', true);
        renderDenah();
    }

    function handleSeatClick(index) {
        if (isSwapMode) {
            if (swapFirstIndex === null) {
                swapFirstIndex = index;
                showStatus(`Kursi ${index + 1} dipilih. Pilih kursi tujuan!`, true);
                renderDenah();
            } else {
                if (swapFirstIndex !== index) {
                    const temp = dataSiswa[swapFirstIndex];
                    dataSiswa[swapFirstIndex] = dataSiswa[index];
                    dataSiswa[index] = temp;

                    allData[currentClass] = { ...dataSiswa };
                    saveClassesLocally();
                    saveToGoogleSheet();
                    showStatus(`✅ Kursi ${swapFirstIndex + 1} & ${index + 1} berhasil ditukar!`, true);
                }
                swapFirstIndex = null;
                renderDenah();
            }
            return;
        }

        const hasPhoto = dataSiswa[index] && dataSiswa[index].photo;
        if (!isMasterUnlocked && hasPhoto) return;
        openModal(index);
    }

    function sortSeats() {
        if (!currentClass) {
            alert('⚠️ Pilih kelas terlebih dahulu!');
            document.getElementById('sortSelect').value = "";
            return;
        }

        if (!isMasterUnlocked) {
            alert('⚠️ Buka Master Lock 🔒 untuk mengurutkan posisi siswa!');
            document.getElementById('sortSelect').value = "";
            return;
        }

        const sortType = document.getElementById('sortSelect').value;
        let entries = [];
        for (let i = 0; i < MAX_ACTIVE_SEATS; i++) {
            if (dataSiswa[i] && dataSiswa[i].name) {
                entries.push({ originalIndex: i, data: dataSiswa[i] });
            }
        }

        if (entries.length === 0) {
            alert('⚠️ Belum ada data siswa di kelas ini!');
            document.getElementById('sortSelect').value = "";
            return;
        }

        if (sortType === 'az') {
            entries.sort((a, b) => a.data.name.localeCompare(b.data.name, 'id', { sensitivity: 'base' }));
        } else if (sortType === 'za') {
            entries.sort((a, b) => b.data.name.localeCompare(a.data.name, 'id', { sensitivity: 'base' }));
        } else if (sortType === 'num') {
            entries.sort((a, b) => a.originalIndex - b.originalIndex);
        }

        let newDataSiswa = {};
        entries.forEach((item, newIndex) => {
            newDataSiswa[newIndex] = item.data;
        });

        dataSiswa = newDataSiswa;
        allData[currentClass] = { ...dataSiswa };
        
        saveClassesLocally();
        saveToGoogleSheet();
        renderDenah();

        showStatus(`✅ Siswa berhasil diurutkan (${sortType.toUpperCase()})!`, true);
        document.getElementById('sortSelect').value = "";
    }

    function randomizeSeats() {
        if (!currentClass) { alert('⚠️ Pilih kelas terlebih dahulu!'); return; }
        if (!isMasterUnlocked) { alert('⚠️ Buka Master Lock 🔒 untuk mengacak kursi!'); return; }
        
        if (!confirm('Apakah Anda yakin ingin mengacak posisi tempat duduk seluruh siswa di kelas ini?')) return;

        let filledKeys = Object.keys(dataSiswa);
        let values = Object.values(dataSiswa);

        for (let i = values.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [values[i], values[j]] = [values[j], values[i]];
        }

        let newDataSiswa = {};
        filledKeys.forEach((key, idx) => {
            newDataSiswa[key] = values[idx];
        });

        dataSiswa = newDataSiswa;
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();
        saveToGoogleSheet();
        renderDenah();
        showStatus('🔀 Tempat duduk berhasil diacak!', true);
    }

    function exportToImage() {
        const area = document.getElementById('denahArea');
        if (!currentClass || area.children.length === 0) {
            alert('⚠️ Pilih kelas dan pastikan denah tampil!');
            return;
        }

        showStatus('⏳ Membuat gambar PNG...', true);
        html2canvas(area, { backgroundColor: '#0f172a', scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Denah_${currentClass}.png`;
            link.href = canvas.toDataURL();
            link.click();
            showStatus('✅ Berhasil diunduh sebagai Gambar!', true);
        });
    }

    function printDenah() {
        if (!currentClass) { alert('⚠️ Pilih kelas terlebih dahulu!'); return; }
        window.print();
    }

    async function refreshData() {
        const btnRefresh = document.getElementById('btnRefresh');
        btnRefresh.innerHTML = '⌛';
        btnRefresh.disabled = true;

        localStorage.removeItem('denah_all_classes_data');
        localStorage.removeItem('denah_current_class');
        localStorage.removeItem('denah_classes_list');

        allClasses = [];
        allData = {};
        dataSiswa = {};
        currentClass = '';

        try {
            const sep = getUrlSeparator();
            const res = await fetch(SCRIPT_URL + sep + 'action=list');

            if (res.ok) {
                const result = JSON.parse(await res.text());

                if (result.result === 'success' && result.sheets) {
                    allClasses = result.sheets.sort();

                    for (let i = 0; i < allClasses.length; i++) {
                        const cls = allClasses[i];
                        const dataUrl = SCRIPT_URL + sep + 'action=read&sheet=' + encodeURIComponent(cls);
                        try {
                            const dataRes = await fetch(dataUrl);
                            if (dataRes.ok) {
                                const dataResult = JSON.parse(await dataRes.text());
                                if (dataResult.result === 'success' && dataResult.data) {
                                    let parsedData = {};
                                    for(let k in dataResult.data) {
                                        let item = dataResult.data[k];
                                        if(typeof item === 'object') {
                                            parsedData[k] = item;
                                        } else if(typeof item === 'string') {
                                            let parts = item.split('|||');
                                            parsedData[k] = {
                                                name: parts[0] || '',
                                                photo: parts[1] || ''
                                            };
                                        }
                                    }
                                    allData[cls] = parsedData;
                                }
                            }
                        } catch (e) { allData[cls] = {}; }
                    }

                    localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
                    localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));

                    renderClassSelect();
                    document.getElementById('classSelect').value = "";
                    renderDenah();
                    showStatus('✅ Data terbaru dimuat!', true);
                }
            }
        } catch (err) {
            showStatus('⚠️ Gagal memuat data', false);
        } finally {
            btnRefresh.innerHTML = '↺';
            btnRefresh.disabled = false;
        }
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('denah_theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('.theme-toggle').textContent = '🌙';
        }

        const savedAllData = localStorage.getItem('denah_all_classes_data');
        const savedClasses = localStorage.getItem('denah_classes_list');

        if (savedAllData) allData = JSON.parse(savedAllData);
        if (savedClasses) allClasses = JSON.parse(savedClasses);

        renderClassSelect();
        document.getElementById('classSelect').value = "";
        renderDenah();
        checkConnection();
    };

    function saveClassesLocally() {
        localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
        localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));
        localStorage.setItem('denah_current_class', currentClass);
    }

    function renderClassSelect() {
        const select = document.getElementById('classSelect');
        select.innerHTML = '<option value="" disabled selected hidden>-- Pilih Kelas --</option>';

        if (allClasses.length === 0) {
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '(Belum ada kelas)';
            emptyOption.disabled = true;
            select.appendChild(emptyOption);
        } else {
            for (let i = 0; i < allClasses.length; i++) {
                const option = document.createElement('option');
                option.value = allClasses[i];
                option.textContent = allClasses[i];
                select.appendChild(option);
            }
        }
    }

    function loadClassData(className) {
        if (!className) {
            currentClass = '';
            dataSiswa = {};
            renderDenah();
            return;
        }
        currentClass = className;
        dataSiswa = allData[className] || {};
        saveClassesLocally();
        renderDenah();
        showStatus('📂 Kelas: ' + className, true);
    }

    function switchClass() {
        const newClass = document.getElementById('classSelect').value;
        if (newClass !== currentClass) {
            if (currentClass) allData[currentClass] = { ...dataSiswa };
            loadClassData(newClass);
        }
    }

    function openAddClassModal() {
        if (!isMasterUnlocked) { alert('⚠️ Buka Master Lock 🔒 untuk menambah kelas!'); return; }
        document.getElementById('inpClassName').value = '';
        document.getElementById('addClassModal').classList.add('active');
        setTimeout(() => document.getElementById('inpClassName').focus(), 100);
    }

    function closeAddClassModal() {
        document.getElementById('addClassModal').classList.remove('active');
    }

    async function addClass() {
        const className = document.getElementById('inpClassName').value.trim();
        if (!className) { alert('Nama kelas wajib diisi!'); return; }
        if (allClasses.indexOf(className) !== -1) { alert('Kelas sudah ada!'); return; }
        
        if (currentClass) allData[currentClass] = { ...dataSiswa };

        try {
            const sep = getUrlSeparator();
            await fetch(SCRIPT_URL + sep + 'action=create&sheetName=' + encodeURIComponent(className));
        } catch (e) {}

        allClasses.push(className);
        allClasses.sort();
        allData[className] = {};
        saveClassesLocally();
        renderClassSelect();
        document.getElementById('classSelect').value = className;
        loadClassData(className);
        closeAddClassModal();
    }

    function checkConnection() {
        const statusEl = document.getElementById('connectionStatus');
        const sep = getUrlSeparator();
        fetch(SCRIPT_URL + sep + 'action=test')
            .then(res => res.json())
            .then(result => {
                if (result.result === 'success') {
                    statusEl.textContent = '✅ Terhubung';
                    statusEl.className = 'connection-status connected';
                } else {
                    statusEl.textContent = '❌ ' + (result.message || 'Error');
                    statusEl.className = 'connection-status disconnected';
                }
            })
            .catch(() => {
                statusEl.textContent = '❌ Offline';
                statusEl.className = 'connection-status disconnected';
            });
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');
        body.classList.toggle('light-mode');
        btn.textContent = body.classList.contains('light-mode') ? '🌙' : '☀️';
        localStorage.setItem('denah_theme', body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    function showStatus(message, isSuccess) {
        const connStatus = document.getElementById('connectionStatus');
        connStatus.textContent = message;
        connStatus.style.background = isSuccess ? 'rgba(16, 185, 129, 0.9)' : 'rgba(245, 158, 11, 0.9)';
        clearTimeout(_notifTimer);
        _notifTimer = setTimeout(() => checkConnection(), 4000);
    }

    function renderDenah() {
        const container = document.getElementById('denahArea');
        const pageNav = document.getElementById('pageNav');
        container.innerHTML = '';

        if (!currentClass) {
            if (pageNav) pageNav.style.display = 'none';
            return;
        }

        const mobile = isMobile();
        if (pageNav) pageNav.style.display = mobile ? 'flex' : 'none';

        const cols = mobile ? 4 : 8;
        const rows = 5;
        const startIndex = mobile ? (currentPage - 1) * 20 : 0;

        for (let r = 0; r < rows; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row-wrapper';

            for (let c = 0; c < cols; c += 2) {
                const pairDiv = document.createElement('div');
                pairDiv.className = 'pair-wrapper';

                const idxLeft = startIndex + (r * cols + c);
                const idxRight = startIndex + (r * cols + c + 1);

                pairDiv.appendChild(createSeat(idxLeft));
                pairDiv.appendChild(createSeat(idxRight));

                rowDiv.appendChild(pairDiv);
            }
            container.appendChild(rowDiv);
        }
    }

    function createSeat(index) {
        const seat = document.createElement('div');
        if (index >= MAX_ACTIVE_SEATS) { seat.className = 'seat hidden'; return seat; }
        
        const hasPhoto = dataSiswa[index] && dataSiswa[index].photo;
        const isSelectedSwap = (swapFirstIndex === index);

        seat.className = 'seat' 
            + (dataSiswa[index] ? ' filled' : '') 
            + (hasPhoto && !isMasterUnlocked ? ' locked' : '')
            + (isSelectedSwap ? ' selected-swap' : '');

        // DRAG & DROP JIKA MASTER LOCK TERBUKA
        if (isMasterUnlocked) {
            seat.setAttribute('draggable', 'true');
            
            seat.ondragstart = (e) => {
                e.dataTransfer.setData('text/plain', index);
            };

            seat.ondragover = (e) => {
                e.preventDefault();
            };

            seat.ondrop = (e) => {
                e.preventDefault();
                const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                const toIndex = index;

                if (fromIndex !== toIndex) {
                    const temp = dataSiswa[fromIndex];
                    dataSiswa[fromIndex] = dataSiswa[toIndex];
                    dataSiswa[toIndex] = temp;

                    allData[currentClass] = { ...dataSiswa };
                    saveClassesLocally();
                    saveToGoogleSheet();
                    renderDenah();
                    showStatus(`✅ Kursi ${fromIndex + 1} dipindah ke Kursi ${toIndex + 1}!`, true);
                }
            };
        }

        const num = document.createElement('div');
        num.className = 'seat-num';
        num.innerText = index + 1;
        seat.appendChild(num);

        if (dataSiswa[index]) {
            if (dataSiswa[index].photo) {
                const img = document.createElement('img');
                img.className = 'seat-photo';
                img.src = dataSiswa[index].photo;
                
                img.onclick = (e) => {
                    e.stopPropagation();
                    openZoomModal(
                        dataSiswa[index].photoOriginal || dataSiswa[index].photo, 
                        dataSiswa[index].name
                    );
                };
                
                seat.appendChild(img);
            }

            const name = document.createElement('div');
            name.className = 'seat-name';
            name.innerText = dataSiswa[index].name;
            name.title = dataSiswa[index].name;
            seat.appendChild(name);
        } else {
            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.innerText = '+';
            seat.appendChild(icon);
        }

        seat.onclick = () => handleSeatClick(index);
        return seat;
    }

    function openZoomModal(photoSrc, name) {
        const zoomModal = document.getElementById('zoomModal');
        const zoomImg = document.getElementById('zoomImg');
        const zoomCaption = document.getElementById('zoomCaption');

        zoomImg.src = photoSrc;
        zoomCaption.innerText = name || '';
        zoomModal.classList.add('active');
    }

    function closeZoomModal() {
        document.getElementById('zoomModal').classList.remove('active');
    }

    function openModal(index) {
        if (!currentClass) { alert('⚠️ Pilih kelas terlebih dahulu!'); return; }
        if (!isMasterUnlocked && dataSiswa[index]) { alert('⚠️ Buka Master Lock 🔒 untuk mengedit!'); return; }
        
        activeIndex = index;
        originalPhotoBase64 = null;
        document.getElementById('modalTitle').innerText = currentClass + ' - Kursi No. ' + (index + 1);
        document.getElementById('inpName').value = dataSiswa[index]?.name || '';
        document.getElementById('imgPreview').classList.remove('show');
        document.getElementById('inpPhoto').value = '';
        
        document.getElementById('btnDeleteSeat').style.display = dataSiswa[index] ? 'block' : 'none';
        
        document.getElementById('modal').classList.add('active');
        setTimeout(() => document.getElementById('inpName').focus(), 100);
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    function compressImage(file, maxW, maxH, quality) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                    else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function handlePreview(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            if (file.size > 2 * 1024 * 1024) { alert('⚠️ Ukuran foto maksimal 2MB'); input.value = ''; return; }
            
            originalPhotoBase64 = await compressImage(file, 500, 500, 0.7);
            const small = await compressImage(file, 200, 240, 0.6);
            
            const img = document.getElementById('imgPreview');
            img.src = small;
            img.classList.add('show');
        }
    }

    async function saveData() {
        const name = document.getElementById('inpName').value.trim();
        const smallPhoto = document.getElementById('imgPreview').classList.contains('show')
            ? document.getElementById('imgPreview').src
            : (dataSiswa[activeIndex]?.photo || '');
        const origPhoto = originalPhotoBase64 || smallPhoto;

        if (!name) { alert('Nama wajib diisi!'); return; }

        dataSiswa[activeIndex] = { name: name, photo: smallPhoto, photoOriginal: origPhoto };
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();
        closeModal();
        renderDenah();

        saveToGoogleSheet();
    }

    function deleteSeatData() {
        if (!confirm('Hapus data siswa dari kursi ini?')) return;
        delete dataSiswa[activeIndex];
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();
        closeModal();
        renderDenah();
        saveToGoogleSheet();
    }

    async function saveToGoogleSheet() {
        if (!currentClass) return;

        const btnSave = document.getElementById('btnSave');
        btnSave.disabled = true;
        btnSave.innerHTML = '⌛';

        try {
            allData[currentClass] = { ...dataSiswa };
            saveClassesLocally();

            const kirimData = {};
            for (let k in dataSiswa) {
                let foto = dataSiswa[k].photoOriginal || dataSiswa[k].photo || '';
                kirimData[k] = dataSiswa[k].name + '|||' + foto;
            }

            const payload = {
                action: 'save',
                sheet: currentClass,
                data: JSON.stringify(kirimData)
            };

            await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            showStatus('✅ Tersimpan ke Sheet!', true);
        } catch (error) {
            showStatus('✅ Tersimpan!', true);
        } finally {
            btnSave.disabled = false;
            btnSave.innerHTML = '💾';
        }
    }

    window.addEventListener('resize', renderDenah);
    document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
    document.getElementById('addClassModal').onclick = e => { if (e.target.id === 'addClassModal') closeAddClassModal(); };
    document.getElementById('inpName').addEventListener('keypress', e => { if (e.key === 'Enter') saveData(); });
    document.getElementById('inpClassName').addEventListener('keypress', e => { if (e.key === 'Enter') addClass(); });
</script>
