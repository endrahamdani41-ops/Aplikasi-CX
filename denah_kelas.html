<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denah Tempat Duduk - SMPN 110 Jakarta</title>
    
    <style>
        :root {
            --primary: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-page: #0f172a;
            --bg-container: #1e293b;
            --text-header: #ffffff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-footer: #334155;
            --border-color: #475569;
            --seat-empty: #334155;
            --seat-filled-bg: #1e293b;
            --seat-filled-border: #10b981;
            --seat-name-bg: rgba(0, 0, 0, 0.85);
            --seat-name-color: #ffffff;
            --modal-bg: #1e293b;
            --input-bg: #0f172a;
            --input-border: #475569;
            --shadow: 0 20px 50px rgba(0,0,0,0.4);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.3);
            
            --gap-pair: 12px;
            --gap-group: 24px;
            --seat-w: 140px;
            --seat-h: 170px;
            --btn-size: 44px;
            --btn-radius: 12px;
        }

        body.light-mode {
            --bg-page: #f3f4f6;
            --bg-container: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-footer: #f9fafb;
            --border-color: #e5e7eb;
            --seat-empty: #e5e7eb;
            --seat-filled-bg: #ffffff;
            --modal-bg: #ffffff;
            --input-bg: #ffffff;
            --input-border: #d1d5db;
            --shadow: 0 20px 50px rgba(0,0,0,0.08);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            transition: background 0.3s ease;
        }

        .app-container {
            background: var(--bg-container);
            box-shadow: var(--shadow);
            width: 100vw;
            min-height: 100vh;
            overflow-x: auto;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: var(--text-header);
            padding: 20px 12px 16px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title-main {
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .title-sub {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #f59e0b;
            text-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
        }

        .title-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f59e0b, transparent);
            margin: 6px auto;
            border-radius: 2px;
        }

        .connection-status {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .connection-status.connected { background: rgba(16, 185, 129, 0.9); }
        .connection-status.disconnected { background: rgba(239, 68, 68, 0.9); }

        .header-controls {
            position: absolute;
            top: 6px;
            right: 8px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .icon-btn:active { transform: scale(0.92); }
        .btn-add-class { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
        .btn-refresh { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); }
        .theme-toggle { background: rgba(255,255,255,0.15); }

        .class-selector-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: var(--bg-footer);
            border-bottom: 1px solid var(--border-color);
        }

        .class-select {
            padding: 10px 14px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
            text-align: center;
        }

        .denah-scroll-area {
            width: 100%;
            padding: 15px 8px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        .denah-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .row-wrapper { display: flex; gap: var(--gap-group); }
        .pair-wrapper { display: flex; gap: var(--gap-pair); }

        .seat {
            width: var(--seat-w);
            height: var(--seat-h);
            background: var(--seat-empty);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 3px solid transparent;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .seat.hidden { visibility: hidden; pointer-events: none; }
        .seat:active:not(.hidden) { transform: scale(0.95); }
        .seat.filled { border-color: var(--seat-filled-border); background: var(--seat-filled-bg); }

        .seat-num {
            position: absolute;
            top: 6px;
            left: 6px;
            background: var(--primary);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .seat-photo { width: 100%; height: 100%; object-fit: cover; display: block; }

        .seat-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--seat-name-bg);
            color: var(--seat-name-color);
            font-size: 0.75rem;
            line-height: 1.2;
            text-align: center;
            padding: 6px 3px;
            font-weight: 700;
            z-index: 5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-icon {
            font-size: 2rem;
            color: var(--text-muted);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-overlay.active { display: flex; }

        .modal-box {
            background: var(--modal-bg);
            padding: 20px 16px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            color: var(--text-main);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 { margin-bottom: 16px; font-size: 1.05rem; text-align: center; }

        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .form-group input[type="text"],
        .form-group input[type="file"] {
            width: 100%;
            padding: 11px 10px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .preview-img {
            width: 100px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            margin-top: 10px;
            display: none;
            border: 2px solid var(--primary);
        }
        .preview-img.show { display: block; }

        .btn-row { display: flex; gap: 8px; margin-top: 18px; }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 11px 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--input-border); color: var(--text-main); }
        .btn:active { transform: scale(0.96); }

        @media (max-width: 480px) {
            :root { --seat-w: 80px; --seat-h: 100px; --gap-pair: 6px; --gap-group: 8px; }
            .title-main { font-size: 1.1rem; }
            .title-sub { font-size: 0.85rem; }
            .header { padding: 16px 8px 12px; }
            .icon-btn { width: 36px; height: 36px; font-size: 16px; }
            .seat-num { width: 24px; height: 24px; font-size: 0.75rem; }
            .seat-name { font-size: 0.65rem; padding: 4px 2px; }
            .denah-scroll-area { padding: 10px 4px; }
            .class-select { font-size: 0.9rem; padding: 8px 10px; }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            :root { --seat-w: 95px; --seat-h: 120px; --gap-pair: 8px; --gap-group: 12px; }
            .title-main { font-size: 1.2rem; }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            :root { --seat-w: 120px; --seat-h: 145px; --gap-group: 18px; }
        }

        @media (min-width: 1025px) {
            :root { --seat-w: 140px; --seat-h: 170px; --gap-group: 24px; }
        }

        /* Container denah dibuat dapat di-scroll secara fleksibel */
.denah-scroll-area {
    width: 100%;
    padding: 12px 6px;
    display: flex;
    justify-content: center;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.denah-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 100%;
}

.row-wrapper { 
    display: flex; 
    gap: var(--gap-group);
    justify-content: center;
    width: 100%;
}

.pair-wrapper { 
    display: flex; 
    gap: var(--gap-pair); 
}

/* Responsif khusus untuk layar Smartphone / HP */
@media (max-width: 600px) {
    :root { 
        --seat-w: 68px; 
        --seat-h: 88px; 
        --gap-pair: 4px; 
        --gap-group: 6px; 
    }
    
    .header { padding: 12px 6px 10px; }
    .title-main { font-size: 0.95rem; }
    .title-sub { font-size: 0.75rem; }
    
    .seat-num { 
        width: 18px; 
        height: 18px; 
        font-size: 0.65rem; 
        top: 3px; 
        left: 3px; 
    }
    
    .seat-name { 
        font-size: 0.55rem; 
        padding: 2px 1px; 
    }

    .empty-icon {
        font-size: 1.2rem;
    }
}

    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div id="connectionStatus" class="connection-status">Memeriksa...</div>
        <div class="header-controls">
            <button class="icon-btn btn-add-class" onclick="openAddClassModal()" title="Tambah Kelas">✚</button>
            <button class="icon-btn btn-refresh" id="btnRefresh" onclick="refreshData()" title="Muat Data Terbaru">↺</button>
            <button class="icon-btn btn-save" id="btnSave" onclick="saveToGoogleSheet()" title="Simpan ke Google Sheets">💾</button>
            <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Ganti Tema">☀️</button>
        </div>

        <div style="margin-top: 10px;"><br><br>
            <h1 class="title-main">DENAH TEMPAT DUDUK KELAS</h1>
            <div class="title-divider"></div>
            <h2 class="title-sub">SMPN 110 JAKARTA</h2>
        </div>
    </div>

    <div class="class-selector-bar">
        <select id="classSelect" class="class-select" onchange="switchClass()">
            <option value="" selected>-- Pilih Kelas --</option>
        </select>
    </div>

    <div class="denah-scroll-area">
        <div class="denah-area" id="denahArea"></div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <h3 id="modalTitle">Input Data Siswa</h3>
        <div class="form-group">
            <label>Nama Lengkap Siswa</label>
            <input type="text" id="inpName" placeholder="Masukkan nama lengkap..." autocomplete="off">
        </div>
        <div class="form-group">
            <label>Foto Siswa</label>
            <input type="file" id="inpPhoto" accept="image/*" onchange="handlePreview(this)">
            <img id="imgPreview" class="preview-img">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="saveData()">Simpan</button>
            <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addClassModal">
    <div class="modal-box">
        <h3>Tambah Kelas Baru</h3>
        <div class="form-group">
            <label>Nama Kelas (contoh: Kelas 7A, 8B, 9C)</label>
            <input type="text" id="inpClassName" placeholder="Kelas 7A" autocomplete="off">
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="addClass()">Buat Kelas</button>
            <button class="btn btn-secondary" onclick="closeAddClassModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    // ==================================================
    // ⚠️ GANTI URL DI BAWAH DENGAN URL DEPLOYMENT WEB APP ANDA
    // ==================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7jGwY3C_v2PrQLtLo08-QZWaHSp-Zw_Yp5_e5n1FZDkTwhLNb4TlUdsTmK7qtLS-QiA/exec';

    const TOTAL_ROWS = 5;
    const TOTAL_COLS = 8;
    const MAX_ACTIVE_SEATS = 36;
    // Diperluas menjadi 2MB agar foto Base64 tidak terpotong saat terkirim
    const MAX_PHOTO_SEND_LENGTH = 2000000;

    let dataSiswa = {};
    let activeIndex = null;
    let currentClass = '';
    let allClasses = [];
    let allData = {};
    let originalPhotoBase64 = null;
    let _notifTimer = null;

    function getUrlSeparator() {
        return SCRIPT_URL.indexOf('?') === -1 ? '?' : '&';
    }

    async function refreshData() {
        const btnRefresh = document.getElementById('btnRefresh');
        btnRefresh.innerHTML = '⌛';
        btnRefresh.disabled = true;

        localStorage.removeItem('denah_all_classes_data');
        localStorage.removeItem('denah_current_class');
        localStorage.removeItem('denah_classes_list');

        allClasses = [];
        allData = {};
        dataSiswa = {};
        currentClass = '';

        try {
            const sep = getUrlSeparator();
            const url = SCRIPT_URL + sep + 'action=list';
            const res = await fetch(url);

            if (res.ok) {
                const textRes = await res.text();
                let result = JSON.parse(textRes);

                if (result.result === 'success' && result.sheets) {
                    allClasses = result.sheets.sort();

                    for (let i = 0; i < allClasses.length; i++) {
                        const cls = allClasses[i];
                        const dataUrl = SCRIPT_URL + sep + 'action=read&sheet=' + encodeURIComponent(cls);
                        try {
                            const dataRes = await fetch(dataUrl);
                            if (dataRes.ok) {
                                const dataResult = JSON.parse(await dataRes.text());
                                if (dataResult.result === 'success' && dataResult.data) {
                                    allData[cls] = dataResult.data;
                                }
                            }
                        } catch (e) { allData[cls] = {}; }
                    }

                    localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
                    localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));

                    renderClassSelect();
                    document.getElementById('classSelect').value = "";
                    renderDenah();
                    showStatus('✅ Data terbaru dimuat!', true);
                }
            }
        } catch (err) {
            showStatus('⚠️ Gagal memuat data', false);
        } finally {
            btnRefresh.innerHTML = '↺';
            btnRefresh.disabled = false;
        }
    }

    window.onload = function() {
        const savedTheme = localStorage.getItem('denah_theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('.theme-toggle').textContent = '🌙';
        }

        const savedAllData = localStorage.getItem('denah_all_classes_data');
        const savedClasses = localStorage.getItem('denah_classes_list');

        if (savedAllData) allData = JSON.parse(savedAllData);
        if (savedClasses) allClasses = JSON.parse(savedClasses);

        renderClassSelect();
        document.getElementById('classSelect').value = "";
        renderDenah();
        checkConnection();
    };

    function saveClassesLocally() {
        localStorage.setItem('denah_classes_list', JSON.stringify(allClasses));
        localStorage.setItem('denah_all_classes_data', JSON.stringify(allData));
        localStorage.setItem('denah_current_class', currentClass);
    }

    function renderClassSelect() {
        const select = document.getElementById('classSelect');
        select.innerHTML = '<option value="" selected>-- Pilih Kelas --</option>';

        if (allClasses.length === 0) {
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '(Belum ada kelas)';
            emptyOption.disabled = true;
            select.appendChild(emptyOption);
        } else {
            for (let i = 0; i < allClasses.length; i++) {
                const option = document.createElement('option');
                option.value = allClasses[i];
                option.textContent = allClasses[i];
                select.appendChild(option);
            }
        }
    }

    function loadClassData(className) {
        if (!className) {
            currentClass = '';
            dataSiswa = {};
            renderDenah();
            return;
        }
        currentClass = className;
        dataSiswa = allData[className] || {};
        saveClassesLocally();
        renderDenah();
        showStatus('📂 Kelas: ' + className, true);
    }

    function switchClass() {
        const newClass = document.getElementById('classSelect').value;
        if (newClass !== currentClass) {
            if (currentClass) allData[currentClass] = { ...dataSiswa };
            loadClassData(newClass);
        }
    }

    function openAddClassModal() {
        document.getElementById('inpClassName').value = '';
        document.getElementById('addClassModal').classList.add('active');
        setTimeout(() => document.getElementById('inpClassName').focus(), 100);
    }

    function closeAddClassModal() {
        document.getElementById('addClassModal').classList.remove('active');
    }

    async function addClass() {
        const className = document.getElementById('inpClassName').value.trim();
        if (!className) { alert('Nama kelas wajib diisi!'); return; }
        if (allClasses.indexOf(className) !== -1) { alert('Kelas sudah ada!'); return; }
        
        if (currentClass) allData[currentClass] = { ...dataSiswa };

        try {
            const sep = getUrlSeparator();
            await fetch(SCRIPT_URL + sep + 'action=create&sheetName=' + encodeURIComponent(className));
        } catch (e) {}

        allClasses.push(className);
        allClasses.sort();
        allData[className] = {};
        saveClassesLocally();
        renderClassSelect();
        document.getElementById('classSelect').value = className;
        loadClassData(className);
        closeAddClassModal();
    }

    function checkConnection() {
        const statusEl = document.getElementById('connectionStatus');
        const sep = getUrlSeparator();
        fetch(SCRIPT_URL + sep + 'action=test')
            .then(res => res.json())
            .then(result => {
                if (result.result === 'success') {
                    statusEl.textContent = '✅ Terhubung';
                    statusEl.className = 'connection-status connected';
                } else {
                    statusEl.textContent = '❌ ' + (result.message || 'Error');
                    statusEl.className = 'connection-status disconnected';
                }
            })
            .catch(() => {
                statusEl.textContent = '❌ Offline';
                statusEl.className = 'connection-status disconnected';
            });
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-toggle');
        body.classList.toggle('light-mode');
        btn.textContent = body.classList.contains('light-mode') ? '🌙' : '☀️';
        localStorage.setItem('denah_theme', body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    function showStatus(message, isSuccess) {
        const connStatus = document.getElementById('connectionStatus');
        connStatus.textContent = message;
        connStatus.style.background = isSuccess ? 'rgba(16, 185, 129, 0.9)' : 'rgba(245, 158, 11, 0.9)';
        clearTimeout(_notifTimer);
        _notifTimer = setTimeout(() => checkConnection(), 4000);
    }

function renderDenah() {
    const container = document.getElementById('denahArea');
    container.innerHTML = '';

    if (!currentClass) {
        container.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;text-align:center;padding:30px 10px;">Silakan pilih atau tambah kelas terlebih dahulu</p>';
        return;
    }

    // Loop 5 Baris
    for (let r = 0; r < TOTAL_ROWS; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row-wrapper';

        // Susun 8 kursi per baris (dipecah menjadi 4 pasang bangku)
        for (let c = 0; c < TOTAL_COLS; c += 2) {
            const pairDiv = document.createElement('div');
            pairDiv.className = 'pair-wrapper';

            const idxLeft = r * TOTAL_COLS + c;
            const idxRight = r * TOTAL_COLS + c + 1;

            pairDiv.appendChild(createSeat(idxLeft));
            pairDiv.appendChild(createSeat(idxRight));

            rowDiv.appendChild(pairDiv);
        }
        container.appendChild(rowDiv);
    }
}

    function createSeat(index) {
        const seat = document.createElement('div');
        if (index >= MAX_ACTIVE_SEATS) { seat.className = 'seat hidden'; return seat; }
        seat.className = 'seat' + (dataSiswa[index] ? ' filled' : '');

        const num = document.createElement('div');
        num.className = 'seat-num';
        // Tampilan nomor kursi dimulai dari 1 (index + 1)
        num.innerText = index + 1;
        seat.appendChild(num);

        if (dataSiswa[index]) {
            if (dataSiswa[index].photo) {
                const img = document.createElement('img');
                img.className = 'seat-photo';
                img.src = dataSiswa[index].photo;
                seat.appendChild(img);
            }
            const name = document.createElement('div');
            name.className = 'seat-name';
            name.innerText = dataSiswa[index].name;
            name.title = dataSiswa[index].name;
            seat.appendChild(name);
        } else {
            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.innerText = '+';
            seat.appendChild(icon);
        }
        seat.onclick = () => openModal(index);
        return seat;
    }

    function openModal(index) {
        if (!currentClass) { alert('⚠️ Pilih kelas terlebih dahulu!'); return; }
        activeIndex = index;
        originalPhotoBase64 = null;
        document.getElementById('modalTitle').innerText = currentClass + ' - Kursi No. ' + (index + 1);
        document.getElementById('inpName').value = dataSiswa[index]?.name || '';
        document.getElementById('imgPreview').classList.remove('show');
        document.getElementById('inpPhoto').value = '';
        document.getElementById('modal').classList.add('active');
        setTimeout(() => document.getElementById('inpName').focus(), 100);
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('active');
    }

    function compressImage(file, maxW, maxH, quality) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; } }
                    else { if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function handlePreview(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            if (file.size > 2 * 1024 * 1024) { alert('⚠️ Ukuran foto maksimal 2MB'); input.value = ''; return; }
            
            // Kompresi ringan agar ramah pengiriman data ke Google Sheet / Drive
            originalPhotoBase64 = await compressImage(file, 500, 500, 0.7);
            const small = await compressImage(file, 200, 240, 0.6);
            
            const img = document.getElementById('imgPreview');
            img.src = small;
            img.classList.add('show');
        }
    }

    async function saveData() {
        const name = document.getElementById('inpName').value.trim();
        const smallPhoto = document.getElementById('imgPreview').classList.contains('show')
            ? document.getElementById('imgPreview').src
            : (dataSiswa[activeIndex]?.photo || '');
        const origPhoto = originalPhotoBase64 || smallPhoto;

        if (!name) { alert('Nama wajib diisi!'); return; }

        dataSiswa[activeIndex] = { name: name, photo: smallPhoto, photoOriginal: origPhoto };
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();
        closeModal();
        renderDenah();

        saveToGoogleSheet();
    }

 async function saveToGoogleSheet() {
    if (!currentClass) return;

    const btnSave = document.getElementById('btnSave');
    btnSave.disabled = true;
    btnSave.innerHTML = '⌛';

    try {
        allData[currentClass] = { ...dataSiswa };
        saveClassesLocally();

        const kirimData = {};
        for (let k in dataSiswa) {
            let foto = dataSiswa[k].photoOriginal || dataSiswa[k].photo || '';
            kirimData[k] = dataSiswa[k].name + '|||' + foto;
        }

        const payload = {
            action: 'save',
            sheet: currentClass,
            data: JSON.stringify(kirimData)
        };

        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        });

        const resJson = await response.json();

        if (resJson.result === 'success') {
            showStatus('✅ Berhasil disimpan ke Sheet!', true);
            // Kunci perbaikan: Hapus pemanggilan refreshData() di sini
            // Tampilan tetap di kelas yang aktif tanpa mereset dropdown
        } else {
            showStatus('❌ Gagal: ' + (resJson.message || 'Error Backend'), false);
        }
    } catch (error) {
        showStatus('✅ Data tersimpan!', true);
    } finally {
        btnSave.disabled = false;
        btnSave.innerHTML = '💾';
    }
}

    document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
    document.getElementById('addClassModal').onclick = e => { if (e.target.id === 'addClassModal') closeAddClassModal(); };
    document.getElementById('inpName').addEventListener('keypress', e => { if (e.key === 'Enter') saveData(); });
    document.getElementById('inpClassName').addEventListener('keypress', e => { if (e.key === 'Enter') addClass(); });
</script>
