<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Soal Universal ke Format Template LMS</title>
    
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Consolas', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Minimal custom styles for specific rich-text outputs */
        .preview-box ol { margin-top: 4px; margin-bottom: 4px; padding-left: 28px; list-style-type: lower-alpha; }
        .preview-box li { margin-bottom: 2px; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 antialiased min-h-screen flex justify-center p-4 sm:p-6">

    <div class="w-full max-w-4xl flex flex-col gap-5">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white dark:bg-slate-800 p-5 sm:px-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
            <div class="flex items-center gap-3 mb-4 sm:mb-0">
                <span class="text-2xl">📝</span>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Konverter Soal LMS</h1>
            </div>
            <button id="themeToggleBtn" onclick="toggleTheme()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-full bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-blue-500 dark:hover:border-blue-500 transition-colors shadow-inner" title="Ubah Tema">
                <span id="themeIcon">☀️</span>
                <span id="themeText" class="hidden sm:inline">Light Mode</span>
            </button>
        </header>

        <main class="bg-white dark:bg-slate-800 rounded-xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-5">
            
            <!-- Raw Input Textarea -->
            <div class="flex flex-col gap-2">
                <label for="rawInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Paste Soal & Opsi:</label>
                <textarea id="rawInput" class="w-full h-56 p-4 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono text-sm leading-relaxed text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-y" placeholder="Paste seluruh soal dan opsi di sini..."></textarea>
            </div>

            <!-- Configuration Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="kategoriInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Kategori Soal:</label>
                    <input type="text" id="kategoriInput" placeholder="ASTS INFORMATIKA-7" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="kunciInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Kunci Default:</label>
                    <input type="text" id="kunciInput" value="a" placeholder="a / b / c / d" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="poinInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Poin per Soal:</label>
                    <input type="number" id="poinInput" value="1" min="1" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="pembahasanInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Pembahasan Default:</label>
                    <input type="text" id="pembahasanInput" value="-" placeholder="Isi pembahasan" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button onclick="convertQuestions()" class="flex-1 sm:flex-[2] py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm hover:-translate-y-px transition-all flex items-center justify-center gap-2">
                    ✨ Konversi ke Format Template
                </button>
                <button onclick="loadSampleText()" class="flex-1 py-3 px-4 bg-transparent border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
                    📄 Isi Contoh Soal
                </button>
                <button onclick="clearInput()" class="flex-1 py-3 px-4 bg-transparent border border-slate-300 dark:border-slate-600 hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-800 dark:text-slate-200 hover:text-red-600 dark:hover:text-red-400 hover:border-red-300 dark:hover:border-red-700 font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
                    🗑️ Bersihkan
                </button>
            </div>
        </main>

        <!-- Output / Preview Section -->
        <section id="outputCard" class="hidden bg-white dark:bg-slate-800 rounded-xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm animate-[fadeIn_0.3s_ease-in-out]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 dark:border-slate-700 pb-4 mb-4 gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-xl">📋</span>
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white">Hasil Konversi LMS</h2>
                    <span id="statsCount" class="text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 px-3 py-1 rounded-full">0 Soal</span>
                </div>
                <button id="copyBtn" onclick="copyResult()" class="w-full sm:w-auto py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm hover:-translate-y-px transition-all flex items-center justify-center gap-2 text-sm">
                    📋 Salin Hasil (Siap Paste)
                </button>
            </div>
            <div id="resultPreview" class="preview-box w-full min-h-[250px] max-h-[550px] overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-5 font-serif text-black dark:text-slate-200 text-base leading-relaxed shadow-inner focus:outline-none" contenteditable="true" spellcheck="false">
                <!-- Converted content injected here -->
            </div>
        </section>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 flex items-center gap-3 bg-slate-900 dark:bg-slate-800 text-white px-5 py-3 rounded-lg shadow-2xl border border-slate-700 font-semibold text-sm transition-all duration-300 translate-y-[150px] opacity-0 z-50">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Notifikasi</span>
    </div>

    <script>
        // --- 1. Theme Management (Dark/Light Mode) ---
        function initTheme() {
            // Default to dark mode based on root class
            const isDark = document.documentElement.classList.contains('dark');
            const savedTheme = localStorage.getItem('konverter_theme') || (isDark ? 'dark' : 'light');
            applyTheme(savedTheme);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('konverter_theme', newTheme);
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            
            if (theme === 'dark') {
                html.classList.add('dark');
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            } else {
                html.classList.remove('dark');
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            }
        }

        // Initialize theme immediately
        initTheme();

        function cleanPrefix(text) {
            if (!text) return '';
            // Remove option prefixes like "A. ", "a) ", "1. ", "A.  ", "(A) "
            return text
                .replace(/^\s*(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s*|\b[A-Ea-e]\b\s*[\.\-]\s*)/, '')
                .trim();
        }

        function cleanQuestionPrefix(text) {
            if (!text) return '';
            // Remove question numbers like "1. ", "1)", "Soal 1:", "45.Rangkaian"
            return text
                .replace(/^\s*(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i, '')
                .trim();
        }

        function parseRawText(raw) {
            // Split by double line breaks to separate question blocks
            const blocks = raw.split(/\r?\n\s*\r?\n/).map(b => b.trim()).filter(b => b.length > 0);
            
            const questions = [];
            
            // Trust blank lines if they exist, but verify internally
            if (blocks.length > 1) {
                blocks.forEach(block => {
                    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    parseLinesSmart(lines, questions);
                });
            } else {
                // Fallback path: No clear blank line separation. Parse line by line.
                const allLines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                parseLinesSmart(allLines, questions);
            }

            return questions;
        }

        function parseLinesSmart(lines, questionsArray) {
            let currentQuestionLines = [];
            // Matches "1.", "1)", "01.", "Soal 1:", "45." (even without space after punctuation)
            const reNumberStart = /^(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                // Strong indicator of a new question
                const isNewNumberedQuestion = reNumberStart.test(line);
                
                if (isNewNumberedQuestion && currentQuestionLines.length > 0) {
                    extractQuestionFromLines(currentQuestionLines, questionsArray);
                    currentQuestionLines = [line]; // Start new block
                } else {
                    currentQuestionLines.push(line);
                }
            }
            
            if (currentQuestionLines.length > 0) {
                extractQuestionFromLines(currentQuestionLines, questionsArray);
            }
        }
        
        function extractQuestionFromLines(lines, questionsArray) {
            if (lines.length === 0) return;

            let questionLines = [];
            let options = [];

            // Regex to detect explicit option prefixes (e.g., "A.", "B)", "a)", "C -")
            const reOptionPrefix = /^(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s+|\b[A-Ea-e]\b\s*[\.\-]\s+)/;

            let firstOptionIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (reOptionPrefix.test(lines[i])) {
                    firstOptionIdx = i;
                    break;
                }
            }

            if (firstOptionIdx !== -1 && firstOptionIdx > 0) {
                // Found explicit options! Extract everything before as question.
                questionLines = lines.slice(0, firstOptionIdx);
                options = lines.slice(firstOptionIdx).map(cleanPrefix);
            } else {
                // Fallback: No clear A/B/C/D labels found. Assume last N lines are options.
                if (lines.length >= 5) {
                    options = lines.slice(-4).map(cleanPrefix);
                    questionLines = lines.slice(0, -4);
                } else if (lines.length > 1) {
                    questionLines = [lines[0]];
                    options = lines.slice(1).map(cleanPrefix);
                } else {
                    questionLines = [lines[0]];
                    options = [];
                }
            }
            
            // Clean the first line of the question to remove numbering
            if (questionLines.length > 0) {
                questionLines[0] = cleanQuestionPrefix(questionLines[0]);
            }
            
            // Fill missing options if less than 4 were found
            while (options.length < 4) {
                options.push("[Opsi tidak ditemukan]");
            }
            
            // Join multi-line questions with a break
            const questionText = questionLines.join('<br>');

            questionsArray.push({
                soal: questionText,
                opsi: options
            });
        }

        function convertQuestions() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) {
                showToast("⚠️ Mohon isi atau paste teks soal terlebih dahulu!", "warning");
                return;
            }

            const kategori = document.getElementById('kategoriInput').value.trim() || 'Umum';
            const kunci = document.getElementById('kunciInput').value.trim().toLowerCase() || 'a';
            const poin = document.getElementById('poinInput').value.trim() || '1';
            const pembahasan = document.getElementById('pembahasanInput').value.trim() || '-';

            const parsedList = parseRawText(rawText);

            if (parsedList.length === 0) {
                showToast("❌ Tidak dapat mengenali format soal.", "error");
                return;
            }

            let htmlResult = '';

            parsedList.forEach((q, index) => {
                const noNum = index + 1;
                
                htmlResult += `<div>No: ${noNum}</div>\n`;
                htmlResult += `<div>Kategori: ${escapeHtml(kategori)}</div>\n`;
                htmlResult += `<div>Soal : ${q.soal}</div>\n`; 
                htmlResult += `<div>Opsi:</div>\n`;
                
                // STRICT LMS REQUIREMENT: <ol type="a"> for lowercase options (a, b, c, d)
                htmlResult += `<ol type="a">\n`;
                q.opsi.forEach(opt => {
                    htmlResult += `  <li>${escapeHtml(opt)}</li>\n`;
                });
                htmlResult += `</ol>\n`;

                htmlResult += `<div>Kunci Jawaban: ${escapeHtml(kunci)}</div>\n`;
                htmlResult += `<div>Poin: ${escapeHtml(poin)}</div>\n`;
                htmlResult += `<div>Pembahasan: ${escapeHtml(pembahasan)}</div>\n`;
                
                // MANDATORY BLANK LINE / SPACE AFTER PEMBAHASAN
                htmlResult += `<div><br></div>\n`;
            });

            const previewEl = document.getElementById('resultPreview');
            previewEl.innerHTML = htmlResult;

            document.getElementById('statsCount').textContent = `${parsedList.length} Soal Terkonversi`;

            const outputCard = document.getElementById('outputCard');
            outputCard.classList.remove('hidden');
            outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

            showToast(`✨ Berhasil mengonversi ${parsedList.length} soal!`, "success");
        }

        // --- 4. Copy to Clipboard ---
        function copyResult() {
            const previewEl = document.getElementById('resultPreview');
            
            if (!previewEl.innerHTML.trim()) {
                showToast("⚠️ Tidak ada hasil untuk disalin!", "warning");
                return;
            }

            // Using Selection and Range to copy rich HTML to maintain format in MS Word
            const range = document.createRange();
            range.selectNodeContents(previewEl);

            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const copyBtn = document.getElementById('copyBtn');
                    const origText = copyBtn.innerHTML;
                    
                    // Button visual feedback
                    copyBtn.innerHTML = '✅ Berhasil Disalin!';
                    copyBtn.classList.replace('bg-emerald-600', 'bg-emerald-500');
                    copyBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-emerald-600');

                    setTimeout(() => {
                        copyBtn.innerHTML = origText;
                        copyBtn.classList.replace('bg-emerald-500', 'bg-emerald-600');
                        copyBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-emerald-700');
                    }, 2500);

                    showToast("📋 Hasil disalin! Siap di-paste ke Word/LMS.", "success");
                } else {
                    showToast("❌ Gagal menyalin. Silakan gunakan Ctrl+C.", "error");
                }
            } catch (err) {
                showToast("❌ Browser tidak mendukung auto-copy.", "error");
            }

            selection.removeAllRanges();
        }

        // --- 5. Helpers ---
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function clearInput() {
            document.getElementById('rawInput').value = '';
            document.getElementById('outputCard').classList.add('hidden');
            showToast("🗑️ Input telah dibersihkan.", "info");
        }

        function loadSampleText() {
            const sampleText = `Apa ciri utama pembangunan Indonesia pada masa Orde Lama di bawah kepemimpinan Soekarno?
Fokus pada pembangunan proyek mercusuar dan penguatan karakter bangsa.
Menitikberatkan pada stabilitas ekonomi nasional dan investasi modal asing.
Melakukan swasembada pangan secara besar-besaran di seluruh wilayah desa.
Menekankan pada desentralisasi kekuasaan dan otonomi daerah yang sangat luas.

2. Strategi pembangunan pada masa Orde Baru dikenal dengan sebutan Trilogi Pembangunan yang meliputi...
A. Kebebasan berpolitik, keterbukaan informasi, dan penghapusan korupsi.
B. Pembangunan infrastruktur digital, peningkatan ekspor, dan subsidi energi gas.
C. Pertumbuhan ekonomi tinggi, stabilitas nasional, dan pemerataan hasil sosial.
D. Penegakan hukum yang adil, perlindungan hak asasi, dan pemilihan umum bebas.`;

            document.getElementById('rawInput').value = sampleText;
            showToast("📝 Contoh soal berhasil dimuat!", "info");
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;

            if (type === 'success') toastIcon.textContent = '✅';
            else if (type === 'warning') toastIcon.textContent = '⚠️';
            else if (type === 'error') toastIcon.textContent = '❌';
            else toastIcon.textContent = 'ℹ️';

            // Show animation
            toast.classList.remove('translate-y-[150px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150px]', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
