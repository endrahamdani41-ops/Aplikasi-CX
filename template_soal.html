<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Soal Portal Sekolah</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Consolas', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        .preview-box ol { margin-top: 4px; margin-bottom: 4px; padding-left: 28px; list-style-type: lower-alpha; }
        .preview-box li { margin-bottom: 6px; }
        
        /* Gambar rata kiri */
        .preview-box img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 10px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .preview-box .img-placeholder {
            display: block;
            width: fit-content;
            margin: 10px 0;
            background-color: #f1f5f9;
            border: 2px dashed #94a3b8;
            color: #475569;
            padding: 8px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
            font-weight: bold;
            text-align: center;
        }

        /* Hilangkan bar hitam */
        .preview-box div {
            background: transparent !important;
            margin-bottom: 2px;
        }
        .preview-box div:empty {
            height: 0 !important;
            margin: 0 !important;
            display: none;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .header-btn {
            @apply flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 shadow-sm;
        }
        .header-btn:hover {
            @apply transform scale-110 shadow-md;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 antialiased min-h-screen flex justify-center p-4 sm:p-6">

    <div class="w-full max-w-5xl flex flex-col gap-5">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white dark:bg-slate-800 p-4 sm:px-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📝</span>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Konverter Soal Portal Sekolah</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3 flex-wrap sm:flex-nowrap">
                <!-- Upload Gambar (Direct Insert) -->
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleDirectImageUpload(this)">
                <button onclick="document.getElementById('imageInput').click()" 
                    class="header-btn bg-gradient-to-br from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white border-0" 
                    title="Upload & Sisipkan Gambar di Posisi Kursor">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
                
                <div class="w-px h-8 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block"></div>
                
                <!-- Konversi Button -->
                <button onclick="convertQuestions()" class="header-btn bg-blue-600 hover:bg-blue-700 text-white border border-blue-500" title="Konversi">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
                
                <!-- Upload Kunci Jawaban Button -->
                <input type="file" id="answerKeyFile" accept=".txt,.docx" class="hidden" onchange="handleAnswerKeyUpload(this)">
                <button onclick="document.getElementById('answerKeyFile').click()" class="header-btn bg-transparent hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-300 dark:border-slate-600" title="Upload Kunci Jawaban">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </button>

                <!-- Bersihkan Button -->
                <button onclick="clearInput()" class="header-btn bg-transparent hover:bg-red-50 dark:hover:bg-red-900/30 text-slate-600 dark:text-slate-300 hover:text-red-600 dark:hover:text-red-400 border border-slate-300 dark:border-slate-600 hover:border-red-300 dark:hover:border-red-700" title="Bersihkan">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>

                <div class="w-px h-8 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block"></div>

                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="header-btn bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-yellow-400 border border-slate-200 dark:border-slate-700 hover:border-blue-500 dark:hover:border-blue-500" title="Ubah Tema">
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <main class="bg-white dark:bg-slate-800 rounded-xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col gap-5">
            
            <!-- Textarea Soal -->
            <div class="flex flex-col gap-2">
                <label for="rawInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Paste Soal & Opsi:</label>
                <textarea id="rawInput" class="w-full h-72 p-4 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg font-mono text-sm leading-relaxed text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-y" placeholder="Paste seluruh soal di sini !

"></textarea>
             </div>

            <!-- Configuration Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="flex flex-col gap-2">
                    <label for="kategoriInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Kategori Soal:</label>
                    <input type="text" id="kategoriInput" placeholder="ASTS INFORMATIKA-7" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="poinInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Poin per Soal:</label>
                    <input type="number" id="poinInput" value="1" min="1" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="pembahasanInput" class="font-semibold text-sm text-slate-700 dark:text-slate-300">Pembahasan Default:</label>
                    <input type="text" id="pembahasanInput" value="-" placeholder="Isi pembahasan" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </main>

        <!-- Output Section -->
        <section id="outputCard" class="hidden bg-white dark:bg-slate-800 rounded-xl p-5 sm:p-6 border border-slate-200 dark:border-slate-700 shadow-sm animate-[fadeIn_0.3s_ease-in-out]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-200 dark:border-slate-700 pb-4 mb-4 gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-xl">📋</span>
                    <h2 class="text-lg font-bold text-slate-900 dark:text-white">Hasil Konversi LMS</h2>
                    <span id="statsCount" class="text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-400 px-3 py-1 rounded-full">0 Soal</span>
                </div>
                <button id="copyBtn" onclick="copyResultToWord()" class="w-full sm:w-auto py-2 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-sm hover:-translate-y-px transition-all flex items-center justify-center gap-2 text-sm">
                     Salin Ke Word
                </button>
            </div>
            
            <div id="resultPreview" class="preview-box w-full min-h-[250px] max-h-[600px] overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-5 font-serif text-black dark:text-slate-200 text-base leading-relaxed shadow-inner focus:outline-none" contenteditable="true" spellcheck="false"></div>
            
       </section>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 flex items-center gap-3 bg-slate-900 dark:bg-slate-800 text-white px-5 py-3 rounded-lg shadow-2xl border border-slate-700 font-semibold text-sm transition-all duration-300 translate-y-[150px] opacity-0 z-50">
        <span id="toastIcon">✅</span>
        <span id="toastMsg">Notifikasi</span>
    </div>

    <script>
        let uploadedImages = [];
        
        // --- Theme Management ---
        function initTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const savedTheme = localStorage.getItem('konverter_theme') || (isDark ? 'dark' : 'light');
            applyTheme(savedTheme);
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
            localStorage.setItem('konverter_theme', isDark ? 'light' : 'dark');
        }
        function applyTheme(theme) {
            const html = document.documentElement;
            if (theme === 'dark') html.classList.add('dark');
            else html.classList.remove('dark');
        }
        initTheme();

        // --- DIRECT IMAGE UPLOAD (Tanpa Galeri, Tanpa Counter) ---
        function handleDirectImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('⚠️ File harus berupa gambar!', 'warning');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImages.push(e.target.result);
                const imageNumber = uploadedImages.length;
                
                // LANGSUNG sisipkan tag di posisi kursor
                const textarea = document.getElementById('rawInput');
                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                const text = textarea.value;
                const tag = `[IMG:${imageNumber}]`;
                
                textarea.value = text.substring(0, startPos) + tag + text.substring(endPos, text.length);
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = startPos + tag.length;
                
                showToast(`Gambar #${imageNumber} diupload & disisipkan!`, 'success');
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // --- Parsing Logic ---
        function cleanPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s*|\b[A-Ea-e]\b\s*[\.\-]\s*)/, '').trim();
        }
        function cleanQuestionPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i, '').trim();
        }
        function isLikelyShortInstruction(text) {
            const cleanText = cleanQuestionPrefix(text).trim();
            const shortKeywords = ['perhatikan', 'cermati', 'simak', 'lihat', 'amati'];
            return cleanText.length < 30 && shortKeywords.some(keyword => cleanText.toLowerCase().includes(keyword));
        }
        function parseRawText(raw) {
            const blocks = raw.split(/\r?\n\s*\r?\n/).map(b => b.trim()).filter(b => b.length > 0);
            const questions = [];
            if (blocks.length > 1) {
                blocks.forEach(block => {
                    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    parseLinesSmart(lines, questions);
                });
            } else {
                const allLines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                parseLinesSmart(allLines, questions);
            }
            return questions;
        }
        function parseLinesSmart(lines, questionsArray) {
            let currentQuestionLines = [];
            const reNumberStart = /^(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const isNewNumberedQuestion = reNumberStart.test(line);
                if (isNewNumberedQuestion && currentQuestionLines.length > 0) {
                    const lastLine = currentQuestionLines[currentQuestionLines.length - 1];
                    if (isLikelyShortInstruction(lastLine)) {
                        currentQuestionLines.push(line);
                    } else {
                        extractQuestionFromLines(currentQuestionLines, questionsArray);
                        currentQuestionLines = [line];
                    }
                } else {
                    currentQuestionLines.push(line);
                }
            }
            if (currentQuestionLines.length > 0) {
                extractQuestionFromLines(currentQuestionLines, questionsArray);
            }
        }
        function extractQuestionFromLines(lines, questionsArray) {
            if (lines.length === 0) return;
            let questionLines = [];
            let options = [];
            const reOptionPrefix = /^(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s+|\b[A-Ea-e]\b\s*[\.\-]\s+)/;
            let firstOptionIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (reOptionPrefix.test(lines[i])) {
                    firstOptionIdx = i;
                    break;
                }
            }
            if (firstOptionIdx !== -1 && firstOptionIdx > 0) {
                questionLines = lines.slice(0, firstOptionIdx);
                options = lines.slice(firstOptionIdx).map(cleanPrefix);
            } else {
                if (lines.length >= 5) {
                    options = lines.slice(-4).map(cleanPrefix);
                    questionLines = lines.slice(0, -4);
                } else if (lines.length > 1) {
                    questionLines = [lines[0]];
                    options = lines.slice(1).map(cleanPrefix);
                } else {
                    questionLines = [lines[0]];
                    options = [];
                }
            }
            if (questionLines.length > 0) {
                questionLines[0] = cleanQuestionPrefix(questionLines[0]);
            }
            while (options.length < 4) {
                options.push("[Opsi tidak ditemukan]");
            }
            questionsArray.push({ soalLines: questionLines, opsi: options });
        }

        // --- Conversion ---
        function escapeHtmlOnly(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        function processTextWithImages(text) {
            if (!text) return '';
            const parts = text.split(/(\[IMG:\d+\])/g);
            let result = '';
            parts.forEach(part => {
                const imgMatch = part.match(/^\[IMG:(\d+)\]$/);
                if (imgMatch) {
                    const imgIndex = parseInt(imgMatch[1]) - 1;
                    if (uploadedImages[imgIndex]) {
                        result += `<img src="${uploadedImages[imgIndex]}" alt="Gambar Soal">`;
                    } else {
                        result += `<span class="img-placeholder">[GAMBAR #${imgMatch[1]} TIDAK DITEMUKAN]</span>`;
                    }
                } else {
                    result += escapeHtmlOnly(part);
                }
            });
            return result;
        }

        let manualAnswerKeys = {};

        async function handleAnswerKeyUpload(input) {
            const file = input.files[0];
            if (!file) return;
            let textContent = '';
            const fileExt = file.name.split('.').pop().toLowerCase();
            try {
                if (fileExt === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    textContent = result.value;
                } else if (fileExt === 'txt') {
                    textContent = await file.text();
                } else {
                    showToast("Format tidak didukung. Gunakan .txt atau .docx", "error");
                    return;
                }
                manualAnswerKeys = {};
                let cleanText = textContent.replace(/\r\n/g, '\n').replace(/\t/g, ' ');
                const lines = cleanText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const keyRegex = /^(\d+)\s*[\.\):]?\s*([a-dA-D])\s*$/i;
                lines.forEach(line => {
                    const match = line.match(keyRegex);
                    if (match) {
                        manualAnswerKeys[parseInt(match[1], 10)] = match[2].toLowerCase();
                    }
                });
                if (Object.keys(manualAnswerKeys).length > 0) {
                    showToast(`Berhasil memuat ${Object.keys(manualAnswerKeys).length} kunci jawaban!`, "success");
                    const outputCard = document.getElementById('outputCard');
                    if (!outputCard.classList.contains('hidden')) convertQuestions();
                } else {
                    showToast("Format kunci tidak dikenali.", "warning");
                }
            } catch (err) {
                console.error(err);
                showToast("Gagal membaca file kunci jawaban.", "error");
            } finally {
                input.value = '';
            }
        }

        function convertQuestions() {
            const rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) {
                showToast("Mohon isi atau paste teks soal terlebih dahulu!", "warning");
                return;
            }
            const kategori = document.getElementById('kategoriInput').value.trim() || 'Umum';
            const poin = document.getElementById('poinInput').value.trim() || '1';
            const pembahasan = document.getElementById('pembahasanInput').value.trim() || '-';
            const parsedList = parseRawText(rawText);
            if (parsedList.length === 0) {
                showToast("Tidak dapat mengenali format soal.", "error");
                return;
            }
            let htmlResult = '';
            parsedList.forEach((q, index) => {
                const noNum = index + 1;
                let processedLines = q.soalLines.map(line => processTextWithImages(line));
                let processedSoal = processedLines.join('<br>');
                let finalKey = 'a';
                if (manualAnswerKeys[noNum]) finalKey = manualAnswerKeys[noNum];
                
                const separatorStyle = index > 0 ? ' style="margin-top: 25px; border-top: 1px dashed #cbd5e1; padding-top: 15px;"' : '';
                
                htmlResult += `<div${separatorStyle}><b>No:</b> ${noNum}</div>\n`;
                htmlResult += `<div><b>Kategori:</b> ${escapeHtmlOnly(kategori)}</div>\n`;
                htmlResult += `<div><b>Soal :</b> ${processedSoal}</div>\n`;
                htmlResult += `<div><b>Opsi:</b></div>\n`;
                htmlResult += `<ol type="a">\n`;
                q.opsi.forEach(opt => {
                    let processedOpt = processTextWithImages(opt);
                    htmlResult += `  <li>${processedOpt}</li>\n`;
                });
                htmlResult += `</ol>\n`;
                htmlResult += `<div><b>Kunci Jawaban:</b> ${escapeHtmlOnly(finalKey)}</div>\n`;
                htmlResult += `<div><b>Poin:</b> ${escapeHtmlOnly(poin)}</div>\n`;
                htmlResult += `<div><b>Pembahasan:</b> ${escapeHtmlOnly(pembahasan)}</div>\n`;
            });
            
            const previewEl = document.getElementById('resultPreview');
            previewEl.innerHTML = htmlResult;
            document.getElementById('statsCount').textContent = `${parsedList.length} Soal Terkonversi`;
            const outputCard = document.getElementById('outputCard');
            outputCard.classList.remove('hidden');
            outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`Berhasil mengonversi ${parsedList.length} soal!`, "success");
        }

        // --- Copy to Word ---
        async function copyResultToWord() {
            const previewEl = document.getElementById('resultPreview');
            if (!previewEl.innerHTML.trim()) {
                showToast("Tidak ada hasil untuk disalin!", "warning");
                return;
            }
            try {
                const htmlContent = previewEl.innerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const data = [new ClipboardItem({ 'text/html': blob })];
                await navigator.clipboard.write(data);
                const copyBtn = document.getElementById('copyBtn');
                const origText = copyBtn.innerHTML;
                copyBtn.innerHTML = 'Berhasil Disalin!';
                setTimeout(() => { copyBtn.innerHTML = origText; }, 2500);
                showToast("Hasil disalin! Paste di Word (Ctrl+V).", "success");
            } catch (err) {
                console.error(err);
                const range = document.createRange();
                range.selectNodeContents(previewEl);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try {
                    document.execCommand('copy');
                    showToast("Disalin (Fallback)!", "warning");
                } catch (e) {
                    showToast("Gagal menyalin.", "error");
                }
                selection.removeAllRanges();
            }
        }

        // --- Helpers ---
        function clearInput() {
            document.getElementById('rawInput').value = '';
            document.getElementById('outputCard').classList.add('hidden');
            uploadedImages = [];
            manualAnswerKeys = {};
            showToast("Input telah dibersihkan.", "info");
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            toastMsg.textContent = msg;
            if (type === 'success') toastIcon.textContent = '✅';
            else if (type === 'warning') toastIcon.textContent = '⚠️';
            else if (type === 'error') toastIcon.textContent = '❌';
            else toastIcon.textContent = 'ℹ️';
            toast.classList.remove('translate-y-[150px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150px]', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
