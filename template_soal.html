    <script>
        let uploadedImages = [];
        let manualAnswerKeys = {};
        
        // ============================================
        // FUNGSI: Gabungkan baris soal + beri jarak antar soal
        // ============================================
        function mergeQuestionLines(text) {
            const lines = text.split('\n').filter(line => line.trim().length > 0);
            const merged = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Cek apakah baris ini adalah awal soal baru (dimulai dengan angka + titik)
                const isNewQuestion = /^\d+[\.\)]\s/.test(line);
                
                // Cek apakah baris ini adalah opsi (a., b., c., d., e.)
                const isOption = /^[a-eA-E][\.\)]\s/.test(line);
                
                if (isNewQuestion) {
                    // BARIS SOAL BARU: tambahkan baris kosong sebagai pemisah (kecuali soal pertama)
                    if (merged.length > 0) {
                        merged.push(''); // Baris kosong sebagai pemisah antar soal
                    }
                    merged.push(line);
                } else if (isOption) {
                    // BARIS OPSI: langsung tambahkan tanpa baris kosong
                    merged.push(line);
                } else {
                    // Baris lanjutan (teks soal terpecah): gabungkan dengan baris sebelumnya
                    if (merged.length > 0) {
                        merged[merged.length - 1] += ' ' + line;
                    } else {
                        merged.push(line);
                    }
                }
            }
            
            return merged.join('\n');
        }

        // ============================================
        // FUNGSI: Format Pecahan
        // ============================================
        function formatFractions(text) {
            if (!text) return text;
            
            const fractionMap = {
                '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾',
                '1/5': '⅕', '2/5': '⅖', '3/5': '⅗', '4/5': '⅘',
                '1/6': '⅙', '5/6': '⅚', '1/8': '', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞'
            };
            
            let result = text;
            for (let [key, value] of Object.entries(fractionMap)) {
                result = result.replace(new RegExp(key, 'g'), value);
            }
            
            return result;
        }

        // ============================================
        // FUNGSI: Intercept Paste dari Word
        // ============================================
        function setupRobustPasteHandler() {
            const textarea = document.getElementById('rawInput');
            const pasteCatcher = document.getElementById('pasteCatcher');
            
            textarea.addEventListener('blur', function() {
                const current = textarea.value;
                if (!current.trim()) return;
                const formatted = mergeQuestionLines(splitInlineOptions(splitInlineQuestions(cleanText(current))));
                if (formatted !== current) {
                    const scrollPos = textarea.scrollTop;
                    textarea.value = formatted;
                    textarea.scrollTop = scrollPos;
                }
            });
            
            textarea.addEventListener('paste', function(e) {
                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                
                const html = e.clipboardData.getData('text/html');
                
                if (html && (html.includes('<sup') || html.includes('<sub') || html.includes('<style'))) {
                    e.preventDefault();
                    const converted = convertHtmlToUnicode(html);
                    insertAtCursor(textarea, converted, startPos, endPos);
                    showToast('Paste dari Word berhasil!', 'success');
                } else {
                    e.preventDefault();
                    pasteCatcher.innerHTML = '';
                    pasteCatcher.focus();
                    
                    setTimeout(() => {
                        const pastedHtml = pasteCatcher.innerHTML;
                        const pastedText = pasteCatcher.innerText;
                        
                        if (pastedHtml && (pastedHtml.includes('<sup') || pastedHtml.includes('<sub') || pastedHtml.includes('<style'))) {
                            const converted = convertHtmlToUnicode(pastedHtml);
                            insertAtCursor(textarea, converted, startPos, endPos);
                            showToast('Paste dari Word berhasil!', 'success');
                        } else {
                            const formatted = mergeQuestionLines(splitInlineOptions(splitInlineQuestions(pastedText)));
                            insertAtCursor(textarea, formatted, startPos, endPos);
                        }
                        
                        pasteCatcher.innerHTML = '';
                        textarea.focus();
                    }, 100);
                }
            });
        }

        function insertAtCursor(textarea, text, startPos, endPos) {
            const currentText = textarea.value;
            textarea.value = currentText.substring(0, startPos) + text + currentText.substring(endPos, currentText.length);
            textarea.selectionStart = textarea.selectionEnd = startPos + text.length;
        }

        // ============================================
        // FUNGSI: Konversi HTML Word ke Text Bersih
        // ============================================
        function convertHtmlToUnicode(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            temp.querySelectorAll('style, link, meta, script').forEach(el => el.remove());
            temp.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
            
            const removeComments = (node) => {
                const children = Array.from(node.childNodes);
                children.forEach(child => {
                    if (child.nodeType === Node.COMMENT_NODE) {
                        node.removeChild(child);
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        removeComments(child);
                    }
                });
            };
            removeComments(temp);
            
            temp.querySelectorAll('*').forEach(el => {
                el.removeAttribute('class');
                el.removeAttribute('lang');
                el.removeAttribute('xml:lang');
            });
            
            const superscriptMap = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺', '=': '⁼', '(': '⁽', ')': '⁾'
            };
            
            const subscriptMap = {
                '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄',
                '5': '₅', '6': '₆', '7': '⁷', '8': '₈', '9': '⁹'
            };
            
            temp.querySelectorAll('sup').forEach(sup => {
                const text = sup.textContent.trim();
                let result = '';
                for (let char of text) {
                    result += superscriptMap[char] || char;
                }
                sup.replaceWith(result);
            });
            
            temp.querySelectorAll('sub').forEach(sub => {
                const text = sub.textContent.trim();
                let result = '';
                for (let char of text) {
                    result += subscriptMap[char] || char;
                }
                sub.replaceWith(result);
            });
            
            temp.querySelectorAll('img').forEach(img => {
                const src = img.src || img.getAttribute('src');
                if (src && src.startsWith('data:image')) {
                    uploadedImages.push(src);
                    img.replaceWith(`[IMG:${uploadedImages.length}]`);
                } else {
                    img.replaceWith('[GAMBAR]');
                }
            });
            
            temp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            temp.querySelectorAll('p, div, tr, li, h1, h2, h3, h4, h5, h6').forEach(el => {
                el.insertAdjacentText('afterend', '\n');
            });
            
            let result = temp.textContent || temp.innerText;
            
            result = result
                .replace(/\u00A0/g, ' ')
                .replace(/\u200B/g, '')
                .replace(/\u200C/g, '')
                .replace(/\u200D/g, '')
                .replace(/\uFEFF/g, '')
                .replace(/\r\n/g, '\n')
                .replace(/\r/g, '\n')
                .replace(/\t/g, ' ')
                .replace(/[ \t]+/g, ' ')
                .replace(/[ \t]+$/gm, '')
                .replace(/^\s+|\s+$/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .join('\n');
            
            result = mergeQuestionLines(result);
            result = splitInlineQuestions(result);
            result = splitInlineOptions(result);
            
            return result;
        }

        // ============================================
        // FUNGSI: Konversi ^ menjadi superscript
        // ============================================
        function convertToSuperscript(text) {
            if (!text) return text;
            const superscriptMap = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺', '=': '⁼', '(': '⁽', ')': '⁾'
            };
            return text.replace(/(\d+)\^(\d+)/g, (match, base, exp) => {
                const superscript = exp.split('').map(c => superscriptMap[c] || c).join('');
                return base + superscript;
            });
        }
        
        function cleanText(text) {
            if (!text) return text;
            return text
                .replace(/\u00A0/g, ' ')
                .replace(/\u200B/g, '')
                .replace(/\u200C/g, '')
                .replace(/\u200D/g, '')
                .replace(/\uFEFF/g, '')
                .replace(/\r\n/g, '\n')
                .replace(/\t/g, ' ');
        }

        // ============================================
        // Theme Management
        // ============================================
        function initTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const savedTheme = localStorage.getItem('konverter_theme') || (isDark ? 'dark' : 'light');
            applyTheme(savedTheme);
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
            localStorage.setItem('konverter_theme', isDark ? 'light' : 'dark');
        }
        function applyTheme(theme) {
            const html = document.documentElement;
            if (theme === 'dark') html.classList.add('dark');
            else html.classList.remove('dark');
        }
        initTheme();

        document.addEventListener('DOMContentLoaded', function() {
            setupRobustPasteHandler();
        });

        // ============================================
        // DIRECT IMAGE UPLOAD
        // ============================================
        function handleDirectImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('️ File harus berupa gambar!', 'warning');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImages.push(e.target.result);
                const imageNumber = uploadedImages.length;
                const textarea = document.getElementById('rawInput');
                const text = textarea.value;
                const tag = `[IMG:${imageNumber}]`;
                const placeholder = '[GAMBAR]';
                const selStart = textarea.selectionStart;
                const selEnd = textarea.selectionEnd;
                const selectedText = text.substring(selStart, selEnd);

                let newText, newCursorPos;

                if (selectedText === placeholder) {
                    // Pengguna sudah select placeholder-nya sendiri: ganti langsung
                    newText = text.substring(0, selStart) + tag + text.substring(selEnd);
                    newCursorPos = selStart + tag.length;
                } else {
                    // Auto-detect: cari [GAMBAR] berikutnya setelah kursor, kalau tidak ada cari dari awal
                    let idx = text.indexOf(placeholder, selEnd);
                    if (idx === -1) idx = text.indexOf(placeholder);
                    if (idx !== -1) {
                        newText = text.substring(0, idx) + tag + text.substring(idx + placeholder.length);
                        newCursorPos = idx + tag.length;
                    } else {
                        // Tidak ada placeholder sama sekali: sisipkan di posisi kursor seperti biasa
                        newText = text.substring(0, selStart) + tag + text.substring(selEnd);
                        newCursorPos = selStart + tag.length;
                    }
                }

                textarea.value = newText;
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = newCursorPos;

                const remaining = (newText.match(/\[GAMBAR\]/g) || []).length;
                let msg = `Gambar #${imageNumber} disisipkan!`;
                if (remaining > 0) msg += ` (${remaining} [GAMBAR] lagi belum diisi)`;
                showToast(msg, 'success');
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // ============================================
        // FUNGSI: Pecah nomor soal baru yang nyangkut di tengah baris
        // Contoh: "d. CPU 2. Perangkat lunak..." -> baris soal baru terpisah
        // ============================================
        function splitInlineQuestions(text) {
            if (!text) return text;
            return text.split('\n').map(line => {
                const qPattern = /(?:(?<=\s)|^)(\d{1,3})[\.\)]\s+(?!\d)/g;
                const matches = [...line.matchAll(qPattern)];
                const midMatches = matches.filter(m => m.index > 0);
                if (midMatches.length === 0) return line;
                const pieces = [];
                let prevIdx = 0;
                midMatches.forEach(m => {
                    pieces.push(line.substring(prevIdx, m.index).trim());
                    prevIdx = m.index;
                });
                pieces.push(line.substring(prevIdx).trim());
                return pieces.filter(p => p.length > 0).join('\n');
            }).join('\n');
        }

        // ============================================
        // FUNGSI: Pecah opsi yang menempel dalam satu baris
        // Contoh: "...adalah.... A. 3^12 B. 3^9 C. 36 D. 3^5"
        // menjadi baris terpisah untuk masing-masing opsi
        // ============================================
        function splitInlineOptions(text) {
            if (!text) return text;
            return text.split('\n').map(line => {
                const optionPattern = /(?:(?<=\s)|^)([A-Ea-e])[\.\)]\s+/g;
                const matches = [...line.matchAll(optionPattern)];
                if (matches.length >= 2) {
                    const pieces = [];
                    let prevIdx = 0;
                    matches.forEach(m => {
                        pieces.push(line.substring(prevIdx, m.index).trim());
                        prevIdx = m.index;
                    });
                    pieces.push(line.substring(prevIdx).trim());
                    return pieces.filter(p => p.length > 0).join('\n');
                }
                return line;
            }).join('\n');
        }

        // ============================================
        // Parsing Logic
        // ============================================
        function cleanPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s*|\b[A-Ea-e]\b\s*[\.\-]\s*)/, '').trim();
        }
        function cleanQuestionPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i, '').trim();
        }
        function isLikelyShortInstruction(text) {
            const cleanTextStr = cleanQuestionPrefix(text).trim();
            const shortKeywords = ['perhatikan', 'cermati', 'simak', 'lihat', 'amati'];
            return cleanTextStr.length < 30 && shortKeywords.some(keyword => cleanTextStr.toLowerCase().includes(keyword));
        }
        function parseRawText(raw) {
            const blocks = raw.split(/\r?\n\s*\r?\n/).map(b => b.trim()).filter(b => b.length > 0);
            const questions = [];
            if (blocks.length > 1) {
                blocks.forEach(block => {
                    const lines = block.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                    parseLinesSmart(lines, questions);
                });
            } else {
                const allLines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
                parseLinesSmart(allLines, questions);
            }
            return questions;
        }
        function parseLinesSmart(lines, questionsArray) {
            let currentQuestionLines = [];
            const reNumberStart = /^(?:Soal\s*\d+|\d+)\s*[\.\):]\s*/i;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const isNewNumberedQuestion = reNumberStart.test(line);
                if (isNewNumberedQuestion && currentQuestionLines.length > 0) {
                    const lastLine = currentQuestionLines[currentQuestionLines.length - 1];
                    if (isLikelyShortInstruction(lastLine)) {
                        currentQuestionLines.push(line);
                    } else {
                        extractQuestionFromLines(currentQuestionLines, questionsArray);
                        currentQuestionLines = [line];
                    }
                } else {
                    currentQuestionLines.push(line);
                }
            }
            if (currentQuestionLines.length > 0) {
                extractQuestionFromLines(currentQuestionLines, questionsArray);
            }
        }
        function extractQuestionFromLines(lines, questionsArray) {
            if (lines.length === 0) return;
            let questionLines = [];
            let options = [];
            const reOptionPrefix = /^(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s+|\b[A-Ea-e]\b\s*[\.\-]\s+)/;
            let firstOptionIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (reOptionPrefix.test(lines[i])) {
                    firstOptionIdx = i;
                    break;
                }
            }
            if (firstOptionIdx !== -1 && firstOptionIdx > 0) {
                questionLines = lines.slice(0, firstOptionIdx);
                options = lines.slice(firstOptionIdx).map(cleanPrefix);
            } else {
                if (lines.length >= 5) {
                    options = lines.slice(-4).map(cleanPrefix);
                    questionLines = lines.slice(0, -4);
                } else if (lines.length > 1) {
                    questionLines = [lines[0]];
                    options = lines.slice(1).map(cleanPrefix);
                } else {
                    questionLines = [lines[0]];
                    options = [];
                }
            }
            if (questionLines.length > 0) {
                questionLines[0] = cleanQuestionPrefix(questionLines[0]);
            }
            while (options.length < 4) {
                options.push("[Opsi tidak ditemukan]");
            }
            questionsArray.push({ soalLines: questionLines, opsi: options });
        }

        // ============================================
        // Conversion
        // ============================================
        function escapeHtmlOnly(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
        
        // Format pecahan untuk output HTML (tampilan vertikal)
        function formatFractionHtml(text) {
            if (!text) return text;
            
            // Pola: 1/2^3 atau 1/2³ → pecahan vertikal
            text = text.replace(/(\d+)\/(\d+)([⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+)/g, (match, num, den, exp) => {
                return `<span class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}${exp}</span></span>`;
            });
            
            // Pola: 1/2 (tanpa pangkat) - tapi hindari yang sudah jadi Unicode fraction
            text = text.replace(/(\d+)\/(\d+)/g, (match, num, den) => {
                return `<span class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></span>`;
            });
            
            return text;
        }
        
        function processTextWithImages(text) {
            if (!text) return '';
            const parts = text.split(/(\[IMG:\d+\])/g);
            let result = '';
            parts.forEach(part => {
                const imgMatch = part.match(/^\[IMG:(\d+)\]$/);
                if (imgMatch) {
                    const imgIndex = parseInt(imgMatch[1]) - 1;
                    if (uploadedImages[imgIndex]) {
                        result += `<img src="${uploadedImages[imgIndex]}" alt="Gambar Soal">`;
                    } else {
                        result += `<span class="img-placeholder">[GAMBAR #${imgMatch[1]} TIDAK DITEMUKAN]</span>`;
                    }
                } else {
                    result += formatFractionHtml(escapeHtmlOnly(part));
                }
            });
            return result;
        }

        async function handleAnswerKeyUpload(input) {
            const file = input.files[0];
            if (!file) return;
            let textContent = '';
            const fileExt = file.name.split('.').pop().toLowerCase();
            try {
                if (fileExt === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    textContent = result.value;
                } else if (fileExt === 'txt') {
                    textContent = await file.text();
                } else {
                    showToast("Format tidak didukung.", "error");
                    return;
                }
                manualAnswerKeys = {};
                let cleanTextStr = cleanText(textContent);
                const lines = cleanTextStr.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const keyRegex = /^(\d+)\s*[\.\):]?\s*([a-eA-E](?:\s*[,;]\s*[a-eA-E])*)\s*$/i;
                lines.forEach(line => {
                    const match = line.match(keyRegex);
                    if (match) {
                        const questionNum = parseInt(match[1], 10);
                        const rawAnswer = match[2].toLowerCase();
                        if (rawAnswer.includes(',') || rawAnswer.includes(';')) {
                            const answers = rawAnswer.split(/[,;]\s*/).map(a => a.trim()).filter(a => a);
                            manualAnswerKeys[questionNum] = { type: 'complex', answers: answers };
                        } else {
                            manualAnswerKeys[questionNum] = { type: 'simple', answer: rawAnswer };
                        }
                    }
                });
                
                const complexCount = Object.values(manualAnswerKeys).filter(k => k.type === 'complex').length;
                if (Object.keys(manualAnswerKeys).length > 0) {
                    let msg = `✅ Berhasil memuat ${Object.keys(manualAnswerKeys).length} kunci jawaban!`;
                    if (complexCount > 0) msg += ` (${complexCount} soal kompleks)`;
                    showToast(msg, "success");
                    const outputCard = document.getElementById('outputCard');
                    if (!outputCard.classList.contains('hidden')) convertQuestions();
                } else {
                    showToast("⚠️ Format kunci tidak dikenali.", "warning");
                }
            } catch (err) {
                console.error(err);
                showToast("Gagal membaca file.", "error");
            } finally {
                input.value = '';
            }
        }

        function convertQuestions() {
            let rawText = document.getElementById('rawInput').value.trim();
            if (!rawText) {
                showToast("Mohon isi soal!", "warning");
                return;
            }
            
            rawText = cleanText(rawText);
            rawText = splitInlineQuestions(rawText);
            rawText = splitInlineOptions(rawText);
            rawText = mergeQuestionLines(rawText);
            document.getElementById('rawInput').value = rawText;

            rawText = convertToSuperscript(rawText);
            rawText = formatFractions(rawText);
            
            const kategori = document.getElementById('kategoriInput').value.trim() || 'Umum';
            const poin = document.getElementById('poinInput').value.trim() || '1';
            const pembahasan = document.getElementById('pembahasanInput').value.trim() || '-';
            const parsedList = parseRawText(rawText);
            if (parsedList.length === 0) {
                showToast("Format tidak dikenali.", "error");
                return;
            }
            let htmlResult = '';
            let complexCount = 0;
            
            parsedList.forEach((q, index) => {
                const noNum = index + 1;
                let processedLines = q.soalLines.map(line => processTextWithImages(line));
                let processedSoal = processedLines.join('<br>');
                
                const keyData = manualAnswerKeys[noNum];
                let isComplex = false;
                let finalKeyDisplay = 'a';
                let correctAnswers = [];
                
                if (keyData) {
                    if (keyData.type === 'complex') {
                        isComplex = true;
                        complexCount++;
                        correctAnswers = keyData.answers;
                        finalKeyDisplay = keyData.answers.join(', ');
                    } else {
                        finalKeyDisplay = keyData.answer;
                        correctAnswers = [keyData.answer];
                    }
                }
                
                const separatorStyle = index > 0 ? ' style="margin-top: 25px; border-top: 1px dashed #cbd5e1; padding-top: 15px;"' : '';
                
                htmlResult += `<div${separatorStyle}><b>No:</b> ${noNum}</div>\n`;
                htmlResult += `<div><b>Kategori:</b> ${escapeHtmlOnly(kategori)}</div>\n`;
                htmlResult += `<div><b>Soal :</b> ${processedSoal}</div>\n`;
                htmlResult += `<div><b>Opsi:</b></div>\n`;
                htmlResult += `<ol type="a">\n`;
                q.opsi.forEach(opt => {
                    let processedOpt = processTextWithImages(opt);
                    htmlResult += `  <li>${processedOpt}</li>\n`;
                });
                htmlResult += `</ol>\n`;
                htmlResult += `<div><b>Kunci Jawaban:</b> ${escapeHtmlOnly(finalKeyDisplay)}</div>\n`;
                htmlResult += `<div><b>Poin:</b> ${escapeHtmlOnly(poin)}</div>\n`;
                htmlResult += `<div><b>Pembahasan:</b> ${escapeHtmlOnly(pembahasan)}</div>\n`;
            });
            
            const previewEl = document.getElementById('resultPreview');
            previewEl.innerHTML = htmlResult;
            document.getElementById('statsCount').textContent = `${parsedList.length} Soal Terkonversi`;
            const outputCard = document.getElementById('outputCard');
            outputCard.classList.remove('hidden');
            outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`Berhasil mengonversi ${parsedList.length} soal!`, "success");
        }

        // ============================================
        // Unduh sebagai file Word (.docx) - gambar tertanam asli
        // ============================================
        async function downloadAsWord() {
            const previewEl = document.getElementById('resultPreview');
            if (!previewEl.innerHTML.trim()) {
                showToast("Tidak ada hasil!", "warning");
                return;
            }
            if (typeof htmlDocx === 'undefined') {
                showToast("Modul Word belum siap, coba lagi sebentar.", "warning");
                return;
            }
            let downloads;
            try {
                downloads = window.claude ? await window.claude.use("downloads") : null;
            } catch (e) {
                downloads = null;
            }
            const fullHtml = `<!DOCTYPE html><html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Soal</title></head><body>${previewEl.innerHTML}</body></html>`;
            const blob = htmlDocx.asBlob(fullHtml);
            if (!downloads) {
                // Fallback: dibuka sebagai file lokal (bukan lewat link claude.ai), pakai unduhan browser biasa
                try {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'soal-konversi.docx';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast("File Word berhasil diunduh!", "success");
                } catch (err) {
                    console.error(err);
                    showToast("Gagal mengunduh file Word.", "error");
                }
                return;
            }
            try {
                const result = await downloads.save({ filename: 'soal-konversi.docx', data: blob });
                if (result && result.status === 'saved') {
                    showToast("File Word berhasil diunduh!", "success");
                }
            } catch (err) {
                console.error(err);
                if (err && err.code === 'declined') {
                    // Pengguna membatalkan, tidak perlu pesan error
                } else {
                    showToast("Gagal membuat file Word.", "error");
                }
            }
        }

        // ============================================
        // Copy to Word
        // ============================================
        async function copyResultToWord() {
            const previewEl = document.getElementById('resultPreview');
            if (!previewEl.innerHTML.trim()) {
                showToast("Tidak ada hasil!", "warning");
                return;
            }
            try {
                const htmlContent = previewEl.innerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const data = [new ClipboardItem({ 'text/html': blob })];
                await navigator.clipboard.write(data);
                const copyBtn = document.getElementById('copyBtn');
                const origText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✅ Berhasil Disalin!';
                setTimeout(() => { copyBtn.innerHTML = origText; }, 2500);
                showToast("Disalin! Paste di Word.", "success");
            } catch (err) {
                console.error(err);
                const range = document.createRange();
                range.selectNodeContents(previewEl);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                try {
                    document.execCommand('copy');
                    showToast("Disalin (Fallback)!", "warning");
                } catch (e) {
                    showToast("Gagal menyalin.", "error");
                }
                selection.removeAllRanges();
            }
        }

        // ============================================
        // Helpers
        // ============================================
        function clearInput() {
            document.getElementById('rawInput').value = '';
            document.getElementById('outputCard').classList.add('hidden');
            uploadedImages = [];
            manualAnswerKeys = {};
            showToast("Input dibersihkan.", "info");
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            toastMsg.textContent = msg;
            if (type === 'success') toastIcon.textContent = '✅';
            else if (type === 'warning') toastIcon.textContent = '⚠️';
            else if (type === 'error') toastIcon.textContent = '';
            else toastIcon.textContent = 'ℹ️';
            toast.classList.remove('translate-y-[150px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150px]', 'opacity-0');
            }, 3000);
        }
    </script>
