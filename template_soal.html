<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Soal Portal Sekolah</title>
    
    <!-- Library Mammoth.js untuk membaca file .docx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        /* Variabel Warna untuk Mode Terang (Default) */
        :root {
            --bg-body: #f4f6f9;
            --bg-container: #ffffff;
            --text-color: #333333;
            --heading-color: #1a73e8;
            --border-color: #e0e0e0;
            --card-bg: #f9f9f9;
            --card-border: #ddd;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --upload-bg: #f8faff;
            --upload-border: #1a73e8;
            --preview-bg: #ffffff;
            --preview-text: #000000;
        }

        /* Variabel Warna untuk Mode Gelap */
        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-container: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #64b5f6;
            --border-color: #333333;
            --card-bg: #2a2a2a;
            --card-border: #444;
            --input-bg: #2d2d2d;
            --input-border: #555;
            --upload-bg: #1a2234;
            --upload-border: #64b5f6;
            --preview-bg: #2a2a2a;
            --preview-text: #e0e0e0;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { margin: 20px; background-color: var(--bg-body); color: var(--text-color); }
        .container { max-width: 1000px; margin: 0 auto; background: var(--bg-container); padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        h2 { margin: 0; color: var(--heading-color); }

        .btn-theme { background: transparent; border: 2px solid var(--heading-color); color: var(--heading-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-theme:hover { background: var(--heading-color); color: #fff; }

        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 10px; border: 1px solid var(--input-border); border-radius: 4px; font-size: 14px; background-color: var(--input-bg); color: var(--text-color); }
        
        /* Area Upload File */
        .upload-area {
            border: 2px dashed var(--upload-border);
            padding: 25px;
            text-align: center;
            border-radius: 6px;
            background: var(--upload-bg);
            margin-bottom: 15px;
        }
        .upload-area label { font-size: 16px; color: var(--heading-color); cursor: pointer; }
        .upload-area p { margin: 5px 0 0 0; opacity: 0.8; font-size: 13px; }

        .btn-group { margin: 15px 0; display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-primary { background-color: #1a73e8; }
        .btn-primary:hover { background-color: #1557b0; }
        .btn-success { background-color: #34a853; }
        .btn-success:hover { background-color: #2d8e47; }
        
        .q-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .q-card h4 { margin: 0 0 10px 0; color: var(--text-color); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .key-select { margin-top: 10px; font-weight: bold; }
        .key-select select { padding: 5px 10px; border-radius: 4px; border: 1px solid var(--input-border); width: auto; }

        .preview-box {
            background: var(--preview-bg);
            color: var(--preview-text);
            border: 2px dashed #34a853;
            padding: 20px;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 11pt;
            line-height: 1.25;
        }
        .preview-box ol { margin-top: 0; margin-bottom: 0; padding-left: 28px; }
        .preview-box p { margin: 0; padding: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Konverter Soal</h2>
        <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="kategoriInput">Kategori:</label>
            <input type="text" id="kategoriInput">
        </div>
        <div class="form-group">
            <label for="poinInput">Poin:</label>
            <input type="text" id="poinInput" value="1">
        </div>
    </div>

    <!-- Section Upload -->
    <div class="upload-area">
        <label for="fileInput">📁 Klik di sini untuk memilih File Soal (.docx atau .txt)</label>
        <input type="file" id="fileInput" accept=".docx, .txt" style="display:none;" onchange="handleFileUpload(this)">
        <p id="fileNameDisplay">Belum ada file yang dipilih</p>
    </div>

    <div id="editorSection"></div>

    <div class="btn-group" id="generateGroup" style="display:none;">
        <button class="btn-success" onclick="generateFormat()">Generate Format Template Word</button>
    </div>

    <div class="form-group" id="outputGroup" style="display:none;">
        <label>Hasil Format Template (Dengan Numbering Asli Word A, B, C, D):</label>
        <div id="richPreview" class="preview-box"></div>
        <div class="btn-group">
            <button class="btn-primary" onclick="copyRichOutput()">Salin Hasil ke Microsoft Word</button>
        </div>
    </div>
</div>

<script>
    let parsedData = [];

    // Fungsi Toggle Dark / Light Mode
    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const targetTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', targetTheme);
        localStorage.setItem('theme', targetTheme);
        updateThemeButton(targetTheme);
    }

    function updateThemeButton(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (theme === 'dark') {
            btn.innerHTML = '☀️';
        } else {
            btn.innerHTML = '🌙';
        }
    }

    // Memuat preferensi tema saat halaman dibuka
    (function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeButton(savedTheme);
    })();

    // Fungsi hapus penomoran lama dari teks opsi jika ada
    function cleanOptionText(str) {
        return str.replace(/^([a-zA-D0-9][\.\)]\s*)+/, '').trim();
    }

    function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        document.getElementById('fileNameDisplay').innerHTML = `File terpilih: <strong>${file.name}</strong>`;

        const fileExt = file.name.split('.').pop().toLowerCase();

        if (fileExt === 'docx') {
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        processRawText(result.value);
                    })
                    .catch(function(err) {
                        alert("Gagal membaca file .docx: " + err.message);
                    });
            };
            reader.readAsArrayBuffer(file);
        } else if (fileExt === 'txt') {
            const reader = new FileReader();
            reader.onload = function(e) {
                processRawText(e.target.result);
            };
            reader.readAsText(file);
        } else {
            alert("Format file tidak didukung! Harap upload file .docx atau .txt");
        }
    }

    function processRawText(text) {
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '');
        
        parsedData = [];
        let index = 1;

        for (let i = 0; i < lines.length; i += 5) {
            if (i + 4 < lines.length) {
                parsedData.push({
                    no: index++,
                    soal: lines[i],
                    opsi: [
                        cleanOptionText(lines[i+1]),
                        cleanOptionText(lines[i+2]),
                        cleanOptionText(lines[i+3]),
                        cleanOptionText(lines[i+4])
                    ],
                    kunci: 'A'
                });
            }
        }

        if (parsedData.length === 0) {
            alert("Tidak ada soal yang terdeteksi dari file tsb.");
            return;
        }

        renderEditor();
    }

    function renderEditor() {
        const container = document.getElementById('editorSection');
        container.innerHTML = '<h3>Atur Kunci Jawaban Soal:</h3>';

        const labels = ['A', 'B', 'C', 'D'];

        parsedData.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            
            let opsiHtml = '';
            q.opsi.forEach((opt, oIdx) => {
                opsiHtml += `<div><strong>${labels[oIdx]}.</strong> ${opt}</div>`;
            });

            card.innerHTML = `
                <h4>Soal ${q.no}: ${q.soal}</h4>
                <div class="options-grid">${opsiHtml}</div>
                <div class="key-select">
                    <label>Pilih Kunci Jawaban: </label>
                    <select onchange="parsedData[${idx}].kunci = this.value">
                        <option value="A" ${q.kunci === 'A' ? 'selected' : ''}>A</option>
                        <option value="B" ${q.kunci === 'B' ? 'selected' : ''}>B</option>
                        <option value="C" ${q.kunci === 'C' ? 'selected' : ''}>C</option>
                        <option value="D" ${q.kunci === 'D' ? 'selected' : ''}>D</option>
                    </select>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('generateGroup').style.display = 'block';
        document.getElementById('outputGroup').style.display = 'none';
    }

    function generateFormat() {
        const kategori = document.getElementById('kategoriInput').value;
        const poin = document.getElementById('poinInput').value;
        const previewDiv = document.getElementById('richPreview');
        
        let htmlContent = '';

        parsedData.forEach((q) => {
            htmlContent += `<p>No: ${q.no}</p>`;
            htmlContent += `<p>Kategori: ${kategori}</p>`;
            htmlContent += `<p>Soal : ${q.soal}</p>`;
            htmlContent += `<p>Opsi:</p>`;
            
            htmlContent += `<ol type="A">`;
            q.opsi.forEach((opt) => {
                htmlContent += `<li>${opt}</li>`;
            });
            htmlContent += `</ol>`;

            htmlContent += `<p>Kunci Jawaban: ${q.kunci}</p>`;
            htmlContent += `<p>Poin: ${poin}</p>`;
            htmlContent += `<p>Pembahasan: -</p>`;
            htmlContent += `<br>`;
        });

        previewDiv.innerHTML = htmlContent;
        document.getElementById('outputGroup').style.display = 'block';
        document.getElementById('outputGroup').scrollIntoView({ behavior: 'smooth' });
    }

    async function copyRichOutput() {
        const previewDiv = document.getElementById('richPreview');

        if (navigator.clipboard && window.ClipboardItem) {
            try {
                const htmlBlob = new Blob([previewDiv.innerHTML], { type: 'text/html' });
                const textBlob = new Blob([previewDiv.innerText], { type: 'text/plain' });
                const data = [new ClipboardItem({
                    'text/html': htmlBlob,
                    'text/plain': textBlob
                })];
                await navigator.clipboard.write(data);
                alert("Berhasil disalin! Buka Microsoft Word dan tekan Ctrl+V.");
                return;
            } catch (e) {
                console.error(e);
            }
        }

        const range = document.createRange();
        range.selectNodeContents(previewDiv);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        try {
            document.execCommand('copy');
            alert("Berhasil disalin! Silakan paste (Ctrl+V) ke Microsoft Word.");
        } catch (err) {
            alert("Gagal menyalin otomatis. Silakan blok tampilan hasil lalu tekan Ctrl+C.");
        }
        selection.removeAllRanges();
    }
</script>

</body>
</html>
