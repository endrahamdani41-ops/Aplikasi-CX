    <!-- Toast Notification -->

        <span id="toastIcon">✅</span>

    <script>
        let uploadedImages = [];
        let manualAnswerKeys = {};
        
        // ============================================
        // FUNGSI: Helper Toast
        // ============================================
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.textContent = msg;
            if (type === 'success') toastIcon.textContent = '✅';
            else if (type === 'warning') toastIcon.textContent = '⚠️';
            else if (type === 'error') toastIcon.textContent = '❌';
            else toastIcon.textContent = 'ℹ️';

            toast.classList.remove('translate-y-[150px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150px]', 'opacity-0');
            }, 3000);
        }

        // ============================================
        // FUNGSI: Escape HTML
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // ============================================
        // FUNGSI: Pembersihan Prefix
        // ============================================
        function cleanPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:\(?\s*[A-Ea-e1-5]\s*[\.\)]\s*|\b[A-Ea-e]\b\s*[\.\-]\s*)/, '').trim();
        }

        function cleanQuestionPrefix(text) {
            if (!text) return '';
            return text.replace(/^\s*(?:Soal\s*\d*[:\.\s]*|\d+[\.\)]\s*)/i, '').trim();
        }

        // ============================================
        // FUNGSI: Gabungkan baris soal + beri jarak antar soal
        // ============================================
        function mergeQuestionLines(text) {
            if (!text) return '';
            const lines = text.split('\n').filter(line => line.trim().length > 0);
            const merged = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                const isNewQuestion = /^\d+[\.\)]\s/.test(line);
                const isOption = /^[a-eA-E][\.\)]\s/.test(line);
                const isSubItem = /^\(\d{1,2}\)\s/.test(line);
                const isImagePlaceholder = /^(?:\[GAMBAR\]|\[IMG:\d+\])$/.test(line);
                
                if (isNewQuestion) {
                    if (merged.length > 0) {
                        merged.push('');
                    }
                    merged.push(line);
                } else if (isOption || isSubItem || isImagePlaceholder) {
                    merged.push(line);
                } else {
                    const prevLine = merged.length > 0 ? merged[merged.length - 1] : '';
                    const prevIsImagePlaceholder = /^(?:\[GAMBAR\]|\[IMG:\d+\])$/.test(prevLine.trim());
                    const prevEndsSentence = /[\.\!\?…]["'\)\]]?\s*$/.test(prevLine.trim());
                    const startsUpper = /^[A-Z"'“(]/.test(line);

                    if (merged.length > 0 && !prevIsImagePlaceholder && !(prevEndsSentence && startsUpper)) {
                        merged[merged.length - 1] += ' ' + line;
                    } else {
                        merged.push(line);
                    }
                }
            }
            
            return merged.join('\n');
        }

        // ============================================
        // FUNGSI: Sambung baris yang berakhir dengan penanda menggantung
        // ============================================
        function reattachDanglingMarkers(text) {
            if (!text) return text;
            const lines = text.split('\n');
            const out = [];
            const dangling = /(?:^|\s)(?:\d{1,3}|[A-Ea-e])[\.\)]$/;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                while (i + 1 < lines.length && dangling.test(line)) {
                    i++;
                    line += ' ' + lines[i].trim();
                }
                if (line.length > 0) out.push(line);
            }
            return out.join('\n');
        }

        // ============================================
        // FUNGSI: Intercept Paste dari Word
        // ============================================
        function setupRobustPasteHandler() {
            const textarea = document.getElementById('rawInput');
            const pasteCatcher = document.getElementById('pasteCatcher');
            
            textarea.addEventListener('blur', function() {
                const current = textarea.value;
                if (!current.trim()) return;
                const formatted = mergeQuestionLines(splitInlineOptions(splitInlineQuestions(reattachDanglingMarkers(cleanText(current)))));
                if (formatted !== current) {
                    const scrollPos = textarea.scrollTop;
                    textarea.value = formatted;
                    textarea.scrollTop = scrollPos;
                }
            });
            
            textarea.addEventListener('paste', function(e) {
                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                const html = e.clipboardData.getData('text/html');
                
                if (html) {
                    e.preventDefault();
                    const converted = convertHtmlToUnicode(html);
                    insertAtCursor(textarea, converted, startPos, endPos);
                    showToast('Paste dari Word berhasil! (Kunci opsi merah terdeteksi)', 'success');
                } else {
                    e.preventDefault();
                    pasteCatcher.innerHTML = '';
                    pasteCatcher.focus();
                    
                    setTimeout(() => {
                        const pastedHtml = pasteCatcher.innerHTML;
                        const pastedText = pasteCatcher.innerText;
                        
                        if (pastedHtml) {
                            const converted = convertHtmlToUnicode(pastedHtml);
                            insertAtCursor(textarea, converted, startPos, endPos);
                            showToast('Paste dari Word berhasil! (Kunci opsi merah terdeteksi)', 'success');
                        } else {
                            const formatted = mergeQuestionLines(splitInlineOptions(splitInlineQuestions(reattachDanglingMarkers(pastedText))));
                            insertAtCursor(textarea, formatted, startPos, endPos);
                        }
                        
                        pasteCatcher.innerHTML = '';
                        textarea.focus();
                    }, 100);
                }
            });
        }

        function insertAtCursor(textarea, text, startPos, endPos) {
            const currentText = textarea.value;
            textarea.value = currentText.substring(0, startPos) + text + currentText.substring(endPos, currentText.length);
            textarea.selectionStart = textarea.selectionEnd = startPos + text.length;
        }

        // ============================================
        // FUNGSI: Deteksi Warna Merah untuk Kunci Jawaban
        // ============================================
        function isRedColor(styleOrColor) {
            if (!styleOrColor) return false;
            const s = styleOrColor.toLowerCase();
            
            if (/\b(red|darkred|crimson|firebrick|maroon|lightcoral|indianred)\b/.test(s)) {
                return true;
            }
            
            const hexMatches = s.match(/#([0-9a-f]{3,6})/gi);
            if (hexMatches) {
                for (let hexStr of hexMatches) {
                    let hex = hexStr.replace('#', '');
                    if (hex.length === 3) {
                        hex = hex.split('').map(c => c + c).join('');
                    }
                    if (hex.length === 6) {
                        const r = parseInt(hex.substring(0, 2), 16);
                        const g = parseInt(hex.substring(2, 4), 16);
                        const b = parseInt(hex.substring(4, 6), 16);
                        if (r > 130 && r > g + 30 && r > b + 30) return true;
                    }
                }
            }
            
            const rgbMatches = s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/gi);
            if (rgbMatches) {
                for (let rgbStr of rgbMatches) {
                    const m = rgbStr.match(/\d+/g);
                    if (m && m.length >= 3) {
                        const r = parseInt(m[0]);
                        const g = parseInt(m[1]);
                        const b = parseInt(m[2]);
                        if (r > 130 && r > g + 30 && r > b + 30) return true;
                    }
                }
            }
            
            return false;
        }

        // ============================================
        // FUNGSI: Konversi HTML Word ke Text Bersih
        // ============================================
        function convertHtmlToUnicode(html) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            // Deteksi teks berwarna merah dan tandai dengan * sebagai penanda kunci jawaban
            temp.querySelectorAll('*').forEach(el => {
                const style = el.getAttribute('style') || '';
                const color = el.getAttribute('color') || '';
                if (isRedColor(style) || isRedColor(color)) {
                    if (!el.hasAttribute('data-red-marked')) {
                        el.setAttribute('data-red-marked', 'true');
                        let parent = el.parentElement;
                        let ancestorMarked = false;
                        while (parent && parent !== temp) {
                            if (parent.hasAttribute('data-red-marked')) {
                                ancestorMarked = true;
                                break;
                            }
                            parent = parent.parentElement;
                        }
                        if (!ancestorMarked) {
                            el.insertAdjacentText('beforeend', '*');
                        }
                    }
                }
            });

            temp.querySelectorAll('style, link, meta, script').forEach(el => el.remove());
            temp.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
            
            const removeComments = (node) => {
                const children = Array.from(node.childNodes);
                children.forEach(child => {
                    if (child.nodeType === Node.COMMENT_NODE) {
                        node.removeChild(child);
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        removeComments(child);
                    }
                });
            };
            removeComments(temp);
            
            temp.querySelectorAll('*').forEach(el => {
                el.removeAttribute('class');
                el.removeAttribute('lang');
                el.removeAttribute('xml:lang');
            });
            
            const superscriptMap = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺', '=': '⁼', '(': '⁽', ')': '⁾'
            };
            
            const subscriptMap = {
                '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄',
                '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉'
            };
            
            temp.querySelectorAll('sup').forEach(sup => {
                const text = sup.textContent.trim();
                let result = '';
                for (let char of text) {
                    result += superscriptMap[char] || char;
                }
                sup.replaceWith(result);
            });
            
            temp.querySelectorAll('sub').forEach(sub => {
                const text = sub.textContent.trim();
                let result = '';
                for (let char of text) {
                    result += subscriptMap[char] || char;
                }
                sub.replaceWith(result);
            });
            
            temp.querySelectorAll('img').forEach(img => {
                const src = img.src || img.getAttribute('src');
                if (src && src.startsWith('data:image')) {
                    uploadedImages.push(src);
                    img.replaceWith(`[IMG:${uploadedImages.length}]`);
                } else {
                    img.replaceWith('[GAMBAR]');
                }
            });
            
            temp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            temp.querySelectorAll('p, div, tr, li, h1, h2, h3, h4, h5, h6').forEach(el => {
                el.insertAdjacentText('afterend', '\n');
            });
            
            let result = temp.textContent || temp.innerText;
            
            result = result
                .replace(/\u00A0/g, ' ')
                .replace(/\u200B/g, '')
                .replace(/\u200C/g, '')
                .replace(/\u200D/g, '')
                .replace(/\uFEFF/g, '')
                .replace(/\r\n/g, '\n')
                .replace(/\r/g, '\n')
                .replace(/\t/g, ' ')
                .replace(/[ \t]+/g, ' ')
                .replace(/[ \t]+$/gm, '')
                .replace(/^\s+|\s+$/g, '')
                .replace(/\n{3,}/g, '\n\n')
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .join('\n');
            
            result = reattachDanglingMarkers(result);
            result = mergeQuestionLines(result);
            result = splitInlineQuestions(result);
            result = splitInlineOptions(result);
            
            return result;
        }

        function convertToSuperscript(text) {
            if (!text) return text;
            const superscriptMap = {
                '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴',
                '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹',
                '-': '⁻', '+': '⁺', '=': '⁼', '(': '⁽', ')': '⁾'
            };
            return text.replace(/(\d+)\^(\d+)/g, (match, base, exp) => {
                const superscript = exp.split('').map(c => superscriptMap[c] || c).join('');
                return base + superscript;
            });
        }
        
        function cleanText(text) {
            if (!text) return text;
            return text
                .replace(/\u00A0/g, ' ')
                .replace(/\u200B/g, '')
                .replace(/\u200C/g, '')
                .replace(/\u200D/g, '')
                .replace(/\uFEFF/g, '')
                .replace(/\r\n/g, '\n')
                .replace(/\t/g, ' ');
        }

        // ============================================
        // Theme Management
        // ============================================
        function initTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const savedTheme = localStorage.getItem('konverter_theme') || (isDark ? 'dark' : 'light');
            applyTheme(savedTheme);
        }
        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            applyTheme(isDark ? 'light' : 'dark');
            localStorage.setItem('konverter_theme', isDark ? 'light' : 'dark');
        }
        function applyTheme(theme) {
            const html = document.documentElement;
            if (theme === 'dark') html.classList.add('dark');
            else html.classList.remove('dark');
        }
        initTheme();

        document.addEventListener('DOMContentLoaded', function() {
            setupRobustPasteHandler();
        });

        // ============================================
        // DIRECT IMAGE UPLOAD
        // ============================================
        function handleDirectImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('File harus berupa gambar!', 'warning');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImages.push(e.target.result);
                const imageNumber = uploadedImages.length;
                const textarea = document.getElementById('rawInput');
                const text = textarea.value;
                const tag = `[IMG:${imageNumber}]`;
                const placeholder = '[GAMBAR]';
                const selStart = textarea.selectionStart;
                const selEnd = textarea.selectionEnd;
                const selectedText = text.substring(selStart, selEnd);

                let newText, newCursorPos;

                if (selectedText === placeholder) {
                    newText = text.substring(0, selStart) + tag + text.substring(selEnd);
                    newCursorPos = selStart + tag.length;
                } else {
                    let idx = text.indexOf(placeholder, selEnd);
                    if (idx === -1) idx = text.indexOf(placeholder);
                    if (idx !== -1) {
                        newText = text.substring(0, idx) + tag + text.substring(idx + placeholder.length);
                        newCursorPos = idx + tag.length;
                    } else {
                        newText = text.substring(0, selStart) + tag + text.substring(selEnd);
                        newCursorPos = selStart + tag.length;
                    }
                }

                textarea.value = newText;
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = newCursorPos;

                const remaining = (newText.match(/\[GAMBAR\]/g) || []).length;
                let msg = `Gambar #${imageNumber} disisipkan!`;
                if (remaining > 0) msg += ` (${remaining} [GAMBAR] lagi belum diisi)`;
                showToast(msg, 'success');
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // ============================================
        // UPLOAD KUNCI JAWABAN
        // ============================================
        function handleAnswerKeyUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.docx')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mammoth.extractRawText({ arrayBuffer: e.target.result })
                        .then(result => {
                            parseAnswerKeys(result.value);
                        })
                        .catch(() => {
                            showToast('Gagal membaca file Word kunci jawaban.', 'error');
                        });
                };
                reader.readAsArrayBuffer(file);
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    parseAnswerKeys(e.target.result);
                };
                reader.readAsText(file);
            }
            input.value = '';
        }

        function parseAnswerKeys(text) {
            manualAnswerKeys = {};
            let count = 0;
            const regex = /(\d+)[\.\)\s:-]+\s*([A-Ea-e])/g;
            let match;
            while ((match = regex.exec(text)) !== null) {
                const qNum = parseInt(match[1]);
                const key = match[2].toUpperCase();
                manualAnswerKeys[qNum] = key;
                count++;
            }

            if (count > 0) {
                showToast(`Berhasil memuat ${count} kunci jawaban!`, 'success');
            } else {
                showToast('Tidak ada kunci jawaban yang terdeteksi dalam file.', 'warning');
            }
        }

        // ============================================
        // FUNGSI: Pecah nomor soal & opsi inline
        // ============================================
        function splitInlineQuestions(text) {
            if (!text) return text;
            return text.split('\n').map(line => {
                const qPattern = /(?:(?<=\s)|^)(\d{1,3})[\.\)]\s+(?!\d)/g;
                const matches = [...line.matchAll(qPattern)];
                const midMatches = matches.filter(m => m.index > 0);
                if (midMatches.length === 0) return line;
                const pieces = [];
                let prevIdx = 0;
                midMatches.forEach(m => {
                    pieces.push(line.substring(prevIdx, m.index).trim());
                    prevIdx = m.index;
                });
                pieces.push(line.substring(prevIdx).trim());
                return pieces.filter(p => p.length > 0).join('\n');
            }).join('\n');
        }

        function splitInlineOptions(text) {
            if (!text) return text;
            return text.split('\n').map(line => {
                const optionPattern = /(?:(?<=\s)|^)([A-Ea-e])[\.\)]\s+/g;
                const matches = [...line.matchAll(optionPattern)];
                if (matches.length >= 2) {
                    const pieces = [];
                    let prevIdx = 0;
                    matches.forEach(m => {
                        pieces.push(line.substring(prevIdx, m.index).trim());
                        prevIdx = m.index;
                    });
                    pieces.push(line.substring(prevIdx).trim());
                    return pieces.filter(p => p.length > 0).join('\n');
                }
                return line;
            }).join('\n');
        }

        // ============================================
        // FUNGSI: Render Gambar Placeholder
        // ============================================
        function renderImagePlaceholders(str) {
            if (!str) return '';
            return str
                .replace(/\[IMG:(\d+)\]/g, (match, p1) => {
                    const idx = parseInt(p1) - 1;
                    if (uploadedImages[idx]) {
                        return `<img src="${uploadedImages[idx]}" class="img-block" alt="Gambar Soal ${p1}">`;
                    }
                    return `<span class="img-placeholder">[GAMBAR ${p1}]</span>`;
                })
                .replace(/\[GAMBAR\]/g, '<span class="img-placeholder">[GAMBAR]</span>');
        }

        // ============================================
        // Parsing Logic & Conversion
        // ============================================
        function convertQuestions() {
            const raw = document.getElementById('rawInput').value.trim();
            if (!raw) {
                showToast('Teks soal masih kosong!', 'warning');
                return;
            }

            const kategori = document.getElementById('kategoriInput').value.trim() || 'UMUM';
            const poin = document.getElementById('poinInput').value.trim() || '1';
            const defaultPembahasan = document.getElementById('pembahasanInput').value.trim() || '-';

            const processedText = mergeQuestionLines(splitInlineOptions(splitInlineQuestions(reattachDanglingMarkers(cleanText(raw)))));
            const lines = processedText.split('\n');
            
            const questions = [];
            let currentQ = null;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (!trimmed) return;

                const qMatch = trimmed.match(/^(\d+)[\.\)]\s*(.*)/);
                const optMatch = trimmed.match(/^([a-eA-E])[\.\)]\s*(.*)/);

                if (qMatch && !optMatch) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = {
                        number: qMatch[1],
                        text: qMatch[2],
                        options: [],
                        answerKey: null
                    };
                } else if (optMatch && currentQ) {
                    let optText = optMatch[2];
                    let isKey = false;
                    if (optText.includes('*') || trimmed.includes('*')) {
                        isKey = true;
                        optText = optText.replace(/\*/g, '').trim();
                    }
                    const label = optMatch[1].toUpperCase();
                    if (isKey) currentQ.answerKey = label;

                    currentQ.options.push({
                        label: label,
                        text: optText
                    });
                } else if (currentQ) {
                    const keyMatch = trimmed.match(/^(?:Kunci|Jawaban|Kunci Jawaban)\s*:\s*([A-Ea-e])/i);
                    if (keyMatch) {
                        currentQ.answerKey = keyMatch[1].toUpperCase();
                    } else {
                        if (currentQ.options.length === 0) {
                            currentQ.text += '<br>' + trimmed;
                        } else {
                            currentQ.options[currentQ.options.length - 1].text += ' ' + trimmed;
                        }
                    }
                }
            });

            if (currentQ) questions.push(currentQ);

            if (questions.length === 0) {
                showToast('Format soal tidak terdeteksi! Pastikan ada penomoran (contoh: 1., 2.).', 'error');
                return;
            }

            let outputHtml = `<div class="portal-template">`;
            outputHtml += `<div style="background-color: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px;">`;
            outputHtml += `<strong>KATEGORI SOAL:</strong> ${escapeHtml(kategori)}<br>`;
            outputHtml += `<strong>POIN PER SOAL:</strong> ${escapeHtml(poin)}`;
            outputHtml += `</div>`;

            questions.forEach((q, idx) => {
                const qNum = idx + 1;
                let finalKey = manualAnswerKeys[qNum] || q.answerKey || 'A';
                let formattedText = renderImagePlaceholders(q.text);

                outputHtml += `<div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0;">`;
                outputHtml += `<p style="font-weight: bold; margin-bottom: 8px;">${qNum}. ${formattedText}</p>`;

                if (q.options.length > 0) {
                    outputHtml += `<ol type="a" style="margin-top: 4px; margin-bottom: 8px; padding-left: 24px;">`;
                    q.options.forEach(opt => {
                        let optText = renderImagePlaceholders(opt.text);
                        outputHtml += `<li style="margin-bottom: 4px;">${optText}</li>`;
                    });
                    outputHtml += `</ol>`;
                }

                outputHtml += `<p style="margin-top: 6px; font-size: 0.9em; color: #047857;"><strong>KUNCI JAWABAN:</strong> ${finalKey}</p>`;
                outputHtml += `<p style="margin-top: 2px; font-size: 0.9em; color: #475569;"><strong>PEMBAHASAN:</strong> ${escapeHtml(defaultPembahasan)}</p>`;
                outputHtml += `</div>`;
            });

            outputHtml += `</div>`;

            const preview = document.getElementById('resultPreview');
            preview.innerHTML = outputHtml;

            document.getElementById('statsCount').textContent = `${questions.length} Soal`;
            document.getElementById('outputCard').classList.remove('hidden');
            showToast(`Berhasil mengonversi ${questions.length} soal!`, 'success');
        }

        // ============================================
        // DOWNLOAD DOCX
        // ============================================
        function downloadAsWord() {
            const content = document.getElementById('resultPreview').innerHTML;
            if (!content.trim()) {
                showToast('Belum ada hasil konversi untuk diunduh.', 'warning');
                return;
            }

            const htmlDocument = `<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Soal Portal Sekolah</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.4; color: #000; }
        p { margin: 4pt 0; }
        ol { margin-top: 4pt; margin-bottom: 4pt; padding-left: 20pt; }
        li { margin-bottom: 3pt; }
        img { max-width: 100%; height: auto; }
        .img-placeholder { font-family: monospace; border: 1px dashed #666; padding: 4px 8px; background: #eee; }
    </style>
</head>
<body>
    ${content}
</body>
</html>`;

            try {
                const converted = htmlDocx.asBlob(htmlDocument);
                const url = URL.createObjectURL(converted);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Soal_Portal_Sekolah_${new Date().toISOString().slice(0,10)}.docx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('File Word berhasil diunduh!', 'success');
            } catch (err) {
                console.error(err);
                showToast('Gagal mengunduh file Word.', 'error');
            }
        }

        // ============================================
        // CLEAR INPUT
        // ============================================
        function clearInput() {
            document.getElementById('rawInput').value = '';
            document.getElementById('kategoriInput').value = '';
            document.getElementById('poinInput').value = '1';
            document.getElementById('pembahasanInput').value = '-';
            document.getElementById('resultPreview').innerHTML = '';
            document.getElementById('outputCard').classList.add('hidden');
            uploadedImages = [];
            manualAnswerKeys = {};
            showToast('Input dan data berhasil dibersihkan.', 'info');
        }
    </script>
