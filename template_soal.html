<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konverter Template Soal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: #ffffff;
            --text-color: #333333;
            --section-bg: #f8f9fa;
            --border-color: #e9ecef;
            --label-color: #495057;
            --input-bg: #ffffff;
            --input-border: #ced4da;
            --input-text: #000000;
            --output-bg: #ffffff;
            --output-border: #e5e5e5;
            --output-text: #000000;
            --stats-bg: #e0e7ff;
            --stats-text: #3730a3;
            --instruction-bg: #fff3cd;
            --instruction-border: #ffc107;
            --instruction-text: #856404;
            
            --container-shadow: 0 15px 35px rgba(0, 0, 0, 0.25), 0 5px 15px rgba(0, 0, 0, 0.15);
            --container-border: #d1d5db;
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --container-bg: #1e293b;
            --text-color: #f1f5f9;
            --section-bg: #0f172a;
            --border-color: #334155;
            --label-color: #cbd5e1;
            --input-bg: #1e293b;
            --input-border: #475569;
            --input-text: #f8fafc;
            --output-bg: #0f172a;
            --output-border: #334155;
            --output-text: #f8fafc;
            --stats-bg: #312e81;
            --stats-text: #e0e7ff;
            --instruction-bg: #422006;
            --instruction-border: #b45309;
            --instruction-text: #fef08a;
            
            --container-shadow: 0 0 20px rgba(129, 140, 248, 0.6), 0 0 40px rgba(129, 140, 248, 0.3);
            --container-border: #6366f1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Calibri', 'Arial', sans-serif; background: var(--bg-gradient); min-height: 100vh; padding: 20px; color: var(--text-color); transition: background 0.3s; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .theme-toggle-btn { 
            background: #f59e0b; 
            border: none; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: all 0.3s; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .theme-toggle-btn:hover { background: #d97706; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--container-bg); 
            border-radius: 12px; 
            padding: 30px; 
            border: 1px solid var(--container-border);
            box-shadow: var(--container-shadow) !important; 
            transition: all 0.3s ease-in-out; 
        }
        
        h1 { text-align: center; color: var(--text-color); margin-bottom: 20px; font-size: 26px; }
        
        .input-section { background: var(--section-bg); padding: 25px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--border-color); transition: all 0.3s; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--label-color); }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid var(--input-border); background: var(--input-bg); color: var(--input-text); border-radius: 5px; font-size: 14px; font-family: inherit; transition: all 0.3s; }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        
        .upload-action-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .file-input-wrapper { position: relative; overflow: hidden; width: 100%; }
        .file-input-wrapper input[type=file] { position: absolute; left: -9999px; }
        
        .file-input-label { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 12px 15px; 
            background: #6366f1; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.3s; 
            font-weight: bold; 
            text-align: center; 
        }
        .file-input-label:hover { background: #4f46e5; }
        .file-input-label.kunci-label { background: #8b5cf6; }
        .file-input-label.kunci-label:hover { background: #7c3aed; }
        
        .btn { flex: 1; min-width: 180px; padding: 12px 15px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; color: white; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
        
        .btn-proses { background: #10b981; } 
        .btn-proses:hover { background: #059669; }
        
        .btn-download { background: #0284c7; } 
        .btn-download:hover { background: #0369a1; }
        
        .output-section { margin-top: 25px; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .stats { background: var(--stats-bg); padding: 10px 15px; border-radius: 5px; font-weight: bold; color: var(--stats-text); display: none; transition: all 0.3s; }
        
        #output { 
            background: var(--output-bg); border: 2px solid var(--output-border); border-radius: 8px; 
            padding: 30px; font-family: 'Calibri', 'Arial', sans-serif; 
            font-size: 11pt; min-height: 200px; color: var(--output-text); transition: all 0.3s;
        }
        #output p { margin: 0 !important; padding: 0 !important; line-height: 1.2 !important; }
        #output p.spacer { height: 12pt !important; line-height: 12pt !important; }
        #output ol.opsi-list { margin: 0 !important; padding-left: 20px !important; list-style-type: lower-alpha; line-height: 1.2 !important; }
        #output ol.opsi-list li { margin-bottom: 2px !important; padding: 0 !important; }
        #output img { max-width: 150px; height: auto; margin: 4px 0; display: block; }
        
        .instructions { background: var(--instruction-bg); border-left: 4px solid var(--instruction-border); padding: 15px; margin-bottom: 20px; border-radius: 5px; color: var(--instruction-text); transition: all 0.3s; }
        .instructions h3 { margin-bottom: 8px; } .instructions ul { margin-left: 20px; }
        .file-info { margin-top: 6px; font-size: 13px; color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>📝 Konverter Template Soal</h1>
            <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
        </div>
        
        <div class="instructions">
            <h3> Cara Penggunaan:</h3>
            <ul>
                <li>Isi <b>Kategori</b> soal</li>
                <li>Upload file <b>Soal (.docx)</b></li>
                <li>Upload file <b>Kunci Jawaban (.docx)</b></li>
                <li>Klik <b>Proses Soal</b>, lalu <b>Download .docx</b></li>
            </ul>
        </div>
        
        <div class="input-section">
            <div class="form-group">
                <label for="kategori">Kategori:</label>
                <input type="text" id="kategori" placeholder="Contoh: ph-1 informatika-7">
            </div>
            
            <div class="form-group">
                <label>1. File Soal (.docx):</label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInputSoal" accept=".docx">
                    <label for="fileInputSoal" class="file-input-label">📁 Upload File Soal</label>
                </div>
                <div id="fileInfoSoal" class="file-info"></div>
            </div>

            <div class="form-group">
                <label>2. File Kunci Jawaban (.docx)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInputKunci" accept=".docx">
                    <label for="fileInputKunci" class="file-input-label kunci-label">🔑 Upload File Kunci Jawaban</label>
                </div>
                <div id="fileInfoKunci" class="file-info"></div>
            </div>

            <div class="upload-action-row">
                <button class="btn btn-proses" onclick="prosesSoal()">🔄 Proses Soal</button>
                <button class="btn btn-download" onclick="downloadDocx()">💾 Download .docx</button>
            </div>
        </div>
        
        <div class="output-section">
            <div class="output-header">
                <h2>Hasil Konversi:</h2>
                <div id="stats" class="stats"></div>
            </div>
            <div id="output">Hasil akan muncul di sini...</div>
        </div>
    </div>
    
    <!-- Library Eksternal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeBtn = document.getElementById('themeToggle');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.innerHTML = '☀️';
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeBtn.innerHTML = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeBtn.innerHTML = '🌙';
            }
        }

        initTheme();

        let currentOutputHTML = '';
        let totalSoal = 0;
        let parsedQuestions = [];
        let rawHtmlSoal = '';
        let kunciJawabanMap = {};

        const bankKunci = {
            "disebut apakah karakter pada scratch": "a",
            "disebut apakah perintah pada scratch": "b",
            "apa maksud dari block berikut": "b"
        };

        // Event listener pembacaan File Soal
        document.getElementById('fileInputSoal').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const info = document.getElementById('fileInfoSoal');
            info.textContent = '';
            if (!file) return;
            
            info.textContent = '⏳ Memproses file soal...';
            const reader = new FileReader();
            
            reader.onload = function(e) {
                mammoth.convertToHtml({ arrayBuffer: e.target.result }, {
                    styleMap: ["r[color] => span[style]"],
                    convertImage: mammoth.images.imgElement(function(image) {
                        return image.read("base64").then(function(imageBuffer) {
                            return { src: "data:" + image.contentType + ";base64," + imageBuffer };
                        });
                    })
                }).then(function(result) {
                    rawHtmlSoal = result.value;
                    info.textContent = `✅ File Soal '${file.name}' berhasil dibaca!`;
                }).catch(function(err) {
                    info.textContent = '❌ Gagal membaca file soal: ' + err.message;
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Event listener pembacaan File Kunci Jawaban Terpisah (Mendukung convertToHtml)
        document.getElementById('fileInputKunci').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const info = document.getElementById('fileInfoKunci');
            info.textContent = '';
            if (!file) return;
            
            info.textContent = '⏳ Memproses file kunci jawaban...';
            const reader = new FileReader();
            
            reader.onload = function(e) {
                mammoth.convertToHtml({ arrayBuffer: e.target.result }).then(function(result) {
                    parseKunciJawabanText(result.value);
                    const totalKunci = Object.keys(kunciJawabanMap).length;
                    info.textContent = `✅ File Kunci '${file.name}' berhasil dibaca! (${totalKunci} kunci terdeteksi)`;
                }).catch(function(err) {
                    info.textContent = '❌ Gagal membaca file kunci: ' + err.message;
                });
            };
            reader.readAsArrayBuffer(file);
        });

        // Fungsi Parsing Kunci Jawaban Super Kuat (List, Tabel, Spasi Lebar \u00a0 / Tab)
        function parseKunciJawabanText(htmlOrText) {
            kunciJawabanMap = {};

            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlOrText, 'text/html');
            
            const elements = doc.querySelectorAll('p, li, tr, td');
            let items = [];

            if (elements.length > 0) {
                elements.forEach(el => {
                    const txt = el.innerText || el.textContent;
                    if (txt && txt.trim()) items.push(txt.trim());
                });
            } else {
                items = htmlOrText.split('\n');
            }

            let autoNumberIndex = 1;

            items.forEach(item => {
                const clean = item.replace(/\u00a0/g, ' ').replace(/\t/g, ' ').trim();
                if (!clean) return;

                // Mode A: Ada nomor dan kunci (misal: "1. A", "1        A", "No 1: A")
                const matchWithNo = clean.match(/^(?:No\.?\s*)?(\d+)[\.\s:=|\)\-–]*\s*([a-eA-E])\b/i);
                
                if (matchWithNo) {
                    const noSoal = parseInt(matchWithNo[1], 10);
                    const kunci = matchWithNo[2].toLowerCase();
                    kunciJawabanMap[noSoal] = kunci;
                    return;
                }

                // Mode B: List Otomatis Word (<ol><li>A</li></ol>), nomor tidak muncul di teks
                const singleKeyMatch = clean.match(/^([a-eA-E])$/i);
                if (singleKeyMatch) {
                    kunciJawabanMap[autoNumberIndex] = singleKeyMatch[1].toLowerCase();
                    autoNumberIndex++;
                }
            });

            // Fallback: Pemindaian global jika format berupa tabel polos tanpa tag baku
            if (Object.keys(kunciJawabanMap).length === 0) {
                const plainText = doc.body.innerText || htmlOrText;
                const normalized = plainText.replace(/\u00a0/g, ' ').replace(/\t/g, ' ');
                const matches = [...normalized.matchAll(/(\d+)[\.\s:=|\)\-–]*\s*([a-eA-E])(?!\w)/gi)];
                
                matches.forEach(m => {
                    const noSoal = parseInt(m[1], 10);
                    const kunci = m[2].toLowerCase();
                    kunciJawabanMap[noSoal] = kunci;
                });
            }
        }

        function cleanText(str) {
            return str.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function getCleanKey(str) {
            return str.toLowerCase().replace(/[?.,!:\-_]/g, '').replace(/\s+/g, ' ').trim();
        }

        function isRedElement(el) {
            if (!el) return false;
            const html = el.innerHTML || el.outerHTML || '';
            const redRegex = /color:\s*(red|#ff0000|#f00|rgb\(\s*255\s*,\s*0\s*,\s*0\s*\))/i;
            return redRegex.test(html);
        }

        function parseHtmlToQuestions(htmlString) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const questions = [];
            const labels = ['a', 'b', 'c', 'd', 'e'];
            
            const orderedLists = doc.querySelectorAll('ol');
            
            if (orderedLists.length > 0) {
                let currentQ = null;
                let optionCount = 0;
                let isFirstOl = true;
                
                orderedLists.forEach(ol => {
                    const items = ol.querySelectorAll('li');
                    items.forEach((li) => {
                        const text = cleanText(li.innerText);
                        const img = li.querySelector('img');
                        const hasRed = isRedElement(li);
                        
                        if (isFirstOl && optionCount === 0) {
                            currentQ = { text: text, options: [], images: {}, detectedKey: null };
                            if (img) currentQ.questionImage = img.src;
                            isFirstOl = false;
                        } else if (currentQ && optionCount < 4) {
                            const currentLabel = labels[optionCount];
                            currentQ.options.push({ label: currentLabel, text: text });
                            if (img) currentQ.images[currentLabel] = img.src;
                            if (hasRed) currentQ.detectedKey = currentLabel;
                            
                            optionCount++;
                            
                            if (optionCount === 4) {
                                questions.push(currentQ);
                                currentQ = null;
                                optionCount = 0;
                                isFirstOl = true;
                            }
                        }
                    });
                });
            }
            
            if (questions.length === 0) {
                const paragraphs = doc.body.querySelectorAll('p');
                let currentQ = null;
                let currentOptIndex = -1;
                
                paragraphs.forEach(p => {
                    const text = cleanText(p.innerText);
                    const img = p.querySelector('img');
                    const hasRed = isRedElement(p);
                    
                    const qMatch = text.match(/^(?:No\s*:\s*)?(\d+)[\.\)]\s*(.*)/i);
                    
                    if (qMatch && !text.match(/^([a-eA-E])[\.\)]/)) {
                        if (currentQ && currentQ.options.length > 0) {
                            questions.push(currentQ);
                        }
                        currentQ = { text: qMatch[2], options: [], images: {}, detectedKey: null };
                        currentOptIndex = -1;
                        if (img) currentQ.questionImage = img.src;
                        return;
                    }
                    
                    const optMatch = text.match(/^([a-eA-E])[\.\)]\s*(.*)/);
                    if (currentQ && optMatch) {
                        const label = optMatch[1].toLowerCase();
                        const optText = optMatch[2] || '';
                        
                        currentQ.options.push({ label: label, text: optText });
                        currentOptIndex = currentQ.options.length - 1;
                        
                        if (img) currentQ.images[label] = img.src;
                        if (hasRed) currentQ.detectedKey = label;
                        return;
                    }
                    
                    if (img && currentQ && currentOptIndex >= 0) {
                        const currentLabel = labels[currentOptIndex];
                        if (!currentQ.images[currentLabel]) {
                            currentQ.images[currentLabel] = img.src;
                        }
                        if (hasRed) currentQ.detectedKey = currentLabel;
                    }
                });
                
                if (currentQ && currentQ.options.length > 0) {
                    questions.push(currentQ);
                }
            }
            
            return questions;
        }

        function prosesSoal() {
            try {
                if (!rawHtmlSoal) { alert('Mohon upload file Soal (.docx) terlebih dahulu!'); return; }
                
                const kategori = document.getElementById('kategori').value.trim() || 'umum';
                parsedQuestions = parseHtmlToQuestions(rawHtmlSoal);
                
                if (parsedQuestions.length === 0) { 
                    alert('Tidak ada soal yang terdeteksi. Pastikan format penomoran standar.'); 
                    return; 
                }
                
                totalSoal = parsedQuestions.length;
                let htmlOutput = '';
                
                const pStyle = 'margin:0;padding:0;line-height:1.2;font-size:11pt;font-family:Calibri,sans-serif;';
                const spacerStyle = 'margin:0;padding:0;height:12pt;line-height:12pt;';

                parsedQuestions.forEach((soal, index) => {
                    const no = index + 1;
                    let kunciJawaban = "-";
                    
                    // Priority 1: File kunci jawaban terpisah
                    if (kunciJawabanMap[no]) {
                        kunciJawaban = kunciJawabanMap[no];
                    } 
                    // Priority 2: Deteksi warna MERAH dari file soal
                    else if (soal.detectedKey) {
                        kunciJawaban = soal.detectedKey;
                    } 
                    // Priority 3: Bank kunci internal
                    else {
                        const soalClean = getCleanKey(soal.text);
                        if (bankKunci[soalClean]) kunciJawaban = bankKunci[soalClean];
                    }

                    htmlOutput += `<p style="${pStyle}"><b>No:</b> ${no}</p>`;
                    htmlOutput += `<p style="${pStyle}"><b>Kategori:</b> ${kategori}</p>`;
                    htmlOutput += `<p style="${pStyle}"><b>Soal :</b> ${soal.text}</p>`;
                    
                    if (soal.questionImage) {
                        htmlOutput += `<p style="${pStyle}"><img src="${soal.questionImage}" alt="Gambar Soal"></p>`;
                    }
                    
                    htmlOutput += `<p style="${pStyle}"><b>Opsi:</b></p>`;
                    htmlOutput += `<ol class="opsi-list" style="margin:0;padding-left:20px;list-style-type:lower-alpha;">`;
                    soal.options.forEach((opsi) => {
                        if (opsi) {
                            htmlOutput += `<li>${opsi.text}`;
                            if (soal.images[opsi.label]) {
                                htmlOutput += `<br><img src="${soal.images[opsi.label]}" alt="Opsi ${opsi.label}">`;
                            }
                            htmlOutput += `</li>`;
                        }
                    });
                    htmlOutput += `</ol>`;
                    
                    htmlOutput += `<p style="${pStyle}"><b>Kunci Jawaban:</b> ${kunciJawaban}</p>`;
                    htmlOutput += `<p style="${pStyle}"><b>Poin:</b> 1</p>`;
                    htmlOutput += `<p style="${pStyle}"><b>Pembahasan:</b> -</p>`;
                    htmlOutput += `<p style="${spacerStyle}">&nbsp;</p>`;
                });

                currentOutputHTML = htmlOutput;
                document.getElementById('output').innerHTML = htmlOutput;
                document.getElementById('stats').style.display = 'block';
                document.getElementById('stats').textContent = `✅ Berhasil memproses ${totalSoal} soal`;
            } catch (err) {
                alert('Terjadi kesalahan saat memproses soal: ' + err.message);
                console.error(err);
            }
        }

        async function downloadDocx() {
            if (!currentOutputHTML || parsedQuestions.length === 0) { 
                alert('Silakan upload dan proses soal terlebih dahulu!'); 
                return; 
            }

            try {
                const docxLib = window.docx;
                if (!docxLib) {
                    alert('Library docx gagal dimuat. Periksa koneksi internet Anda.');
                    return;
                }

                const { Document, Packer, Paragraph, TextRun, ImageRun, LevelFormat } = docxLib;
                const children = [];
                const kategoriVal = document.getElementById('kategori').value.trim() || 'umum';

                const processBase64Image = (base64Str) => {
                    const parts = base64Str.split(',');
                    const mimeMatch = parts[0].match(/:(.*?);/);
                    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
                    const raw = window.atob(parts[1]);
                    const uInt8Array = new Uint8Array(raw.length);
                    for (let i = 0; i < raw.length; ++i) {
                        uInt8Array[i] = raw.charCodeAt(i);
                    }
                    return { data: uInt8Array, mimeType: mime };
                };

                const numberingConfigs = [];

                parsedQuestions.forEach((soal, index) => {
                    const no = index + 1;
                    let kunciJawaban = "-";
                    
                    if (kunciJawabanMap[no]) {
                        kunciJawaban = kunciJawabanMap[no];
                    } else if (soal.detectedKey) {
                        kunciJawaban = soal.detectedKey;
                    } else {
                        const soalClean = getCleanKey(soal.text);
                        if (bankKunci[soalClean]) kunciJawaban = bankKunci[soalClean];
                    }

                    const numRef = `num-opsi-${index}`;
                    numberingConfigs.push({
                        reference: numRef,
                        levels: [{
                            level: 0,
                            format: LevelFormat.LOWER_LETTER,
                            text: "%1.",
                            alignment: docxLib.AlignmentType.LEFT,
                            style: { paragraph: { indent: { left: 720, hanging: 360 } } }
                        }]
                    });

                    children.push(new Paragraph({ children: [new TextRun({ text: `No: ${no}`, bold: true })] }));
                    children.push(new Paragraph({ children: [new TextRun({ text: "Kategori: ", bold: true }), new TextRun(kategoriVal)] }));
                    children.push(new Paragraph({ children: [new TextRun({ text: "Soal : ", bold: true }), new TextRun(soal.text)] }));
                    
                    if (soal.questionImage) {
                        const imgData = processBase64Image(soal.questionImage);
                        children.push(new Paragraph({
                            children: [new ImageRun({ data: imgData.data, transformation: { width: 120, height: 120 } })]
                        }));
                    }

                    children.push(new Paragraph({ children: [new TextRun({ text: "Opsi:", bold: true })] }));
                    
                    soal.options.forEach(opsi => {
                        if (opsi) {
                            children.push(new Paragraph({
                                numbering: { reference: numRef, level: 0 },
                                children: [new TextRun({ text: opsi.text })]
                            }));
                            
                            if (soal.images[opsi.label]) {
                                const imgData = processBase64Image(soal.images[opsi.label]);
                                children.push(new Paragraph({
                                    children: [new ImageRun({ data: imgData.data, transformation: { width: 100, height: 100 } })],
                                    indent: { left: 720 }
                                }));
                            }
                        }
                    });

                    children.push(new Paragraph({ children: [new TextRun({ text: "Kunci Jawaban: ", bold: true }), new TextRun(kunciJawaban)] }));
                    children.push(new Paragraph({ children: [new TextRun({ text: "Poin: ", bold: true }), new TextRun("1")] }));
                    children.push(new Paragraph({ children: [new TextRun({ text: "Pembahasan: ", bold: true }), new TextRun("-")] }));
                    children.push(new Paragraph({ children: [new TextRun("")] }));
                });

                const doc = new Document({
                    numbering: { config: numberingConfigs },
                    sections: [{ properties: {}, children: children }]
                });

                const blob = await Packer.toBlob(doc);
                saveAs(blob, `Soal_${kategoriVal}_${totalSoal}.docx`);
            } catch (error) {
                console.error("Gagal men-download docx:", error);
                alert("Terjadi kesalahan saat membuat file Word: " + error.message);
            }
        }
    </script>
</body>
</html>
