<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu 3D Interaktif</title>
 
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JjyvHZbP/logo-menu3d.png">
    <link rel="shortcut icon" type="image/png" href="https://i.ibb.co.com/JjyvHZbP/logo-menu3d.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    
    <style>
        /* === RESET & FIX VIEWPORT HP === */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100vh !important;
            height: 100dvh !important;
            overflow: hidden !important;
        }

        body {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2c5f2d;
            position: relative;
            transition: background 0.5s ease, background-image 0.5s ease;
        }

        /* === FIXED OVERLAY === */
        .bg-overlay-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
            pointer-events: none;
            transition: all 0.4s ease;
            backdrop-filter: brightness(0.95);
            -webkit-backdrop-filter: brightness(0.95);
        }

        body.dark-mode .bg-overlay-fixed { 
            backdrop-filter: brightness(0.3) contrast(1.1) saturate(0.8) !important;
            -webkit-backdrop-filter: brightness(0.3) contrast(1.1) saturate(0.8) !important;
            background-color: rgba(10, 15, 30, 0.4) !important;
        }

        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        /* === WADAH MENU === */
        .menu-container {
            position: relative;
            width: 380px;
            height: 380px;
            margin: 0 auto;
            z-index: 2;
            cursor: grab;
        }
        .menu-container:active {
            cursor: grabbing;
        }

        /* === ELEMEN GARIS ORBIT NEON BERDENYUT === */
        .orbit-line {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px;
            height: 300px;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.6s ease, border-color 0.6s ease;
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.1),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .orbit-line.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: orbitPulse 3s infinite alternate ease-in-out;
        }

        @keyframes orbitPulse {
            0% {
                border-color: rgba(255, 255, 255, 0.2);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.05);
            }
            100% {
                border-color: rgba(255, 255, 255, 0.5);
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.25), inset 0 0 25px rgba(255, 255, 255, 0.25);
            }
        }

        /* === LINGKARAN PUSAT 3D === */
        .center-circle {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 4px solid #ffffff;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.3), 
                inset 0 -8px 12px rgba(0, 0, 0, 0.15), 
                inset 0 8px 12px rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .center-circle:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4), 
                inset 0 -4px 8px rgba(0, 0, 0, 0.1), 
                inset 0 6px 10px rgba(255, 255, 255, 0.9);
        }

        /* === WADAH TEKS MELINGKAR === */
        .text-circle {
            position: absolute;
            width: 110px;
            height: 110px; 
            border-radius: 50%;
            animation: putarTeks 20s linear infinite;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            overflow: visible; 
            transition: animation-duration 0.5s ease;
            pointer-events: none;
        }
        @keyframes putarTeks {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .menu-container:has(.menu-item:hover) .text-circle {
            animation-duration: 45s;
        }

        .char {
            position: absolute;
            top: 0; left: 50%;
            transform-origin: center 55px;
            font-size: 8.5px; 
            font-weight: 800;
            color: #1e40af;
            text-align: center;
            width: 12px;
            margin-left: -6px;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
            display: block !important;
            opacity: 1 !important;
            line-height: 1;
            transition: color 0.3s ease;
        }

        /* === LOGO BERKEDIP === */
        .logo-sekolah {
            width: 88px;
            height: 88px; 
            object-fit: contain;
            z-index: 25;
            display: block !important;
            animation: kedipGlow 2.5s infinite alternate ease-in-out !important;
            position: relative;
            pointer-events: none;
        }
        @keyframes kedipGlow {
            0% { opacity: 0.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)) scale(0.96); }
            100% { opacity: 1; filter: drop-shadow(0 8px 16px rgba(30, 64, 175, 0.6)) scale(1.03); }
        }

        /* === SUB-MENU UTAMA === */
        .menu-item {
            position: absolute;
            width: 74px;
            height: 74px;
            z-index: 5;
            left: calc(50% - 37px);
            top: calc(50% - 37px);
            
            opacity: 0;
            visibility: hidden;
            transform: translate(0px, 0px) scale(0);
            /* Dihapus transisi transform agar pergerakan drag terasa instan dan smooth */
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        .menu-item.show {
            opacity: 1;
            visibility: visible;
            transform: translate(var(--x), var(--y)) scale(1);
        }

        .menu-item:not(.show) {
            transform: translate(0px, 0px) scale(0) !important;
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.36, 0, 0.66, -0.56), opacity 0.3s ease;
        }

        /* === WADAH ANIMASI MELAYANG === */
        .orbit-wrapper {
            width: 100%;
            height: 100%;
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 22px;
            cursor: pointer;
            position: relative;
            transition: box-shadow 0.3s ease, filter 0.3s ease;
        }

        .menu-item.show .orbit-wrapper {
            animation: mengorbitMelayang var(--durasi-float, 4s) ease-in-out infinite alternate;
            animation-delay: var(--delay-float, 0s);
        }

        .menu-item:hover .orbit-wrapper {
            animation-play-state: paused !important;
            filter: brightness(1.15);
        }

        @keyframes mengorbitMelayang {
            0% { transform: translate(-3px, -4px) rotate(-1deg); }
            50% { transform: translate(0px, 0px) scale(1.02) rotate(1deg); }
            100% { transform: translate(3px, 4px) rotate(-0.5deg); }
        }

        .orbit-wrapper::before {
            content: '';
            position: absolute;
            top: 4px; left: 15%;
            width: 70%; height: 35%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 100%);
            border-radius: 50px / 20px;
        }

        .orbit-wrapper span {
            font-size: 9px;
            margin-top: 3px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* WARNA GRADIEN ICON & VARIABEL WARNA SHOCKWAVE */
        .color-0 { background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); border: 2px solid #fb923c; box-shadow: 0 8px 15px rgba(194,65,12,0.4), 0 4px 0 #7c2d12; --neon: #f97316; }
        .color-0:hover { box-shadow: 0 14px 28px rgba(194,65,12,0.6), 0 1px 0 #7c2d12; }

        .color-1 { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: 2px solid #60a5fa; box-shadow: 0 8px 15px rgba(29,78,216,0.4), 0 4px 0 #1e3a8a; --neon: #3b82f6; }
        .color-1:hover { box-shadow: 0 14px 28px rgba(29,78,216,0.6), 0 1px 0 #1e3a8a; }

        .color-2 { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); border: 2px solid #4ade80; box-shadow: 0 8px 15px rgba(21,128,61,0.4), 0 4px 0 #14532d; --neon: #22c55e; }
        .color-2:hover { box-shadow: 0 14px 28px rgba(21,128,61,0.6), 0 1px 0 #14532d; }

        .color-3 { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); border: 2px solid #f87171; box-shadow: 0 8px 15px rgba(185,28,28,0.4), 0 4px 0 #7f1d1d; --neon: #ef4444; }
        .color-3:hover { box-shadow: 0 14px 28px rgba(185,28,28,0.6), 0 1px 0 #7f1d1d; }

        .color-4 { background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%); border: 2px solid #c084fc; box-shadow: 0 8px 15px rgba(126,34,206,0.4), 0 4px 0 #581c87; --neon: #a855f7; }
        .color-4:hover { box-shadow: 0 14px 28px rgba(126,34,206,0.6), 0 1px 0 #581c87; }

        .color-5 { background: linear-gradient(135deg, #14b8a6 0%, #0f766e 100%); border: 2px solid #2dd4bf; box-shadow: 0 8px 15px rgba(15,118,110,0.4), 0 4px 0 #115e59; --neon: #14b8a6; }
        .color-5:hover { box-shadow: 0 14px 28px rgba(15,118,110,0.6), 0 1px 0 #115e59; }

        .color-6 { background: linear-gradient(135deg, #eab308 0%, #a16207 100%); border: 2px solid #facc15; box-shadow: 0 8px 15px rgba(161,98,7,0.4), 0 4px 0 #854d0e; --neon: #eab308; }
        .color-6:hover { box-shadow: 0 14px 28px rgba(161,98,7,0.6), 0 1px 0 #854d0e; }

        .color-7 { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); border: 2px solid #f472b6; box-shadow: 0 8px 15px rgba(190,24,93,0.4), 0 4px 0 #831843; --neon: #ec4899; }
        .color-7:hover { box-shadow: 0 14px 28px rgba(190,24,93,0.6), 0 1px 0 #831843; }

        .color-8 { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); border: 2px solid #818cf8; box-shadow: 0 8px 15px rgba(67,56,202,0.4), 0 4px 0 #3730a3; --neon: #6366f1; }
        .color-8:hover { box-shadow: 0 14px 28px rgba(67,56,202,0.6), 0 1px 0 #3730a3; }

        .color-9 { background: linear-gradient(135deg, #84cc16 0%, #4d7c0f 100%); border: 2px solid #a3e635; box-shadow: 0 8px 15px rgba(77,124,15,0.4), 0 4px 0 #3f6212; --neon: #84cc16; }
        .color-9:hover { box-shadow: 0 14px 28px rgba(77,124,15,0.6), 0 1px 0 #3f6212; }

        /* MODIFIKASI ANIMASI: Meluncur ciut lalu mental ke posisi asal */
        .move-to-center {
            animation: luncurKeTengahLogo 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards !important;
        }
        @keyframes luncurKeTengahLogo {
            0% { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
            40% { transform: translate(0px, 0px) scale(0.1); opacity: 0.3; }
            50% { transform: translate(0px, 0px) scale(0.1); opacity: 0.3; }
            100% { transform: translate(var(--x), var(--y)) scale(1); opacity: 1; }
        }

        #toggleMode {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 14px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 999;
            transition: all 0.3s ease;
        }

        /* === PANEL PENGATURAN === */
        .settings-panel {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px 24px 0 0;
            padding: 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            z-index: 1000;
            transform: translateX(-50%) translateY(100%);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .settings-panel.open { 
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        body.dark-mode .center-circle {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%) !important;
            border-color: #475569 !important;
        }
        body.dark-mode .char { color: #f8fafc; text-shadow: 1px 1px 0px rgba(0,0,0,0.6); }
        body.dark-mode .settings-panel {
            background: rgba(30, 41, 59, 0.95);
            color: #f8fafc;
        }
        
        .input-custom {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s;
            background-color: #ffffff !important;
            color: #1f2937 !important;
            margin-bottom: 0.5rem;
        }
        body.dark-mode .input-custom { background-color: #e2e8f0 !important; color: #111827 !important; border-color: #94a3b8; }

        .item-menu-editor {
            background: rgba(0,0,0,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #0d9488;
        }
        body.dark-mode .item-menu-editor { background: rgba(255,255,255,0.1); }

        .btn-hapus {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body class="dark-mode">

    <canvas id="particleCanvas"></canvas>
    <div class="bg-overlay-fixed"></div>
    <button id="toggleMode">☀️</button>

    <div class="menu-container" id="menuContainer">
        <div class="orbit-line" id="orbitLine"></div>

        <div class="center-circle" id="tombolUtama">
            <div class="text-circle" id="textCircle"></div>
            <img class="logo-sekolah" id="logoTujuan" src="https://i.ibb.co.com/bgHfySHf/sticker-earth-t-shirt-811396-75337-removebg-preview.png" alt="Logo Menu 3D">
        </div>
    </div>

    <div class="settings-panel" id="panelPengaturan">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold"><i class="fa-solid fa-gear mr-2 text-teal-600"></i>Pengaturan Menu</h3>
            <button id="btnTutupPanel" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>
        
        <div class="mb-4 p-3 bg-gray-100 dark:bg-gray-800 rounded-lg">
            <label class="block text-sm font-semibold mb-2"><i class="fa-solid fa-pen mr-2 text-blue-500"></i>Ubah Teks Berputar:</label>
            <input type="text" id="inputTeksBerputar" class="input-custom" maxlength="50">
        </div>

        <div class="mb-4 p-3 bg-gray-100 dark:bg-gray-800 rounded-lg">
            <label class="block text-sm font-semibold mb-2"><i class="fa-solid fa-image mr-2 text-green-500"></i>Ubah Logo:</label>
            <input type="text" id="inputLogoBaru" class="input-custom">
        </div>

        <div class="mb-4 p-3 bg-gray-100 dark:bg-gray-800 rounded-lg">
            <label class="block text-sm font-semibold mb-2"><i class="fa-solid fa-table-cells-large mr-2 text-purple-500"></i>Daftar Ikon Menu:</label>
            <div id="daftarEditorIkon"></div>
            <button type="button" id="btnTambahIkon" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 px-3 rounded-lg text-sm mt-2">
                <i class="fa-solid fa-plus mr-1"></i> Tambah Ikon Baru
            </button>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-300 mb-2">Warna Latar:</label>
            <input type="color" id="colorPicker" class="w-12 h-10 border rounded cursor-pointer bg-transparent">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 dark:text-gray-300 mb-1">Gambar Latar (URL):</label>
            <input type="text" id="bgUrlInput" class="input-custom">
        </div>

        <button id="btnTerapkanBg" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow-md">
            Terapkan Semua Perubahan
        </button>
    </div>

    <script>
        const DEFAULT_BG_IMAGE = "https://i.ibb.co.com/nsM7N5cq/pexels-photo-1226302.jpg";
        const DEFAULT_TEKS = "SELAMAT DATANG DI WEBSITE SAYA ";
        const DEFAULT_LOGO = "https://i.ibb.co.com/bgHfySHf/sticker-earth-t-shirt-811396-75337-removebg-preview.png";
        
        const SHEET_URL = "https://script.google.com/macros/s/AKfycbyExu8UNQD6AGALGTaGeofCA53zK2QBol1H5Qw1R_j-hcimTdq3h8PjGFbhCp0WZIpT/exec";

        let daftarIkonDefault = [
            { ikon: "book", label: "Agenda", link: "#" },
            { ikon: "users", label: "Siswa", link: "#" },
            { ikon: "star", label: "Baru", link: "#" },
            { ikon: "calendar-days", label: "Jadwal", link: "#" },
            { ikon: "file-lines", label: "Nilai", link: "#" },
            { ikon: "bullhorn", label: "Pengumuman", link: "#" },
            { ikon: "gear", label: "Pengaturan", link: "#" }
        ];

        let menuTampil = false;
        let daftarIkon = [];
        let efekRippleList = []; 

        // === VARIABEL DRAG / GESER ROTASI ===
        let sedangDrag = false;
        let sudutAwalPointer = 0;
        let sudutTambahan = 0; // Menyimpan akumulasi pergeseran rotasi
        let totalPergeseranPiksel = 0; // Deteksi apakah pointer benar-benar digeser atau sekadar klik

        const menuContainer = document.getElementById('menuContainer');
        const tombolUtama = document.getElementById('tombolUtama');
        const orbitLine = document.getElementById('orbitLine');
        const panelPengaturan = document.getElementById('panelPengaturan');
        const btnTutupPanel = document.getElementById('btnTutupPanel');
        const inputTeksBerputar = document.getElementById('inputTeksBerputar');
        const inputLogoBaru = document.getElementById('inputLogoBaru');
        const colorPicker = document.getElementById('colorPicker');
        const bgUrlInput = document.getElementById('bgUrlInput');
        const btnTerapkanBg = document.getElementById('btnTerapkanBg');
        const toggleMode = document.getElementById('toggleMode');
        const logoTujuan = document.getElementById('logoTujuan');

        function putarSuaraMenu(apakahTerbuka) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                if (apakahTerbuka) {
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.08); 
                } else {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
                    osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.08); 
                }
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08); 
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { }
        }

        function putarSuaraShockwave() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.25);
                
                gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch (e) {}
        }

        // CANVAS ENGINE
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let arrayPartikel = [];
        const jumlahPartikel = 40;

        function sesuaikanUkuranCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', sesuaikanUkuranCanvas);
        sesuaikanUkuranCanvas();

        class PartikelAmbient {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.ukuran = Math.random() * 2 + 0.5;
                this.kecepatanY = Math.random() * 0.3 + 0.1;
                this.kecepatanX = (Math.random() * 0.2 - 0.1);
                this.alpha = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y -= this.kecepatanY;
                this.x += this.kecepatanX;
                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.arc(this.x, this.y, this.ukuran, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class WaveRing {
            constructor(x, y, warnaHex, delay) {
                this.x = x;
                this.y = y;
                this.warna = warnaHex;
                this.delay = delay; 
                this.radius = 10;
                this.radiusMaks = 90; 
                this.alpha = 1.0;
                this.kecepatanEkspansi = 3.5;
            }
            update() {
                if (this.delay > 0) {
                    this.delay--;
                    return;
                }
                this.radius += this.kecepatanEkspansi;
                let rasio = this.radius / this.radiusMaks;
                this.alpha = 1 - rasio;
            }
            draw() {
                if (this.delay > 0 || this.alpha <= 0) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.warna;
                ctx.lineWidth = 3 * this.alpha;
                ctx.shadowColor = this.warna;
                ctx.shadowBlur = 12;
                ctx.stroke();
                ctx.restore();
            }
        }

        function pemicuLedakanShockwave(x, y, warnaHex) {
            efekRippleList.push(new WaveRing(x, y, warnaHex, 0));  
            efekRippleList.push(new WaveRing(x, y, warnaHex, 6));  
            efekRippleList.push(new WaveRing(x, y, warnaHex, 12)); 
        }

        function inisialisasiPartikel() {
            arrayPartikel = [];
            for (let i = 0; i < jumlahPartikel; i++) {
                let p = new PartikelAmbient();
                p.y = Math.random() * canvas.height;
                arrayPartikel.push(p);
            }
        }

        function jalankanAnimasiPartikel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < arrayPartikel.length; i++) {
                arrayPartikel[i].update();
                arrayPartikel[i].draw();
            }
            for (let i = efekRippleList.length - 1; i >= 0; i--) {
                efekRippleList[i].update();
                if (efekRippleList[i].radius >= efekRippleList[i].radiusMaks) {
                    efekRippleList.splice(i, 1);
                } else {
                    efekRippleList[i].draw();
                }
            }
            requestAnimationFrame(jalankanAnimasiPartikel);
        }
        inisialisasiPartikel();
        jalankanAnimasiPartikel();


        window.addEventListener('DOMContentLoaded', () => {
            ambilDataDariSheet();

            tombolUtama.addEventListener('click', (e) => {
                // Hanya trigger menu jika tidak sedang digeser/drag jauh
                if (totalPergeseranPiksel > 7) return;

                menuTampil = !menuTampil;
                putarSuaraMenu(menuTampil);
                orbitLine.classList.toggle('show', menuTampil);
                document.querySelectorAll('.menu-item').forEach(menu => {
                    menu.classList.toggle('show', menuTampil);
                });
            });

            // INDUKSI EVENT INTERAKSI DRAG ROTASI
            menuContainer.addEventListener('mousedown', mulaiDrag);
            window.addEventListener('mousemove', prosesDrag);
            window.addEventListener('mouseup', selesaiDrag);

            menuContainer.addEventListener('touchstart', mulaiDrag, { passive: false });
            window.addEventListener('touchmove', prosesDrag, { passive: false });
            window.addEventListener('touchend', selesaiDrag);
        });

        // === FUNGSI LOGIKA MENGHITUNG SUDUT DAN POSISI DRAG ===
        function dapatkanSudutPointer(e) {
            const batasMenu = menuContainer.getBoundingClientRect();
            // Titik tengah kontainer menu
            const pusatX = batasMenu.left + batasMenu.width / 2;
            const pusatY = batasMenu.top + batasMenu.height / 2;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Hitung sudut dalam satuan derajat menggunakan Trigonometri atan2
            const radian = Math.atan2(clientY - pusatY, clientX - pusatX);
            return radian * (180 / Math.PI);
        }

        function mulaiDrag(e) {
            // Abaikan jika user menekan tombol pengaturan/input di dalam panel
            if (e.target.closest('.settings-panel') || !menuTampil) return;
            
            sedangDrag = true;
            totalPergeseranPiksel = 0;
            sudutAwalPointer = dapatkanSudutPointer(e);
        }

        function prosesDrag(e) {
            if (!sedangDrag) return;
            
            totalPergeseranPiksel += 1;
            const sudutSekarang = dapatkanSudutPointer(e);
            let selisihSudut = sudutSekarang - sudutAwalPointer;
            
            // Koreksi patahan transisi lompatan lingkaran 180 ke -180 derajat
            if (selisihSudut > 180) selisihSudut -= 360;
            if (selisihSudut < -180) selisihSudut += 360;
            
            sudutTambahan += selisihSudut;
            sudutAwalPointer = sudutSekarang;
            
            // Render ulang posisi ikon berdasarkan sudut tambahan yang baru
            perbaruiPosisiMenu();
        }

        function selesaiDrag() {
            sedangDrag = false;
        }

        function ambilDataDariSheet(){
            fetch(SHEET_URL + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const teks = data.teks || DEFAULT_TEKS;
                const logo = data.logo || DEFAULT_LOGO;
                const latar = data.latar ? JSON.parse(data.latar) : {type:"image", value:DEFAULT_BG_IMAGE};
                const ikon = data.ikon ? JSON.parse(data.ikon) : daftarIkonDefault;

                inputTeksBerputar.value = teks; buatTeksBerputar(teks);
                inputLogoBaru.value = logo; logoTujuan.src = logo;
                
                if(latar.type === "image"){
                    document.body.style.backgroundImage = `url('${latar.value}')`;
                    bgUrlInput.value = latar.value;
                } else {
                    document.body.style.backgroundImage = "none";
                    document.body.style.backgroundColor = latar.value;
                    colorPicker.value = latar.value;
                }

                daftarIkon = ikon;
                buatMenuDinamis();
                buatEditorIkon();
            })
            .catch(err => {
                daftarIkon = [...daftarIkonDefault];
                buatMenuDinamis();
                buatEditorIkon();
            });
        }

        function simpanKeSheet(){
            const data = {
                teks: inputTeksBerputar.value,
                logo: inputLogoBaru.value,
                latar: JSON.stringify({
                    type: bgUrlInput.value ? "image" : "color",
                    value: bgUrlInput.value || colorPicker.value
                }),
                ikon: JSON.stringify(daftarIkon)
            };

            fetch(SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });
        }

        function buatTeksBerputar(teks) {
            const wadah = document.getElementById("textCircle");
            wadah.innerHTML = '';
            const jumlahHuruf = teks.length;
            if (jumlahHuruf === 0) return;
            const sudutPerHuruf = 360 / jumlahHuruf;
            const radius = 55;
            for (let i = 0; i < jumlahHuruf; i++) {
                const huruf = document.createElement("div");
                huruf.className = "char";
                huruf.innerText = teks[i];
                const sudut = i * sudutPerHuruf;
                const x = Math.sin(sudut * Math.PI / 180) * radius;
                const y = -Math.cos(sudut * Math.PI / 180) * radius;
                huruf.style.transform = `translate(${x}px, ${y}px) rotate(${sudut}deg)`;
                wadah.appendChild(huruf);
            }
        }

        function buatMenuDinamis() {
            // Hapus menu lama
            document.querySelectorAll('.menu-item').forEach(el => el.remove());
            const wadah = document.getElementById("menuContainer");

            daftarIkon.forEach((data, indeks) => {
                const elemenMenu = document.createElement('div');
                elemenMenu.className = "menu-item";
                elemenMenu.setAttribute('data-indeks', indeks);

                const elemenAyun = document.createElement('a');
                elemenAyun.className = "orbit-wrapper";
                const kelasWarna = `color-${indeks % 10}`;
                elemenAyun.classList.add(kelasWarna);
                elemenAyun.href = data.link;

                const durasiAcak = (3.2 + (indeks * 0.2)).toFixed(1);
                const delayAcak = (indeks * 0.15).toFixed(2);
                elemenAyun.style.setProperty('--durasi-float', `${durasiAcak}s`);
                elemenAyun.style.setProperty('--delay-float', `-${delayAcak}s`);

                let namaIkonBersih = data.ikon.replace('fa-solid', '').replace('fa-', '').trim();
                elemenAyun.innerHTML = `<i class="fa-solid fa-${namaIkonBersih}"></i><span>${data.label}</span>`;
                
                elemenAyun.addEventListener('click', (e) => {
                    // Blokir aksi klik jika user sebenarnya sedang menggeser/drag menu
                    if (totalPergeseranPiksel > 7) {
                        e.preventDefault();
                        return;
                    }
                    e.preventDefault();
                    
                    const batasTombol = elemenAyun.getBoundingClientRect();
                    const pusatX = batasTombol.left + (batasTombol.width / 2);
                    const pusatY = batasTombol.top + (batasTombol.height / 2);

                    const gayaComputed = window.getComputedStyle(elemenAyun);
                    const warnaHex = gayaComputed.getPropertyValue('--neon').trim() || '#ffffff';

                    putarSuaraShockwave();
                    pemicuLedakanShockwave(pusatX, pusatY, warnaHex);
                    
                    elemenMenu.classList.add('move-to-center');
                    
                    setTimeout(() => {
                        if(data.label === "Pengaturan") {
                            panelPengaturan.classList.add('open');
                        } else if(data.link !== '#') {
                            window.location.href = data.link;
                        }
                    }, 550);

                    setTimeout(() => {
                        elemenMenu.classList.remove('move-to-center');
                    }, 1000);
                });

                elemenMenu.appendChild(elemenAyun);
                wadah.appendChild(elemenMenu);
            });
            
            // Hitung posisi koordinat X & Y awal
            perbaruiPosisiMenu();
            
            if(menuTampil) {
                document.querySelectorAll('.menu-item').forEach(menu => menu.classList.add('show'));
                orbitLine.classList.add('show');
            }
        }

        // === FUNGSI MATEMATIKA RE-RENDER KOORDINAT IKON BERDASARKAN SUDUT AKTIF ===
        function perbaruiPosisiMenu() {
            const elemenIkon = document.querySelectorAll('.menu-item');
            const jumlah = elemenIkon.length;
            if (jumlah === 0) return;

            const radiusLingkaran = 145;
            const sudutAwal = -90; // Memulai dari jam 12 tegak lurus

            elemenIkon.forEach((elemenMenu) => {
                const indeks = parseInt(elemenMenu.getAttribute('data-indeks'));
                // Tambahkan variabel 'sudutTambahan' hasil dari geseran tangan
                const sudut = sudutAwal + (indeks * (360 / jumlah)) + sudutTambahan;
                const radian = sudut * Math.PI / 180;
                
                const x = Math.round(radiusLingkaran * Math.cos(radian));
                const y = Math.round(radiusLingkaran * Math.sin(radian));

                elemenMenu.style.setProperty('--x', `${x}px`);
                elemenMenu.style.setProperty('--y', `${y}px`);
                
                // Terapkan translasi instan saat drag agar halus
                if (elemenMenu.classList.contains('show')) {
                    elemenMenu.style.transform = `translate(${x}px, ${y}px) scale(1)`;
                }
            });
        }

        function buatEditorIkon() {
            const wadah = document.getElementById("daftarEditorIkon");
            wadah.innerHTML = '';

            daftarIkon.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "item-menu-editor";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold">Ikon #${idx+1}</span>
                        <button class="btn-hapus" onclick="hapusIkon(${idx})">Hapus</button>
                    </div>
                    <input type="text" class="input-custom input-ikon" value="${item.ikon}">
                    <input type="text" class="input-custom input-label" value="${item.label}">
                    <input type="text" class="input-custom input-link" value="${item.link}">
                `;
                wadah.appendChild(div);
            });
        }

        function dapatkanDataDariEditor(){
            const dataBaru = [];
            document.querySelectorAll('.item-menu-editor').forEach(block => {
                const ikon = block.querySelector('.input-ikon').value || 'question';
                const label = block.querySelector('.input-label').value || 'Menu';
                const link = block.querySelector('.input-link').value || '#';
                dataBaru.push({ikon, label, link});
            });
            daftarIkon = dataBaru;
        }

        function hapusIkon(idx){
            if(daftarIkon.length <= 1) return alert("Minimal harus ada 1 ikon!");
            dapatkanDataDariEditor();
            daftarIkon.splice(idx, 1);
            buatEditorIkon();
        }

        document.getElementById('btnTambahIkon').addEventListener('click', () => {
            dapatkanDataDariEditor();
            daftarIkon.push({ikon: "star", label: "Baru", link: "#"});
            buatEditorIkon();
        });

        btnTutupPanel.addEventListener('click', () => { 
            panelPengaturan.classList.remove('open'); 
        });

        btnTerapkanBg.addEventListener('click', () => {
            dapatkanDataDariEditor();

            let urlGambar = bgUrlInput.value.trim();
            const warnaDipilih = colorPicker.value;
            const teksBaru = inputTeksBerputar.value;
            const logoBaru = inputLogoBaru.value.trim();

            if (urlGambar !== "") {
                document.body.style.backgroundImage = `url('${urlGambar}')`;
            } else {
                document.body.style.backgroundImage = "none";
                document.body.style.backgroundColor = warnaDipilih;
            }
            
            buatTeksBerputar(teksBaru);
            if (logoBaru) logoTujuan.src = logoBaru;

            buatMenuDinamis(); 
            simpanKeSheet(); 
            alert("✅ Pengaturan Tersimpan"); 

            panelPengaturan.classList.remove('open');
        });

        toggleMode.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            toggleMode.innerHTML = isDark ? '☀️' : '🌙';
        });
    </script>
</body>
