<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pembina Ekstrakurikuler - Eye Care Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f11; color: #cbd5e1; padding: 30px 20px; }
        .table-container { background: #141418; padding: 28px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #1f1f25; }
        
        h4 { font-weight: 700; letter-spacing: -0.5px; }
        .badge-lock { background-color: rgba(6, 182, 212, 0.1); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.25); padding: 6px 12px; border-radius: 6px; font-weight: 600; }
        
        .form-label { color: #868694; font-weight: 500; font-size: 13px; margin-bottom: 6px; }
        .form-select-custom { background-color: #1a1a22; color: #e2e8f0; border: 1px solid #2d2d39; border-radius: 10px; padding: 8px 12px; font-size: 14px; transition: all 0.2s; height: 42px; }
        .form-select-custom:focus { background-color: #20202a; border-color: #06b6d4; color: #fff; box-shadow: 0 0 0 3px rgba(6,182,212,0.2); outline: none; }
        
        .table { border-collapse: separate; border-spacing: 0 6px; margin-top: 15px; background-color: transparent !important; }
        
        .table thead th { 
            background-color: rgba(6, 182, 212, 0.15) !important; 
            color: #06b6d4 !important; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 14px; 
            text-align: center; 
            vertical-align: middle;
            letter-spacing: 1.2px; 
            padding: 16px 14px; 
            border: 1px solid rgba(6, 182, 212, 0.2) !important; 
            border-width: 1px 0 !important; 
        }
        .table thead th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-left: 1px solid rgba(6, 182, 212, 0.2) !important; }
        .table thead th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-right: 1px solid rgba(6, 182, 212, 0.2) !important; }
        
        .table tbody tr { background-color: #1a1a22 !important; transition: all 0.15s; }
        .table tbody tr:nth-of-type(even) { background-color: #1e1e27 !important; }
        .table tbody tr:hover { background-color: #262633 !important; transform: translateY(-1px); }
        
        .table tbody td { padding: 14px; color: #cbd5e1; border: none !important; vertical-align: middle; text-align: center; background: transparent !important; }
        .table tbody td.nama { text-align: left; font-weight: 600; color: #f8fafc; }
        
        .table tbody tr td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .table tbody tr td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        
        .select-nilai { width: 80px; margin: auto; font-weight: 700; text-align: center; background-color: #22222d; border: 1px solid #333345; color: #34d399; height: auto; }
        
        .btn-gradient-green { background: linear-gradient(135deg, #0891b2, #0e7490); color: white; border: none; border-radius: 10px; padding: 0 24px; font-weight: 600; box-shadow: 0 4px 15px rgba(14,116,144,0.25); transition: all 0.2s; height: 42px; display: flex; align-items: center; justify-content: center; }
        .btn-gradient-green:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(14,116,144,0.35); }
        .btn-gradient-green:disabled { background: #22222a; color: #52525b; box-shadow: none; cursor: not-allowed; }
        
        .btn-danger-custom { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: none; border-radius: 10px; padding: 0 24px; font-weight: 600; box-shadow: 0 4px 15px rgba(185,28,28,0.25); transition: all 0.2s; text-decoration: none; height: 42px; display: flex; align-items: center; justify-content: center; }
        .btn-danger-custom:hover { opacity: 0.95; transform: translateY(-1px); color: white; box-shadow: 0 6px 20px rgba(185,28,28,0.35); }

        .status-refresh { font-size: 12px; color: #64748b; margin-top: 5px; display: inline-block; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4 w-100">
            <div class="w-100">
                <h4 class="text-white mb-2" id="judulPanel">📋 Panel Pembina Ekskul</h4>
                <div class="mb-2">
                    <span class="status-refresh" id="refreshStatus"></span>
                </div>
                
                <div class="d-flex justify-content-between align-items-end w-100">
                    <div class="filter-container">
                        <label class="form-label">Ekstrakurikuler Pilihan :</label>
                        <select id="dropdownEkskul" class="form-select-custom" style="width: 200px;" onchange="gantiEkskul(this.value)">
                            <option value="Pencak Silat">Pencak Silat</option>
                            <option value="Drum Band">Drum Band</option>
                            <option value="Tari">Tari</option>
                            <option value="Futsal">Futsal</option>
                            <option value="Taekwondo">Taekwondo</option>
                        </select>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-gradient-green" id="btnSimpan" onclick="simpanKeSheets()" disabled>💾</button>
                        <button type="button" class="btn btn-danger-custom" id="btnKeluar" onclick="window.location.href='index.html'">🚪</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table text-light">
                <thead>
                    <tr>
                        <th style="width: 5%;">No</th>
                        <th style="width: 15%;">NIS</th>
                        <th style="width: 40%;">Nama Murid</th>
                        <th style="width: 10%;">L/P</th>
                        <th style="width: 15%;">Kelas</th>
                        <th style="width: 15%;">Nilai Huruf</th>
                    </tr>
                </thead>
                <tbody id="bodyInput">
                    <tr><td colspan="6" class="text-center text-muted py-5">Memuat data anggota...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPxCfRs117TPyQVJ_9otGqwVkZUj6YRE00wo7D1NxP51UkGcmefb1VGjhfFTtgfPLfvQ/exec";
    let dataMuridGlobal = [];
    let ekskulTerpilihGlobal = "";
    let isUserEditing = false;

    function muatDataAwal() {
        if (isUserEditing) return;

        if (!ekskulTerpilihGlobal) {
            const urlParams = new URLSearchParams(window.location.search);
            ekskulTerpilihGlobal = urlParams.get('ekskul') || "Pencak Silat";
            document.getElementById('dropdownEkskul').value = ekskulTerpilihGlobal;
        }

        document.getElementById('judulPanel').innerText = "📋 Ekstrakurikuler: " + ekskulTerpilihGlobal.toUpperCase();

        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            if (!isUserEditing) {
                dataMuridGlobal = data;
                renderTabel();
                document.getElementById('btnSimpan').disabled = false;
            }
        });
    }

    function gantiEkskul(nilaiBaru) {
        ekskulTerpilihGlobal = nilaiBaru;
        document.getElementById('judulPanel').innerText = "📋 Ekstrakurikuler: " + ekskulTerpilihGlobal.toUpperCase();
        renderTabel();
    }

    function renderTabel() {
        const tbody = document.getElementById('bodyInput');
        tbody.innerHTML = '';
        let nomorUrut = 1;

        dataMuridGlobal.forEach((murid) => {
            if (!murid.ekskul.includes(ekskulTerpilihGlobal)) return;

            const nilaiSiswaSaatIni = murid.nilaiMap[ekskulTerpilihGlobal] || "";
            tbody.innerHTML += `
                <tr>
                    <td style="color: #64748b; font-weight: 500;">${nomorUrut++}</td>
                    <td style="color: #94a3b8;">${murid.nis}</td>
                    <td class="nama">${murid.nama}</td>
                    <td><span class="badge ${murid.lp === 'L' ? 'bg-primary' : 'bg-danger'} bg-opacity-20 text-opacity-100 p-2" style="font-size:11px; width:24px;">${murid.lp}</span></td>
                    <td style="font-weight:600; color: #fbbf24;">${murid.kelas}</td>
                    <td>
                        <select class="form-select-custom select-nilai" data-idrow="${murid.nis}" onfocus="setEditing(true)" onblur="setEditing(false)">
                            <option value="" ${nilaiSiswaSaatIni === "" ? "selected" : ""}>-</option>
                            <option value="A" ${nilaiSiswaSaatIni === "A" ? "selected" : ""}>A</option>
                            <option value="B" ${nilaiSiswaSaatIni === "B" ? "selected" : ""}>B</option>
                            <option value="C" ${nilaiSiswaSaatIni === "C" ? "selected" : ""}>C</option>
                        </select>
                    </td>
                </tr>`;
        });

        if (nomorUrut === 1) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada murid di ekstrakurikuler ini.</td></tr>`;
        }
    }

    function setEditing(status) {
        isUserEditing = status;
        const statusText = document.getElementById('refreshStatus');
        if(status) {
            statusText.innerText = "⚠️ Auto-refresh dijeda karena Anda sedang memilih nilai...";
            statusText.style.color = "#06b6d4";
        } else {
            statusText.innerText = "";
            statusText.style.color = "#64748b";
        }
    }

    function simpanKeSheets() {
        isUserEditing = true;
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true; btn.innerText = "⏳ MENYIMPAN...";

        dataMuridGlobal.forEach((murid) => {
            const selectNilai = document.querySelector(`select.select-nilai[data-idrow="${murid.nis}"]`);
            if (selectNilai) {
                if (selectNilai.value !== "") murid.nilaiMap[ekskulTerpilihGlobal] = selectNilai.value;
                else delete murid.nilaiMap[ekskulTerpilihGlobal];
            }
        });

        fetch(SCRIPT_URL, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataMuridGlobal)
        }).then(() => {
            alert('Nilai Berhasil Diperbarui!');
            btn.disabled = false; btn.innerText = "💾";
            isUserEditing = false;
            setEditing(false);
            muatDataAwal();
        });
    }

    window.onload = function() {
        muatDataAwal();
        setInterval(muatDataAwal, 5000);
    };
</script>
</body>
</html>
