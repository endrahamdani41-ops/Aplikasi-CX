<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Piket Kelas - Editable</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #f5f5f5;
            --bg-container: #ffffff;
            --text-primary: #000000;
            --border-color: #cccccc;
            --header-bg: #2196F3;
            --header-border: #1976D2;
            --student-female: #d32f2f;
            --student-male: #000000;
            --input-bg: #e3f2fd;
            --shadow: rgba(0,0,0,0.1);
            --wali-color: #000000;
        }

        .dark-mode {
            --bg-primary: #1a1a2e;
            --bg-container: #16213e;
            --text-primary: #eaeaea;
            --border-color: #444444;
            --header-bg: #0f3460;
            --header-border: #16213e;
            --student-female: #ff6b6b;
            --student-male: #ffffff;
            --input-bg: #0f3460;
            --shadow: rgba(0,0,0,0.5);
            --wali-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-container);
            padding: 40px;
            box-shadow: 0 0 20px var(--shadow);
            position: relative;
            transition: background 0.3s ease;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; margin-bottom: 5px; color: var(--text-primary); }
        .header h2 { font-size: 20px; color: var(--text-primary); }

        .editable {
            border: 1px dashed var(--border-color);
            padding: 5px;
            min-height: 30px;
            display: inline-block;
            min-width: 200px;
            text-align: center;
            color: var(--text-primary);
        }

        .editable:focus { outline: none; border-color: #2196F3; background: var(--input-bg); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            overflow-x: auto;
            display: block;
        }

        thead { display: table; width: 100%; table-layout: fixed; }
        tbody { display: block; overflow-x: auto; }
        tbody tr { display: table; width: 100%; table-layout: fixed; }

        th {
            background: var(--header-bg);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border: 2px solid var(--header-border);
        }

        td { 
            border: 1px solid var(--border-color); 
            padding: 10px; 
            vertical-align: middle;
            /* Hapus height tetap agar bisa memanjang sesuai isi */
            height: auto; 
            min-height: 45px;
        }

        /* PERUBAHAN UTAMA: Nama Siswa Lengkap & Wrap */
        .student-name {
            color: var(--student-female);
            font-weight: 500;
            padding: 5px;
            border: 1px dashed transparent;
            
            /* Membiarkan teks turun ke bawah (wrap) */
            white-space: normal; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
            display: block;
            line-height: 1.3; /* Jarak antar baris jika nama panjang */
        }

        .student-name.male { color: var(--student-male); }
        
        .student-name:hover { 
            border-color: var(--border-color); 
            background: var(--input-bg); 
            cursor: pointer; 
        }
        
        .student-name:focus { 
            outline: none; 
            border-color: #2196F3; 
            background: var(--bg-container); 
            z-index: 10;
            position: relative;
        }

        .top-buttons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .icon-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 8px var(--shadow); }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .icon-btn.import { background: #ff9800; }
        .icon-btn.import:hover { background: #f57c00; }
        .icon-btn.import.active { background: #e65100; box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.4); }

        .icon-btn.sync { background: #009688; }
        .icon-btn.sync:hover { background: #00796b; }
        .icon-btn.sync.loading { background: #80cbc4; cursor: wait; }

        .icon-btn.load { background: #3f51b5; }
        .icon-btn.load:hover { background: #303f9f; }
        .icon-btn.load.loading { background: #9fa8da; cursor: wait; }

        .icon-btn.print { background: #4CAF50; }
        .icon-btn.print:hover { background: #388E3C; }

        .icon-btn.delete { background: #f44336; }
        .icon-btn.delete:hover { background: #d32f2f; }

        .icon-btn.dark-mode { background: #6c5ce7; }
        .icon-btn.dark-mode:hover { background: #5b4cdb; }

        .footer {
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .footer-line { margin: 10px 0; width: 300px; text-align: center; }
        .footer-line strong {
            display: block;
            text-align: center;
            color: var(--wali-color);
            transition: color 0.3s ease;
        }

        .footer-input {
            border: 1px dashed var(--border-color);
            padding: 5px;
            display: inline-block;
            width: 100%;
            text-align: center;
            color: var(--text-primary);
        }

        .footer-input:focus { outline: none; border-color: #2196F3; }

        .import-area {
            display: none;
            margin: 20px 0;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 8px;
            border: 2px solid var(--border-color);
            animation: slideDown 0.3s ease;
        }

        .import-area.show { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .area-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .area-header span { font-weight: bold; color: var(--text-primary); font-size: 14px; }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-primary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .close-btn:hover { background: rgba(0,0,0,0.1); }
        .dark-mode .close-btn:hover { background: rgba(255,255,255,0.1); }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
            background: var(--bg-container);
            color: var(--text-primary);
            resize: vertical;
        }

        textarea:focus { outline: none; border-color: #2196F3; }

        .btn-row { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-import { background: #ff9800; }
        .btn-import:hover { background: #f57c00; }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }

        .status-msg.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-msg.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .dark-mode .status-msg.success { background: #1e4620; color: #a8e6b0; border-color: #2d6a30; }
        .dark-mode .status-msg.error { background: #4a1a1d; color: #f5a0a5; border-color: #6a2528; }

        .day-column { width: 20%; }

        .confirm-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }

        .confirm-overlay.show { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .confirm-dialog {
            background: var(--bg-container);
            border-radius: 12px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .confirm-dialog h3 { color: var(--text-primary); margin-bottom: 10px; font-size: 18px; }
        .confirm-dialog p { color: var(--text-primary); margin-bottom: 20px; font-size: 14px; line-height: 1.5; }

        .confirm-options { display: flex; flex-direction: column; gap: 10px; }

        .confirm-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            transition: transform 0.15s, opacity 0.15s;
        }

        .confirm-btn:hover { transform: translateY(-1px); opacity: 0.9; }
        .confirm-btn.both { background: #f44336; }
        .confirm-btn.browser { background: #ff9800; }
        .confirm-btn.sheet { background: #ff5722; }
        .confirm-btn.cancel { background: #757575; }

        @media print {
            .top-buttons, .import-area, .confirm-overlay { display: none !important; }
            .editable, .student-name, .footer-input { border: none !important; background: transparent !important; }
            body { background: white; }
            .container { box-shadow: none; }
            .footer-line strong { color: #000 !important; }
            .student-name.male { color: #000 !important; }
        }

        @media screen and (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px 15px; }
            .header h1 { font-size: 18px; }
            .header h2 { font-size: 16px; }
            .top-buttons { position: static; margin-bottom: 20px; justify-content: center; }
            .icon-btn { width: 45px; height: 45px; font-size: 20px; }
            th { padding: 10px 5px; font-size: 12px; }
            td { padding: 8px 5px; font-size: 13px; }
            .footer-line { width: 220px; }
        }

        @media screen and (max-width: 480px) {
            .container { padding: 15px 10px; }
            .header h1 { font-size: 16px; }
            .header h2 { font-size: 14px; }
            .top-buttons { gap: 5px; }
            .icon-btn { width: 40px; height: 40px; font-size: 18px; }
            th { padding: 8px 3px; font-size: 11px; }
            td { padding: 6px 3px; font-size: 12px; }
            .student-name { font-size: 11px; }
            .footer-line { width: 180px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-buttons">
            <button onclick="toggleImport()" class="icon-btn import" id="importBtn" title="Import Siswa">📥</button>
            <button onclick="syncToSheet()" class="icon-btn sync" id="syncBtn" title="Simpan ke Google Sheet">️💾</button>
            <button onclick="loadFromSheet()" class="icon-btn load" id="loadBtn" title="Load dari Google Sheet">📂</button>
            <button onclick="showDeleteConfirm()" class="icon-btn delete" title="Hapus Data">🗑️</button>
            <button onclick="window.print()" class="icon-btn print" title="Cetak">🖨️</button>
            <button onclick="toggleDarkMode()" class="icon-btn dark-mode" title="Mode Gelap/Terang">🌙</button>
        </div>

        <div class="header">
            <h1 contenteditable="true" class="editable" id="title1">JADWAL PIKET KELAS</h1><br>
            <h2 contenteditable="true" class="editable" id="title2">TAHUN PELAJARAN 2026-2027</h2>
        </div>

        <div class="import-area" id="importArea">
            <div class="area-header">
                <span>📥 Import Daftar Nama Siswa</span>
                <button class="close-btn" onclick="toggleImport()">✕</button>
            </div>
            <textarea id="importData" placeholder="Paste daftar nama di sini (format: NAMA L atau NAMA P)"></textarea>
            <div class="btn-row">
                <button class="btn btn-import" onclick="importNames()">✔️ Proses Import</button>
            </div>
        </div>

        <table id="scheduleTable">
            <thead>
                <tr>
                    <th class="day-column">SENIN</th>
                    <th class="day-column">SELASA</th>
                    <th class="day-column">RABU</th>
                    <th class="day-column">KAMIS</th>
                    <th class="day-column">JUMAT</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div id="statusMsg" class="status-msg"></div>

        <div class="footer">
            <div class="footer-line">
                <span contenteditable="true" class="footer-input" id="footer1">JAKARTA, 15-09-2026</span>
            </div>
            <div class="footer-line">
                <strong>WALI KELAS</strong>
            </div>
            <div class="footer-line" style="margin-top: 60px;">
                <span contenteditable="true" class="footer-input" id="footer2">_________________________</span>
            </div>
        </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <h3>⚠️ Hapus Data</h3>
            <p>Pilih lokasi data yang ingin dihapus:</p>
            <div class="confirm-options">
                <button class="confirm-btn both" onclick="deleteBoth()">🗑️ Hapus Browser & Sheet</button>
                <button class="confirm-btn browser" onclick="deleteBrowserOnly()">📱 Hapus Browser Saja</button>
                <button class="confirm-btn sheet" onclick="deleteSheetOnly()">📄 Hapus Sheet Saja</button>
                <button class="confirm-btn cancel" onclick="closeConfirm()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyqNJ163zd2FhAplQdSmAhskFKR6oFq2io6likf1qsRhOGiTPww9-aWzOiH2uCpnwWY6A/exec';

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }

        window.onload = function() {
            if (!localStorage.getItem('scheduleData')) {
                for (let i = 0; i < 5; i++) addRow();
            } else {
                loadDataLocal();
            }
        };

        function showStatus(message, type = 'success') {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = message;
            statusMsg.className = 'status-msg ' + type;
            setTimeout(() => { statusMsg.className = 'status-msg'; }, 4000);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }

        function toggleImport() {
            const area = document.getElementById('importArea');
            const btn = document.getElementById('importBtn');
            area.classList.toggle('show');
            btn.classList.toggle('active');
            if (area.classList.contains('show')) {
                setTimeout(() => document.getElementById('importData').focus(), 100);
            }
        }

        function addRow() {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            for (let i = 0; i < 5; i++) {
                const td = document.createElement('td');
                const div = document.createElement('div');
                div.className = 'student-name';
                div.contentEditable = true;
                // Set title attribute untuk tooltip saat hover
                div.oninput = function() { this.title = this.innerText; };
                td.appendChild(div);
                row.appendChild(td);
            }
            tbody.appendChild(row);
        }

        function importNames() {
            const text = document.getElementById('importData').value.trim();
            if (!text) { showStatus('Silakan paste data nama terlebih dahulu!', 'error'); return; }
            importNamesFromText(text);
        }

        function importNamesFromText(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const females = [], males = [];

            lines.forEach(line => {
                const parts = line.trim().split(/\s+/);
                const gender = parts.pop().toUpperCase();
                const name = parts.join(' ');
                if (gender === 'P') females.push(name);
                else if (gender === 'L') males.push(name);
            });

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const columns = [[], [], [], [], []];
            let colIndex = 0;

            females.forEach(name => { columns[colIndex].push({name, gender: 'P'}); colIndex = (colIndex + 1) % 5; });
            males.forEach(name => { columns[colIndex].push({name, gender: 'L'}); colIndex = (colIndex + 1) % 5; });

            const maxRows = Math.max(...columns.map(col => col.length));

            for (let rowIndex = 0; rowIndex < maxRows; rowIndex++) {
                const row = document.createElement('tr');
                for (let colIndex = 0; colIndex < 5; colIndex++) {
                    const td = document.createElement('td');
                    const div = document.createElement('div');
                    div.className = 'student-name';
                    div.contentEditable = true;
                    if (rowIndex < columns[colIndex].length) {
                        div.textContent = columns[colIndex][rowIndex].name;
                        div.title = columns[colIndex][rowIndex].name; // Tooltip nama lengkap
                        if (columns[colIndex][rowIndex].gender === 'L') div.classList.add('male');
                    }
                    td.appendChild(div);
                    row.appendChild(td);
                }
                tbody.appendChild(row);
            }

            document.getElementById('importData').value = '';
            toggleImport();
            showStatus(`Berhasil: ${females.length} Perempuan, ${males.length} Laki-laki`);
        }

        function showDeleteConfirm() { document.getElementById('confirmOverlay').classList.add('show'); }
        function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('show'); }
        document.getElementById('confirmOverlay').addEventListener('click', function(e) { if (e.target === this) closeConfirm(); });

        async function deleteBoth() { closeConfirm(); deleteFromBrowser(); await deleteFromSheet(); }
        function deleteBrowserOnly() { closeConfirm(); deleteFromBrowser(); }
        function deleteSheetOnly() { closeConfirm(); deleteFromSheet(); }

        function deleteFromBrowser() {
            localStorage.removeItem('scheduleData');
            document.getElementById('tableBody').innerHTML = '';
            for (let i = 0; i < 5; i++) addRow();
            showStatus('✅ Data di browser berhasil dihapus!');
        }

        async function deleteFromSheet() {
            const deleteBtn = document.querySelector('.icon-btn.delete');
            deleteBtn.classList.add('loading');
            deleteBtn.disabled = true;

            try {
                await fetch(SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'clear' })
                });
                showStatus('✅ Data di Google Sheet berhasil dihapus!');
            } catch (error) {
                showStatus('❌ Gagal hapus di Sheet: ' + error.message, 'error');
            } finally {
                deleteBtn.classList.remove('loading');
                deleteBtn.disabled = false;
            }
        }

        async function syncToSheet() {
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.classList.add('loading');
            syncBtn.disabled = true;

            const data = {
                action: 'save',
                title1: document.getElementById('title1').innerText,
                title2: document.getElementById('title2').innerText,
                footer1: document.getElementById('footer1').innerText,
                footer2: document.getElementById('footer2').innerText,
                rows: []
            };

            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const rowData = [];
                const cells = row.querySelectorAll('.student-name');
                cells.forEach(cell => {
                    rowData.push({ text: cell.innerText, isMale: cell.classList.contains('male') });
                });
                data.rows.push(rowData);
            });

            try {
                await fetch(SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data)
                });

                showStatus('✅ Data berhasil dikirim ke Google Sheet!');
                localStorage.setItem('scheduleData', JSON.stringify(data));
            } catch (error) {
                showStatus('❌ Gagal menyimpan: ' + error.message, 'error');
            } finally {
                syncBtn.classList.remove('loading');
                syncBtn.disabled = false;
            }
        }

        async function loadFromSheet() {
            const loadBtn = document.getElementById('loadBtn');
            loadBtn.classList.add('loading');
            loadBtn.disabled = true;

            try {
                const response = await fetch(SHEET_URL + '?action=load');
                
                // Cek apakah response adalah JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error('URL Sheet tidak valid. Response bukan JSON.');
                }
                
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    document.getElementById('title1').innerText = data.title1 || 'JADWAL PIKET KELAS';
                    document.getElementById('title2').innerText = data.title2 || 'TAHUN PELAJARAN 2026-2027';
                    document.getElementById('footer1').innerText = data.footer1 || 'JAKARTA, 15-09-2026';
                    document.getElementById('footer2').innerText = data.footer2 || '_________________________';

                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';

                    if (data.rows && data.rows.length > 0) {
                        data.rows.forEach(rowData => {
                            const row = document.createElement('tr');
                            rowData.forEach(cellData => {
                                const td = document.createElement('td');
                                const div = document.createElement('div');
                                div.className = 'student-name';
                                div.contentEditable = true;
                                div.innerText = cellData.text || '';
                                div.title = cellData.text || ''; // Tooltip nama lengkap
                                if (cellData.isMale) div.classList.add('male');
                                td.appendChild(div);
                                row.appendChild(td);
                            });
                            tbody.appendChild(row);
                        });
                    }

                    localStorage.setItem('scheduleData', JSON.stringify({
                        title1: data.title1, title2: data.title2,
                        footer1: data.footer1, footer2: data.footer2,
                        rows: data.rows
                    }));

                    showStatus(`✅ Berhasil load dari Sheet! (${data.rows.length} baris)`);
                } else {
                    showStatus('❌ Gagal load: ' + (result.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Load error:', error);
                showStatus('❌ Gagal load: URL Sheet tidak valid atau tidak bisa diakses.', 'error');
            } finally {
                loadBtn.classList.remove('loading');
                loadBtn.disabled = false;
            }
        }

        function loadDataLocal() {
            const saved = localStorage.getItem('scheduleData');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('title1').innerText = data.title1 || '';
                document.getElementById('title2').innerText = data.title2 || '';
                document.getElementById('footer1').innerText = data.footer1 || '';
                document.getElementById('footer2').innerText = data.footer2 || '';

                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                if (data.rows && data.rows.length > 0) {
                    data.rows.forEach(rowData => {
                        const row = document.createElement('tr');
                        rowData.forEach(cellData => {
                            const td = document.createElement('td');
                            const div = document.createElement('div');
                            div.className = 'student-name';
                            div.contentEditable = true;
                            if (typeof cellData === 'object') {
                                div.innerText = cellData.text || '';
                                div.title = cellData.text || ''; // Tooltip nama lengkap
                                if (cellData.isMale) div.classList.add('male');
                            } else {
                                div.innerText = cellData || '';
                                div.title = cellData || '';
                            }
                            td.appendChild(div);
                            row.appendChild(td);
                        });
                        tbody.appendChild(row);
                    });
                }
            }
        }
    </script>
</body>
</html>
