<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-ARSIP</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --card-bg: #ffffff;
    --text-color: #333333;
    --text-muted: #666666;
    --border-color: #e0e0e0;
    --upload-bg: #f8f9ff;
    --upload-hover: #eef0ff;
    --shadow: rgba(0,0,0,0.15);
  }

  body.dark-mode {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --card-bg: #1e293b;
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --upload-bg: #0f172a;
    --upload-hover: #1e293b;
    --shadow: rgba(0,0,0,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    background: var(--bg-gradient);
    min-height: 100vh;
    color: var(--text-color);
    padding: 15px;
    transition: background 0.3s;
  }
  .container { max-width: 800px; margin: 0 auto; }
  
  header { 
    text-align: center; 
    color: white; 
    padding: 15px 0 25px 0; 
    position: relative;
  }
  header h1 { font-size: 2rem; margin-bottom: 5px; }

  .theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(5px);
    font-weight: 600;
    font-size: 0.85rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px var(--shadow);
  }

  .upload-area {
    border: 3px dashed #667eea;
    border-radius: 12px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    background: var(--upload-bg);
  }
  .upload-area:hover { background: var(--upload-hover); }
  .upload-area .icon { font-size: 2.5rem; margin-bottom: 8px; }

  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-color);
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-color);
    border-radius: 8px;
    margin-bottom: 15px;
  }

  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
  }

  .btn-icon {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .btn-icon.danger { background: #e74c3c; color: white; }

  /* DEFAULT 2 KOLOM UNTUK HP */
  .cert-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  /* OTOMATIS MENYESUAIKAN JIKA DIBUKA DI TABLET / LAPTOP */
  @media (min-width: 600px) {
    .cert-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }
  }

  .cert-card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 12px var(--shadow);
    border: 1px solid var(--border-color);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  
  .cert-thumb {
    width: 100%;
    height: 120px;
    background: var(--upload-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 2rem;
    position: relative;
  }

  .cert-actions-top {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 10;
  }

  .cert-info { 
    padding: 10px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .cert-info h3 {
    font-size: 0.85rem;
    line-height: 1.25;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cert-info small {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 3000;
    color: white;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .loading.active { display: flex; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translate(-50%, 150px);
    background: #2ecc71;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    transition: transform 0.3s;
    z-index: 2000;
    max-width: 90vw;
    font-size: 0.85rem;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.error { background: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <header>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    <h1>📜 E-ARSIP</h1>
  </header>

  <div class="card">
    <h2 style="margin-bottom: 12px; font-size: 1.2rem;">➕ Upload Arsip</h2>
    <div class="upload-area" id="uploadArea">
      <div class="icon">📁</div>
      <p style="font-size: 0.9rem;">Pilih Arsip</p>
      <input type="file" id="fileInput" accept="image/*,application/pdf" hidden />
      <p id="fileName" style="margin-top:8px; color:#667eea; font-weight:600; font-size:0.85rem; word-break:break-all;"></p>
    </div>

    <div style="margin-top: 12px;">
      <div class="form-group">
        <input type="text" id="certName" placeholder="Masukkan Nama Arsip" />
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn">☁️ Upload ke Sheet</button>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 12px; font-size: 1.2rem;">📚 Arsip Tersimpan</h2>
    <div id="certList" class="cert-grid"></div>
  </div>
</div>

<div class="loading" id="loading">
  <div style="font-size: 2.5rem; margin-bottom: 10px;">⏳</div>
  <h3>Mengunggah arsip ke Sheet !</h3>
</div>

<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8f-2vC3dgahFN_6c6aRQhhXEnldSFM5XleXJW8Ij2oaNSMSA_MQ7q1c3lSW7W-OblvQ/exec";

const themeToggle = document.getElementById('themeToggle');
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark-mode');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('darkMode', isDark);
  themeToggle.textContent = isDark ? '☀️' : '🌙';
});

let selectedFile = null;
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');

uploadArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) {
    selectedFile = e.target.files[0];
    fileNameEl.textContent = `✓ ${selectedFile.name}`;
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = error => reject(error);
  });
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = document.getElementById('certName').value.trim();

  if (!name || !selectedFile) return showToast('Nama dan File wajib diisi!', true);

  showLoading(true);

  try {
    const base64Data = await fileToBase64(selectedFile);
    
    const formData = new URLSearchParams();
    formData.append('action', 'upload');
    formData.append('nama', name);
    formData.append('namaFile', selectedFile.name);
    formData.append('tipeFile', selectedFile.type);
    formData.append('fileBase64', base64Data);

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: formData.toString()
    });
    
    const result = await res.json();
    if(result.status === 'success') {
      showToast('Berhasil diunggah ke Cloud!');
      resetForm();
      loadCloudData();
    } else {
      showToast('Gagal: ' + result.message, true);
    }
  } catch (err) {
    showToast('Terjadi kesalahan koneksi', true);
    console.error(err);
  } finally {
    showLoading(false);
  }
});

async function loadCloudData() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=get`, {
      method: 'GET',
      redirect: 'follow'
    });
    const data = await res.json();
    renderCerts(data);
  } catch (err) {
    console.error('Gagal mengambil data:', err);
  }
}

function renderCerts(certs) {
  const list = document.getElementById('certList');
  if (!certs || certs.length === 0) {
    list.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding: 20px 0;">Belum ada arsip di Sheet !</p>';
    return;
  }

  list.innerHTML = certs.map(c => `
    <div class="cert-card">
      <div class="cert-thumb" onclick="window.open('${c.fileUrl}', '_blank')">
        ${c.tipeFile && c.tipeFile.startsWith('image/') 
          ? `<img src="${c.fileUrl}" style="width:100%; height:100%; object-fit:cover;">` 
          : '📄'}
        <div class="cert-actions-top" onclick="event.stopPropagation()">
          <button class="btn-icon danger" onclick="deleteCloudData('${c.id}')" title="Hapus">🗑</button>
        </div>
      </div>
      <div class="cert-info">
        <h3><a href="${c.fileUrl}" target="_blank" style="color:inherit; text-decoration:none;">${c.nama}</a></h3>
        <small style="color:var(--text-muted);">${c.tanggal}</small>
      </div>
    </div>
  `).join('');
}

async function deleteCloudData(id) {
  if (!confirm('Yakin hapus dari Sheet ?')) return;
  
  showLoading(true);
  try {
    const formData = new URLSearchParams();
    formData.append('action', 'delete');
    formData.append('id', id);

    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: formData.toString()
    });
    
    const result = await res.json();
    if(result.status === 'success') {
      showToast('Arsip berhasil dihapus !');
      loadCloudData();
    } else {
      showToast('Gagal menghapus: ' + result.message, true);
    }
  } catch(err) {
    showToast('Gagal menghapus', true);
  } finally {
    showLoading(false);
  }
}

function resetForm() {
  selectedFile = null;
  fileNameEl.textContent = '';
  fileInput.value = '';
  document.getElementById('certName').value = '';
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

function showLoading(show) {
  document.getElementById('loading').className = 'loading' + (show ? ' active' : '');
}

loadCloudData();
</script>
</body>
</html>
