<html lang="id">
<head>

    <style>
        /* TAMPILAN UMUM (DARK MODE) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.4;
            margin: 0;
            padding: 15px;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .container {
            max-width: 1350px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 12px;
        }
        h1, h2, h3 {
            text-align: center;
            color: #f8fafc;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .divider {
            border-top: 3px double #475569;
            margin: 15px 0;
        }
        .profil-guru {
            margin-bottom: 15px;
            background: #334155;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        
        /* Susunan Grid Utama Desktop */
        .profil-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .form-group {
            display: flex;
            align-items: center;
        }
        .form-group label {
            width: 150px;
            font-weight: bold;
            color: #cbd5e1;
        }
        .form-group input, .form-group select {
            flex: 1;
            padding: 8px;
            border: 1px solid #475569;
            border-radius: 4px;
            font-size: 14px;
            background-color: #1e293b;
            color: #f8fafc;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Pembungkus Tabel Desktop */
        .table-responsive {
            width: 100%;
            margin: 12px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #475569;
            padding: 6px;
            font-size: 14px;
            vertical-align: top;
        }
        th {
            background-color: #0f172a;
            color: #fff;
            text-align: center;
            font-weight: 600;
        }
        td input, td textarea, td select {
            width: 100%;
            border: 1px solid transparent;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            color: #e2e8f0;
        }
        td select option, .form-group select option {
            background-color: #1e293b;
            color: #e2e8f0;
        }
        td input:focus, td textarea:focus, td select:focus {
            border: 1px solid #3498db;
            background: #334155;
            outline: none;
            border-radius: 4px;
        }
        .center-input {
            text-align: center;
        }
        .ceklis-jam-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
            padding: 2px;
            justify-content: center;
        }
        .jam-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            background: #334155;
            color: #cbd5e1;
            padding: 2px 1px;
            border-radius: 4px;
            border: 1px solid #475569;
            cursor: pointer;
            user-select: none;
        }
        .jam-item input[type="checkbox"] {
            width: auto;
            margin-right: 2px;
            cursor: pointer;
        }
        .jam-item:hover {
            background: #475569;
        }
        .refleksi-container {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .refleksi-container textarea {
            width: 100%;
            height: 65px;
            margin-top: 4px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #475569;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #334155;
            color: #f8fafc;
        }
        .ttd-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            page-break-inside: avoid;
            gap: 20px;
        }
        .ttd-box {
            text-align: center;
            width: 280px;
            color: #cbd5e1;
            line-height: 1.3;
        }
        .ttd-box input {
            text-align: center;
            font-weight: bold;
            border: none !important;
            padding: 3px;
            width: 100%;
            background: transparent;
            color: #f8fafc;
        }
        .ttd-box input:focus {
            outline: none;
        }
        .space-ttd {
            height: 50px;
        }
        .menu-kontrol {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border: 1px solid #475569;
            gap: 10px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-print { background-color: #2ecc71; color: white; }
        .btn-print:hover { background-color: #27ae60; }
        .btn-save { background-color: #f39c12; color: white; }
        .btn-save:hover { background-color: #d35400; }
        .btn-save:disabled { background-color: #64748b; cursor: not-allowed; }
        .btn-add { background-color: #3498db; color: white; margin-bottom: 8px; padding: 6px 14px; font-size: 13px; }
        .btn-add:hover { background-color: #2980b9; }

        /* UKURAN KOLOM DESKTOP */
        .col-no { width: 3%; text-align: center; }
        .col-hari { width: 14%; white-space: nowrap; }
        .col-jam { width: 8%; text-align: center; }
        .col-kelas { width: 6%; text-align: center; }
        .col-pert { width: 6%; text-align: center; }
        .col-tp { width: 20%; }
        .col-materi { width: 20%; }
        .col-absensi { width: 10%; }
        .col-refleksi { width: 16%; }

        .print-text-wrap {
            display: none;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.3;
            font-size: 13px;
            text-align: left;
        }

        /* SUSUNAN KHUSUS LAYAR HP (RESPONSIVE TOTAL) */
        @media screen and (max-width: 768px) {
            body { padding: 8px; }
            .container { padding: 12px; }
            h1 { font-size: 18px; }
            h2 { font-size: 16px; }
            h3 { font-size: 13px; }
            
            .menu-kontrol {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
            
            /* MEMBUAT PROFIL GURU (NAMA, NIP, MAPEL, SEMESTER) BERURUTAN KE BAWAH DI HP */
            .profil-grid { 
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .form-group { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 5px; 
            }
            .form-group label { 
                width: 100%; 
                font-size: 13px;
                color: #3498db;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            /* Mengubah struktur baris tabel menjadi kartu vertikal */
            table, thead, tbody, th, td, tr { 
                display: block; 
                width: 100% !important;
                box-sizing: border-box;
            }
            thead { 
                display: none; 
            }
            tr {
                background: #334155;
                margin-bottom: 20px;
                border-radius: 8px;
                border: 2px solid #475569;
                padding: 12px;
            }
            td {
                border: none;
                border-bottom: 1px dashed #475569;
                padding: 6px 0 6px 0 !important;
                text-align: left;
                box-sizing: border-box;
                margin-bottom: 8px;
            }
            td:last-child {
                border-bottom: none;
                margin-bottom: 0;
            }
            
            /* Penanda Judul Kolom Menurun */
            td::before {
                display: block;
                font-weight: bold;
                color: #3498db;
                font-size: 12px;
                margin-bottom: 4px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            td.col-no::before { content: "🔢 Baris Ke"; }
            td.col-hari::before { content: "📅 Hari / Tanggal"; }
            td.col-jam::before { content: "⏰ Jam Ke- (Ceklis)"; }
            td.col-kelas::before { content: "🏫 Kelas"; }
            td.col-pert::before { content: "🔄 Pertemuan Ke"; }
            td.col-tp::before { content: "🎯 Tujuan Pembelajaran (TP)"; }
            td.col-materi::before { content: "📚 Materi Pokok"; }
            td.col-absensi::before { content: "📝 Absensi (S/I/A)"; }
            td.col-refleksi::before { content: "💡 Refleksi / Catatan"; }

            td input, td select, td textarea {
                background: #1e293b !important;
                border: 1px solid #475569 !important;
                border-radius: 6px !important;
                padding: 8px !important;
                width: 100% !important;
                display: block;
                color: #f8fafc !important;
            }
            .ceklis-jam-container {
                grid-template-columns: repeat(4, 1fr);
                background: #1e293b;
                padding: 6px;
                border-radius: 6px;
                border: 1px solid #475569;
            }
            .ttd-container {
                flex-direction: column;
                align-items: center;
                gap: 25px;
            }
            .ttd-box { width: 100%; }
        }

        /* FORMAT PRINT / CETAK LAPORAN (OTOMATIS HORIZONTAL KEMBALI) */
        @media print {
            body { padding: 0; background: #fff !important; color: #000 !important; }
            .container { box-shadow: none; padding: 0; max-width: 100%; background: #fff !important; }
            .menu-kontrol, .btn-add { display: none !important; }
            h1, h2, h3 { color: #000 !important; }
            .divider { border-top: 3px double #000 !important; }
            
            table { display: table !important; border: 1px solid #000 !important; table-layout: auto; width: 100% !important; }
            thead { display: table-header-group !important; }
            tbody { display: table-row-group !important; }
            tr { display: table-row !important; background: transparent !important; border: none !important; padding: 0 !important; }
            td { display: table-cell !important; border: 1px solid #000 !important; padding: 5px !important; width: auto !important; }
            td::before { display: none !important; }
            
            th { display: table-cell !important; background-color: #f1f5f9 !important; color: #000 !important; border: 1px solid #000 !important; }
            td input, td textarea, td select { border: none !important; background: transparent !important; color: #000 !important; appearance: none; -webkit-appearance: none; }
            
            td select.cp, td select.mat { display: none !important; }
            .print-text-wrap { display: block !important; }

            input::placeholder, textarea::placeholder { color: transparent !important; }
            .profil-guru { background: transparent !important; border: none !important; padding: 0; margin-bottom: 10px; }
            .profil-guru label { color: #000 !important; }
            
            /* Kembalikan tampilan profil jadi grid horizontal saat diprint */
            .profil-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
            .form-group { flex-direction: row !important; align-items: center !important; }
            .form-group label { width: 150px !important; color: #000 !important; }

            .profil-guru input, .profil-guru select { border: none !important; background: transparent !important; color: #000 !important; appearance: none; -webkit-appearance: none; }
            .refleksi-container { background: transparent !important; border: 1px solid #000 !important; padding: 10px; }
            .refleksi-container textarea { background: transparent !important; border: 1px solid #000 !important; color: #000 !important; height: 55px; }
            
            .ttd-container { margin-top: 20px; flex-direction: row !important; justify-content: space-between !important; }
            .ttd-box { color: #000 !important; width: 280px !important; }
            .ttd-box input { color: #000 !important; border: none !important; }
            .ceklis-jam-container { display: none !important; }
            .print-jam-text { display: block !important; text-align: center; font-weight: bold; font-size: 13px; }
        }
        .print-jam-text { display: none; }
    </style>
</head>

            <option value="Memahami pemanfaatan perangkat teknologi pengolah lembar kerja; menggunakan fungsi dasar statistik untuk mengolah data.">Pert. 2: Formula dan Fungsi Dasar SUM, AVERAGE, MAX, MIN (Bab 6)</option>
            <option value="Memahami pemanfaatan perangkat teknologi pengolah lembar kerja; menggunakan logika komputasional untuk penyaringan data.">Pert. 3: Fungsi Logika IF dan Fitur Sort - Filter Data (Bab 6)</option>
            <option value="Menerapkan keterampilan analisis data untuk menyelesaikan studi kasus secara mandiri, bernalar kritis, dan berkolaborasi.">Pert. 4: Studi Kasus Analisis Data Lembar Kerja (Bab 6)</option>
            <option value="Memahami konsep elemen visual pengembangan visual pemrograman; mengenali lingkungan pemrograman blok.">Pert. 5: Konsep Pemrograman Blok, Antarmuka Scratch & Sprite (Bab 7)</option>
            <option value="Menerapkan berpikir komputasional dalam menyusun logika sekuensial instruksi program langkah-demi-langkah.">Pert. 6: Logika Sekuensial Instruksi & Event Handling Scratch (Bab 7)</option>
            <option value="Memahami struktur kontrol keputusan dan perulangan dalam pemrograman blok visual.">Pert. 7: Kontrol Perulangan (Looping) dan Percabangan IF-Then (Bab 7)</option>
            <option value="Mampu menghasilkan karya digital kreatif berupa artefak komputasional (game/animasi) terstruktur.">Pert. 8: Proyek Mini Pembuatan Game/Animasi Kreatif Interaktif (Bab 7)</option>
            <option value="Murid mampu menjelaskan perkembangan Teknologi Informasi dan Komunikasi (TIK) serta menganalisis dampak positif dan negatifnya dalam kehidupan masyarakat.">Pert. 9: Perkembangan TIK serta Dampak Positif & Negatifnya (Bab 8)</option>
            <option value="Murid mampu menjelaskan konsep kolaborasi maya dan media sosial, serta menerapkan etika berkomunikasi digital yang baik dan bertanggung jawab.">Pert. 10: Ruang Kolaborasi Maya, Media Sosial & Etika Netizen (Bab 8)</option>
            <option value="Murid mampu mengidentifikasi serta memilah informasi pribadi yang harus dilindungi (privat) dan dipublikasikan, serta memahami pentingnya rekam jejak digital.">Pert. 11: Keamanan Informasi Data Pribadi & Hukum Privasi Digital (Bab 8)</option>
            <option value="Murid mampu bekerja sama dalam kelompok secara kolaboratif guna mengintegrasikan berbagai pengetahuan informatika untuk menyelesaikan studi kasus atau masalah nyata.">Pert. 12: PLB - Kerja Kelompok & Analisis Studi Kasus Nyata (Bab 9)</option>
            <option value="Murid mampu merancang, memprogram, mengembangkan, serta melakukan debugging (pengujian) pada sebuah proyek artefak komputasional sederhana.">Pert. 13: PLB - Perancangan & Pembuatan Proyek Artefak Komputasional (Bab 9)</option>
            <option value="Murid mampu mempresentasikan hasil proyek artefak komputasional kelompok dengan baik serta memberikan umpan balik (review) yang membangun kepada karya teman.">Pert. 14: PLB - Presentasi Hasil Karya Kelompok & Evaluasi Akhir (Bab 9)</option>
        `;

        const opsiDropdownMateri = `
            <option value="">-</option>
            <option value="Mengenal Data, Analisis Data, dan Perkakas Pengolah Lembar Kerja (Cell, Row, Column, Worksheet)">Pert. 1: Mengenal Data & Perkakas Pengolah Lembar Kerja</option>
            <option value="Formula dan Fungsi Dasar (SUM, AVERAGE, MAX, MIN)">Pert. 2: Formula dan Fungsi Dasar (SUM, AVERAGE, MAX, MIN)</option>
            <option value="Fungsi Logika (IF) dan Fitur Otomatisasi Data (Sort dan Filter)">Pert. 3: Fungsi Logika (IF) dan Fitur Sort - Filter</option>
            <option value="Studi Kasus Analisis Data (Data Peminjaman Buku Perpustakaan)">Pert. 4: Studi Kasus Analisis Data Lembar Kerja</option>
            <option value="Pengenalan Pemrograman Blok (Scratch), Antarmuka, Sprite, dan Stage">Pert. 5: Pengenalan Pemrograman Blok (Scratch) & Antarmuka</option>
            <option value="Gerakan Blok (Motion), Alur Sekuensial, dan Event Handling">Pert. 6: Gerakan Blok (Motion) & Event Handling Scratch</option>
            <option value="Struktur Kontrol Perulangan (Looping/Forever/Repeat) dan Percabangan (If-Then)">Pert. 7: Struktur Kontrol Perulangan & Percabangan IF-Then</option>
            <option value="Proyek Mini Pemrograman: Membuat Game atau Animasi Interaktif Sederhana">Pert. 8: Proyek Mini Pembuatan Game/Animasi Kreatif Interaktif</option>
            <option value="Bab 8: Perkembangan Teknologi Informasi & Komunikasi dan Dampak Sosialnya">Pert. 9: Perkembangan TIK dan Dampak Sosialnya</option>
            <option value="Bab 8: Kolaborasi di Dunia Maya, Media Sosial, dan Etika Netizen">Pert. 10: Kolaborasi Maya, Media Sosial & Etika Netizen</option>
            <option value="Bab 8: Keamanan Data Informasi Pribadi dan Hukum Privasi Dunia Digital">Pert. 11: Keamanan Informasi Data Pribadi & Hukum Privasi</option>
            <option value="Bab 9: Praktik Lintas Bidang - Pendahuluan Kerja Kelompok & Studi Kasus Integratif">Pert. 12: PLB - Pendahuluan Kerja Kelompok & Studi Kasus</option>
            <option value="Bab 9: Praktik Lintas Bidang - Pengembangan & Pembuatan Proyek Artefak Komputasional">Pert. 13: PLB - Pengembangan Proyek Artefak Komputasional</option>
            <option value="Bab 9: Praktik Lintas Bidang - Presentasi Karya Proyek Mandiri & Evaluasi Akhir">Pert. 14: PLB - Presentasi Hasil Karya & Evaluasi Akhir</option>
        `;

        const opsiDropdownKelas = `
            <option value="">-</option>
            <option value="7A">7A</option><option value="7B">7B</option><option value="7C">7C</option><option value="7D">7D</option><option value="7E">7E</option><option value="7F">7F</option>
            <option value="8A">8A</option><option value="8B">8B</option><option value="8C">8C</option><option value="8D">8D</option><option value="8E">8E</option><option value="8F">8F</option>
            <option value="9A">9A</option><option value="9B">9B</option><option value="9C">9C</option><option value="9D">9D</option><option value="9E">9E</option><option value="9F">9F</option>
        `;

        const opsiDropdownPertemuan = `
            <option value="">-</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        `;

        function dapatkanTanggalHariIni() {
            const hariNama = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
            const d = new Date();
            const namaHari = hariNama[d.getDay()];
            const tgl = String(d.getDate()).padStart(2, '0');
            const bln = String(d.getMonth() + 1).padStart(2, '0');
            const thn = d.getFullYear();
            return `${namaHari}, ${tgl}/${bln}/${thn}`;
        }

        window.onload = function() {
            document.getElementById("auto_tahun_ajaran").innerText = "Tahun Ajaran: 2025/2026";

            document.getElementById("tgl_cetak").innerHTML = `Jakarta, ${String(new Date().getDate()).padStart(2, '0')} Mei 2026<br>Guru Mata Pelajaran`;
            tambahBarisMengajarBlank();
        };

        function isiNipOtomatis() {
            const namaTerpilih = document.getElementById("nama_guru").value;
            const tbody = document.getElementById("body-tabel-mengajar");
            
            if (namaTerpilih in databaseGuru) {
                document.getElementById("nip").value = databaseGuru[namaTerpilih].nip;
                document.getElementById("mata_pelajaran").value = databaseGuru[namaTerpilih].mapel;
                document.getElementById("nama_guru_ttd").value = namaTerpilih;
                document.getElementById("nip_guru_ttd").value = "NIP. " + databaseGuru[namaTerpilih].nip;
                
                tbody.innerHTML = "";
                tambahBarisMengajarBlank();
            } else {
                document.getElementById("nip").value = "";
                document.getElementById("mata_pelajaran").value = "";
                document.getElementById("nama_guru_ttd").value = "";
                document.getElementById("nip_guru_ttd").value = "";
                tbody.innerHTML = "";
                tambahBarisMengajarBlank();
            }
        }

        function tambahBarisMengajarBlank() {
            const table = document.getElementById("tabel-mengajar").getElementsByTagName('tbody')[0];
            const jumlahBarisSekarang = table.rows.length;
            const idBaris = jumlahBarisSekarang + 1;
            const tglHariIni = dapatkanTanggalHariIni();

            var row = table.insertRow(jumlahBarisSekarang);
            row.innerHTML = `
                <td class="center-input row-num col-no">${idBaris}</td>
                <td class="col-hari"><input type="text" class="tgl" value="${tglHariIni}" placeholder="Contoh: Senin, 17/05/2026"></td>
                <td class="col-jam">
                    <div class="print-jam-text" id="print_jam_${idBaris}"></div>
                    <div class="ceklis-jam-container">
                        <label class="jam-item"><input type="checkbox" value="1">1</label>
                        <label class="jam-item"><input type="checkbox" value="2">2</label>
                        <label class="jam-item"><input type="checkbox" value="3">3</label>
                        <label class="jam-item"><input type="checkbox" value="4">4</label>
                        <label class="jam-item"><input type="checkbox" value="5">5</label>
                        <label class="jam-item"><input type="checkbox" value="6">6</label>
                        <label class="jam-item"><input type="checkbox" value="7">7</label>
                        <label class="jam-item"><input type="checkbox" value="8">8</label>
                    </div>
                </td>
                <td class="col-kelas"><select class="kls">${opsiDropdownKelas}</select></td>
                <td class="col-pert"><select class="pert">${opsiDropdownPertemuan}</select></td>
                <td class="col-tp">
                    <div class="print-text-wrap class-print-tp"></div>
                    <select class="cp">${opsiDropdownTP}</select>
                </td>
                <td class="col-materi">
                    <div class="print-text-wrap class-print-materi"></div>
                    <select class="mat">${opsiDropdownMateri}</select>
                </td>
                <td class="col-absensi"><textarea rows="3" class="abs" placeholder="S: -&#10;I: -&#10;A: -"></textarea></td>
                <td class="col-refleksi"><textarea rows="3" class="ref" placeholder="Catatan kelas..."></textarea></td>
            `;
        }

        function dapatkanFormatJamCeklis(rowElement) {
            let checkboxes = rowElement.querySelectorAll(".ceklis-jam-container input[type='checkbox']");
            let pilihan = [];
            checkboxes.forEach(cb => { if (cb.checked) pilihan.push(parseInt(cb.value)); });

            if (pilihan.length > 1) {
                pilihan.sort((a, b) => a - b);
                return pilihan[0] + " - " + pilihan[pilihan.length - 1];
            } else if (pilihan.length === 1) {
                return pilihan[0].toString();
            }
            return "";
        }

        function jalankanCetak() {
            const rows = document.querySelectorAll("#tabel-mengajar tbody tr");
            rows.forEach((row) => {
                const teksJam = dapatkanFormatJamCeklis(row);
                const printContainer = row.querySelector(".print-jam-text");
                if (printContainer) printContainer.innerText = teksJam ? teksJam : "-";

                const selectCP = row.querySelector("select.cp");
                const divPrintTP = row.querySelector(".class-print-tp");
                if (selectCP && divPrintTP) {
                    const teksTerpilih = selectCP.options[selectCP.selectedIndex].value;
                    divPrintTP.innerText = teksTerpilih ? teksTerpilih : "-";
                }

                const selectMat = row.querySelector("select.mat");
                const divPrintMateri = row.querySelector(".class-print-materi");
                if (selectMat && divPrintMateri) {
                    const teksTerpilihMat = selectMat.options[selectMat.selectedIndex].value;
                    divPrintMateri.innerText = teksTerpilihMat ? teksTerpilihMat : "-";
                }
            });
            window.print();
        }

        function simpanKeSpreadsheet() {
            const btnSimpan = document.getElementById("btn_simpan_sheet");
            const nama_guru = document.getElementById("nama_guru").value;
            const nip = document.getElementById("nip").value;
            const mata_pelajaran = document.getElementById("mata_pelajaran").value;
            const kelas_semester = document.getElementById("kelas_semester").value;

            if(nama_guru === "") {
                alert("Gagal: Silakan pilih Nama Guru terlebih dahulu!");
                return;
            }

            const rows = document.querySelectorAll("#tabel-mengajar tbody tr");
            let dataJurnal = [];
            let semuaValid = true;
            let pesanPeringatan = "";

            rows.forEach((row, index) => {
                const nomorBaris = index + 1;
                const tglValue = row.querySelector(".tgl").value.trim();
                const teksJamGabungan = dapatkanFormatJamCeklis(row);
                const klsValue = row.querySelector(".kls").value;
                const pertValue = row.querySelector(".pert").value;
                const cpValue = row.querySelector(".cp").value;
                const matValue = row.querySelector(".mat").value;
                const absValue = row.querySelector(".abs").value;
                const refValue = row.querySelector(".ref").value;

                if (tglValue === "" || teksJamGabungan === "" || klsValue === "" || pertValue === "" || cpValue === "" || matValue === "") {
                    semuaValid = false;
                    pesanPeringatan = "Baris No. " + nomorBaris + " belum lengkap!\nKolom Hari/Tanggal, Jam Ke- (Ceklis), Kelas, Pert. Ke, Tujuan Pembelajaran, dan Materi Pokok wajib diisi.";
                    return;
                }

                dataJurnal.push({
                    tanggal: tglValue,
                    jam_ke: teksJamGabungan,
                    kelas: klsValue,
                    pertemuan_ke: pertValue,
                    cp_pembelajaran: cpValue,
                    materi_pokok: matValue,
                    absensi: absValue,
                    refleksi: refValue
                });
            });

            if (!semuaValid) {
                alert("Gagal Menyimpan!\n\n" + pesanPeringatan);
                return;
            }

            if(dataJurnal.length === 0) {
                alert("Gagal: Baris Catatan Harian minimal harus diisi satu!");
                return;
            }

            btnSimpan.disabled = true;
            btnSimpan.innerText = "⏳ Memproses...";

            const payload = {
                nama_guru: nama_guru,
                nip: nip,
                mata_pelajaran: mata_pelajaran,
                kelas_semester: kelas_semester,
                refleksi_efektif: document.getElementById("refleksi_1").value,
                refleksi_kendala: document.getElementById("refleksi_2").value,
                refleksi_rencana: document.getElementById("refleksi_3").value,
                jurnal: dataJurnal
            };

            const idUnik = "layar_kirim_" + Date.now();
            const iframe = document.createElement("iframe");
            iframe.name = idUnik; iframe.style.display = "none";
            document.body.appendChild(iframe);

            const form = document.createElement("form");
            form.method = "POST"; 
            form.action = "https://script.google.com/macros/s/AKfycbzg7UOZ7TAehOut5iwwXSUG86-dyHe9J67xmUQnRLJdlAmV4Ok5TDD3dzA6TPypOJY-/exec"; 
            form.target = idUnik;

            const hiddenInput = document.createElement("input");
            hiddenInput.type = "hidden"; hiddenInput.name = "postData";
            hiddenInput.value = JSON.stringify(payload);
            
            form.appendChild(hiddenInput);
            document.body.appendChild(form);
            form.submit();

            alert("Data sedang diproses dan dikirim ke Google Sheets! Silakan periksa spreadsheet Anda.");
            
            setTimeout(() => {
                if(document.body.contains(form)) document.body.removeChild(form);
                if(document.body.contains(iframe)) document.body.removeChild(iframe);
                btnSimpan.disabled = false;
                btnSimpan.innerText = "💾 Simpan ke Google Sheets";
            }, 4000);
        }
    </script>
</body>
