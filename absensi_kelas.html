<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Hadir - SMPN 110 Jakarta</title>
    <style>
        :root {
            --primary: #4080FF;
            --primary-light: rgba(64, 128, 255, 0.12);
            --primary-glow: rgba(64, 128, 255, 0.25);
            --secondary: #00B4AA;
            --success: #27C347;
            --warning: #FF8A3D;
            --danger: #F65C5C;
            --text-primary: #E5E6EB;
            --text-secondary: #C9CDD4;
            --text-tertiary: #86909C;
            --border: #3A3A3C;
            --border-light: #2C2C2E;
            --bg-page: #121212;
            --bg-card: #1A1A1B;
            --bg-input: #242426;
            --bg-table-header: #242426;
            --bg-table-row: #1A1A1B;
            --bg-table-alt: #202022;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.35);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            --shadow-focus: 0 0 0 4px rgba(64, 128, 255, 0.2);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-full: 999px;
        }

        body.light-mode {
            --primary: #165DFF;
            --primary-light: rgba(22, 93, 255, 0.1);
            --primary-glow: rgba(22, 93, 255, 0.15);
            --secondary: #0FC6C2;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
            --text-tertiary: #86909C;
            --border: #E5E6EB;
            --border-light: #F2F3F5;
            --bg-page: #F7F8FA;
            --bg-card: #FFFFFF;
            --bg-input: #F7F8FA;
            --bg-table-header: #F7F8FA;
            --bg-table-row: #FFFFFF;
            --bg-table-alt: #F7F8FA;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.05);
            --shadow-focus: 0 0 0 4px rgba(22, 93, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            padding: 16px;
            min-height: 100vh;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden; /* Hanya kunci geser kiri-kanan halaman utama */
            overflow-y: auto;   /* ✅ BISA DIGESER ATAS-BAWAH */
        }
        body::before {
            content: '';
            position: fixed; /* Tetap di belakang saat digulir */
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, var(--primary-glow) 0%, transparent 60%);
            opacity: 0.6;
            pointer-events: none;
        }

        .container {
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            transition: all 0.3s ease;
            position: relative;
            padding-bottom: 40px; /* Beri ruang di bawah */
        }

        .verifikasi-nrk {
            padding: 52px 36px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }
        .verifikasi-nrk::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(64,128,255,0.08), transparent);
            transition: left 0.7s ease;
        }
        .verifikasi-nrk:hover::before {
            left: 100%;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .verifikasi-nrk h2 {
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        .verifikasi-nrk h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            margin: 12px auto 0;
            border-radius: 2px;
        }

        .verifikasi-nrk .form-item {
            margin-top: 28px;
            margin-bottom: 28px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .verifikasi-nrk label {
            display: block;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .verifikasi-nrk input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.3s ease;
            text-align: center;
        }
        .verifikasi-nrk input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 5px var(--primary-light);
            transform: translateY(-1px);
        }

        .btn-cek {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary), #2970F2);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(64, 128, 255, 0.35);
        }
        .btn-cek:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(64, 128, 255, 0.45); }
        .btn-cek:active { transform: translateY(0); }

        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            max-width: 400px;
            width: calc(100% - 48px);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
            border: 1px solid var(--border-light);
        }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { background: rgba(39,195,71,0.12); border-left: 4px solid var(--success); color: #D1FAE5; }
        .toast.error { background: rgba(246,92,92,0.12); border-left: 4px solid var(--danger); color: #FECDD3; }
        body.light-mode .toast.success { background: #ECFDF3; color: #065F46; }
        body.light-mode .toast.error { background: #FEECEC; color: #991B1B; }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 28px 20px 20px;
            text-align: center;
            display: none;
            border-radius: var(--radius) var(--radius) 0 0;
            position: sticky; /* Tetap di atas saat digulir */
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .header h2 { font-size: 17px; font-weight: 500; opacity: 0.98; margin-bottom: 24px; }

        .action-bar { display: flex; justify-content: center; gap: 10px; display: none; flex-wrap: wrap; }
        button { width: 42px; height: 42px; border: none; border-radius: var(--radius-full); font-size: 20px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; color: #FFF; box-shadow: var(--shadow-sm); }
        button:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-primary { background: #4080FF; }
        .btn-warning { background: #FF9A2E; }
        .btn-secondary { background: #722ED1; }
        .btn-success { background: #00B42A; }
        .btn-dark { background: #60A5FA; }

        .status-box {
            position: fixed; /* Tetap terlihat di atas */
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 600;
            display: none;
            box-shadow: var(--shadow-md);
            z-index: 999;
            color: #FFF;
            backdrop-filter: blur(8px);
        }
        .status-box.success { background: rgba(0,154,41,0.9); }
        .status-box.error { background: rgba(217,43,43,0.9); }
        .status-box.loading { background: rgba(204,100,0,0.9); }

        .content { padding: 24px 20px; display: none; }
        .info-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-table-header);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-top: 12px;
        }
        .form-item { display: flex; flex-direction: column; gap: 6px; }
        .form-item label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .form-item select, .form-item input { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: var(--bg-input); color: var(--text-primary); }
        .form-item input[readonly] { opacity: 0.9; }
        .form-item select:focus, .form-item input:focus { outline: none; border-color: var(--primary); box-shadow: var(--shadow-focus); }

        /* ✅ AREA TABEL BISA DIGESER KE SEMUA ARAH */
        .table-container {
            overflow-x: auto; /* Geser kiri-kanan */
            overflow-y: auto; /* ✅ GESER ATAS-BAWAH */
            max-height: calc(100vh - 320px); /* Batas tinggi agar tidak melebihi layar */
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            -webkit-overflow-scrolling: touch; /* Halus di HP */
        }
        table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 6px; text-align: center; border: 1px solid var(--border); }
        th { background: var(--bg-table-header); font-weight: 600; color: var(--text-secondary); position: sticky; top: 0; z-index: 10; }
        tbody tr { background: var(--bg-table-row); }
        tbody tr:nth-child(even) { background: var(--bg-table-alt); }

        .col-no { width: 40px; }
        .col-nis { width: 55px; }
        .col-nama { width: 180px; text-align: left; padding-left: 10px; }
        .col-lp { width: 40px; }
        .col-tgl { width: 36px; padding: 4px; }
        .col-stat { width: 50px; }
        .col-jumlah { width: 60px; }
        .col-persen { width: 65px; font-weight: 700; color: var(--primary); }

        .input-tgl-header { width: 100%; padding: 4px 2px; border-radius: 6px; border: none; background: transparent; color: inherit; font-size: 11px; font-weight: 600; text-align: center; }
        .input-hadir { width: 100%; padding: 6px 2px; border-radius: 6px; border: none; background: transparent; color: inherit; font-size: 14px; font-weight: 600; text-align: center; }
        .input-hadir:focus { outline: none; background: var(--primary-light); }

        .footer-section { display: flex; flex-direction: column; gap: 32px; margin-top: 32px; padding: 0 16px 24px; font-size: 14px; display: none; }
        .signature-block { text-align: center; }
        .signature-title { margin-bottom: 48px; color: var(--text-secondary); font-weight: 500; }
        .signature-name { font-weight: 700; color: var(--primary); display: block; margin-bottom: 6px; font-size: 15px; }
        .signature-nip { color: var(--text-tertiary); font-size: 13px; }

        @media (min-width: 768px) {
            body { padding: 32px; }
            .verifikasi-nrk { padding: 56px 40px; max-width: 400px; }
            .info-section { grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 24px; }
            .footer-section { flex-direction: row; justify-content: space-between; padding: 0 24px 32px; }
            .table-container { max-height: calc(100vh - 280px); }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast error">
        <span class="toast-icon">⚠️</span>
        <span class="toast-text" id="toastText">NRK tidak ditemukan!</span>
    </div>

    <div class="container">
        <div id="status" class="status-box"></div>

        <div id="halamanVerifikasi" class="verifikasi-nrk">
            <h2>Verifikasi Akses</h2>
            <div class="form-item">
                <label>Masukkan NRK / NIP Anda</label>
                <input type="text" id="inputNRK" placeholder="Contoh: 186043" autocomplete="off">
            </div>
            <button class="btn-cek" onclick="cekNRK()">Masuk ke Absensi</button>
        </div>

        <div id="halamanUtama" style="display: none;">
            <div class="header">
                <h1>SMPN 110 JAKARTA</h1>
                <h2>DAFTAR HADIR MURID</h2>
                <div class="action-bar">
                    <button class="btn-primary" onclick="tambahTanggal()" title="Tambah Tanggal">➕</button>
                    <button class="btn-warning" onclick="kurangiTanggal()" title="Kurangi Tanggal">➖</button>
                    <button class="btn-secondary" onclick="window.print()" title="Cetak">🖨️</button>
                    <button class="btn-success" onclick="simpanKeSheet()" title="Simpan">💾</button>
                    <button class="btn-dark" onclick="toggleDarkMode()" title="Tampilan">🔆</button>
                </div>
            </div>

            <div class="content">
                <div class="info-section">
                    <div class="form-item">
                        <label>Mata Pelajaran</label>
                        <input type="text" id="mapel" readonly>
                    </div>
                    <div class="form-item">
                        <label>Nama Guru</label>
                        <input type="text" id="namaGuru" readonly>
                    </div>
                    <div class="form-item">
                        <label>Semester</label>
                        <select id="semester" readonly>
                            <option value="Ganjil">Ganjil</option>
                            <option value="Genap">Genap</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label>Periode Bulan</label>
                        <input type="text" id="bulan" readonly>
                    </div>
                    <div class="form-item">
                        <label>Tahun Pelajaran</label>
                        <input type="text" id="tapel" readonly>
                    </div>
                    <div class="form-item">
                        <label>Kelas</label>
                        <select id="kelas">
                            <option value="">-- Pilih Kelas --</option>
                            <option value="7A">7A</option>
                            <option value="7B">7B</option>
                            <option value="7C">7</option>
                            <option value="7D">7D</option>
                            <option value="7E">7E</option>
                            <option value="7F">7F</option>
                            <option value="8A">8A</option>
                            <option value="8B">8B</option>
                            <option value="8C">8C</option>
                            <option value="8D">8D</option>
                            <option value="8E">8E</option>
                            <option value="8F">8F</option>
                            <option value="9A">9A</option>
                            <option value="9B">9B</option>
                            <option value="9C">9C</option>
                            <option value="9D">9D</option>
                            <option value="9E">9E</option>
                            <option value="9F">9F</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table id="tabelAbsensi">
                        <thead>
                            <tr>
                                <th class="col-no">No</th>
                                <th class="col-nis">NIS</th>
                                <th class="col-nama">Nama Lengkap</th>
                                <th class="col-lp">L/P</th>
                                <th class="col-stat">Sakit</th>
                                <th class="col-stat">Izin</th>
                                <th class="col-stat">Alpa</th>
                                <th class="col-jumlah">Hadir</th>
                                <th class="col-persen">Persen</th>
                            </tr>
                        </thead>
                        <tbody id="isiTabel">
                            <tr><td colspan="9" style="padding:48px 16px;color:var(--text-tertiary);">Silakan pilih kelas untuk memulai</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="footer-section">
                    <div class="signature-block">
                        <div class="signature-title">Menyetujui,<br>Kepala Sekolah</div>
                        <span class="signature-name">Iis Ratna Sariningrum, S.Pd., M.M.</span>
                        <span class="signature-nip">NIP. 197010311994122001</span>
                    </div>
                    <div class="signature-block">
                        <div class="signature-title">Jakarta, <span id="tanggalTtd"></span><br>Guru Mata Pelajaran</div>
                        <span class="signature-name" id="ttdNamaGuru"></span>
                        <span class="signature-nip" id="ttdNipGuru"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyugPcgnCDzFhcUB5kW-3WZ-P27EN1Qdn0Lc_0K4G5M9EqPetCF_BtKDajYvff-8JiQsg/exec";
        let daftarSiswa = [], jumlahTanggal = 0, daftarTanggal = [], dataGuruSaatIni = null;

        const daftarGuruAwal = {
            "186043": { nama: "Endra Triyanto Hamdani, S.Kom", nip: "NIP. 197601042014121003", mapel: "Informatika" },
            "186044": { nama: "Ahmad Fauzi, S.Pd.", nip: "NIP. 197503121998021004", mapel: "Pendidikan Agama" },
            "197807222001012007": { nama: "Sri Wahyuni, S.Pd.", nip: "NIP. 197807222001012007", mapel: "Pendidikan Pancasila" },
            "197905152002031005": { nama: "Budi Santoso, S.Si.", nip: "NIP. 197905152002031005", mapel: "Matematika" },
            "198009032003042009": { nama: "Dewi Lestari, S.Si.", nip: "NIP. 198009032003042009", mapel: "IPA" }
        };

        function tampilkanNotifikasi(pesan, jenis = "error", durasi = 3500) {
            const toast = document.getElementById("toast");
            const toastText = document.getElementById("toastText");
            toast.className = `toast ${jenis}`;
            toastText.textContent = pesan;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), durasi);
        }

        async function cekNRK() {
            const input = document.getElementById("inputNRK").value.trim();
            if (!input) return tampilkanNotifikasi("Masukkan NRK terlebih dahulu!");

            try {
                const res = await fetch(`${GAS_URL}?action=AmbilDataGuru&nrk=${encodeURIComponent(input)}`);
                const hasil = await res.json();

                if (hasil.status === "ok" && hasil.dataGuru) {
                    dataGuruSaatIni = hasil.dataGuru;
                    tampilkanNotifikasi("Verifikasi berhasil!", "success");
                    lanjutKeUtama();
                    return;
                }

                if (!daftarGuruAwal[input]) return tampilkanNotifikasi("NRK tidak ditemukan!");
                dataGuruSaatIni = daftarGuruAwal[input];

                await fetch(GAS_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: `action=SimpanDataGuru&nrk=${encodeURIComponent(input)}&nama=${encodeURIComponent(dataGuruSaatIni.nama)}&nip=${encodeURIComponent(dataGuruSaatIni.nip)}&mapel=${encodeURIComponent(dataGuruSaatIni.mapel)}`
                });
                tampilkanNotifikasi("Data tersimpan ke database!", "success");
                lanjutKeUtama();

            } catch {
                if (daftarGuruAwal[input]) {
                    dataGuruSaatIni = daftarGuruAwal[input];
                    tampilkanNotifikasi("Mode luring aktif", "success");
                    lanjutKeUtama();
                } else {
                    tampilkanNotifikasi("NRK tidak ditemukan & server tidak terhubung!");
                }
            }
        }

        function lanjutKeUtama() {
            document.getElementById("halamanVerifikasi").style.display = "none";
            document.getElementById("halamanUtama").style.display = "block";
            document.getElementById("mapel").value = dataGuruSaatIni.mapel;
            document.getElementById("namaGuru").value = dataGuruSaatIni.nama;
            document.getElementById("ttdNamaGuru").textContent = dataGuruSaatIni.nama;
            document.getElementById("ttdNipGuru").textContent = dataGuruSaatIni.nip;
            setPeriodeBulanOtomatis();
            setTahunPelajaranOtomatis();
            setTanggalTtd();
            document.querySelector(".header").style.display = "block";
            document.querySelector(".action-bar").style.display = "flex";
            document.querySelector(".content").style.display = "block";
            document.querySelector(".footer-section").style.display = "flex";
        }

        function setPeriodeBulanOtomatis() {
            const b = new Date().getMonth() + 1;
            const p = b <=3 ? "Januari–Maret" : b <=6 ? "April–Juni" : b <=9 ? "Juli–September" : "Oktober–Desember";
            document.getElementById("bulan").value = p;
        }

        function setTahunPelajaranOtomatis() {
            const t = new Date().getFullYear(), b = new Date().getMonth() + 1;
            document.getElementById("tapel").value = b <=6 ? `${t-1}/${t}` : `${t}/${t+1}`;
            document.getElementById("semester").value = b >=7 && b <=12 ? "Ganjil" : "Genap";
        }

        function toggleDarkMode() {
            document.body.classList.toggle("light-mode");
        }

        function formatTanggalLengkap(d) {
            const nm = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
            return `${d.getDate()} ${nm[d.getMonth()]} ${d.getFullYear()}`;
        }
        function setTanggalTtd() {
            document.getElementById("tanggalTtd").textContent = formatTanggalLengkap(new Date());
        }

        function showStatus(msg, jenis) {
            const el = document.getElementById("status");
            el.className = `status-box ${jenis}`;
            el.textContent = msg;
            el.style.display = "block";
            if (jenis !== "loading") setTimeout(() => el.style.display = "none", 4000);
        }

        window.onload = async function() {
            const selectKelas = document.getElementById("kelas");
            try {
                const res = await fetch(`${GAS_URL}?action=AmbilDaftarKelas`);
                const hasil = await res.json();
                if (hasil.status === "ok" && hasil.daftarKelas) {
                    selectKelas.innerHTML = `<option value="">-- Pilih Kelas --</option>`;
                    hasil.daftarKelas.forEach(k => {
                        const opt = document.createElement("option");
                        opt.value = k; opt.textContent = k;
                        selectKelas.appendChild(opt);
                    });
                }
            } catch {}
            selectKelas.addEventListener("change", () => selectKelas.value && loadSiswaDariSheet());
        };

        async function loadSiswaDariSheet() {
            const kelas = document.getElementById("kelas").value;
            showStatus(`Memuat ${kelas}...`, "loading");
            try {
                const rS = await fetch(`${GAS_URL}?action=AmbilSiswaKelas&kelasPilihan=${kelas}`);
                const hS = await rS.json();
                const rA = await fetch(`${GAS_URL}?action=AmbilAbsensi&kelasPilihan=${kelas}`);
                const hA = await rA.json();
                daftarSiswa = hS.daftarSiswa || [];
                if (hA.status === "ok") {
                    daftarTanggal = hA.daftarTanggal || [];
                    jumlahTanggal = daftarTanggal.length;
                    daftarSiswa.forEach(s => s.hadir = hA.daftarSiswa?.find(x => x.noInduk === s.noInduk)?.hadir || Array(jumlahTanggal).fill("✓"));
                } else {
                    jumlahTanggal = 0; daftarTanggal = [];
                    daftarSiswa.forEach(s => s.hadir = []);
                }
                renderTabel(); hitungKehadiran();
                showStatus(`Data ${kelas} dimuat!`, "success");
            } catch {
                showStatus("Gagal memuat, coba lagi nanti", "error");
            }
        }

        async function simpanKeSheet() {
            const kelas = document.getElementById("kelas").value;
            if (!kelas) return showStatus("Pilih kelas dulu!", "error");
            if (!confirm(`Simpan absensi ${kelas}?`)) return;
            showStatus("Menyimpan...", "loading");
            try {
                const data = {
                    nrk: document.getElementById("inputNRK").value.trim(),
                    mapel: document.getElementById("mapel").value,
                    namaGuru: document.getElementById("namaGuru").value,
                    nipGuru: dataGuruSaatIni.nip,
                    kelasPilihan: kelas,
                    tapel: document.getElementById("tapel").value,
                    bulan: document.getElementById("bulan").value,
                    semester: document.getElementById("semester").value,
                    daftarTanggal, daftarSiswa
                };
                const res = await fetch(GAS_URL, {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: `action=SimpanSemua&data=${encodeURIComponent(JSON.stringify(data))}`
                });
                const hasil = await res.json();
                showStatus(hasil.pesan, hasil.status === "ok" ? "success" : "error");
            } catch {
                showStatus("Gagal simpan, coba lagi", "error");
            }
        }

        function renderTabel() {
            const tbody = document.getElementById("isiTabel");
            const thead = document.querySelector("#tabelAbsensi thead tr");
            thead.querySelectorAll(".col-tgl").forEach(c => c.remove());
            const pos = thead.querySelector("th:nth-child(5)");
            for (let i=0; i<jumlahTanggal; i++) {
                const th = document.createElement("th"); th.className = "col-tgl";
                const inp = document.createElement("input"); inp.type = "text"; inp.className = "input-tgl-header"; inp.value = daftarTanggal[i];
                inp.addEventListener("change", e => daftarTanggal[i] = e.target.value.trim());
                th.appendChild(inp); thead.insertBefore(th, pos);
            }
            tbody.innerHTML = "";
            if (!daftarSiswa.length) {
                tbody.innerHTML = `<tr><td colspan="9" style="padding:48px 16px;color:var(--text-tertiary);">Silakan pilih kelas atau tambah tanggal</td></tr>`;
                return;
            }
            daftarSiswa.forEach((s, idx) => {
                const tr = document.createElement("tr");
                let html = `<td>${idx+1}</td><td>${s.noInduk||"-"}</td><td class="col-nama">${s.nama||"-"}</td><td>${s.jk||"-"}</td>`;
                for (let t=0; t<jumlahTanggal; t++) html += `<td class="col-tgl"><input type="text" class="input-hadir" maxlength="1" value="${s.hadir?.[t]||"✓"}" onchange="ubahAbsen(${idx},${t},this.value)"></td>`;
                html += `<td id="s-${idx}">0</td><td id="i-${idx}">0</td><td id="a-${idx}">0</td><td id="jml-${idx}">0</td><td id="prsn-${idx}">0%</td>`;
                tr.innerHTML = html; tbody.appendChild(tr);
            });
        }

        function tambahTanggal() {
            if (jumlahTanggal >= 24) return showStatus("Maksimal 24 kolom!", "error");
            jumlahTanggal++;
            const fmt = `${String(new Date().getDate()).padStart(2,"0")}/${String(new Date().getMonth()+1).padStart(2,"0")}`;
            daftarTanggal.push(fmt);
            daftarSiswa.forEach(s => s.hadir ? s.hadir.push("✓") : s.hadir = Array(jumlahTanggal).fill("✓"));
            renderTabel(); hitungKehadiran();
            showStatus(`Ditambah: ${fmt}`, "success");
        }

        function kurangiTanggal() {
            if (!jumlahTanggal) return showStatus("Belum ada tanggal!", "error");
            jumlahTanggal--; daftarTanggal.pop();
            daftarSiswa.forEach(s => s.hadir?.pop());
            renderTabel(); hitungKehadiran();
            showStatus("Tanggal terakhir dihapus", "success");
        }

        function ubahAbsen(idx, tgl, val) {
            daftarSiswa[idx].hadir[tgl] = ["S","I","A"].includes(val.trim().toUpperCase()) ? val.trim().toUpperCase() : "✓";
            hitungKehadiran();
        }

        function hitungKehadiran() {
            daftarSiswa.forEach((s, idx) => {
                let S=0, I=0, A=0, H=0;
                (s.hadir||[]).forEach(k => {
                    if (k==="S") S++; else if (k==="I") I++; else if (k==="A") A++; else H++;
                });
                const p = s.hadir?.length ? Math.round((H/s.hadir.length)*100) : 0;
                document.getElementById(`s-${idx}`).textContent = S;
                document.getElementById(`i-${idx}`).textContent = I;
                document.getElementById(`a-${idx}`).textContent = A;
                document.getElementById(`jml-${idx}`).textContent = H;
                document.getElementById(`prsn-${idx}`).textContent = p + "%";
            });
        }

        document.getElementById("inputNRK").addEventListener("keydown", e => e.key === "Enter" && cekNRK());
    </script>
</body>
</html>
