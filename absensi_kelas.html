<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Hadir Peserta Didik - SMP Negeri 110 Jakarta</title>
    <style>
        /* ✅ VARIABEL UTAMA: DEFAULT LANGSUNG MODE GELAP */
        :root {
            --primary: #4080FF;
            --primary-light: #1D2C4A;
            --secondary: #00B4AA;
            --success: #27C347;
            --warning: #FF8A3D;
            --danger: #F65C5C;
            --text-primary: #E5E6EB;
            --text-secondary: #C9CDD4;
            --text-tertiary: #86909C;
            --border: #303133;
            --bg-page: #121212;
            --bg-card: #1E1E1E;
            --bg-table-header: #2C2C2C;
            --bg-table-row: #1E1E1E;
            --bg-table-alt: #252525;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }

        /* ✅ VARIABEL MODE TERANG */
        body.light-mode {
            --primary: #165DFF;
            --primary-light: #E8F3FF;
            --secondary: #0FC6C2;
            --success: #00B42A;
            --warning: #FF7D00;
            --danger: #F53F3F;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
            --text-tertiary: #86909C;
            --border: #E5E6EB;
            --bg-page: #F2F3F5;
            --bg-card: #FFFFFF;
            --bg-table-header: #F7F8FA;
            --bg-table-row: #FFFFFF;
            --bg-table-alt: #F7F8FA;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-page);
            color: var(--text-primary);
            padding: 12px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px 16px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .header h2 {
            font-size: 15px;
            font-weight: 500;
            opacity: 0.95;
            margin-bottom: 12px;
        }

        /* ✅ TOMBOL IKON DIPINDAH KE BAWAH JUDUL */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 998;
        }

        button {
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            flex-shrink: 0;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        /* WARNA BERBEDA SETIAP TOMBOL */
        .btn-primary { background: #4080FF; }
        .btn-primary:hover { background: #2970F2; }

        .btn-warning { background: #FF9A2E; }
        .btn-warning:hover { background: #F58A1A; }

        .btn-secondary { background: #722ED1; }
        .btn-secondary:hover { background: #5F24B2; }

        .btn-success { background: #00B42A; }
        .btn-success:hover { background: #009A29; }

        .btn-dark { background: #FFC53D; color: #1D2129; }
        .btn-dark:hover { background: #F5BA2E; }

        .status-box {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            display: none;
            border: none;
            box-shadow: var(--shadow-md);
            z-index: 999;
            color: #FFFFFF !important;
            max-width: 80%;
            text-align: center;
        }

        .status-box.success {
            background: rgba(0, 154, 41, 0.95);
            display: block;
        }

        .status-box.error {
            background: rgba(217, 43, 43, 0.95);
            display: block;
        }

        .status-box.loading {
            background: rgba(204, 100, 0, 0.95);
            display: block;
        }

        .content {
            padding: 16px 12px;
        }

        .info-section {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 16px;
            padding: 14px;
            background: var(--bg-table-header);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-top: 8px;
        }

        .form-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-item label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .form-item select, .form-item input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }

        .form-item input[readonly] {
            cursor: default;
            opacity: 0.9;
        }

        .form-item select:focus, .form-item input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            width: 100%;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        th {
            background: var(--bg-table-header);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.2px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tbody tr {
            background: var(--bg-table-row);
            transition: background 0.15s ease;
        }

        tbody tr:nth-child(even) {
            background: var(--bg-table-alt);
        }

        .col-no { width: 35px; min-width: 35px; }
        .col-nis { width: 50px; min-width: 50px; }
        .col-nama { width: 160px; min-width: 160px; text-align: left; padding-left: 8px; }
        .col-lp { width: 35px; min-width: 35px; }
        .col-tgl { width: 32px; min-width: 32px; padding: 2px; }
        .col-stat { width: 45px; min-width: 45px; }
        .col-jumlah { width: 55px; min-width: 55px; }
        .col-persen { width: 60px; min-width: 60px; font-weight: 600; color: var(--primary); }

        .input-tgl-header {
            width: 100%;
            padding: 2px 1px;
            border: 1px solid transparent;
            background: transparent;
            color: inherit;
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .input-tgl-header:hover, .input-tgl-header:focus {
            border-color: var(--primary);
            background: var(--bg-card);
            outline: none;
        }

        .input-hadir {
            width: 100%;
            padding: 4px 1px;
            border: 1px solid transparent;
            background: transparent;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            border-radius: 4px;
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .input-hadir:focus {
            border-color: var(--primary);
            background: var(--primary-light);
            outline: none;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 24px;
            padding: 0 10px 16px;
            font-size: 13px;
        }

        .signature-block {
            text-align: center;
            min-width: auto;
        }

        .signature-title {
            margin-bottom: 40px;
            color: var(--text-secondary);
        }

        .signature-name {
            font-weight: 700;
            color: var(--primary);
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .signature-nip {
            color: var(--text-tertiary);
            font-size: 12px;
        }

        /* ✅ TAMPILAN TABLET & KOMPUTER */
        @media (min-width: 768px) {
            body {
                padding: 24px;
            }

            .header {
                padding: 28px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header h2 {
                font-size: 18px;
                margin-bottom: 16px;
            }

            button {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }

            .info-section {
                grid-template-columns: repeat(5, 1fr);
                gap: 16px;
                padding: 18px;
                margin-top: 10px;
            }

            table {
                font-size: 13px;
                min-width: auto;
            }

            .footer-section {
                flex-direction: row;
                justify-content: space-between;
                padding: 0 20px 24px;
                font-size: 14px;
            }

            .signature-block {
                min-width: 260px;
            }
        }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; max-width: 100%; width: 100%; }
            .header { background: #165DFF !important; color: white !important; padding: 20px; }
            .action-bar, .status-box { display: none !important; }
            .info-section { border: none; background: white; }
            th { background: #F7F8FA !important; color: #1D2129 !important; }
            .input-tgl-header { border: none !important; font-weight: bold; }
            .input-hadir { border: none !important; }
            .col-persen { color: #165DFF !important; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="status" class="status-box"></div>

        <div class="header">
            <h1>SMPN 110 JAKARTA</h1>
            <h2>DAFTAR HADIR</h2>
            <!-- ✅ TOMBOL IKON SUDAH DIPINDAH KE SINI -->
            <div class="action-bar">
                <button class="btn-primary" onclick="tambahTanggal()" title="Tambah Tanggal">➕</button>
                <button class="btn-warning" onclick="kurangiTanggal()" title="Kurangi Tanggal">➖</button>
                <button class="btn-secondary" onclick="window.print()" title="Cetak Dokumen">🖨️</button>
                <button class="btn-success" onclick="simpanKeSheet()" title="Simpan Data">💾</button>
                <button class="btn-dark" id="btnDarkMode" onclick="toggleDarkMode()" title="Ubah Mode">☀️</button>
            </div>
        </div>

        <div class="content">
            <div class="info-section">
                <div class="form-item">
                    <label>Mata Pelajaran</label>
                    <select id="mapel">
                        <option value="">-- Pilih Mata Pelajaran --</option>

                            <option>Pendidikan Agama dan BP</option>
                            <option>Pendidikan Pancasila</option>
                            <option>Bahasa Indonesia</option>
                            <option>Matematika</option>
                            <option>Ilmu Pengetahuan Alam</option>
                            <option>Ilmu Pengetahuan Sosial</option>
                            <option>Bahasa Inggris</option>
                            <option>PJOK</option>
                            <option>Informatika</option>
                            <option>Bimbinan Konseling</option>

                    </select>
                </div>
                <div class="form-item">
                    <label>Kelas</label>
                    <select id="kelas">
                        <option value="">-- Pilih Kelas --</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>Tahun Pelajaran</label>
                    <input type="text" id="tapel" readonly>
                </div>
                <div class="form-item">
                    <label>Periode Bulan</label>
                    <select id="bulan">
                        <option value="">-- Pilih Periode --</option>
                        <option>Januari s.d Maret</option>
                        <option>April s.d. Juni</option>
                        <option>Juli s.d. Agustus</option>
                        <option>September s.d. Desember</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>Semester</label>
                    <select id="semester">
                        <option value="Ganjil">Ganjil</option>
                        <option value="Genap">Genap</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table id="tabelAbsensi">
                    <thead>
                        <tr>
                            <th class="col-no">No</th>
                            <th class="col-nis">NIS</th>
                            <th class="col-nama">Nama Lengkap</th>
                            <th class="col-lp">L/P</th>
                            <th class="col-stat">Sakit</th>
                            <th class="col-stat">Izin</th>
                            <th class="col-stat">Alpa</th>
                            <th class="col-jumlah">Hadir</th>
                            <th class="col-persen">Persen</th>
                        </tr>
                    </thead>
                    <tbody id="isiTabel">
                        <tr>
                            <td colspan="9" style="padding: 40px 10px; color: var(--text-tertiary);">Silakan pilih kelas untuk memuat data</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="footer-section">
                <div class="signature-block">
                    <div class="signature-title">Menyetujui,<br>Kepala Sekolah</div>
                    <span class="signature-name">Iis Ratna Sariningrum, S.Pd., M.M.</span>
                    <span class="signature-nip">NIP. 197010311994122001</span>
                </div>
                <div class="signature-block">
                    <div class="signature-title">Jakarta, <span id="tanggalTtd"></span><br>Guru Mata Pelajaran</div>
                    <span class="signature-name">Endra Triyanto Hamdani, S.Kom</span>
                    <span class="signature-nip">NIP. 197601042014121003</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyugPcgnCDzFhcUB5kW-3WZ-P27EN1Qdn0Lc_0K4G5M9EqPetCF_BtKDajYvff-8JiQsg/exec";
        
        let daftarSiswa = [];
        let jumlahTanggal = 0;
        let daftarTanggal = [];

        // ✅ FUNGSI OTOMATIS TAHUN PELAJARAN
        function setTahunPelajaranOtomatis() {
            const sekarang = new Date();
            const tahun = sekarang.getFullYear();
            const bulan = sekarang.getMonth() + 1; // 1-12
            
            let tapel;
            if (bulan >= 1 && bulan <= 6) {
                tapel = `${tahun - 1} / ${tahun}`;
            } else {
                tapel = `${tahun} / ${tahun + 1}`;
            }
            
            document.getElementById("tapel").value = tapel;
        }

        // ✅ FUNGSI TOMBOL MODE
        function toggleDarkMode() {
            const body = document.body;
            const btn = document.getElementById("btnDarkMode");
            
            body.classList.toggle("light-mode");

            if (body.classList.contains("light-mode")) {
                btn.innerHTML = "🌙";
            } else {
                btn.innerHTML = "☀️";
            }
        }

        function formatTanggalLengkap(date) {
            const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${date.getDate()} ${namaBulan[date.getMonth()]} ${date.getFullYear()}`;
        }

        function setTanggalTtd() {
            const el = document.getElementById("tanggalTtd");
            if (el) el.textContent = formatTanggalLengkap(new Date());
        }

        function showStatus(msg, jenis) {
            const el = document.getElementById("status");
            el.className = `status-box ${jenis}`;
            el.textContent = msg;
            el.style.display = "block";
            if (jenis !== 'loading') setTimeout(() => el.style.display = 'none', 4000);
        }

        window.onload = async function() {
            setTahunPelajaranOtomatis();
            setTanggalTtd();
            try {
                const res = await fetch(`${GAS_URL}?action=AmbilDaftarKelas`);
                const hasil = await res.json();
                if (hasil.status === "ok") {
                    const select = document.getElementById("kelas");
                    hasil.daftarKelas.forEach(k => {
                        const opt = document.createElement("option");
                        opt.value = k;
                        opt.textContent = k;
                        select.appendChild(opt);
                    });
                    select.addEventListener("change", async () => {
                        if (select.value) {
                            await loadSiswaDariSheet();
                            hitungKehadiran();
                        } else {
                            daftarSiswa = []; jumlahTanggal = 0; daftarTanggal = [];
                            renderTabel();
                        }
                    });
                }
            } catch (e) { showStatus("Gagal memuat daftar kelas: " + e.message, "error"); }
        };

        async function loadSiswaDariSheet() {
            const kelas = document.getElementById("kelas").value;
            showStatus(`Memuat data kelas ${kelas}...`, "loading");
            try {
                const rSiswa = await fetch(`${GAS_URL}?action=AmbilSiswaKelas&kelasPilihan=${kelas}`);
                const hSiswa = await rSiswa.json();
                if (hSiswa.status !== "ok") throw hSiswa.pesan;

                const rAbsen = await fetch(`${GAS_URL}?action=AmbilAbsensi&kelasPilihan=${kelas}`);
                const hAbsen = await rAbsen.json();

                daftarSiswa = hSiswa.daftarSiswa;
                if (hAbsen.status === "ok") {
                    daftarTanggal = hAbsen.daftarTanggal || [];
                    jumlahTanggal = daftarTanggal.length;
                    daftarSiswa.forEach(s => {
                        const lama = hAbsen.daftarSiswa?.find(x => x.noInduk === s.noInduk);
                        s.hadir = lama?.hadir || Array(jumlahTanggal).fill("✓");
                    });
                    const mapelSelect = document.getElementById("mapel");
                    const bulanSelect = document.getElementById("bulan");
                    const tapelInput = document.getElementById("tapel");
                    if (hAbsen.info?.mapel) mapelSelect.value = hAbsen.info.mapel;
                    if (hAbsen.info?.bulan) bulanSelect.value = hAbsen.info.bulan;
                    if (hAbsen.info?.tapel) tapelInput.value = hAbsen.info.tapel;
                } else {
                    jumlahTanggal = 0; daftarTanggal = [];
                    daftarSiswa.forEach(s => s.hadir = []);
                }
                renderTabel();
                hitungKehadiran();
                showStatus(`Data kelas ${kelas} berhasil dimuat!`, "success");
            } catch (e) { showStatus("Kesalahan: " + e, "error"); }
        }

        async function simpanKeSheet() {
            const kelas = document.getElementById("kelas").value;
            if (!kelas) return showStatus("Pilih kelas terlebih dahulu!", "error");
            if (!confirm(`Simpan semua data absensi kelas ${kelas}?`)) return;
            showStatus("Menyimpan data...", "loading");
            try {
                const data = {
                    mapel: document.getElementById("mapel").value,
                    kelasPilihan: kelas,
                    tapel: document.getElementById("tapel").value,
                    bulan: document.getElementById("bulan").value,
                    daftarTanggal: daftarTanggal,
                    daftarSiswa: daftarSiswa
                };
                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `action=SimpanSemua&data=${encodeURIComponent(JSON.stringify(data))}`
                });
                const hasil = await res.json();
                showStatus(hasil.pesan, hasil.status === "ok" ? "success" : "error");
            } catch (e) { showStatus("Gagal menyimpan: " + e.message, "error"); }
        }

        function renderTabel() {
            const tbody = document.getElementById("isiTabel");
            const thead = document.querySelector("#tabelAbsensi thead tr");
            thead.querySelectorAll(".col-tgl").forEach(c => c.remove());
            const posSisip = thead.querySelector("th:nth-child(5)");

            for (let i = 0; i < jumlahTanggal; i++) {
                const th = document.createElement("th");
                th.className = "col-tgl";
                const inp = document.createElement("input");
                inp.type = "text";
                inp.className = "input-tgl-header";
                inp.value = daftarTanggal[i] || "";
                inp.placeholder = "Tgl";
                inp.addEventListener("change", e => daftarTanggal[i] = e.target.value.trim());
                th.appendChild(inp);
                thead.insertBefore(th, posSisip);
            }

            tbody.innerHTML = "";
            if (daftarSiswa.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 40px 10px; color: var(--text-tertiary);">Silakan pilih kelas untuk memuat data</td></tr>`;
                return;
            }

            daftarSiswa.forEach((siswa, idx) => {
                const tr = document.createElement("tr");
                let html = `
                    <td>${idx + 1}</td>
                    <td>${siswa.noInduk}</td>
                    <td class="col-nama">${siswa.nama}</td>
                    <td>${siswa.jk}</td>
                `;
                for (let t = 0; t < jumlahTanggal; t++) {
                    html += `<td class="col-tgl"><input type="text" class="input-hadir" maxlength="1" value="${siswa.hadir?.[t] || "✓"}" onchange="ubahAbsen(${idx}, ${t}, this.value)"></td>`;
                }
                html += `
                    <td id="s-${idx}">0</td>
                    <td id="i-${idx}">0</td>
                    <td id="a-${idx}">0</td>
                    <td id="jml-${idx}">0</td>
                    <td id="prsn-${idx}">0%</td>
                `;
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function tambahTanggal() {
            if (daftarSiswa.length === 0) return showStatus("Muat data kelas dulu!", "error");
            if (jumlahTanggal >= 24) return showStatus("Maksimal 24 kolom tanggal!", "error");
            jumlahTanggal++;
            const tgl = new Date();
            const fmt = `${String(tgl.getDate()).padStart(2,'0')}/${String(tgl.getMonth()+1).padStart(2,'0')}`;
            daftarTanggal.push(fmt);
            daftarSiswa.forEach(s => s.hadir ? s.hadir.push("✓") : s.hadir = ["✓"]);
            renderTabel(); hitungKehadiran();
            showStatus(`Tanggal ditambahkan: ${fmt}`, "success");
        }

        function kurangiTanggal() {
            if (jumlahTanggal <= 0) return showStatus("Tidak ada tanggal untuk dihapus!", "error");
            jumlahTanggal--; daftarTanggal.pop();
            daftarSiswa.forEach(s => s.hadir?.pop());
            renderTabel(); hitungKehadiran();
            showStatus("Tanggal terakhir dihapus", "success");
        }

        function ubahAbsen(idx, tgl, val) {
            const v = val.trim().toUpperCase();
            daftarSiswa[idx].hadir[tgl] = ["S","I","A"].includes(v) ? v : "✓";
            hitungKehadiran();
        }

        function hitungKehadiran() {
            if (daftarSiswa.length === 0) return;
            daftarSiswa.forEach((s, idx) => {
                let sVal = 0, iVal = 0, aVal = 0, hVal = 0;
                const totalHari = s.hadir?.length || 0;

                (s.hadir || []).forEach(k => {
                    if (k === "S") sVal++;
                    else if (k === "I") iVal++;
                    else if (k === "A") aVal++;
                    else hVal++;
                });

                let persen = 0;
                if (totalHari > 0) {
                    persen = Math.round((hVal / totalHari) * 100);
                    if (persen > 100) persen = 100;
                }

                document.getElementById(`s-${idx}`).textContent = sVal;
                document.getElementById(`i-${idx}`).textContent = iVal;
                document.getElementById(`a-${idx}`).textContent = aVal;
                document.getElementById(`jml-${idx}`).textContent = hVal;
                document.getElementById(`prsn-${idx}`).textContent = persen + "%";
            });
        }
    </script>
</body>
</html>
