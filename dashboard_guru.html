<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru - E-Rapor Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { 
            background-color: #050505; 
            color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .dashboard-card { 
            background-color: #0a0a0a; 
            border: 1px solid #141414; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-between">

    <div class="w-full max-w-7xl mx-auto flex-1">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 border-b border-zinc-900 pb-5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-purple-600/10 rounded-xl flex items-center justify-center border border-purple-500/20">
                    <i class="fas fa-th-large text-purple-500 text-sm"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black italic tracking-tighter uppercase">E-RAPOR <span class="text-purple-500">DASHBOARD</span></h1>
                    <p class="text-gray-600 text-[9px] font-bold tracking-widest uppercase">SMPN 110 JAKARTA</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <button id="btnSimpan" onclick="simpanSemuaNilaiKeCloud()" disabled class="bg-purple-600 hover:bg-purple-700 disabled:bg-zinc-900 disabled:text-zinc-700 text-white px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider italic flex items-center gap-2 transition opacity-50 disabled:opacity-100 disabled:border disabled:border-zinc-800 shadow-lg shadow-purple-900/10">
                    <i class="fas fa-cloud-upload-alt"></i>
                </button>

                <button id="btnMenuWali" onclick="window.location.href='cetak_rapor.html'" class="hidden bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white px-4 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider italic flex items-center gap-2 transition">
                    <i class="fas fa-print text-purple-500"></i>
                </button>


            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <div class="dashboard-card rounded-2xl p-6 flex items-center gap-4 relative overflow-hidden">
                <div class="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-lg shadow-purple-900/30">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div>
                    <p class="text-gray-600 text-[9px] font-bold tracking-wider uppercase">Selamat Datang,</p>
                    <h3 id="namaGuru" class="text-sm font-black uppercase tracking-tight text-white mt-0.5">-</h3>
                    <p id="nipGuru" class="text-gray-500 font-mono text-[10px] mt-0.5">NIP. -</p>
                </div>
            </div>

            <div class="dashboard-card rounded-2xl p-6 flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-600/10 border border-blue-500/20 rounded-xl flex items-center justify-center text-blue-500 text-lg">
                    <i class="fas fa-book-open"></i>
                </div>
                <div>
                    <p class="text-gray-600 text-[9px] font-bold tracking-wider uppercase">Mengajar Mata Pelajaran</p>
                    <h3 id="mapelGuru" class="text-sm font-black uppercase tracking-tight text-blue-400 mt-0.5">-</h3>
                </div>
            </div>

            <div class="dashboard-card rounded-2xl p-6 flex items-center gap-4">
                <div class="w-12 h-12 bg-emerald-600/10 border border-emerald-500/20 rounded-xl flex items-center justify-center text-emerald-500 text-lg">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <div>
                    <p class="text-gray-600 text-[9px] font-bold tracking-wider uppercase">Status Wali Kelas</p>
                    <h3 id="waliKelasGuru" class="text-sm font-black uppercase tracking-tight text-emerald-400 mt-0.5">-</h3>
                </div>
            </div>
        </div>

        <div class="dashboard-card rounded-2xl p-5 mb-8 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-3">
                <label for="pilihKelas" class="text-xs font-black uppercase tracking-wider text-gray-400">Pilih Kelas Mengajar :</label>
                <select id="pilihKelas" onchange="muatNilaiSiswaDariCloud()" class="bg-zinc-900 border border-zinc-800 text-xs font-bold rounded-xl px-4 py-2.5 outline-none text-white focus:border-purple-600 cursor-pointer min-w-[140px]">
                    <option value="">-- KELAS --</option>
                    <option value="7 A">7 A</option>
                    <option value="7 B">7 B</option>
                    <option value="7 C">7 C</option>
                    <option value="7 D">7 D</option>
                    <option value="7 E">7 E</option>
                    <option value="7 F">7 F</option>
                    <option value="8 A">8 A</option>
                    <option value="8 B">8 B</option>
                    <option value="8 C">8 C</option>
                    <option value="8 D">8 D</option>
                    <option value="8 E">8 E</option>
                    <option value="8 F">8 F</option>
                    <option value="9 A">9 A</option>
                    <option value="9 B">9 B</option>
                    <option value="9 C">9 C</option>
                    <option value="9 D">9 D</option>
                    <option value="9 E">9 E</option>
                    <option value="9 F">9 F</option>
                </select>
            </div>
        </div>

        <div id="kotakNotif" class="hidden mb-6 p-4 rounded-xl text-xs font-bold uppercase tracking-wide border text-center"></div>

        <div class="overflow-x-auto rounded-2xl border border-zinc-900 bg-[#060606] shadow-2xl">
            <table class="w-full text-left border-collapse whitespace-nowrap">
                <thead>
                    <tr class="bg-zinc-900/50 text-gray-400 uppercase text-[10px] font-black tracking-widest border-b border-zinc-900">
                        <th class="py-4 px-5 text-center w-16">No</th>
                        <th class="py-4 px-6 w-32">NIS</th>
                        <th class="py-4 px-6">Nama Siswa</th>
                        <th class="py-4 px-6 text-center w-20">KKM</th>
                        <th class="py-4 px-6 text-center w-28">UH 1</th>
                        <th class="py-4 px-6 text-center w-28">UH 2</th>
                        <th class="py-4 px-6 text-center w-28">ASTS</th>
                        <th class="py-4 px-6 text-center w-28">Nilai Akhir</th>
                    </tr>
                </thead>
                <tbody id="tabelSiswa" class="divide-y divide-zinc-900 text-xs font-semibold">
                    <tr>
                        <td colspan="8" class="text-center py-12 text-gray-500 font-bold uppercase tracking-wider">
                            <i class="fas fa-filter text-purple-500 text-lg mb-2"></i><br>
                            Silakan pilih kelas terlebih dahulu untuk mengisi nilai siswa
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="text-center text-gray-700 text-[10px] font-bold uppercase tracking-widest mt-12 py-4">
        &copy; 2026 SMPN 110 JAKARTA. All Rights Reserved.
    </footer>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbyASGr_jDzLMbaLmNRYLGEvk-Zhafe_6Z5cW8O2aq9Mc_x5rmNKN7q8FFaVoRzaH2Q5/exec";

        var NAMA_GURU = "";
        var MAPEL_GURU = "";
        var WALI_KELAS = "";

        window.onload = function() {
            if (localStorage.getItem("nama_guru")) {
                NAMA_GURU = localStorage.getItem("nama_guru");
                MAPEL_GURU = localStorage.getItem("mapel_guru");
                WALI_KELAS = localStorage.getItem("wali_kelas");

                document.getElementById("namaGuru").innerText = NAMA_GURU;
                document.getElementById("nipGuru").innerText = "NIP. " + (localStorage.getItem("nip_guru") || "-");
                document.getElementById("mapelGuru").innerText = MAPEL_GURU;
                document.getElementById("waliKelasGuru").innerText = WALI_KELAS;

                if (WALI_KELAS && WALI_KELAS.toLowerCase() !== "bukan wali kelas" && WALI_KELAS !== "-") {
                    document.getElementById("btnMenuWali").classList.remove("hidden");
                }
            } else {
                window.location.href = "login.html";
            }
        }

        // FUNGSI MEMBACA DATA SISWA & NILAI DARI CLOUD SPREADSHEET
        async function muatNilaiSiswaDariCloud() {
            const kelasTerpilih = document.getElementById("pilihKelas").value;
            const wadahTabel = document.getElementById("tabelSiswa");
            const btnSimpan = document.getElementById("btnSimpan");

            if (!kelasTerpilih) {
                wadahTabel.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-gray-500 font-bold uppercase tracking-wider"><i class="fas fa-filter text-purple-500 text-lg mb-2"></i><br>Silakan pilih kelas terlebih dahulu untuk mengisi nilai siswa</td></tr>`;
                btnSimpan.disabled = true;
                btnSimpan.classList.add("opacity-50");
                return;
            }

            wadahTabel.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-gray-400 font-bold uppercase tracking-widest animate-pulse"><i class="fas fa-spinner fa-spin text-purple-500 text-lg mb-2"></i><br>Menghubungkan ke Cloud... Mohon Tunggu</td></tr>`;

            try {
                const respon = await fetch(URL_WEB_APP, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        aksi: "ambil_nilai",
                        mapel: MAPEL_GURU,
                        kelas: kelasTerpilih
                    })
                });

                const dataCloud = await respon.json();

                if (dataCloud.success) {
                    let listSiswa = dataCloud.data;

                    listSiswa.sort((a, b) => (a.nama || '').localeCompare(b.nama || ''));

                    if (listSiswa.length === 0) {
                        wadahTabel.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-amber-500 font-bold uppercase tracking-wider">Tidak ada siswa terdaftar di kelas ${kelasTerpilih} untuk mapel ${MAPEL_GURU}.</td></tr>`;
                        btnSimpan.disabled = true;
                        btnSimpan.classList.add("opacity-50");
                        return;
                    }

                    wadahTabel.innerHTML = "";
                    
                    listSiswa.forEach((siswa, index) => {
                        let nomorStr = String(index + 1).padStart(2, '0');
                        let uh1 = Number(siswa.uh1) || 0;
                        let uh2 = Number(siswa.uh2) || 0;
                        let asts = Number(siswa.asts) || 0;
                        let nilaiAkhir = Math.round((uh1 + uh2 + asts) / 3);

                        let barisHtml = `
                            <tr class="baris-siswa-nilai hover:bg-zinc-950/40 transition">
                                <td class="py-4 px-5 text-center text-gray-600 font-mono">${nomorStr}</td>
                                <td class="py-4 px-6"><span class="nis-siswa text-gray-400 font-mono">${siswa.nis}</span></td>
                                <td class="py-4 px-6 text-gray-200 font-bold uppercase tracking-tight nama-siswa">${siswa.nama}</td>
                                <td class="py-4 px-6 text-center text-zinc-500 font-mono">82</td>
                                <td class="py-3 px-6">
                                    <input type="number" value="${uh1}" min="0" max="100" oninput="hitungOtomatisNilaiAkhir(this)" class="input-uh1 w-20 mx-auto block text-center bg-zinc-900 border border-zinc-800 rounded-lg py-1.5 font-mono text-purple-400 font-bold outline-none focus:border-purple-600">
                                </td>
                                <td class="py-3 px-6">
                                    <input type="number" value="${uh2}" min="0" max="100" oninput="hitungOtomatisNilaiAkhir(this)" class="input-uh2 w-20 mx-auto block text-center bg-zinc-900 border border-zinc-800 rounded-lg py-1.5 font-mono text-purple-400 font-bold outline-none focus:border-purple-600">
                                </td>
                                <td class="py-3 px-6">
                                    <input type="number" value="${asts}" min="0" max="100" oninput="hitungOtomatisNilaiAkhir(this)" class="input-asts w-20 mx-auto block text-center bg-zinc-900 border border-zinc-800 rounded-lg py-1.5 font-mono text-blue-400 font-bold outline-none focus:border-blue-600">
                                </td>
                                <td class="py-4 px-6 text-center">
                                    <span class="span-nilai-akhir font-black text-purple-400 font-mono text-sm">${nilaiAkhir}</span>
                                </td>
                            </tr>
                        `;
                        wadahTabel.insertAdjacentHTML("beforeend", barisHtml);
                    });

                    btnSimpan.disabled = false;
                    btnSimpan.classList.remove("opacity-50");

                } else {
                    wadahTabel.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-red-500 font-bold uppercase">Gagal mengambil data: ${dataCloud.message}</td></tr>`;
                }

            } catch (err) {
                console.error(err);
                wadahTabel.innerHTML = `<tr><td colspan="8" class="text-center py-12 text-red-500 font-bold uppercase">Terjadi Gangguan Koneksi Jaringan Internet!</td></tr>`;
            }
        }

        // FUNGSI HITUNG NILAI AKHIR LANGSUNG DI LAYAR SAAT GURU MENGETIK
        function hitungOtomatisNilaiAkhir(elemenInput) {
            const baris = elemenInput.closest(".baris-siswa-nilai");
            let uh1 = Number(baris.querySelector(".input-uh1").value) || 0;
            let uh2 = Number(baris.querySelector(".input-uh2").value) || 0;
            let asts = Number(baris.querySelector(".input-asts").value) || 0;
            
            let hasilRataRata = Math.round((uh1 + uh2 + asts) / 3);
            baris.querySelector(".span-nilai-akhir").innerText = hasilRataRata;
        }

        // FUNGSI MENGIRIM / MENYIMPAN NILAI KE CLOUD SPREADSHEET
        async function simpanSemuaNilaiKeCloud() {
            const kelasTerpilih = document.getElementById("pilihKelas").value;
            const elemenBaris = document.querySelectorAll(".baris-siswa-nilai");
            const btnSimpan = document.getElementById("btnSimpan");
            
            if (elemenBaris.length === 0) return;

            let kumpulanDataNilai = [];

            elemenBaris.forEach(baris => {
                let nis = baris.querySelector(".nis-siswa").innerText.trim();
                let nama = baris.querySelector(".nama-siswa").innerText.trim();
                let uh1 = baris.querySelector(".input-uh1").value || 0;
                let uh2 = baris.querySelector(".input-uh2").value || 0;
                let asts = baris.querySelector(".input-asts").value || 0;

                kumpulanDataNilai.push({
                    nis: nis,
                    nama: nama,
                    mapel: MAPEL_GURU,
                    kelas: kelasTerpilih,
                    uh1: Number(uh1),
                    uh2: Number(uh2),
                    asts: Number(asts)
                });
            });

            btnSimpan.disabled = true;
            btnSimpan.innerHTML = `<i class="fas fa-spinner fa-spin"></i>`;
            tampilkanPesanStatus("Sedang mengunggah data nilai siswa ke database cloud, mohon tunggu...", "proses");

            try {
                const kirimRespon = await fetch(URL_WEB_APP, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({
                        aksi: "simpan_nilai",
                        nilai_siswa: kumpulanDataNilai
                    })
                });

                const hasilKirim = await kirimRespon.json();

                if (hasilKirim.success) {
                    tampilkanPesanStatus("Selamat! Seluruh data nilai berhasil disimpan permanen ke Cloud Spreadsheet.", "sukses");
                } else {
                    tampilkanPesanStatus("Gagal Menyimpan: " + hasilKirim.message, "gagal");
                }

            } catch (e) {
                console.error(e);
                tampilkanPesanStatus("Gagal terkoneksi ke server! Periksa koneksi internet Anda.", "gagal");
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.innerHTML = `<i class="fas fa-cloud-upload-alt"></i>`;
            }
        }

        // FUNGSI TAMPILKAN BANNER NOTIFIKASI STATUS
        function tampilkanPesanStatus(pesan, jenis) {
            const box = document.getElementById("kotakNotif");
            box.innerText = pesan;
            box.classList.remove("hidden", "bg-purple-950/40", "border-purple-800", "text-purple-400", "bg-emerald-950/40", "border-emerald-800", "text-emerald-400", "bg-red-950/40", "border-red-800", "text-red-400");

            if (jenis === "proses") {
                box.classList.add("block", "bg-purple-950/40", "border-purple-800", "text-purple-400");
            } else if (jenis === "sukses") {
                box.classList.add("block", "bg-emerald-950/40", "border-emerald-800", "text-emerald-400");
                setTimeout(() => { box.classList.add("hidden"); }, 5000);
            } else if (jenis === "gagal") {
                box.classList.add("block", "bg-red-950/40", "border-red-800", "text-red-400");
            }
        }

        document.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                const btnSimpan = document.getElementById("btnSimpan");
                if(!btnSimpan.disabled) {
                    simpanSemuaNilaiKeCloud();
                }
            }
        });

        function logoutGuru() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
