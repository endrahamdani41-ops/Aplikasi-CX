<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Guru - SMPN 110 JAKARTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #e2e8f0; 
            font-family: 'Segoe UI', sans-serif; 
            overflow-x: hidden; 
        }
        .glass { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(148, 163, 184, 0.18); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .check-item input:checked + span { 
            background: linear-gradient(135deg, #6366f1, #8b5cf6); 
            border-color: #8b5cf6; 
            color: white; 
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.4);
        }
        input, select, textarea { font-size: 16px !important; }

        /* Gaya Tabel dengan Garis Rapi */
        .tabel-garis {
            border-collapse: collapse;
            width: 100%;
        }
        .tabel-garis th,
        .tabel-garis td {
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 8px 6px;
        }
        .tabel-garis th {
            background-color: rgba(15, 23, 42, 0.6);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.3px;
        }
        .tabel-garis tr:nth-child(even) {
            background-color: rgba(30, 41, 59, 0.2);
        }
        .tabel-garis tr:hover {
            background-color: rgba(99, 102, 241, 0.08);
        }

        /* Bungkus tabel agar bisa digeser di HP */
        .bungkus-tabel {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="p-3 md:p-6">
    <div class="max-w-[1800px] mx-auto">
        <header class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-6">
            <div class="text-center sm:text-left">
                <h1 class="text-xl font-bold text-indigo-400">SMPN 110 JAKARTA</h1>
                <p class="text-slate-500 text-xs">Sistem Database Presensi Guru</p>
            </div>
            <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all duration-300 shadow-lg hover:shadow-emerald-900/20 w-full sm:w-auto justify-center">
                <i class="fa-solid fa-file-excel"></i> Laporan Excel
            </button>
        </header>

        <div class="grid lg:grid-cols-12 gap-6">
            <!-- Form Input: Penuh di HP, 4 kolom di layar besar -->
            <div class="lg:col-span-4">
                <div class="glass p-4 rounded-2xl">
                    <h3 class="text-white font-semibold mb-5 text-sm uppercase tracking-widest flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-gradient-to-b from-indigo-400 to-purple-500 rounded-full"></span> Input Presensi
                    </h3>
                    
                    <form id="formPresensi" class="space-y-4">
                        <div class="grid grid-cols-3 gap-3">
                            <div class="col-span-2">
                                <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Tanggal</label>
                                <input type="date" id="tanggal_input" name="tanggal_input" class="w-full mt-1 p-3 rounded-xl bg-slate-800/80 border border-slate-700/60 outline-none text-white transition-all focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30" required>
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Status</label>
                                <select name="status" class="w-full mt-1 p-3 rounded-xl bg-slate-800/80 border border-slate-700/60 outline-none text-white transition-all focus:border-indigo-500/50">
                                    <option value="">-- Alasan --</option>
                                    <option>Sakit</option><option>Izin</option><option>Alpha</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Nama Guru</label>
                            <select name="teacher_name" class="w-full mt-1 p-3 rounded-xl bg-slate-800/80 border border-slate-700/60 outline-none text-white transition-all focus:border-indigo-500/50" required>
                                <option value="">-- Pilih Guru --</option>
                                <option>Sunardi, M.Pd.</option><option>Popy, S.Ag.</option><option>Purwanto, S.Pd.</option>
                                <option>Sri Murwani, M.Pd.</option><option>Endang Retna Ningsih, M.Pd.</option><option>Badriah, M.Pd.</option>
                                <option>Lelalahi, S.Pd.</option><option>Endra Triyanto Hamdani, S.Kom.</option>
                                <option>Asril Yansah, S.Pd.</option><option>Sukiswati, S.Pd.Ing.</option>
                                <option>Muh. Nurus Syiroj, S.Pd.</option>
                                <option>Suningsih, S.Pd.</option><option>Bahrul Ulum, S.Pd.</option>
                                <option>Siti Maimona, S.Pd.I, M.M.</option><option>Sapari, S.Pd.</option>
                                <option>Hani Realita Alvi, S.Pd.</option>
                                <option>Amrullah, S.Pd.I, S.Pd.</option>
                                <option>Eny Setyowati, S.Pd.</option>
                                <option>Hasbi Nurhidayat, S.Sos.I</option>
                                <option>Nurina Permatasari, S.Pd.</option>
                                <option>Heru Damara, S.Pd.</option>
                                <option>Endah Sulstyorini, M.Pd.</option>
                                <option>Riswadi, S.Pd.</option>
                                <option>Sidiq Prakoso, S.Pd.</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Mata Pelajaran</label>
                            <div class="space-y-2 mt-1 bg-slate-900/40 p-3 rounded-xl border border-slate-800/60">
                                <div class="grid grid-cols-3 gap-2">
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="PAI" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">PAI</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Pendidikan Pancasila" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">P. Pancasila</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Bahasa Indonesia" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">B. Indonesia</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Matematika" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">Matematika</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="IPA" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">IPA</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="IPS" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">IPS</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Bahasa Inggris" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">B. Inggris</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="PJOK" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">PJOK</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Informatika" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">Informatika</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="Seni Budaya" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">Seni Budaya</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="subject_check" value="BK" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">BK</span></label>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Pilih Kelas</label>
                            <div class="space-y-2 mt-1 bg-slate-900/40 p-3 rounded-xl border border-slate-800/60">
                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7A" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7A</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7B" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7B</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7C" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7C</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7D" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7D</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7E" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7E</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="7F" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7F</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8A" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8A</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8B" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8B</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8C" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8C</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8D" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8D</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8E" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8E</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="8F" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8F</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9A" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9A</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9B" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9B</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9C" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9C</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9D" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9D</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9E" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9E</span></label>
                                    <label class="check-item cursor-pointer"><input type="checkbox" name="class_checkbox" value="9F" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9F</span></label>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Jam Ke</label>
                            <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-1">
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="1" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">1</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="2" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">2</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="3" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">3</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="4" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">4</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="5" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">5</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="6" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">6</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="7" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">7</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="8" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">8</span></label>
                                <label class="check-item cursor-pointer"><input type="checkbox" name="hour_check" value="9" class="hidden"><span class="block text-center py-2 rounded-lg border border-slate-700/70 text-xs font-semibold text-slate-400 transition-all">9</span></label>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] text-slate-500 font-semibold ml-1 uppercase">Keterangan / Alasan</label>
                            <textarea name="reason" class="w-full mt-1 p-3 rounded-xl bg-slate-800/80 border border-slate-700/60 outline-none text-white text-sm transition-all focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30" placeholder="Alasan ketidakhadiran..."></textarea>
                        </div>
                        
                        <button type="submit" id="btnSimpan" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 p-3.5 rounded-xl font-semibold uppercase tracking-widest active:scale-95 transition-all duration-300 shadow-lg shadow-indigo-900/20 flex justify-center items-center gap-2">
                            <span>Simpan ke Google Sheet</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tabel: Penuh di HP, 8 kolom di layar besar -->
            <div class="lg:col-span-8">
                <div class="glass rounded-2xl overflow-hidden shadow-2xl mb-6">
                    <h4 class="px-5 pt-4 pb-3 text-sm font-semibold text-slate-300 uppercase tracking-wider text-center">Rekapitulasi</h4>
                    <div class="bungkus-tabel">
                        <table class="tabel-garis">
                            <thead>
                                <tr>
                                    <th class="w-12 text-center">NO.</th>
                                    <th>NAMA GURU</th>
                                    <th class="w-24 text-center">JUMLAH</th>
                                </tr>
                            </thead>
                            <tbody id="tabelBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="relative mb-5">
                    <input type="text" id="search" placeholder="Cari histori lengkap..." class="w-full p-3.5 pl-12 rounded-2xl glass outline-none text-sm border-none shadow-xl transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
                
                <div class="glass rounded-2xl overflow-hidden shadow-2xl">
                    <div class="bungkus-tabel">
                        <table class="tabel-garis text-[11px]" id="tabel-lengkap">
                            <thead>
                                <tr>
                                    <th>TANGGAL</th>
                                    <th>NAMA GURU</th>
                                    <th>MAPEL</th>
                                    <th>KELAS</th>
                                    <th>JAM</th>
                                    <th>ALASAN</th>
                                </tr>
                            </thead>
                            <tbody id="tabelLengkapBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <table id="tabel-ekspor" style="display:none">
        <thead>
            <tr><th>No.</th><th>Tanggal</th><th>Nama Guru</th><th>Status</th><th>Mata Pelajaran</th><th>Kelas</th><th>Jam Ke</th><th>Alasan</th></tr>
        </thead>
        <tbody id="tabelEksporBody"></tbody>
    </table>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm_NnsANbjQtY53AMv4DIsnp7kve27BkB-DKrIFk4vupx26Vnf_nMYGeXMBck5qN_CsA/exec";

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("tanggal_input").value = new Date().toISOString().slice(0, 10);
            muatDataRiwayat();
        });

        function hitungRingkasan(dataPresensi) {
            const hitungGuru = dataPresensi.reduce((h, i) => {
                h[i.nama_guru] = (h[i.nama_guru] || 0) + 1;
                return h;
            }, {});

            const urut = Object.entries(hitungGuru).sort((a,b) => b[1] - a[1]);

            document.getElementById("tabelBody").innerHTML = "";
            urut.forEach((g, idx) => {
                document.getElementById("tabelBody").innerHTML += `
                <tr>
                    <td class="text-center text-slate-400">${idx+1}</td>
                    <td class="font-semibold">${g[0]}</td>
                    <td class="text-center font-bold text-rose-400">${g[1]}</td>
                </tr>`;
            });
        }

        function muatDataRiwayat() {
            document.getElementById("tabelLengkapBody").innerHTML = "";
            document.getElementById("tabelEksporBody").innerHTML = "";

            fetch(SCRIPT_URL)
            .then(r=>r.json()).then(res=>{
                if(res.status==="berhasil" && Array.isArray(res.data)){
                    hitungRingkasan(res.data);
                    res.data.reverse().forEach((b,no)=>{
                        document.getElementById("tabelLengkapBody").innerHTML += `
                        <tr>
                            <td>${b.tanggal.split("-").reverse().join("/")}</td>
                            <td class="font-medium">${b.nama_guru}</td>
                            <td>${b.mata_pelajaran}</td>
                            <td class="text-center">${b.kelas}</td>
                            <td class="text-center">${b.jam_ke}</td>
                            <td class="italic">${b.alasan||"-"}</td>
                        </tr>`;
                        document.getElementById("tabelEksporBody").innerHTML += `
                        <tr><td>${no+1}</td><td>${b.tanggal}</td><td>${b.nama_guru}</td><td>${b.status||"-"}</td><td>${b.mata_pelajaran}</td><td>${b.kelas}</td><td>${b.jam_ke}</td><td>${b.alasan||"-"}</td></tr>`;
                    });
                }
            }).catch(e=>alert("Gagal memuat data: "+e.message));
        }

        document.getElementById("formPresensi").addEventListener("submit", e=>{
            e.preventDefault();
            const btn = document.getElementById("btnSimpan");
            btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

            const mapel = [...document.querySelectorAll("[name=subject_check]:checked")].map(c=>c.value);
            const kelas = [...document.querySelectorAll("[name=class_checkbox]:checked")].map(c=>c.value);
            const jam = [...document.querySelectorAll("[name=hour_check]:checked")].map(c=>c.value);
            if(!mapel.length||!kelas.length||!jam.length){alert("Lengkapi semua pilihan!"); btn.disabled=false; btn.innerHTML="Simpan ke Google Sheet"; return;}

            const fd = new FormData(e.target);
            const d = new URLSearchParams();
            d.append("tanggal_input", fd.get("tanggal_input"));
            d.append("teacher_name", fd.get("teacher_name"));
            d.append("status", fd.get("status")||"-");
            d.append("subject", mapel.join(", "));
            d.append("class_name", kelas.join(", "));
            d.append("class_hour", jam.join(", "));
            d.append("reason", fd.get("reason").trim()||"-");

            fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", body:d}).then(()=>{
                alert("✅ Data tersimpan!"); muatDataRiwayat(); e.target.reset();
                document.getElementById("tanggal_input").value = new Date().toISOString().slice(0,10);
            }).catch(e=>alert("❌ Gagal menyimpan: "+e.message)).finally(()=>{btn.disabled=false; btn.innerHTML="Simpan ke Google Sheet";});
        });

        document.getElementById("search").addEventListener("keyup", function(){
            const k = this.value.toLowerCase();
            document.querySelectorAll("#tabelLengkapBody tr").forEach(r=>{
                r.style.display = r.innerText.toLowerCase().includes(k)?"":"none";
            });
        });

        function exportExcel(){
            const b = XLSX.utils.table_to_book(document.getElementById("tabel-ekspor"), {sheet:"Presensi_Guru"});
            XLSX.writeFile(b, `Presensi_Guru_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
