    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwm_NnsANbjQtY53AMv4DIsnp7kve27BkB-DKrIFk4vupx26Vnf_nMYGeXMBck5qN_CsA/exec";
        let nomorUrut = 1;
        let grafik;

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("tanggal_input").value = new Date().toISOString().slice(0, 10);
            muatDataRiwayat();
        });

        // === GRAFIK: NAMA GURU PER BULAN ===
        function buatGrafik(dataPresensi) {
            const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const warnaGuru = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f43f5e','#14b8a6','#a855f7','#6366f1'];

            // Ambil semua bulan yang ada di data
            const daftarBulan = [...new Set(dataPresensi.map(item => {
                const tgl = new Date(item.tanggal);
                return `${namaBulan[tgl.getMonth()]} ${tgl.getFullYear()}`;
            }))].sort((a,b) => {
                const [blnA, thnA] = a.split(' ');
                const [blnB, thnB] = b.split(' ');
                return new Date(`${blnA} 1, ${thnA}`) - new Date(`${blnB} 1, ${thnB}`);
            });

            // Ambil semua nama guru yang ada
            const daftarGuru = [...new Set(dataPresensi.map(i => i.nama_guru))];

            // Susun data per guru per bulan
            const kumpulanData = daftarGuru.map((guru, idx) => {
                const hitung = daftarBulan.map(bulan => {
                    return dataPresensi.filter(item => {
                        const tgl = new Date(item.tanggal);
                        const kunci = `${namaBulan[tgl.getMonth()]} ${tgl.getFullYear()}`;
                        return item.nama_guru === guru && kunci === bulan;
                    }).length;
                });
                return {
                    label: guru,
                    data: hitung,
                    backgroundColor: warnaGuru[idx % warnaGuru.length],
                    borderRadius: 6,
                    borderWidth: 0
                };
            });

            document.getElementById("totalSemua").innerText = dataPresensi.length;
            document.getElementById("totalTidakMasuk").innerText = daftarGuru.length;

            if(grafik) grafik.destroy();
            const ctx = document.getElementById("grafikPresensi").getContext("2d");

            grafik = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: daftarBulan,
                    datasets: kumpulanData
                },
                options: {
                    responsive: true,
                    layout: { padding: { top: 5, bottom: 5 } },
                    plugins: { 
                        legend: { 
                            position: 'top',
                            labels: { font: { size: 9.5 }, boxWidth: 12, padding: 12 }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.92)',
                            borderColor: 'rgba(148, 163, 184, 0.2)',
                            borderWidth: 1,
                            padding: 10,
                            titleFont: { size: 12, weight: '600' },
                            bodyFont: { size: 11 },
                            callbacks: {
                                label: function(info) {
                                    return `${info.dataset.label}: ${info.raw} kali`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true,
                            stacked: true,
                            ticks: { color: "#94a3b8", font: { size: 10.5 }, precision: 0 }, 
                            grid: { color: "rgba(148, 163, 184, 0.08)", lineWidth: 1 }
                        },
                        x: { 
                            stacked: true,
                            ticks: { color: "#64748b", font: { size: 10 } }, 
                            grid: { display: false } 
                        }
                    }
                }
            });
        }

        function muatDataRiwayat() {
            console.log("🔄 Memuat data...");
            document.getElementById("tabelBody").innerHTML = "";
            document.getElementById("tabelEksporBody").innerHTML = "";
            nomorUrut = 1;

            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(respon => {
                console.log("✅ Data diterima:", respon);
                if(respon.status === "berhasil" && Array.isArray(respon.data)) {
                    if(respon.data.length === 0) {
                        buatGrafik([]);
                        return console.log("Belum ada data");
                    }
                    respon.data.reverse().forEach(baris => {
                        tambahKeTabel(baris.tanggal, baris.nama_guru, baris.status, baris.mata_pelajaran, baris.kelas, baris.jam_ke, baris.alasan);
                    });
                    buatGrafik(respon.data);
                }
            })
            .catch(err => alert("Gagal memuat: " + err.message));
        }

        function tambahKeTabel(tgl, nama, status, mapel, kelas, jam, alasan) {
            jam = String(jam).replace(/[^0-9, ]/g, "").trim() || "-";
            const tglBiasa = tgl.split("-").reverse().join("/");

            const barisTampil = `
                <tr class="search-item hover:bg-slate-800/30 transition-colors">
                    <td class="text-center font-semibold text-slate-400">${nomorUrut}</td>
                    <td class="text-slate-400">${tglBiasa}</td>
                    <td class="font-semibold text-white">${nama}</td>
                    <td class="text-slate-400">${mapel}</td>
                    <td class="text-center font-semibold text-blue-400">${kelas}</td>
                    <td class="text-center font-mono text-purple-400">${jam}</td>
                    <td class="text-slate-400 italic">${alasan}</td>
                </tr>`;

            const barisEkspor = `
                <tr>
                    <td>${nomorUrut}</td><td>${tgl}</td><td>${nama}</td><td>${status || "-"}</td><td>${mapel}</td><td>${kelas}</td><td>${jam}</td><td>${alasan}</td>
                </tr>`;

            document.getElementById("tabelBody").insertAdjacentHTML("beforeend", barisTampil);
            document.getElementById("tabelEksporBody").insertAdjacentHTML("beforeend", barisEkspor);
            nomorUrut++;
        }

        document.getElementById("formPresensi").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("btnSimpan");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Memproses...`;

            let checkedSubjects = [...document.querySelectorAll("input[name='subject_check']:checked")].map(cb => cb.value);
            if (!checkedSubjects.length) { alert("Pilih minimal satu mata pelajaran!"); btn.disabled = false; btn.innerHTML = "Simpan ke Google Sheet"; return; }

            let checkedClasses = [...document.querySelectorAll("input[name='class_checkbox']:checked")].map(cb => cb.value);
            if (!checkedClasses.length) { alert("Pilih minimal satu kelas!"); btn.disabled = false; btn.innerHTML = "Simpan ke Google Sheet"; return; }

            let checkedHours = [...document.querySelectorAll("input[name='hour_check']:checked")].map(cb => cb.value);
            if (!checkedHours.length) { alert("Pilih minimal satu jam!"); btn.disabled = false; btn.innerHTML = "Simpan ke Google Sheet"; return; }

            const form = new FormData(this);
            const data = new URLSearchParams();
            data.append("tanggal_input", form.get("tanggal_input"));
            data.append("teacher_name", form.get("teacher_name"));
            data.append("status", form.get("status") || "-");
            data.append("subject", checkedSubjects.join(", "));
            data.append("class_name", checkedClasses.join(", "));
            data.append("class_hour", checkedHours.join(", "));
            data.append("reason", form.get("reason").trim() || "-");

            fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: data })
            .then(() => {
                alert("✅ Tersimpan!");
                muatDataRiwayat();
                this.reset();
                document.getElementById("tanggal_input").value = new Date().toISOString().slice(0,10);
            })
            .catch(err => alert("❌ Gagal: " + err.message))
            .finally(() => { btn.disabled = false; btn.innerHTML = "Simpan ke Google Sheet"; });
        });

        document.getElementById("search").addEventListener("keyup", function() {
            const kata = this.value.toLowerCase();
            document.querySelectorAll(".search-item").forEach(baris => {
                baris.style.display = baris.innerText.toLowerCase().includes(kata) ? "" : "none";
            });
        });

        function exportExcel() {
            const buku = XLSX.utils.table_to_book(document.getElementById("tabel-ekspor"), { sheet: "Presensi" });
            XLSX.writeFile(buku, `Presensi_Guru_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
    </script>
</body>
</html>
