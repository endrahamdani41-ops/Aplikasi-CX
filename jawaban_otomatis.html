<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Form Assistant (Secure)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: { bg: '#0f172a', card: '#1e293b', input: '#334155', border: '#475569' } } } }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .ai-response-box { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.7; }
        .ai-response-box strong { color: #818cf8; display: block; margin-top: 0.75rem; margin-bottom: 0.25rem; font-size: 1.05em; }
        .ai-response-box ul { list-style-type: none; padding-left: 0; margin-top: 0.5rem; }
        .ai-response-box li { background-color: #1e293b; margin-bottom: 0.5rem; padding: 0.6rem 0.8rem; border-radius: 0.5rem; border-left: 4px solid #6366f1; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0f172a; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        @media (max-width: 768px) { textarea { font-size: 16px !important; } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-inner"><i class="fas fa-magic text-white text-sm"></i></div>
                <h1 class="text-lg font-bold tracking-wide text-white">AI Assistant <span class="text-indigo-400 text-xs font-normal">(Secure)</span></h1>
            </div>
            <button onclick="showConfig()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs px-3 py-2 rounded-lg transition border border-slate-600 flex items-center cursor-pointer">
                <i class="fas fa-cog mr-2"></i> Setup
            </button>
        </div>
    </header>

    <!-- Config Modal -->
    <div id="config-modal" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full shadow-2xl border border-slate-600 relative">
            <h3 class="text-lg font-bold text-white mb-2 flex items-center"><i class="fas fa-shield-alt mr-2 text-green-400"></i> Setup Akses</h3>
            <p class="text-xs text-slate-400 mb-4">
                Masukkan kredensial akses Anda. Data ini hanya tersimpan di browser lokal dan tidak akan terlihat di source code.
            </p>
            <input type="password" id="user-token" placeholder="Tempel kredensial di sini..." 
                class="w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm mb-4 bg-slate-900 text-white font-mono placeholder-slate-500">
            <div class="flex justify-end space-x-3">
                <button onclick="storeToken()" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 shadow-lg w-full">Simpan & Mulai</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-6xl flex-grow">
        <!-- Input Section -->
        <section class="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700 flex flex-col h-full">
            <div class="mb-4">
                <h2 class="text-base font-bold text-indigo-400 flex items-center mb-1"><i class="fas fa-paste mr-2"></i> Tempel Soal</h2>
                <p class="text-[10px] text-slate-400">Salin teks soal dari Google Form.</p>
            </div>
            <textarea id="question-input" rows="10" placeholder="Contoh:&#10;1. Berapakah nilai desimal dari biner 11011?&#10;2. Ubah Infix P + Q * R ke Postfix!"
                class="w-full px-4 py-3 border border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm resize-y bg-slate-900 text-slate-200 placeholder-slate-500"></textarea>
            <div class="mt-5 flex space-x-3">
                <button onclick="processRequest()" id="submit-btn" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition font-medium flex items-center justify-center shadow-lg active:scale-95 cursor-pointer">
                    <i class="fas fa-paper-plane mr-2"></i> Proses
                </button>
                <button onclick="clearData()" class="px-4 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition cursor-pointer" title="Reset"><i class="fas fa-redo"></i></button>
            </div>
        </section>

        <!-- Output Section -->
        <section class="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700 flex flex-col h-full">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
                <h2 class="text-base font-bold text-yellow-400 flex items-center"><i class="fas fa-lightbulb mr-2"></i> Hasil</h2>
                <button onclick="copyOutput()" class="text-[10px] bg-slate-700 text-indigo-300 px-3 py-1.5 rounded border border-slate-600 hover:bg-slate-600 transition cursor-pointer"><i class="fas fa-copy mr-1"></i> Salin</button>
            </div>
            <div id="result-area" class="p-4 bg-slate-900 rounded-lg text-sm text-slate-300 h-64 overflow-y-auto whitespace-pre-wrap border border-slate-700 ai-response-box flex-grow">
                <span class="text-slate-500 italic block text-center mt-20">Menunggu input...</span>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-700 flex justify-between items-center">
                <span id="status-text" class="text-[10px] text-slate-500 font-medium">Siap.</span>
                <span id="model-info" class="text-[9px] text-slate-600 uppercase tracking-wider"></span>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-slate-600 text-[10px] border-t border-slate-800 bg-slate-900">
        &copy; 2026 AI Assistant. Secure LocalStorage Edition.
    </footer>

    <script>
        // KONFIGURASI MODEL
        const TARGET_MODEL = 'openrouter/auto'; 
        
        // Fungsi utilitas untuk mengambil data dari penyimpanan lokal
        function retrieveLocalData() {
            return localStorage.getItem('app_user_token') || '';
        }

        // Tampilkan modal konfigurasi saat halaman dimuat jika data belum ada
        window.onload = function() {
            if (!retrieveLocalData()) {
                showConfig();
            }
        };

        function showConfig() {
            const modal = document.getElementById('config-modal');
            modal.classList.toggle('hidden');
            if(!modal.classList.contains('hidden')) {
                document.getElementById('user-token').value = retrieveLocalData();
                setTimeout(() => document.getElementById('user-token').focus(), 100);
            }
        }

        function storeToken() {
            const val = document.getElementById('user-token').value.trim();
            if(!val) { alert('Data tidak boleh kosong!'); return; }
            
            // Simpan ke LocalStorage dengan nama variabel yang netral
            localStorage.setItem('app_user_token', val);
            showConfig();
            updateStatus('Konfigurasi berhasil disimpan.', 'text-green-400');
        }

        function updateStatus(msg, color = 'text-slate-500') {
            const el = document.getElementById('status-text');
            el.textContent = msg;
            el.className = `text-[10px] font-medium ${color}`;
        }

        async function processRequest() {
            const q = document.getElementById('question-input').value.trim();
            const out = document.getElementById('result-area');
            const btn = document.getElementById('submit-btn');
            const lbl = document.getElementById('model-info');
            const authData = retrieveLocalData();

            if(!q) { alert('Masukkan data dulu!'); return; }
            
            if(!authData) {
                alert('Konfigurasi belum diatur! Silakan klik tombol "Setup" di pojok kanan atas.');
                showConfig();
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-hourglass-half mr-2"></i> Memproses...';
            btn.classList.add('opacity-75');
            updateStatus('Menghubungkan layanan...', 'text-indigo-400');
            out.innerHTML = '<div class="flex items-center justify-center h-full text-slate-500"><i class="fas fa-circle-notch fa-spin mr-2"></i> Thinking...</div>';
            lbl.textContent = '';

            const prompt = `Anda adalah asisten ahli pengisi soal ujian. Berikan jawaban AKURAT dan LANGSUNG.
Aturan:
1. Pilihan Ganda: Tulis huruf jawaban (A/B/C/D) + teks opsi + penjelasan singkat.
2. Isian/Uraian: Jawaban langsung.
3. Gunakan format tebal (**Jawaban:**) untuk poin penting.

Soal:
${q}`;

            try {
                updateStatus('Sedang memproses...', 'text-yellow-400');
                const result = await fetchExternalService(TARGET_MODEL, prompt, authData);
                
                out.innerHTML = formatOutput(result);
                updateStatus('Selesai!', 'text-green-400');
                lbl.textContent = `Source: Auto-Free`;

            } catch (error) {
                out.innerHTML = `<div class="text-red-400 font-medium"><i class="fas fa-exclamation-circle mr-1"></i> Gagal: ${error.message}</div>`;
                updateStatus('Gagal.', 'text-red-400');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Proses';
                btn.classList.remove('opacity-75');
            }
        }

        async function fetchExternalService(model, text, token) {
            // Menggunakan endpoint OpenRouter
            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': window.location.href,
                    'X-Title': 'AI Form Assistant'
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: "user", content: text }],
                    provider: { order: ["Free"], allow_fallbacks: true }
                })
            });
            
            const data = await res.json();
            if (data.error) throw new Error(data.error.message || `HTTP ${res.status}`);
            return data.choices[0].message.content;
        }

        function formatOutput(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        }

        function copyOutput() {
            const txt = document.getElementById('result-area').innerText;
            if(txt.includes('Menunggu') || txt.includes('Gagal')) return;
            navigator.clipboard.writeText(txt).then(() => {
                const btn = event.currentTarget;
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check mr-1"></i> Tersalin';
                setTimeout(() => btn.innerHTML = original, 2000);
            });
        }

        function clearData() {
            document.getElementById('question-input').value = '';
            document.getElementById('result-area').innerHTML = '<span class="text-slate-500 italic block text-center mt-20">Menunggu input...</span>';
            updateStatus('Reset.', 'text-slate-500');
        }
    </script>
</body>
</html>
