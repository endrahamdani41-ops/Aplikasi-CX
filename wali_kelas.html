<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Rangkuman Wali Kelas - Eye Care Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f11; color: #cbd5e1; padding: 30px 20px; }
        .table-container { background: #141418; padding: 28px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #1f1f25; }
        
        h4 { font-weight: 700; letter-spacing: -0.5px; }
        
        .table { border-collapse: separate; border-spacing: 0 6px; margin-top: 15px; background-color: transparent !important; }
        
        .table thead th { 
            background-color: rgba(99, 102, 241, 0.15) !important; 
            color: #818cf8 !important; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 14px; 
            text-align: center; 
            vertical-align: middle;
            letter-spacing: 1.2px; 
            padding: 16px 14px; 
            border: 1px solid rgba(99, 102, 241, 0.2) !important; 
            border-width: 1px 0 !important; 
        }
        .table thead th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-left: 1px solid rgba(99, 102, 241, 0.2) !important; }
        .table thead th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-right: 1px solid rgba(99, 102, 241, 0.2) !important; }
        
        .table tbody tr { background-color: #1a1a22 !important; transition: all 0.15s; }
        .table tbody tr:nth-of-type(even) { background-color: #1e1e27 !important; }
        .table tbody tr:hover { background-color: #262633 !important; transform: translateY(-1px); }
        
        .table tbody td { padding: 14px; color: #cbd5e1; border: none !important; vertical-align: middle; text-align: center; background: transparent !important; }
        .table tbody td.nama { text-align: left; font-weight: 600; color: #f8fafc; }
        
        .table tbody tr td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .table tbody tr td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        
        .badge-ekskul { font-size: 11px; margin: 3px 0; padding: 6px 12px; border-radius: 6px; font-weight: 500; display: inline-block; }
        .text-nilai-huruf { font-weight: 700; font-size: 14px; color: #4ade80; margin: 3px 0; padding: 4px 0; display: inline-block; }
        
        .btn-refresh { background-color: transparent; border: 1px solid #2d2d39; color: #94a3b8; border-radius: 10px; padding: 8px 16px; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-refresh:hover { background-color: #1a1a22; border-color: #6366f1; color: #fff; }
        
        .status-refresh { font-size: 12px; color: #818cf8; font-weight: 500; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h4 class="text-white mb-1" id="judulWali">📋 Jurnal Rangkuman Wali Kelas</h4>
                <div class="d-flex align-items-center gap-2">
                    <p class="text-muted small mb-0">Halaman pantauan khusus keanggotaan dan rekap nilai siswa kelas Anda.</p>
                    <span class="status-refresh">• 🔄 Auto-refresh (5s)</span>
                </div>
            </div>
            <button class="btn btn-refresh" onclick="muatDataSiswa()">🔄 REFRESH SEKARANG</button>
        </div>
        <div class="table-responsive">
            <table class="table text-light">
                <thead>
                    <tr>
                        <th style="width: 5%;">No</th>
                        <th style="width: 12%;">NIS</th>
                        <th style="width: 30%;">Nama Murid</th>
                        <th style="width: 8%;">L/P</th>
                        <th style="width: 10%;">Kelas</th>
                        <th style="width: 20%;">Ekstrakurikuler</th>
                        <th style="width: 15%;">Nilai Huruf</th>
                    </tr>
                </thead>
                <tbody id="bodyWaliKelas">
                    <tr><td colspan="7" class="text-center text-muted py-5">Mengambil data kelas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPxCfRs117TPyQVJ_9otGqwVkZUj6YRE00wo7D1NxP51UkGcmefb1VGjhfFTtgfPLfvQ/exec";
    let kelasAktifGlobal = "";

    function muatDataSiswa() {
        const tbody = document.getElementById('bodyWaliKelas');
        const urlParams = new URLSearchParams(window.location.search);
        kelasAktifGlobal = urlParams.get('kelas') || "8A"; 
        document.getElementById('judulWali').innerText = "📋 Jurnal Rangkuman Ekskul: KELAS " + kelasAktifGlobal.toUpperCase();

        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            tbody.innerHTML = '';
            let nomorUrut = 1;

            data.forEach((murid) => {
                if (murid.kelas.toUpperCase() !== kelasAktifGlobal.toUpperCase()) return;

                let tampilanEkskul = "";
                let tampilanNilai = "";
                
                if (murid.ekskul && murid.ekskul.length > 0) {
                    let listEkskulBadges = [];
                    let listNilaiStrings = [];
                    
                    murid.ekskul.forEach(ekskul => {
                        if(ekskul.trim() === "") return;
                        
                        let warnaBadge = "bg-secondary text-secondary bg-opacity-10";
                        if (ekskul === "Futsal") warnaBadge = "bg-danger text-danger bg-opacity-10";
                        else if (ekskul === "Tari") warnaBadge = "bg-warning text-warning bg-opacity-10";
                        else if (ekskul === "Pencak Silat") warnaBadge = "bg-success text-success bg-opacity-10";
                        else if (ekskul === "Drum Band") warnaBadge = "bg-info text-info bg-opacity-10";
                        
                        listEkskulBadges.push(`<span class="badge ${warnaBadge} badge-ekskul">${ekskul}</span>`);
                        
                        let hurufNilai = (murid.nilaiMap && murid.nilaiMap[ekskul]) ? murid.nilaiMap[ekskul] : "-";
                        listNilaiStrings.push(`<span class="text-nilai-huruf">${hurufNilai}</span>`);
                    });
                    
                    tampilanEkskul = listEkskulBadges.join("<br>");
                    tampilanNilai = listNilaiStrings.join("<br>");
                } 
                
                if (tampilanEkskul === "") {
                    tampilanEkskul = `<span style="color: #4b5563; font-style: italic; font-size: 13px;">Belum memilih ekskul</span>`;
                    tampilanNilai = `<span style="color: #4b5563;">-</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="color: #64748b; font-weight: 500;">${nomorUrut++}</td>
                        <td style="color: #94a3b8;">${murid.nis}</td>
                        <td class="nama">${murid.nama}</td>
                        <td><span class="badge ${murid.lp === 'L' ? 'bg-primary' : 'bg-danger'} bg-opacity-20 text-opacity-100 p-2" style="font-size:11px; width:24px;">${murid.lp}</span></td>
                        <td style="font-weight:600; color: #fbbf24;">${murid.kelas}</td>
                        <td>${tampilanEkskul}</td>
                        <td>${tampilanNilai}</td>
                    </tr>`;
            });
            
            if(tbody.innerHTML === "") {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-5">Tidak ada data siswa untuk kelas ${kelasAktifGlobal}</td></tr>`;
            }
        }).catch(err => {
            console.log("Koneksi gagal disegarkan secara otomatis.");
        });
    }

    window.onload = function() {
        muatDataSiswa();
        // Berjalan otomatis re-fetch dari sheets setiap 5 detik
        setInterval(muatDataSiswa, 5000);
    };
</script>
</body>
</html>
