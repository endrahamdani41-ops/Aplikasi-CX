<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ikon Meledak + Asap Tepat di Ikon</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* === Tema Terang & Gelap === */
        :root {
            --body-bg: #ffffff;
            --text-color: #222222;
            --toggle-btn-bg: #2c3e50;
            --toggle-btn-hover: #1a252f;
            --tooltip-bg: rgba(0,0,0,0.85);
            --tooltip-color: #ffffff;
        }
        body.dark-mode {
            --body-bg: #121212;
            --text-color: #f0f0f0;
            --toggle-btn-bg: #444444;
            --toggle-btn-hover: #555555;
        }

        body {
            min-height: 100vh;
            background: var(--body-bg);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* Kontainer Utama */
        .menu-container {
            position: relative;
            width: 420px;
            height: 220px;
            margin-bottom: 0;
        }

        /* Tombol Mode Gelap/Terang */
        .mode-switch {
            position: absolute;
            top: -40px;
            right: 0;
            background: var(--toggle-btn-bg);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 20;
        }
        .mode-switch:hover {
            background: var(--toggle-btn-hover);
        }

        /* Area Setengah Lingkaran + Gambar Latar */
        .tunnel {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            border-radius: 200px 200px 0 0;
            overflow: hidden;
            background: url("https://i.pinimg.com/originals/43/3f/d1/433fd198d0b5b09e071b9d64a6176bb4.jpg") center / cover no-repeat;
            cursor: pointer;
            z-index: 1;
        }

        /* Wadah Ikon */
        .icons-wrapper {
            --radius: 200px;
            --jarak-keluar: 90px;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            transform-origin: center bottom;
            z-index: 5;
            pointer-events: none;
        }

        /* Gaya Ikon */
        .menu-icon {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 52px;
            height: 52px;
            margin-left: -26px;
            margin-bottom: -26px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.3, 0, 0.7, 1);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transform-origin: center center;
            animation: float 3s ease-in-out infinite;
            animation-delay: 0s !important;
            pointer-events: auto;
            z-index: 6;
        }

        /* Animasi mengambang halus */
        @keyframes float {
            0% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) translateY(0); }
            50% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) translateY(-5px); }
            100% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) translateY(0); }
        }

        /* Posisi & Warna Ikon */
        .menu-icon:nth-child(1) { --rotasi: -72deg; transform: rotate(-72deg) translateY(calc(-1 * var(--radius))); background-color: #e74c3c; }
        .menu-icon:nth-child(2) { --rotasi: -48deg; transform: rotate(-48deg) translateY(calc(-1 * var(--radius))); background-color: #e67e22; }
        .menu-icon:nth-child(3) { --rotasi: -24deg; transform: rotate(-24deg) translateY(calc(-1 * var(--radius))); background-color: #f1c40f; }
        .menu-icon:nth-child(4) { --rotasi: 0deg;   transform: rotate(0deg)   translateY(calc(-1 * var(--radius))); background-color: #2ecc71; }
        .menu-icon:nth-child(5) { --rotasi: 24deg;  transform: rotate(24deg)  translateY(calc(-1 * var(--radius))); background-color: #3498db; }
        .menu-icon:nth-child(6) { --rotasi: 48deg;  transform: rotate(48deg)  translateY(calc(-1 * var(--radius))); background-color: #9b59b6; }
        .menu-icon:nth-child(7) { --rotasi: 72deg;  transform: rotate(72deg)  translateY(calc(-1 * var(--radius))); background-color: #e91e63; }

        /* SAAT MENU DITUTUP: Ikon keluar lebih jauh */
        .menu-closed .menu-icon {
            animation: none;
            transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius) - var(--jarak-keluar))) scale(0.6);
            opacity: 0;
            pointer-events: none;
        }

        /* Efek hover */
        .menu-icon:hover:not(.explode) {
            animation: none;
            transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) scale(1.12);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* ✅ ANIMASI MELEDAK */
        .menu-icon.explode {
            animation: explode 0.8s ease-out forwards;
            z-index: 10;
        }

        @keyframes explode {
            0% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) scale(1); opacity: 1; }
            40% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) scale(1.3); opacity: 0.9; }
            70% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) scale(0.2); opacity: 0; }
            100% { transform: rotate(var(--rotasi)) translateY(calc(-1 * var(--radius))) scale(0); opacity: 0; }
        }

        /* ✅ Efek asap - tepat di posisi tengah ikon */
        .smoke {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(220,220,220,0.95) 0%, rgba(160,160,160,0.6) 35%, rgba(120,120,120,0.2) 65%, rgba(0,0,0,0) 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            animation: smoke-expand 0.9s ease-out forwards;
            pointer-events: none;
            z-index: 9;
        }

        @keyframes smoke-expand {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.95; }
            40% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.7; }
            80% { transform: translate(-50%, -50%) scale(2.0); opacity: 0.2; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        /* Tooltip */
        .menu-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--tooltip-bg);
            color: var(--tooltip-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
            z-index: 15;
        }
        .menu-icon:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Responsif HP */
        @media (max-width: 480px) {
            .menu-container { width: 340px; height: 190px; }
            .tunnel { width: 320px; height: 160px; border-radius: 160px 160px 0 0; }
            .icons-wrapper { --radius: 160px; --jarak-keluar: 70px; width: 320px; height: 160px; }
            .menu-icon { width: 46px; height: 46px; margin-left: -23px; margin-bottom: -23px; font-size: 17px; }
            .mode-switch { top: -35px; font-size: 12px; padding: 4px 10px; }
            .smoke { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="menu-container menu-open" id="mainMenu">
        <button class="mode-switch" id="darkModeBtn">
            <i class="fa fa-moon-o"></i> 
        </button>

        <div class="tunnel" id="toggleArea"></div>

        <div class="icons-wrapper">
            <a href="https://endrahamdani41-ops.github.io/Aplikasi-CX/agenda_guru.html" target="_blank" class="menu-icon" data-tooltip="Agenda Guru">
                <i class="fa fa-home"></i>
            </a>
            <a href="#profil" class="menu-icon" data-tooltip="Profil">
                <i class="fa fa-user"></i>
            </a>
            <a href="#layanan" class="menu-icon" data-tooltip="Layanan">
                <i class="fa fa-cogs"></i>
            </a>
            <a href="#produk" class="menu-icon" data-tooltip="Produk">
                <i class="fa fa-shopping-bag"></i>
            </a>
            <a href="#galeri" class="menu-icon" data-tooltip="Galeri">
                <i class="fa fa-image"></i>
            </a>
            <a href="#artikel" class="menu-icon" data-tooltip="Artikel">
                <i class="fa fa-file-text"></i>
            </a>
            <a href="#kontak" class="menu-icon" data-tooltip="Kontak">
                <i class="fa fa-phone"></i>
            </a>
        </div>
    </div>

    <script>
        const menuContainer = document.getElementById('mainMenu');
        const toggleArea = document.getElementById('toggleArea');
        const menuIcons = document.querySelectorAll('.menu-icon');
        const darkModeBtn = document.getElementById('darkModeBtn');

        // Klik gambar untuk sembunyi/tampil ikon
        toggleArea.addEventListener('click', () => {
            document.querySelectorAll('.smoke').forEach(s => s.remove());
            menuIcons.forEach(i => {
                i.classList.remove('explode');
                i.style.opacity = '1';
                i.style.transform = '';
                i.style.animation = '';
            });
            menuContainer.classList.toggle('menu-open');
            menuContainer.classList.toggle('menu-closed');
        });

        // ✅ Klik ikon: asap tepat di tengah ikon
        menuIcons.forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.preventDefault();
                const link = this.getAttribute('href');
                const isExternal = link && link.startsWith('http');

                if (menuContainer.classList.contains('menu-closed')) return;
                if (this.classList.contains('explode')) return;

                // Hentikan animasi mengambang
                this.style.animation = 'none';

                // Buat asap langsung di dalam ikon
                const smoke = document.createElement('div');
                smoke.classList.add('smoke');
                this.appendChild(smoke);

                // Jalankan efek meledak
                this.classList.add('explode');

                // Setelah selesai efek
                setTimeout(() => {
                    this.classList.remove('explode');
                    this.style.opacity = '0';
                    smoke.remove();

                    setTimeout(() => {
                        this.style.opacity = '1';
                        this.style.transform = '';
                        this.style.animation = '';
                        if (isExternal) window.open(link, '_blank');
                    }, 400);
                }, 800);
            });
        });

        // Mode terang/gelap
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = darkModeBtn.querySelector('i');
            darkModeBtn.innerHTML = document.body.classList.contains('dark-mode')
                ? '<i class="fa fa-sun-o"></i> '
                : '<i class="fa fa-moon-o"></i> ';
        });
    </script>
</body>
</html>
