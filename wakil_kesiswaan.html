<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Wakil Kesiswaan - Eye Care Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f0f11; color: #cbd5e1; padding: 30px 20px; }
        .table-container { background: #141418; padding: 28px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); border: 1px solid #1f1f25; }
        
        h4 { font-weight: 700; letter-spacing: -0.5px; }
        .badge-master { background-color: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.25); padding: 6px 12px; border-radius: 6px; font-weight: 600; }
        
        .form-label { color: #868694; font-weight: 500; font-size: 13px; margin-bottom: 4px; }
        .form-select-custom, .input-custom { background-color: #1a1a22; color: #e2e8f0; border: 1px solid #2d2d39; border-radius: 10px; padding: 8px 12px; font-size: 14px; transition: all 0.2s; width: 200px; height: 42px; }
        .form-select-custom:focus { background-color: #20202a; border-color: #f59e0b; color: #fff; box-shadow: 0 0 0 3px rgba(245,158,11,0.2); outline: none; }
        
        .table { border-collapse: separate; border-spacing: 0 6px; margin-top: 15px; background-color: transparent !important; }
        
        .table thead th { 
            background-color: rgba(245, 158, 11, 0.15) !important; 
            color: #f59e0b !important; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 14px; 
            text-align: center; 
            vertical-align: middle;
            letter-spacing: 1.2px; 
            padding: 18px 14px; 
            border: 1px solid rgba(245, 158, 11, 0.2) !important; 
            border-width: 1px 0 !important; 
        }
        .table thead th:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; border-left: 1px solid rgba(245, 158, 11, 0.2) !important; }
        .table thead th:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-right: 1px solid rgba(245, 158, 11, 0.2) !important; }
        
        .table tbody tr { background-color: #1a1a22 !important; transition: background-color 0.15s, transform 0.15s; }
        .table tbody tr:nth-of-type(even) { background-color: #1e1e27 !important; }
        .table tbody tr:hover { background-color: #262633 !important; transform: translateY(-1px); }
        
        .table tbody td { padding: 14px; color: #cbd5e1; border: none !important; vertical-align: middle; text-align: center; background: transparent !important; }
        .table tbody td.nama { text-align: left; font-weight: 600; color: #f8fafc; }
        
        .table tbody tr td:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
        .table tbody tr td:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
        
        .select-nilai { width: 80px; margin: auto; font-weight: 700; text-align: center; background-color: #22222d; border: 1px solid #333345; color: #38bdf8; }
        .kelas-input { width: 70px; margin: auto; text-align: center; font-weight: 600; background-color: #22222d; border: 1px solid #333345; color: #fbbf24; height: auto; padding: 6px; }
        
        .ekskul-select-tabel { width: 155px; margin: auto; font-weight: 500; color: #60a5fa; background-color: #22222d; border: 1px solid #333345; }
        
        .ekskul-select-tabel[data-kosong="true"] { color: #ef4444 !important; font-weight: 600; }
        .ekskul-select-tabel option[value=""] { color: #ef4444; }
        .ekskul-select-tabel option:not([value=""]) { color: #60a5fa; }

        .badge-active-ekskul { background: rgba(37, 99, 235, 0.15); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.3); }

        .btn-gradient { background: linear-gradient(135deg, #d97706, #b45309); color: white; border: none; border-radius: 10px; padding: 0 24px; font-weight: 600; box-shadow: 0 4px 15px rgba(180,83,9,0.25); transition: all 0.2s; height: 42px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-gradient:hover { opacity: 0.95; transform: translateY(-1px); color: white; box-shadow: 0 6px 20px rgba(180,83,9,0.35); }
        .btn-gradient:disabled { background: #22222a; color: #52525b; box-shadow: none; cursor: not-allowed; }
        
        .btn-danger-custom { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: none; border-radius: 10px; padding: 0 24px; font-weight: 600; box-shadow: 0 4px 15px rgba(185,28,28,0.25); transition: all 0.2s; text-decoration: none; height: 42px; display: inline-flex; align-items: center; justify-content: center; }
        .btn-danger-custom:hover { opacity: 0.95; transform: translateY(-1px); color: white; box-shadow: 0 6px 20px rgba(185,28,28,0.35); }

        .status-refresh { font-size: 12px; color: #64748b; margin-top: 5px; display: inline-block; }

        /* CSS Filter gabungan Ekskul & Kelas */
        table[data-filter="Pencak Silat"] tbody tr:not(:has(.badge-active-ekskul)) { display: none !important; }
        table[data-filter="Drum Band"] tbody tr:not(:has(.badge-active-ekskul)) { display: none !important; }
        table[data-filter="Tari"] tbody tr:not(:has(.badge-active-ekskul)) { display: none !important; }
        table[data-filter="Futsal"] tbody tr:not(:has(.badge-active-ekskul)) { display: none !important; }
        table[data-filter="Taekwondo"] tbody tr:not(:has(.badge-active-ekskul)) { display: none !important; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4 w-100">
            <div>
                <h4 class="text-white mb-2">🏛️ Panel Wakil Kesiswaan</h4>
                <div class="mb-3">

                    <br><span class="status-refresh" id="refreshStatus"></span>
                </div>
                
                <div class="d-flex flex-column gap-3">
                    <div class="filter-container">
                        <label class="form-label d-block">Ekstrakurikuler Pilihan :</label>
                        <select id="dropdownEkskul" class="form-select-custom" onchange="document.getElementById('tabelUtama').setAttribute('data-filter', this.value); renderTabel();">
                            <option value="Semua Ekskul">-- Semua Ekskul --</option>
                            <option value="Pencak Silat">Pencak Silat</option>
                            <option value="Drum Band">Drum Band</option>
                            <option value="Tari">Tari</option>
                            <option value="Futsal">Futsal</option>
                            <option value="Taekwondo">Taekwondo</option>
                        </select>
                    </div>
                    
                    <div class="filter-container">
                        <label class="form-label d-block">Pilih Kelas :</label>
                        <select id="dropdownKelas" class="form-select-custom" onchange="renderTabel();">
                            <option value="Semua Kelas">-- Semua Kelas --</option>
                            <option value="7A">Kelas 7A</option>
                            <option value="7B">Kelas 7B</option>
							<option value="7C">Kelas 7C</option>
                            <option value="7D">Kelas 7D</option>
                            <option value="7E">Kelas 7E</option>
                            <option value="7F">Kelas 7F</option>							
                            <option value="8A">Kelas 8A</option>
                            <option value="8B">Kelas 8B</option>	
                            <option value="8C">Kelas 8C</option>
                            <option value="8D">Kelas 8D</option>
                            <option value="8E">Kelas 8E</option>
                            <option value="8F">Kelas 8F</option>							
                            <option value="9A">Kelas 9A</option>
                            <option value="9B">Kelas 9B</option>
                            <option value="9C">Kelas 9C</option>	
                            <option value="9D">Kelas 9D</option>
                            <option value="9E">Kelas 9E</option>
                            <option value="9F">Kelas 9F</option>							
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="d-flex gap-2 align-self-end">
                <button type="button" class="btn btn-gradient" id="btnSimpan" onclick="simpanKeSheets()" disabled>💾</button>
                <button type="button" class="btn btn-danger-custom" id="btnKeluar" onclick="window.history.back()">🚪</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table text-light" id="tabelUtama" data-filter="Semua Ekskul">
                <thead>
                    <tr>
                        <th style="width: 5%;">No</th>
                        <th style="width: 10%;">NIS</th>
                        <th style="width: 25%;">Nama Murid</th>
                        <th style="width: 5%;">L/P</th>
                        <th style="width: 12%;">Kelas</th>
                        <th style="width: 28%;">Nama Ekskul</th>
                        <th style="width: 15%;">Nilai Ekskul</th>
                    </tr>
                </thead>
                <tbody id="bodyInput">
                    <tr><td colspan="7" class="text-center text-muted py-5">Memuat data seluruh siswa...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPxCfRs117TPyQVJ_9otGqwVkZUj6YRE00wo7D1NxP51UkGcmefb1VGjhfFTtgfPLfvQ/exec";
    let dataMuridGlobal = [];
    let ekskulTerpilihGlobal = "";
    let isUserEditing = false;
    let refreshInterval;

    function muatDataAwal() {
        if (isUserEditing) return;

        ekskulTerpilihGlobal = document.getElementById('dropdownEkskul').value;
        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            if (!isUserEditing) {
                dataMuridGlobal = data;
                renderTabel();
                document.getElementById('btnSimpan').disabled = false;
            }
        }).catch(err => console.log('Gagal memperbarui: ' + err));
    }

    function cekWarnaDropdown(el) {
        if (el.value === "") { el.setAttribute('data-kosong', 'true'); } 
        else { el.removeAttribute('data-kosong'); }
    }

    function renderTabel() {
        const tbody = document.getElementById('bodyInput');
        ekskulTerpilihGlobal = document.getElementById('dropdownEkskul').value;
        const kelasTerpilih = document.getElementById('dropdownKelas').value;
        tbody.innerHTML = '';
        
        let nomorUrut = 1;
        dataMuridGlobal.forEach((murid) => {
            // Logika filter kelas di JavaScript
            if (kelasTerpilih !== "Semua Kelas" && murid.kelas !== kelasTerpilih) return;

            const nilaiSiswaSaatIni = murid.nilaiMap[ekskulTerpilihGlobal] || "";
            const ekskulSiswaSaatIni = (murid.ekskul && murid.ekskul.length > 0) ? murid.ekskul[0] : "";
            
            let filterSaktiBadge = "";
            if (murid.ekskul && murid.ekskul.length > 0) {
                murid.ekskul.forEach(e => {
                    if(e === ekskulTerpilihGlobal) filterSaktiBadge = `<span class="badge-active-ekskul d-none"></span>`;
                });
            }

            const isKosongAttr = ekskulSiswaSaatIni === "" ? 'data-kosong="true"' : '';

            tbody.innerHTML += `
                <tr>
                    <td style="color: #64748b; font-weight: 500;">${nomorUrut++}</td>
                    <td style="color: #94a3b8;">${murid.nis}</td>
                    <td class="nama">${murid.nama}</td>
                    <td><span class="badge ${murid.lp === 'L' ? 'bg-primary' : 'bg-danger'} bg-opacity-20 text-opacity-100 p-2" style="font-size:11px; width:24px;">${murid.lp}</span></td>
                    <td><input type="text" class="form-select-custom kelas-input" data-idrow="${murid.nis}" value="${murid.kelas}" onfocus="setEditing(true)" onblur="setEditing(false)"></td>
                    <td>
                        ${filterSaktiBadge}
                        <select class="form-select-custom ekskul-select-tabel" data-idrow="${murid.nis}" ${isKosongAttr} onfocus="setEditing(true)" onchange="setEditing(true); cekWarnaDropdown(this);">
                            <option value="" ${ekskulSiswaSaatIni === "" ? "selected" : ""}>- Tanpa Ekskul -</option>
                            <option value="Pencak Silat" ${ekskulSiswaSaatIni === "Pencak Silat" ? "selected" : ""}>Pencak Silat</option>
                            <option value="Drum Band" ${ekskulSiswaSaatIni === "Drum Band" ? "selected" : ""}>Drum Band</option>
                            <option value="Tari" ${ekskulSiswaSaatIni === "Tari" ? "selected" : ""}>Tari</option>
                            <option value="Futsal" ${ekskulSiswaSaatIni === "Futsal" ? "selected" : ""}>Futsal</option>
                            <option value="Taekwondo" ${ekskulSiswaSaatIni === "Taekwondo" ? "selected" : ""}>Taekwondo</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-select-custom select-nilai" data-idrow="${murid.nis}" onfocus="setEditing(true)" onblur="setEditing(false)">
                            <option value="" ${nilaiSiswaSaatIni === "" ? "selected" : ""}>-</option>
                            <option value="A" ${nilaiSiswaSaatIni === "A" ? "selected" : ""}>A</option>
                            <option value="B" ${nilaiSiswaSaatIni === "B" ? "selected" : ""}>B</option>
                            <option value="C" ${nilaiSiswaSaatIni === "C" ? "selected" : ""}>C</option>
                        </select>
                    </td>
                </tr>`;
        });

        if (nomorUrut === 1) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Tidak ada data murid yang sesuai filter.</td></tr>`;
        }
    }

    function setEditing(status) {
        isUserEditing = status;
        const statusText = document.getElementById('refreshStatus');
        if(status) {
            statusText.innerText = "⚠️ Auto-refresh dijeda karena Anda sedang mengedit data...";
            statusText.style.color = "#f59e0b";
        } else {
            statusText.innerText = "";
            statusText.style.color = "#64748b";
        }
    }

    function simpanKeSheets() {
        isUserEditing = true;
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true; btn.innerText = "⏳ MENYIMPAN...";

        dataMuridGlobal.forEach((murid) => {
            const inputKelas = document.querySelector(`.kelas-input[data-idrow="${murid.nis}"]`);
            const selectNilai = document.querySelector(`select.select-nilai[data-idrow="${murid.nis}"]`);
            const selectEkskulTabel = document.querySelector(`select.ekskul-select-tabel[data-idrow="${murid.nis}"]`);

            if (inputKelas) murid.kelas = inputKelas.value.trim() || "8A";
            
            if (selectEkskulTabel) {
                const ekskulBaru = selectEkskulTabel.value;
                if (ekskulBaru !== "") {
                    murid.ekskul = [ekskulBaru];
                } else {
                    murid.ekskul = [];
                    delete murid.nilaiMap[ekskulTerpilihGlobal];
                }
            }

            if (selectNilai && selectEkskulTabel && selectEkskulTabel.value !== "") {
                if (selectNilai.value !== "") murid.nilaiMap[selectEkskulTabel.value] = selectNilai.value;
                else delete murid.nilaiMap[selectEkskulTabel.value];
            }
        });

        fetch(SCRIPT_URL, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(dataMuridGlobal)
        }).then(() => {
            alert('Data Berhasil Disimpan!');
            btn.disabled = false; btn.innerText = "💾";
            isUserEditing = false;
            setEditing(false);
            muatDataAwal();
        });
    }

    window.onload = function() {
        muatDataAwal();
        refreshInterval = setInterval(muatDataAwal, 5000);
    };
</script>
</body>
</html>
